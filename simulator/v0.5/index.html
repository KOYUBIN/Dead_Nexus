    row < maxIdx ? coord(col, row + 1) : null,
  ].filter(Boolean);
};

// 자기 블록 주식: 통제권 표시, 자산 X
// 자산 = Σ(타 블록 주식 × 주가) + 구역 수 × 5
// 크레딧은 유동 자원이라 자본에 안 넣음 (자산 인플레 방지)
const assetValue = (p, stocks, state) => {
  // v0.5.16 검토안: Bloc 경제 개선 (구역 가치 5→7 / 크레딧 1/3 반영 / 무기·부품·데이터 소액 자산화)
  // → 최종 미반영. 실제 코드는 아래 1425행 결론대로 구역 가치 5 유지 + 크레딧/무기/부품/데이터 자산 미포함
  // (v6.8 조사로 stale 확인: 자산 = 타 블록 주식 + 구역×5 + 건물 보너스만 합산, credit 등은 가산 없음)
  let total = 0;
  for (const [bl, qty] of Object.entries(p.stocks)) {
    const isOwn = p.role === 'bloc' && p.specific === bl;
    if (isOwn) continue;
    const price = stocks[bl] ?? 10;
    total += qty * price;
  }
  if (state?.map) {
    const zonesOwned = Object.values(state.map).filter(c => c.owner === p.id).length;
    total += zonesOwned * 5;
    // v0.6.3e: 건물 자산 보너스 — 사옥 +5, 거래소 +3, 공장/보안센터 +2, 미디어허브 +4
    const buildingValue = { hq: 5, trading: 3, factory: 2, security: 2, media: 4 };
    Object.values(state.map).forEach(cell => {
      if (cell.owner === p.id && cell.building) total += (buildingValue[cell.building] || 0);
    });
  }
  // v6.46 [71차 M10]: 아래 주석은 v0.5.16 당시 결론이었으나 v0.6.3e 에서 건물 자산 보너스가
  //   추가되며 코드와 어긋났다(주석은 "주식+구역만"이라 하는데 바로 위에서 건물값을 가산).
  //   현재 자산 구성 = 타 블록 주식 + 구역(×5) + 건물(hq5·media4·trading3·factory2·security2).
  //   유지되는 부분: Bloc/Ghost P0 격차는 assetGoal 이 아닌 Ghost 승리 루트 수 문제라는 판단.
  return Math.floor(total);
};

// Resource init
const initResources = (role) => role === 'bloc'
  ? { credit: 8, data: 2, influence: 3, weapons: 0, parts: 0, rep: 0 }
  : { credit: 5, data: 0, influence: 0, weapons: 0, parts: 0, rep: 5 };

// Initial stocks for bloc player
const initStocks = (role, specific) => {
  const base = { VANTA: 0, IRONWALL: 0, HELIX: 0, AXIOM: 0, CARBON: 0 };
  if (role === 'bloc') base[specific] = 10;
  return base;
};

// ============================================================================
// GAME STATE + REDUCER
// ============================================================================

function initGame(humanRole, humanSpecific, playerCount, mapSize, extraOpts) {
  // v0.7.3: 5x5 또는 11x11 맵 빌드 (mapSize 미지정 시 5x5)
  // v1.0: extraOpts = { mode, difficulty, humans } — 솔로/멀티 모드, 난이도, 추가 인간 정의
  const useSize = mapSize === '11x11' ? '11x11' : '5x5';
  const mapSrc = useSize === '11x11' ? MAP_11x11 : MAP_5x5;
  const blocSetupSrc = useSize === '11x11' ? BLOC_SETUP_11x11 : BLOC_SETUP;
  const mode = extraOpts?.mode || 'solo';
  const difficulty = extraOpts?.difficulty || 'normal';
  // v6.18: 시나리오 프레임워크 — 시작 조건 변형 (docs/14). 기본 S01.
  const scenarioId = extraOpts?.scenario || 'S01';
  const scen = getScenario(scenarioId);
  let humansList = extraOpts?.humans || null;
  const map = {};
  mapSrc.forEach(([c, z]) => {
    map[c] = { zone: z, owner: null, token: Math.random() < 0.6 ? 'quest' : (Math.random() < 0.5 ? 'instant' : 'discovery'), tokenRevealed: false };
  });

  // v1.0.2: 멀티 모드면 humansList 길이만큼 인간, 나머지는 봇으로
  // 솔로/봇만 모드: 1 human + (playerCount-1) bots
  // v6.18: 시나리오가 참가 인원을 제한하면 캡 적용 (S02: 최대 3 — 나머지는 NPC 충원).
  let totalPlayers = Math.max(2, Math.min(5, playerCount || 4));
  if (scen.maxParticipants) totalPlayers = Math.min(totalPlayers, scen.maxParticipants);
  const players = [];
  const allBlocs = ['VANTA', 'IRONWALL', 'HELIX', 'AXIOM', 'CARBON'];
  const allGhosts = ['CIPHER', 'BLADE', 'BROKER', 'RIGGER', 'DRIFTER', 'MOLE'];
  const usedBlocs = [];
  const usedGhosts = [];
  const pickBloc = () => { const avail = allBlocs.filter(b => !usedBlocs.includes(b)); const p = rand(avail); if (p) usedBlocs.push(p); return p; };
  const pickGhost = () => { const avail = allGhosts.filter(g => !usedGhosts.includes(g)); const p = rand(avail); if (p) usedGhosts.push(p); return p; };
  // v6.18: 전원 Bloc 시나리오(S02) — 인간 역할/멀티 humansList 를 Bloc 으로 정규화.
  // v6.19: Ghost 주도 시나리오(S03) — P0(protagonist)를 Ghost 로 정규화 (실참 Bloc 은 봇 1명).
  const effHumanRole = scen.allBloc ? 'bloc' : (scen.ghostRising ? 'ghost' : humanRole);
  const effHumanSpecific = (scen.allBloc && !allBlocs.includes(humanSpecific)) ? allBlocs[0]
    : (scen.ghostRising && !allGhosts.includes(humanSpecific)) ? allGhosts[0]
    : humanSpecific;
  if (scen.allBloc && humansList) {
    humansList = humansList.map(h => h.role === 'bloc' ? h : { role: 'bloc', specific: allBlocs.includes(h.specific) ? h.specific : 'VANTA' });
  }

  if (mode === 'multi' && humansList && humansList.length >= 2) {
    // 멀티 핫시트: humansList 그대로 인간 P0~P(N-1)
    humansList.forEach((h, i) => {
      players.push(buildPlayer(i, 'human', h.role, h.specific));
      if (h.role === 'bloc') usedBlocs.push(h.specific);
      else usedGhosts.push(h.specific);
    });
    // 빈 자리 봇 보충 (총 totalPlayers까지)
    const botCount = Math.max(0, totalPlayers - humansList.length);
    // 균형: 인간 Ghost 수 vs Bloc 수 차이를 봇이 보충
    const humanGhostN = humansList.filter(h => h.role === 'ghost').length;
    const humanBlocN  = humansList.filter(h => h.role === 'bloc').length;
    for (let i = 0; i < botCount; i++) {
      const needGhost = humanGhostN + (botCount > 0 ? Math.floor(i / 2) : 0) <= humanBlocN;
      const r = scen.allBloc ? 'bloc' : (needGhost ? 'ghost' : 'bloc');
      const sp = r === 'bloc' ? pickBloc() : pickGhost();
      players.push(buildPlayer(humansList.length + i, 'bot', r, sp));
    }
  } else {
    // 솔로/단일 인간 모드 (v6.18: allBloc 시나리오는 effHumanRole/effHumanSpecific 사용)
    if (effHumanRole === 'bloc') usedBlocs.push(effHumanSpecific);
    else usedGhosts.push(effHumanSpecific);
    players.push(buildPlayer(0, 'human', effHumanRole, effHumanSpecific));
    const botCount = totalPlayers - 1;
    const botSpecs = [];
    const oppositeRole = effHumanRole === 'bloc' ? 'ghost' : 'bloc';
    const botRoles = [];
    for (let i = 0; i < botCount; i++) {
      if (scen.allBloc) botRoles.push('bloc');
      // v6.19 (S03 ghostRising): 봇 1명만 Bloc(악당 보스), 나머지 Ghost — P0 Ghost 와 합쳐 실참 Bloc=1.
      else if (scen.ghostRising) botRoles.push(i === 0 ? 'bloc' : 'ghost');
      else if (i === 0) botRoles.push(oppositeRole);
      else if (i === 1 && botCount >= 2) botRoles.push(oppositeRole);
      else botRoles.push(i % 2 === 0 ? oppositeRole : effHumanRole);
    }
    botRoles.forEach(r => botSpecs.push({ role: r, sp: r === 'bloc' ? pickBloc() : pickGhost() }));
    botSpecs.forEach((bs, i) => players.push(buildPlayer(i + 1, 'bot', bs.role, bs.sp)));
  }

  // v0.6.1: 2인 모드 NPC 중립 블록 2개 추가 (Bloc 편향 해소)
  // v0.6.3d: NPC는 시그널 점진 공개(정보)을 점진 공개하는 표적 역할
  // v6.18: allBloc 시나리오(S02)는 아래 npcFillTo 로직으로 대체 — 중복 방지.
  // v6.19: ghostRising(S03)도 npcFillTo 로 NPC Bloc 충원 → 이 2인 기본 NPC 경로 제외.
  if (totalPlayers === 2 && !scen.allBloc && !scen.ghostRising) {
    const npc1 = pickBloc();
    const npc2 = pickBloc();
    const npcP1 = buildPlayer(players.length, 'npc', 'bloc', npc1);
    const npcP2 = buildPlayer(players.length + 1, 'npc', 'bloc', npc2);
    npcP1.isNpc = true;
    npcP2.isNpc = true;
    // v0.6.3d: 시그널 — 0=완전 미상, 1=정체, 2=특성, 3=완전 노출 (보너스 약탈)
    npcP1.signal = { revealed: 0, max: 3 };
    npcP2.signal = { revealed: 0, max: 3 };
    players.push(npcP1);
    players.push(npcP2);
  }

  // v6.18: 시나리오 NPC Bloc 충원 (docs/14 S02: 5 − 참가 수 = NPC). 자동 등락·방어만.
  if (scen.npcFillTo) {
    while (players.length < scen.npcFillTo && usedBlocs.length < allBlocs.length) {
      const nb = pickBloc();
      if (!nb) break;
      const npcP = buildPlayer(players.length, 'npc', 'bloc', nb);
      npcP.isNpc = true;
      npcP.signal = { revealed: 0, max: 3 };
      players.push(npcP);
    }
  }

  // v1.0.1: 솔로 모드 난이도 보정 — easy: 인간 시작 자원 +5 / hard: 봇 시작 자원 +5
  if (mode === 'solo' && difficulty === 'easy') {
    const p0 = players[0];
    p0.resources = { ...p0.resources, credit: (p0.resources.credit || 0) + 5, weapons: (p0.resources.weapons || 0) + 1, parts: (p0.resources.parts || 0) + 1, data: (p0.resources.data || 0) + 1 };
  } else if (mode === 'solo' && difficulty === 'hard') {
    for (let i = 1; i < players.length; i++) {
      players[i].resources = { ...players[i].resources, credit: (players[i].resources.credit || 0) + 5, weapons: (players[i].resources.weapons || 0) + 1 };
    }
  }

  // Set bloc HQ zones as owned
  players.forEach(p => {
    if (p.role === 'bloc') {
      const setup = blocSetupSrc[p.specific];
      map[setup.hq].owner = p.id;
      setup.support.forEach(s => { map[s].owner = p.id; });
      p.position = setup.hq;
    } else {
      // v0.7.3: 11×11에서는 Ghost 시작 위치를 외곽으로 분산
      if (useSize === '11x11') {
        const ghostStarts11 = {
          CIPHER: 'A6', BLADE: 'F1', BROKER: 'K6', RIGGER: 'F11',
          DRIFTER: 'A1', MOLE: 'K11',
        };
        p.position = ghostStarts11[p.specific] || 'F6';
        // v0.8.4: 11×11 Ghost 시작 자원 보강 — 큰 보드 이동 비용 보전
        // 시작 ₵+5 / 무기+1 / 데이터+1 / 부품+1 + transport 트랙 +1
        p.resources = { ...p.resources, credit: (p.resources.credit || 0) + 5, weapons: (p.resources.weapons || 0) + 1, data: (p.resources.data || 0) + 1, parts: (p.resources.parts || 0) + 1 };
        if (p.tracks) p.tracks = { ...p.tracks, transport: (p.tracks.transport || 0) + 1 };
      } else {
        p.position = GHOST_STATS[p.specific].startZone;
      }
    }
    // v6.11.4 (P0-4): 시작 배치 좌표를 캡처 — HP0 STEP F 리스폰에서 재사용 (하드코딩 회피)
    p.startZone = p.position;
  });

  // v6.18: 시나리오 initGame 훅 — 시작 크레딧 보강 + 추가 구역(Ring 확장) 배정.
  //   구역 소유가 확정된 후 호출 (extraSupport 가 미소유 구역을 탐색).
  applyScenarioInit(scen, players, map);

  // Deal objectives
  const objBloc = shuffle(OBJECTIVES.filter(o => o.role === 'bloc'));
  const objGhost = shuffle(OBJECTIVES.filter(o => o.role === 'ghost'));
  let bi = 0, gi = 0;
  players.forEach(p => {
    if (p.role === 'bloc') {
      p.objectives = [objBloc[bi++ % objBloc.length], objBloc[bi++ % objBloc.length]];
    } else {
      p.objectives = [objGhost[gi++ % objGhost.length], objGhost[gi++ % objGhost.length]];
    }
  });

  // v6.24 (레거시 Stage 1): 시작 주식 시세 + 도시 흉터 적용.
  //   흉터 = 직전 게임 최다 레이드 피해 블록의 시작 주가 -1 (docs/22 정체성 —
  //   "판의 결과가 다음 판의 도시에 흉터로 남는다"의 첫 조각). legacyActiveScar()는
  //   챕터 1 해금 이후에만 값을 돌려주고, localStorage 미가용(헤드리스/모듈 미로드)
  //   시엔 null → 흉터 미발동 = 시작 주가 무변경. stocks·lastStockSnapshot 두 곳이
  //   동일 시세로 출발해야 공매도 정산이 어긋나지 않으므로 단일 startStocks 로 공유.
  const _startSp = scen.startStock != null ? scen.startStock : 8;
  const startStocks = { VANTA: _startSp, IRONWALL: _startSp, HELIX: _startSp, AXIOM: _startSp, CARBON: _startSp };
  const _scar = (typeof legacyActiveScar === 'function') ? legacyActiveScar() : null;
  let _scarLog = null;
  let _scarHeat = 0;   // v6.33 (레거시 Ch.3 Stage 3): 'martial' 흉터 — 특정 블록 없이 도시 전역 시작 공권력 가산.
  // v6.39 (레거시 Ch.8 Stage 8): 'zeroday' 흉터 — 캠페인 완결 여파, martial 과 동일한 도시 전역 공권력 채널.
  if (_scar && (_scar.kind === 'martial' || _scar.kind === 'zeroday')) {
    _scarHeat = _scar.heatDelta || 0;
    if (_scarHeat) _scarLog = _scar.kind === 'zeroday'
      ? `🩹 Zero Day 여파: 시작 공권력 +${_scarHeat}`
      : `🩹 계엄의 밤 여파: 시작 공권력 +${_scarHeat}`;
  } else if (_scar && startStocks[_scar.bloc] != null) {
    startStocks[_scar.bloc] = Math.max(1, startStocks[_scar.bloc] - 1);
    // v6.34 (레거시 Ch.4 Stage 4): 'splice' 흉터 — 과잉 개조 블록의 사이버사이코시스 대가.
    // v6.35 (레거시 Ch.5 Stage 5): 'mesh' 흉터 — SIGNAL 이 강림한 종가 최저(취약) 노드.
    // v6.39 (레거시 Ch.7 Stage 7): 'nexus' 흉터 — 도시의 심장(NEXUS 의장실)을 장악한 블록.
    _scarLog = _scar.kind === 'splice'
      ? `🩹 스플라이스의 대가: ${_scar.bloc} 주가 -1`
      : _scar.kind === 'mesh'
      ? `🩹 메시 고스트 강림: ${_scar.bloc} 주가 -1`
      : _scar.kind === 'nexus'
      ? `🩹 도시의 심장: ${_scar.bloc} 주가 -1`
      : `🩹 지난 전쟁의 흉터: ${_scar.bloc} 주가 -1`;
  }

  return {
    meta: {
      scenario: scenarioId,
      // v6.21: 모바일 NPC 엔티티 엔진 상태. S04 는 시작 시 경찰 3체 배치(policeStart) + policeSpawned=true
      //   (heat9 코어 규칙의 이중 스폰 방지). 그 외 시나리오는 빈 배열 — heat≥9 도달 시 스폰.
      // v6.23: S04 는 구금 NPC(captive) 5체를 경찰·플레이어 시작칸을 피해 추가 배치 (같은 npcs 배열, type 분기).
      npcs: (() => {
        const police = scen.policeStart ? spawnPoliceEntities(map, scen.policeStart, POLICE_COUNT) : [];
        if (!scen.captiveStart) return police;
        const exclude = [...police.map(n => n.position), ...players.map(p => p.position).filter(Boolean)];
        return [...police, ...spawnCaptiveEntities(map, scen.captiveStart, exclude)];
      })(),
      policeSpawned: !!scen.policeStart,   // 게임당 1회 스폰 게이트 (하락해도 유지)
      policeKills: 0,                      // NPC 격파 누적 (cap-immune 계측)
      policeFights: 0,                     // NPC 자동전투(비격파) 누적 (cap-immune 계측)
      rescues: 0,                          // v6.23: 구금 NPC 구출 누적 (cap-immune 계측)
      rescuesByPlayer: {},                 // v6.23: { playerIdx: 구출 수 } — 전원(5) 보너스 게이트
      captiveBonusAwarded: {},             // v6.23: { playerIdx: true } — 전원 구출 렙+10 1회 지급 게이트
      mnaNoCooldown: !!scen.mnaNoCooldown,  // v6.18: S02 — M&A 선언 간 2R 간격 게이트 무시 (euro_declareMnaCheck 조회)
      mapSize: useSize,
      round: 1,
      phase: 0,
      currentPlayer: 0,
      humanPlayer: 0,
      turnInit: null,
      gameOver: false,
      winner: null,
      winReason: null,
      loreQuoted: {},            // 서사 표면화: 게임당 인물별 명대사 1회 캡 { specific: true }
      // v6.10: M&A Stage 2 — 인간 공격자 인수 루프 트래킹
      pendingMna: null,          // { attacker, target(bloc), declaredRound, defense } — 진행 중 M&A
      mnaCount: {},              // { attackerIdx: 선언 횟수 } (게임당 3회 상한)
      mnaLastRound: {},          // { attackerIdx: 마지막 선언 라운드 } (선언 간 2R 간격)
      acquisitions: {},          // { attackerIdx: [인수한 bloc명...] } (2곳 = 즉시 승리)
      whiteKnight: {},           // v6.11 Stage 3: { bloc: 추가 float 수 } — 백기사 방어 분모 가산
      newsSinceStart: 0,
      raidsThisGame: Object.fromEntries([...Array(5).keys()].map(k => [k, 0])),
      raidDmgByBloc: {},         // v6.24 (레거시 Stage 1): { bloc: 레이드 피해 횟수 } — 게임 종료 시 최다 피해 블록 → 도시 흉터
      // v6.51 (E9): S06 startScandalEach 시드 오염도 POLLUTION_CAP 카운터에 기록 (상한 우회 봉합)
      scandalsThisGame: scen.startScandalEach ? Object.fromEntries(players.map((p, i) => [i, p.role === 'bloc' ? 1 : 0])) : {},
      zonesVisited: Object.fromEntries([...Array(5).keys()].map(k => [k, new Set()])),
      attacksUsed: Object.fromEntries([...Array(5).keys()].map(k => [k, 0])),
      lostCardsUsed: Object.fromEntries([...Array(5).keys()].map(k => [k, 0])),
      nexusHolder: null,
      nexusStreak: 0,
      // v6.12 P0-1: 종료 선언 라운드
      victoryDeclaration: null,  // { idx, route, reason, round } — 활성 종료 선언 (없으면 null)
      declarationCounts: {},     // { playerIdx: 선언 횟수 } (게임당 같은 플레이어 2회 캡)
      claimedAchievements: {},  // id => playerIdx
      milestonesAwarded: Object.fromEntries([...Array(5).keys()].map(k => [k, []])),  // v0.6.3b: 거리명성 마일스톤 기록
      highlights: [],            // v0.9.1: 하이라이트 모먼트 기록 (게임 중 기억할 한 수)
      promises: [],              // v0.9.2: 협상 약속 트래킹
      negoStats: { proposed: 0, accepted: 0, rejected: 0, swaps: 0, truces: 0, broker: 0 },  // v6.44 (A2): 협상 발생 계측 (cap-immune)
      mode,                      // v1.0.1: 'solo' | 'multi' (핫시트) | 'bots' (시뮬)
      difficulty,                // v1.0.1: easy / normal / hard (솔로 한정)
      activePlayer: 0,           // v1.0.2: 핫시트용 — 현재 차례 인간 인덱스
      pendingMoveTarget: null,   // 사용자가 지도에서 찍은 목표 좌표 (Ghost/Bloc 둘 다)
      awaitingMoveTarget: false, // true면 UI에서 목표 클릭 대기
      moveBudget: 0,             // 이번 턴 총 이동 칸 수 (BFS 반경)
      turnSnapshot: null,        // 턴 전 상태 스냅샷 (변화 요약용)
      turnDiff: null,            // 턴 후 계산된 변화 요약
      zoneBonusPending: null,    // { zone: 'home', coord: 'B3', options: [{...},{...},{...}] }
      visitedBonusZones: {},     // { playerIdx: { coord: true } } — 보너스를 이미 받은 구역
      pendingRaid: null,         // { coord, bloc, zoneNm, atk, threshold } — 사용자 레이드 결정 대기
      chosenTargets: [],         // [ { cardIdx, half, targetPlayerIdx } ] — 사용자가 지정한 공격 타겟들
      pendingTargetSelect: null, // { cardId, half, effectKey, candidates, cardIdx } — UI가 타겟 고를 수 있게
      pendingGhostDuel: null,    // { coord, atkGhostIdx, defGhostIdx } — Ghost PvP 결정 대기
      lastTargetedBy: null,      // { attacker, effectKey, detail } — 봇이 P0 타겟했을 때 표시
      attackBonusOnce: 0,        // 일회성 공격 판정 보너스
      peekNews: 0,               // 남은 peek 카운트 (cop/data 보너스)
      mapReveal: 0,              // 남은 전체 지도 노출 라운드
      moveBonusNext: 0,          // 다음 턴 이동 보너스 (port 보너스)
      atkBonusOnce: 0,           // 일회성 공격 판정 보너스 (arms 보너스)
      // v6.12 P0-4: 공매도 정산 스냅샷 — 라운드 전환 시 전 라운드 종가와 비교(단일 지점 정산)
      // v6.19 (S03): 시작 주가 시나리오 오버라이드 (docs/14 S03=12; 미지정 시 기본 8).
      lastStockSnapshot: { ...startStocks },
    },
    players,
    map,
    pool: { M: 0, I: 0, V: 0, S: 0, B: 0, A: 0, GRID: 0 },
    stocks: { ...startStocks },
    heat: Math.min(10, (scen.startHeat != null ? scen.startHeat : 5) + _scarHeat),  // v6.18: 시나리오 시작 공권력 (S02=3) · v6.33: 계엄 여파 흉터 가산(≤10 클램프)
    signalDie: rollSignalDie(),
    currentNews: null,
    log: [
      { round: 0, phase: 0, message: `🎮 게임 시작. ${useSize} · 시나리오 ${scenarioId} ${scen.name}` },
      ...(_scarLog ? [{ round: 0, phase: 0, message: _scarLog }] : []),
    ],
  };
}

function buildPlayer(id, kind, role, specific) {
  const deck = role === 'bloc' ? BLOC_DECKS[specific] : GHOST_DECKS[specific];
  const stats = role === 'bloc' ? BLOC_STATS[specific] : GHOST_STATS[specific];
  const trackInit = initTracks(specific);
  return {
    id, kind, role, specific,
    hp: stats.hp,
    maxHp: stats.hp,
    stats,
    resources: initResources(role),
    stocks: initStocks(role, specific),
    deck: shuffle(deck),
    hand: [],
    discard: [],
    lost: [],
    contracts: [],
    shortPositions: {},        // v6.12 P0-4: Ghost 공매도 포지션 { BLOC: 계약수 }
    wanted: 0,
    tl: 1,
    tlProgress: 0,
    position: null,
    zonesOwned: [],
    pool: { M: 0, I: 0, V: 0, S: 0, B: 0, A: 0, GRID: 0 },
    objectives: [],
    achievements: [],
    defeated: false,
    plannedCards: [],
    plannedHalves: [],
    // v0.6.3: 5트랙 시스템 (악명형 악명식 — 직접 투자, 총악명=합)
    tracks: trackInit.tracks,
    onceAbilities: { critFailImmunity: false, droneFree: false, reroll: false, teleport: false, deathSave: false },
    cyberware: [],  // v1.1.2: 장착된 임플란트 키 배열 (max 3)
  };
}

// v6.11.4 (P0-4 / docs/21 C4): 통합 피해 처리 헬퍼.
// 모든 HP 감소 경로가 이 함수를 경유한다. HP0 도달 시 docs/07 STEP F 일관 적용:
//   보유 자원(credit·parts·data) 30% 약탈(내림) → 가해자가 있으면 가해자에게, 없으면(환경 피해) 소실.
//   시작 구역으로 리스폰 + HP 절반(내림, 최소 1) 회복. defeated 미설정 — 게임 계속.
//   경호 LV5 deathSave 보유 시 STEP F 대신 HP 0→1 (기존 직접공격 경로 보존).
// source: 가해자 식별용. 숫자면 가해자 playerIdx, { attacker, label } 객체, 그 외/null이면 환경(가해자 없음).
function applyDamage(state, playerIdx, amount, source) {
  const dmg = Math.max(0, Math.floor(amount || 0));  // 음수/NaN 방지
  if (dmg <= 0) return state;
  const p = state.players[playerIdx];
  if (!p || p.defeated) return state;
  const wasBelow = p.belowHalf === true;  // v6.13.1 (P1-1): 상처 교차 판정용 사전 상태

  // source 정규화
  let attackerIdx = null;
  if (typeof source === 'number') attackerIdx = source;
  else if (source && typeof source === 'object' && typeof source.attacker === 'number') attackerIdx = source.attacker;

  let s = state;
  let ps = [...s.players];
  const newHp = Math.max(0, p.hp - dmg);  // 음수 HP 방지
  ps[playerIdx] = { ...p, hp: newHp };
  s = { ...s, players: ps };
  if (newHp > 0) return checkWoundCross(s, playerIdx, wasBelow);  // v6.13.1 (P1-1): 50% 교차 시 상처

  // === HP0 도달 ===
  const downed = ps[playerIdx];
  // 1) 경호 LV5 deathSave 우선
  if (downed.onceAbilities?.deathSave) {
    ps = [...s.players];
    ps[playerIdx] = { ...downed, hp: 1, onceAbilities: { ...downed.onceAbilities, deathSave: false } };
    s = { ...s, players: ps };
    s = logEntry(s, `🛡 P${playerIdx} (${downed.specific}) · 경호 LV5 deathSave 발동! HP 0→1`);
    s = recordHighlight(s, 'death_save', playerIdx);
    return checkWoundCross(s, playerIdx, wasBelow);  // v6.13.1 (P1-1): HP 0→1 도 50% 이하 → 상처
  }

  // 2) STEP F — 자원 30% 약탈 + 시작 구역 리스폰 + HP 절반 회복
  ps = [...s.players];
  const victim = ps[playerIdx];
  const lootKeys = ['credit', 'parts', 'data'];
  const looted = {};
  const vRes = { ...victim.resources };
  for (const k of lootKeys) {
    const have = vRes[k] || 0;
    const take = Math.floor(have * 0.3);  // 30% 내림
    if (take > 0) { looted[k] = take; vRes[k] = have - take; }
  }
  const respawnZone = victim.startZone || victim.position;  // initGame 시작 배치 좌표 재사용
  const revivedHp = Math.max(1, Math.floor(victim.maxHp / 2));  // 절반 내림, 최소 1
  ps[playerIdx] = { ...victim, resources: vRes, hp: revivedHp, position: respawnZone };
  // 약탈물: 가해자 있으면 가해자에게 이전, 없으면(환경 피해) 소실
  if (attackerIdx != null && attackerIdx !== playerIdx && ps[attackerIdx] && !ps[attackerIdx].defeated) {
    const aRes = { ...ps[attackerIdx].resources };
    for (const k of lootKeys) if (looted[k]) aRes[k] = (aRes[k] || 0) + looted[k];
    ps[attackerIdx] = { ...ps[attackerIdx], resources: aRes };
  }
  s = { ...s, players: ps };
  s = logEntry(s, `💀 P${playerIdx} 격침 — 자원 30% 약탈, 시작 구역 리스폰`);
  return checkWoundCross(s, playerIdx, wasBelow);  // v6.13.1 (P1-1): 리스폰 후 절반 HP(≤50%) → 상처
}

// ============================================================================
// v6.13.1 (P1-1 / docs/05 §1.7·§2.7 / docs/21 K1): 덱 오염 실카드화 — 상처·스캔들.
// 정적 덱 목록(GHOST_DECKS/BLOC_DECKS) 미포함, 런타임에만 해당 플레이어 discard에 삽입.
// 게임당 상한 각 2장(스파이럴 방지). 삽입 카드는 무효 슬롯 → 손에 오는 라운드는 실질 1카드 플레이.
// ============================================================================
const POLLUTION_CAP = 2;

function insertWound(state, playerIdx) {
  const p = state.players[playerIdx];
  if (!p || p.defeated || p.role !== 'ghost') return state;
  const prev = (state.meta.woundsThisGame && state.meta.woundsThisGame[playerIdx]) || 0;
  if (prev >= POLLUTION_CAP) return state;  // 상한 도달 — 중복 삽입 방지
  const ps = [...state.players];
  ps[playerIdx] = { ...p, discard: [...(p.discard || []), 'WOUND'] };
  const woundsThisGame = { ...(state.meta.woundsThisGame || {}), [playerIdx]: prev + 1 };
  let s = { ...state, players: ps, meta: { ...state.meta, woundsThisGame } };
  const meTag = playerIdx === 0 ? '⭐ 당신 ' : '';
  s = logEntry(s, `${meTag}🩸 P${playerIdx} [${p.specific}] · HP 50% 이하 교차 — 상처 카드 1장 덱 오염 (누적 ${prev + 1}/${POLLUTION_CAP})`);
  return s;
}

function insertScandal(state, blocIdx, reason) {
  const p = state.players[blocIdx];
  if (!p || p.defeated || p.role !== 'bloc') return state;
  const prev = (state.meta.scandalsThisGame && state.meta.scandalsThisGame[blocIdx]) || 0;
  if (prev >= POLLUTION_CAP) return state;  // 상한 도달 — 중복 삽입 방지
  const ps = [...state.players];
  ps[blocIdx] = { ...p, discard: [...(p.discard || []), 'SCANDAL'] };
  const scandalsThisGame = { ...(state.meta.scandalsThisGame || {}), [blocIdx]: prev + 1 };
  let s = { ...state, players: ps, meta: { ...state.meta, scandalsThisGame } };
  const meTag = blocIdx === 0 ? '⭐ 당신 ' : '';
  s = logEntry(s, `${meTag}📰 P${blocIdx} [${p.specific}] · ${reason} — 스캔들 카드 1장 덱 오염 (누적 ${prev + 1}/${POLLUTION_CAP})`);
  return s;
}

// HP 50% 교차 감지 — applyDamage가 각 return 직전 호출. p.belowHalf 플래그로 "위→아래" 1회만 삽입.
// (아래→위 회복은 라운드 시작 리필에서 belowHalf 재계산 → 재교차 시 다시 1회 삽입, 단 게임 상한 2 유지.)
function checkWoundCross(state, playerIdx, wasBelowHalf) {
  const p = state.players[playerIdx];
  if (!p || p.role !== 'ghost') return state;
  const belowHalf = p.hp <= p.maxHp * 0.5;
  let s = state;
  if ((p.belowHalf === true) !== belowHalf) {
    const ps = [...s.players];
    ps[playerIdx] = { ...p, belowHalf };
    s = { ...s, players: ps };
  }
  if (belowHalf && !wasBelowHalf) s = insertWound(s, playerIdx);  // 교차 순간 1회
  return s;
}

// Reducer actions
// v6.12 P0-2: 봇 M&A 각성 — BOT_MARKET 목표 지분 매집 튜닝 상수 (게이트는 euro_module 불변)
// 왜 이 수치인가: 11×11에서 봇 Bloc은 P0가 Ghost일 때만 존재(P0=Bloc이면 봇은 전원 Ghost),
// 그 봇 Bloc들은 자산 95(승리 게이트)를 ~R5에 돌파해 게임이 R5에 끝난다(docs/22 P0-1의
// 'R5 즉사' 미해결 버그, 본 과제 범위 밖). 게다가 지분 분모는 NPC float 10주가 지배해
// 51%엔 ~11주가 필요한데 봇 신용은 라운드당 ~3주치뿐. 따라서 선언은 'R4 종료 시 51%'가
// 유일한 창이며, 그 창에 닿으려면 (a) R1부터 즉시 지정 (b) 한 블록에 예약 집중 (c) 타 보유
// 주식 전량 청산으로 실탄 확보 — 이 세 레버를 다 써야 한다(단일 레버로는 32% 벽). 가드 R3+는
// 이 창에서 물리적으로 불가(측정: R3 지정→선언 ~1/30, R1 지정→~5/30). 절충으로 R1 채택.
const MNA_MIN_ROUND = 1;          // 목표 지정 최소 라운드 (R5 창 압축 → R1 필수, 측정 근거 상단)
const MNA_DESIGNATE_CREDIT = 14;  // 목표 지정 ₵ 여유 하한 (충분한 봇만 각성; 낮추면 조기 저가지정으로 역효과)
const MNA_CREDIT_FLOOR = 0;       // 목표 매수 시 남길 ₵ 하한 (인수 올인 — 청산 실탄이 별도 안전판)
const MNA_BUY_MAXPRICE = 18;      // 목표 매수 완화 상한 (기존 가격 트레이더 ≤7 대비 대폭 완화)
const MNA_BUY_QTY = 14;           // 라운드당 목표 매집 상한 주식 수 (신용 한도가 실질 제약)
                                  // v6.13.1(②): 14→11 재시도 기각·원복. 11×11 n=200 측정에서 11은 ghost 36.5%로
                                  // 45~55 밴드 미진입(14는 41.0%)이고 M&A 선언은 0.14/판으로 불변 → 중앙화 개선 없음.
const MNA_EQUITY_STOP = 60;       // 이 지분% 도달 시 매집 중단 (게이트 여유 확보 후 과매수 방지)
const MNA_TARGET_EXISTING_PCT = 30; // 이미 이만큼 보유한 라이벌은 최우선 목표 (완주가 쌈)

// v6.12 P0-4: 공매도 레이드 — 니치 기함 루프 튜닝 상수 (docs/22 §6 P0-4)
// "레이드(폭력·정보)가 곧 주가 포지션이 되는 사이버펑크 비대칭 시장 전쟁."
// Ghost가 시장 페이즈에 대상 블록 숏 계약을 사고, 그 블록 주가가 떨어지면 라운드 경계에서
// 차익을 정산한다(레이드 성공 -3 = 계약당 ₵6). 정산은 스냅샷 방식(meta.lastStockSnapshot):
// 라운드 전환 시 전 라운드 종가 대비 하락분을 단일 지점에서 잡아, 레이드·뉴스·시그니처 등
// 여러 하락 훅을 개별 배선하지 않고도 이중 정산 없이 모든 하락을 포착한다. 상승 시 무손실
// (옵션형, 단순성 우선). 만기 없음(게임 끝까지 유지). 수치는 측정 후 조정 가능한 상수 블록.
const SHORT_CONFIG = {
  cost: 4,          // 계약 1건 진입 비용 (₵)
  payoutPerPt: 2,   // 하락 1pt × 계약 1건당 지급 (₵) — 레이드 -3 = 계약당 ₵6
  capPerBloc: 2,    // 블록당 계약 상한
  capTotal: 3,      // 총 계약 상한
  botProb: 0.5,     // 봇 Ghost 진입 확률 게이트 (과용 방지)
  botMinCredit: 8,  // 봇 Ghost 진입 최소 여유 ₵ (수익 엔진 과열 방지)
};
const shortTotal = (p) => Object.values((p && p.shortPositions) || {}).reduce((a, b) => a + b, 0);

// v6.12 P0-4: 숏 포지션 정산 — 라운드 경계에서 전 라운드 종가(meta.lastStockSnapshot) 대비
// 하락분을 각 Ghost 보유 계약 수만큼 지급하고, 현재 종가를 새 스냅샷으로 저장한다.
// 단일 지점 정산이라 하락 훅이 아무리 많아도 이중 정산이 없다(스냅샷 1회 비교).
function settleShortPositions(state) {
  const snap = state.meta.lastStockSnapshot || state.stocks;
  // v6.15: 시장 변동성 뉴스(short_settle_mult) — 이번 라운드 정산분에 배수 적용 (round 일치 시에만)
  const mult = (state.meta.shortMultRound === state.meta.round) ? (state.meta.shortMultVal || 1) : 1;
  // v6.20 (S06): 붕괴 저가 정산 2배 — 정산 시점 종가가 저가 임계 이하인 블록은 추가 배수 (docs/14 S06).
  const lowMult   = scenarioRule(state, 'shortLowPriceMult', 1);
  const lowThresh = scenarioRule(state, 'shortLowPriceThresh', 5);
  const logs = [];
  const ps = state.players.map(p => {
    if (p.defeated || p.role !== 'ghost') return p;
    const sp = p.shortPositions || {};
    let gained = 0;
    for (const [bl, qty] of Object.entries(sp)) {
      if (!qty) continue;
      const drop = (snap[bl] ?? state.stocks[bl] ?? 0) - (state.stocks[bl] ?? 0);
      if (drop > 0) {
        // 저가 임계 이하(붕괴 지속)면 lowMult 추가 적용 — 미지정 시나리오는 lowMult=1(항등).
        const crashBonus = ((state.stocks[bl] ?? 0) <= lowThresh) ? lowMult : 1;
        const payout = drop * qty * SHORT_CONFIG.payoutPerPt * mult * crashBonus;
        gained += payout;
        logs.push({ round: state.meta.round, phase: 6, message: `📉 ${p.id === 0 ? '⭐ 당신 ' : ''}P${p.id} 숏 정산: ${bl} -${drop}pt × ${qty} = ₵+${payout}${mult > 1 ? ` (변동성×${mult})` : ''}` });
      }
    }
    if (gained === 0) return p;
    return { ...p, resources: { ...p.resources, credit: (p.resources.credit || 0) + gained } };
  });
  return {
    ...state,
    players: ps,
    meta: { ...state.meta, lastStockSnapshot: { ...state.stocks } },
    log: logs.length ? [...state.log, ...logs].slice(-150) : state.log,
  };
}

// ===== v6.44 (A2): 협상 페이즈 (Phase 1.5) 공용 헬퍼 — docs/17 §2 원전 배선 =====
// 원전 §2.1 거래 3종만 생성: 자원 스왑 / 비공격 약속(truce) / BROKER 중개.
// EV-중립(지배 전략 금지): 봇 수락은 net-value ≥ 0 문턱. 지속·보상·위반은 기존 채널 재사용
// (truce 만료 ★+1 = NEXT_ROUND, truce 위반 ★-2/피해자 ★+2 = 레이드 판정, 인맥 트랙 = raiseTrack).
function negoTypeLabel(t) { return t === 'swap' ? '자원 스왑' : t === 'truce' ? '비공격 약속' : t === 'broker_deal' ? 'BROKER 중개' : t; }
function negoResAbbr(k) { return ({ credit: '₵', weapons: '🔩', data: '📡', parts: '⚙', rep: '★' })[k] || (k.charAt(0).toUpperCase()); }

// 원전 §2.1 3종 거래 후보 생성. from 이 남는 자원 ↔ to 가 남는 자원 = 양측 부족분 보충(win-win, EV-중립).
function negoBuildCandidates(fromP, from, toP, to, round) {
  const cands = [];
  const fr = fromP.resources || {}, tr = toP.resources || {};
  // (1) 자원 스왑 — 원전 §2.1 "크레딧↔무기, 데이터↔부품 등. 즉시 자원 교환"
  if ((fr.credit || 0) >= 4 && (tr.weapons || 0) >= 2 && (fr.weapons || 0) < 2)
    cands.push({ from, to, type: 'swap', give: { credit: 4 }, get: { weapons: 2 }, value: 5 });
  if ((fr.weapons || 0) >= 2 && (tr.credit || 0) >= 4 && (fr.credit || 0) < 4)
    cands.push({ from, to, type: 'swap', give: { weapons: 2 }, get: { credit: 4 }, value: 5 });
  if ((fr.data || 0) >= 2 && (tr.parts || 0) >= 2 && (fr.parts || 0) < 2)
    cands.push({ from, to, type: 'swap', give: { data: 2 }, get: { parts: 2 }, value: 4 });
  // (2) 비공격 약속 truce — 원전 §2.1 "1R 동안 서로 raid 안 한다" (진영 다를 때만 의미)
  if (fromP.role !== toP.role)
    cands.push({ from, to, type: 'truce', give: {}, get: {}, expiresR: round + 1, value: 3 });
  // (3) BROKER 중개 — 원전 §2.1/§2.3 "BROKER 클래스 한정. 매 R ★+1 ₵+1"
  if (fromP.specific === 'BROKER')
    cands.push({ from, to, type: 'broker_deal', give: {}, get: { rep: 1, credit: 1 }, value: 3 });
  return cands;
}

// EV-중립 봇 수락 판정. acceptValue = (to 가 받는 것) − (to 가 내주는 것) + 관계가치.
// prop.give = from→to 이전분(=to 수령), prop.get = to→from 이전분(=to 지불). net ≥ 0 이면 수락.
// 지배 전략 방지: 스왑은 부족분 보충 시에만 +, truce 는 소폭 +(만료 ★+1 기대), broker 는 to 무손실.
function negoEvalAccept(prop, toP) {
  let acceptValue = 0;
  for (const [, v] of Object.entries(prop.give || {})) acceptValue += v;   // to 가 수령
  for (const [, v] of Object.entries(prop.get || {})) acceptValue -= v;    // to 가 지불
  if (prop.type === 'truce') acceptValue += 2;        // 비공격 약속 자체 가치
  if (prop.type === 'broker_deal') acceptValue = 1;   // 중개는 to 무손실 → 수락 (BROKER 정체성, to 지불 없음)
  let canAfford = true;   // 스왑만 to 가 get(지불분)을 실제 보유해야 성립 (broker 의 get 은 from 보너스라 to 무지불)
  if (prop.type === 'swap' && prop.get) for (const [k, v] of Object.entries(prop.get)) if ((toP.resources[k] || 0) < v) canAfford = false;
  return { accept: canAfford && acceptValue >= 0, acceptValue, canAfford };
}

// 협상 처리 — 봇↔봇 자동·인간→봇 UI 공용. 발생 로그 + cap-immune 계측(meta.negoStats). 조용한 실패 금지.
function negoApply(s, prop) {
  const fromP = s.players[prop.from], toP = s.players[prop.to];
  if (!fromP || !toP || fromP.defeated || toP.defeated) return s;
  const stats = { proposed: 0, accepted: 0, rejected: 0, swaps: 0, truces: 0, broker: 0, ...(s.meta.negoStats || {}) };
  stats.proposed += 1;
  const evl = negoEvalAccept(prop, toP);
  if (!evl.accept) {
    stats.rejected += 1;
    s = logEntry(s, `🤝 협상 거절: P${prop.from} [${fromP.specific}] → P${prop.to} [${toP.specific}] (${negoTypeLabel(prop.type)}) · EV ${evl.acceptValue}`);
    return { ...s, meta: { ...s.meta, negoStats: stats } };
  }
  // v6.51 (E8): 동일 쌍 활성 truce 중복 등록 거부 — 수락 전 게이트 (거부 로그 + 계측, 조용한 중복 금지)
  if (prop.type === 'truce' && typeof rules_truceActiveBetween === 'function' && rules_truceActiveBetween(s, prop.from, prop.to)) {
    stats.rejected += 1;
    s = logEntry(s, `🕊 비공격 약속 중복: P${prop.from} ↔ P${prop.to} 이미 활성 — 재등록 거부`);
    return { ...s, meta: { ...s.meta, negoStats: stats } };
  }
  stats.accepted += 1;
  const ps = [...s.players];
  if (prop.type === 'swap') {
    stats.swaps += 1;
    const frr = { ...fromP.resources }, trr = { ...toP.resources };
    for (const [k, v] of Object.entries(prop.give)) { frr[k] = (frr[k] || 0) - v; trr[k] = (trr[k] || 0) + v; }
    for (const [k, v] of Object.entries(prop.get)) { trr[k] = (trr[k] || 0) - v; frr[k] = (frr[k] || 0) + v; }
    ps[prop.from] = { ...fromP, resources: frr };
    ps[prop.to] = { ...toP, resources: trr };
    s = { ...s, players: ps };
    const gs = Object.entries(prop.give).map(([k, v]) => `${v}${negoResAbbr(k)}`).join(' ');
    const gt = Object.entries(prop.get).map(([k, v]) => `${v}${negoResAbbr(k)}`).join(' ');
    s = logEntry(s, `🤝 거래 성사: P${prop.from} [${fromP.specific}] (${gs}) ↔ P${prop.to} [${toP.specific}] (${gt})`);
    s = raiseTrack(s, prop.from, 'party', 1, '거래');
  } else if (prop.type === 'truce') {
    stats.truces += 1;
    const newPromises = [...(s.meta.promises || []), { from: prop.from, to: prop.to, type: 'truce', expiresR: prop.expiresR, status: 'active' }];
    s = { ...s, meta: { ...s.meta, promises: newPromises } };
    s = logEntry(s, `🕊 비공격 약속: P${prop.from} ↔ P${prop.to} (R${prop.expiresR}까지 · 지킴 양측 ★+1 / 위반 ★-2·피해자 ★+2)`);
  } else if (prop.type === 'broker_deal') {
    stats.broker += 1;
    const frr = { ...fromP.resources, rep: (fromP.resources.rep || 0) + 1, credit: (fromP.resources.credit || 0) + 1 };
    ps[prop.from] = { ...fromP, resources: frr };
    s = { ...s, players: ps };
    s = logEntry(s, `🎙 BROKER 중개: P${prop.from} ★+1 ₵+1 (P${prop.to} 중개 성사 · 원전 §2.3)`);
    s = raiseTrack(s, prop.from, 'party', 1, 'BROKER 중개');
  }
  return { ...s, meta: { ...s.meta, negoStats: stats } };
}

function reducer(state, action) {
  switch (action.type) {
    case 'SET_PHASE':
      return { ...state, meta: { ...state.meta, phase: action.phase } };

    case 'REQUEST_MOVE_TARGET':
      return { ...state, meta: { ...state.meta, awaitingMoveTarget: true, moveBudget: action.budget || 0, pendingMoveTarget: null } };

    case 'SET_MOVE_TARGET':
      return { ...state, meta: { ...state.meta, awaitingMoveTarget: false, pendingMoveTarget: action.coord } };

    case 'CLEAR_MOVE_TARGET':
      return { ...state, meta: { ...state.meta, awaitingMoveTarget: false, pendingMoveTarget: null, moveBudget: 0 } };

    case 'APPLY_ZONE_BONUS': {
      // action.opt: 선택된 옵션 객체 {k, v, label}
      const pending = state.meta.zoneBonusPending;
      if (!pending) return state;
      const opt = action.opt;
      let s = { ...state };
      const me = s.players[0];
      let res = { ...me.resources };
      let pool = { ...(me.pool || {}) };
      let hp = me.hp;
      let maxHp = me.maxHp;
      let wanted = me.wanted || 0;
      let heat = s.heat;
      let metaPatch = {};
      const logLines = [];
      switch (opt.k) {
        case 'credit': res.credit = (res.credit || 0) + opt.v; logLines.push(`₵ +${opt.v}`); break;
        case 'data': res.data = (res.data || 0) + opt.v; logLines.push(`📡 데이터 +${opt.v}`); break;
        case 'weapons': res.weapons = (res.weapons || 0) + opt.v; logLines.push(`🔩 무기 +${opt.v}`); break;
        case 'parts': res.parts = (res.parts || 0) + opt.v; logLines.push(`⚙️ 부품 +${opt.v}`); break;
        case 'influence': res.influence = (res.influence || 0) + opt.v; logLines.push(`🎙 인플루언스 +${opt.v}`); break;
        case 'rep': res.rep = (res.rep || 0) + opt.v; logLines.push(`★ 렙 +${opt.v}`); break;
        case 'heal': hp = Math.min(maxHp, hp + opt.v); logLines.push(`❤️ HP +${opt.v} (→${hp})`); break;
        case 'full_heal': hp = maxHp; logLines.push(`❤️❤️ HP 완전 회복 (→${hp})`); break;
        case 'wanted': wanted = Math.max(0, wanted + opt.v); logLines.push(`🚨 현상수배 ${opt.v > 0 ? '+' : ''}${opt.v} (→${wanted})`); break;
        case 'heat_down': heat = Math.max(0, heat - opt.v); logLines.push(`🔥 공권력 -${opt.v} (→${heat})`); break;
        case 'gen': pool[opt.v] = (pool[opt.v] || 0) + 1; logLines.push(`◈${opt.v} +1 (개인 풀)`); break;
        case 'all_attr':
          ['M','I','V','S','B','A'].forEach(a => { pool[a] = (pool[a] || 0) + opt.v; });
          logLines.push(`◈ 전속성 +${opt.v}`);
          break;
        case 'random_attr': {
          const pick = rand(['M','I','V','S','B','A']);
          pool[pick] = (pool[pick] || 0) + opt.v;
          logLines.push(`◈${pick} +${opt.v} (랜덤)`);
          break;
        }
        case 'draw': {
          const deck = [...(me.deck || [])];
          const handAdd = deck.splice(0, opt.v);
          const newHand = [...(me.hand || []), ...handAdd];
          // 플레이어에 반영 예약 (아래에서 한 번에 저장)
          metaPatch._drawNew = { deck, hand: newHand };
          logLines.push(`🂠 카드 ${handAdd.length}장 드로우`);
          break;
        }
        case 'stock_buy': {
          // 임의 선택 불가라 랜덤 블록 1주 할인 매수
          const blocs = Object.keys(s.stocks);
          const pick = rand(blocs);
          const cost = Math.max(1, s.stocks[pick] - opt.v);
          if (res.credit >= cost) {
            res.credit -= cost;
            const newStocks = { ...me.stocks, [pick]: (me.stocks[pick] || 0) + 1 };
            metaPatch._stocksNew = newStocks;
            logLines.push(`📈 ${pick} 주식 1주 매수 (₵${cost})`);
          } else {
            logLines.push(`📈 주식 할인 매수 — ₵부족 (필요 ${cost})`);
          }
          break;
        }
        case 'peek_news':
          metaPatch.peekNews = (s.meta.peekNews || 0) + opt.v;
          logLines.push(`👁 다음 뉴스 ${opt.v}장 미리보기 적립`);
          break;
        case 'info':
          metaPatch.mapReveal = (s.meta.mapReveal || 0) + 3;
          logLines.push(`👁 지도 3R 노출`);
          break;
        case 'move_bonus':
          metaPatch.moveBonusNext = (s.meta.moveBonusNext || 0) + opt.v;
          logLines.push(`🚶 다음 턴 이동 +${opt.v}`);
          break;
        case 'atk_boost':
          metaPatch.atkBonusOnce = (s.meta.atkBonusOnce || 0) + opt.v;
          logLines.push(`💥 다음 판정 +${opt.v} (일회성)`);
          break;
        default:
          logLines.push(`(${opt.k} 미구현)`);
      }
      // 플레이어 상태 병합
      let ps = [...s.players];
      const p0Next = {
        ...me,
        resources: res,
        pool,
        hp,
        wanted,
      };
      if (metaPatch._drawNew) {
        p0Next.deck = metaPatch._drawNew.deck;
        p0Next.hand = metaPatch._drawNew.hand;
        delete metaPatch._drawNew;
      }
      if (metaPatch._stocksNew) {
        p0Next.stocks = metaPatch._stocksNew;
        delete metaPatch._stocksNew;
      }
      ps[0] = p0Next;
      const meta2 = { ...s.meta, zoneBonusPending: null, ...metaPatch };
      s = { ...s, players: ps, heat, meta: meta2 };
      s = logEntry(s, `⭐ 당신 🌟 ${pending.coord} 보너스 획득 · ${opt.label}${logLines.length > 1 ? ` [${logLines.join(', ')}]` : ''}`);
      return s;
    }

    case 'SKIP_ZONE_BONUS':
      return { ...state, meta: { ...state.meta, zoneBonusPending: null } };

    // v6.0: 결정 모달 골격 — euro_module.js의 pendingDecisions 큐 해소 (UI v5.3.3 연결)
    case 'RESOLVE_DECISION': {
      if (typeof euro_resolvePendingDecision !== 'function') return state;
      return euro_resolvePendingDecision(state, action.decisionId, action.choice);
    }

    case 'RAID_SELECT_TYPE': {
      const pr = state.meta.pendingRaid;
      if (!pr) return state;
      // v0.6.3c: 트랙 레벨 잠금 검증
      const cfg = RAID_TYPES[action.raidType];
      if (cfg?.requiresTrack) {
        const me = state.players[0];
        const lv = me?.tracks?.[cfg.requiresTrack.key] || 0;
        if (lv < cfg.requiresTrack.lv) {
          return { ...state, log: [...state.log, { round: state.meta.round, phase: state.meta.phase, message: `❌ ${cfg.name} 잠김 — ${TRACK_NAMES[cfg.requiresTrack.key].name} LV${cfg.requiresTrack.lv} 필요 (현재 LV${lv})` }].slice(-150) };
        }
      }
      return { ...state, meta: { ...state.meta, pendingRaid: { ...pr, selectedType: action.raidType, phase: 'invest' } } };
    }

    case 'RAID_INVEST': {
      // action.item: 'weapons' | 'data' | 'poolAttr' (with action.attr for pool)
      const pr = state.meta.pendingRaid;
      if (!pr) return state;
      const me = state.players[0];
      const inv = { ...pr.invested };
      if (action.item === 'weapons' && (me.resources.weapons || 0) > inv.weapons) {
        inv.weapons++;
      } else if (action.item === 'data' && (me.resources.data || 0) > inv.data) {
        inv.data++;
      } else if (action.item === 'poolAttr' && action.attr) {
        if ((me.pool?.[action.attr] || 0) > 0 && !inv.poolAttr) {
          inv.poolAttr = action.attr;
        }
      } else if (action.item === 'unset_pool') {
        inv.poolAttr = null;
      } else if (action.item === 'reset') {
        inv.weapons = 0; inv.data = 0; inv.poolAttr = null;
      }
      return { ...state, meta: { ...state.meta, pendingRaid: { ...pr, invested: inv } } };
    }

    case 'RAID_EXECUTE': {
      const pr = state.meta.pendingRaid;
      if (!pr || !pr.selectedType) return state;
      let s = { ...state };
      const me = s.players[0];
      const rtype = RAID_TYPES[pr.selectedType];
      const zoneLoot = ZONE_LOOT[pr.zoneType] || {};
      const bloc = pr.bloc;
      const counterBonus = countersBloc(me.specific, bloc) ? 1 : 0;

      // 투자 자원 소비
      const inv = pr.invested;
      const newRes = { ...me.resources };
      if (inv.weapons > 0) newRes.weapons = Math.max(0, (newRes.weapons || 0) - inv.weapons);
      if (inv.data > 0) newRes.data = Math.max(0, (newRes.data || 0) - inv.data);
      const newPool = { ...(me.pool || {}) };
      if (inv.poolAttr) newPool[inv.poolAttr] = Math.max(0, (newPool[inv.poolAttr] || 0) - 1);

      // 레이드 타입별 비용 선지불 (협상형·드론형 등)
      if (rtype.cost) {
        if (rtype.cost.credit) {
          if ((newRes.credit || 0) >= rtype.cost.credit) newRes.credit -= rtype.cost.credit;
          else {
            s = logEntry(s, `⭐ 당신 ${rtype.icon} ${rtype.name} 실패 (비용 ₵${rtype.cost.credit} 부족)`);
            return { ...s, meta: { ...s.meta, pendingRaid: null } };
          }
        }
        if (rtype.cost.parts) {
          if ((newRes.parts || 0) >= rtype.cost.parts) newRes.parts -= rtype.cost.parts;
          else {
            s = logEntry(s, `⭐ 당신 ${rtype.icon} ${rtype.name} 실패 (부품 ${rtype.cost.parts}개 부족)`);
            return { ...s, meta: { ...s.meta, pendingRaid: null } };
          }
        }
      }

      // Bloc 자동 반격 (잠입형은 bypass)
      const defense = rtype.bypass_defense ? {} : (BLOC_DEFENSE[bloc] || {});
      let thresholdMod = 0;
      let approachMod = 0;
      let executeMod = 0;
      let escapeMod = 0;
      const defenseLogs = [];
      if (rtype.bypass_defense) defenseLogs.push('🕷 방어 우회');
      if (defense.threshold_plus) { thresholdMod += defense.threshold_plus; defenseLogs.push(`${bloc} 방어 +${defense.threshold_plus} threshold`); }
      if (defense.detect) { approachMod -= 2; defenseLogs.push(`${bloc} 센서 감지 (접근 -2)`); }
      if (defense.all_plus) { approachMod += 0 - defense.all_plus; executeMod -= defense.all_plus; escapeMod -= defense.all_plus; defenseLogs.push(`${bloc} AI 보조 (전 판정 ${-defense.all_plus})`); }
      // v6.11.3 (P0-1): 요새 + 주둔(garrison) + 베일(veil) 토큰을 모두 threshold에 가산 (잠입형은 bypass)
      if (!rtype.bypass_defense) {
        const tokBonus = (pr.fortified || 0) + (pr.garrison || 0) + (pr.veil || 0);
        if (tokBonus > 0) { thresholdMod += tokBonus; defenseLogs.push(`방어 토큰 +${tokBonus} (요새${pr.fortified||0}/주둔${pr.garrison||0}/베일${pr.veil||0})`); }
      }
      // v6.16 (P1-2): MOLE 위장 대상 Bloc이면 내부자 이점 (threshold -2)
      if (moleDisguiseMatch(me, bloc)) { thresholdMod -= 2; defenseLogs.push(`🕷 내부자 위장 (${bloc}, threshold -2)`); }

      const finalThreshold = rtype.threshold + thresholdMod;

      // 투자 보너스
      const zoneAttr = ZONE_TYPES[pr.zoneType]?.attr;
      const poolBonus = inv.poolAttr === zoneAttr ? 2 : (inv.poolAttr ? 1 : 0);
      const execBonus = inv.weapons + counterBonus + executeMod;
      const approachBonus = inv.data + approachMod;
      const escapeBonus = escapeMod;

      // === 3단계 판정 ===
      // 1. Approach (접근) — d6 + SHADE 속성 투자 (data) vs 4
      const approachRoll = d6();
      const approachTotal = approachRoll + approachBonus + (inv.poolAttr === 'S' ? 2 : 0);
      const approachOK = approachTotal >= 4;

      // 2. Execute (실행) — d6 + 선택한 스탯 + 투자 + 상성 + 트랙 보너스 vs threshold
      // v0.5.25: 크리티컬 실패 — d6 = 1은 자동 실패 (스탯 무관)
      // v0.6.3c: 트랙 패시브 보너스 (combat/mfg/transport LV2~5)
      const execRoll = d6();
      const statVal = me.stats[rtype.useStat] || 0;
      const trackVal = trackBonus(me, rtype.useStat);
      // v6.11.3 (P0-3): attackBonusOnce("다음 판정 +N") 실적용 — 기록만 되고 소비처 0이던 허위 로그 해소
      const atkOnce = s.meta.attackBonusOnce || 0;
      if (atkOnce > 0) {
        s = { ...s, meta: { ...s.meta, attackBonusOnce: 0 } };
        s = logEntry(s, `💪 일회 판정 보너스 +${atkOnce} 소비 (레이드 실행)`);
      }
      const execTotal = execRoll + statVal + trackVal + execBonus + poolBonus + atkOnce + (approachOK ? 0 : -2);
      const critFail = execRoll === 1;
      // v0.6.3c: combat LV4+ 또는 onceAbilities.critFailImmunity → 크리티컬 실패 면역
      const critImmune = (me.tracks?.combat || 0) >= 4 || me.onceAbilities?.critFailImmunity;
      const execOK = (!critFail || critImmune) && execTotal >= finalThreshold;

      // 3. Escape (도주) — d6 + SPD + 수송 트랙 보너스 vs 3
      const escapeRoll = d6();
      const escapeTotal = escapeRoll + me.stats.spd + trackBonus(me, 'spd') + escapeBonus;
      const escapeOK = escapeTotal >= 3;

      // 결과 적용
      const cell = s.map[pr.coord];
      let rewards = rtype.success;
      let outcome = 'success';
      if (!execOK) {
        rewards = rtype.failure;
        outcome = 'failure';
      }

      const ps = [...s.players];
      let updatedP = { ...me, resources: newRes, pool: newPool };

      // 보상/페널티 적용
      if (outcome === 'success') {
        // v6.5: 기본 평판 보상(rewards.rep)은 결정 모달로 대체 — 평판 루트 vs 등가 약탈 루트.
        // 여기서 즉시 더하지 않고 아래에서 pendingDecisions 큐에 등록 (euro_module 미로드 시 폴백 지급).
        if (rewards.data) updatedP.resources.data = (updatedP.resources.data || 0) + rewards.data;
        if (rewards.parts) updatedP.resources.parts = Math.max(0, (updatedP.resources.parts || 0) + rewards.parts);
        if (rewards.influence) updatedP.resources.influence = (updatedP.resources.influence || 0) + rewards.influence;
        updatedP.wanted = (updatedP.wanted || 0) + (rewards.wanted || 0);
        // 구역 차등 전리품
        if (zoneLoot.credit) updatedP.resources.credit = (updatedP.resources.credit || 0) + zoneLoot.credit;
        if (zoneLoot.data) updatedP.resources.data = (updatedP.resources.data || 0) + zoneLoot.data;
        if (zoneLoot.weapons) updatedP.resources.weapons = (updatedP.resources.weapons || 0) + zoneLoot.weapons;
        if (zoneLoot.parts) updatedP.resources.parts = (updatedP.resources.parts || 0) + zoneLoot.parts;
        if (zoneLoot.influence) updatedP.resources.influence = (updatedP.resources.influence || 0) + zoneLoot.influence;
        if (zoneLoot.rep) updatedP.resources.rep += zoneLoot.rep;
        if (zoneLoot.wanted) updatedP.wanted = Math.max(0, (updatedP.wanted || 0) + zoneLoot.wanted);
        if (zoneLoot.full_heal) updatedP.hp = updatedP.maxHp;
        if (zoneLoot.all_attr) ['M','I','V','S','B','A'].forEach(a => { updatedP.pool[a] = (updatedP.pool[a] || 0) + 1; });
        if (zoneLoot.peek_news) s = { ...s, meta: { ...s.meta, peekNews: (s.meta.peekNews || 0) + 1 } };
      } else {
        // v6.11.4 (P0-4): HP 감소는 커밋 후 applyDamage로 위임 (HP0 시 STEP F 일관 처리)
        updatedP.wanted = (updatedP.wanted || 0) + (rewards.wanted || 0);
        if (rewards.data) updatedP.resources.data = Math.max(0, (updatedP.resources.data || 0) + rewards.data);
        if (rewards.parts) updatedP.resources.parts = Math.max(0, (updatedP.resources.parts || 0) + rewards.parts);
      }

      // Escape 실패 추가 페널티
      if (!escapeOK && outcome === 'success') {
        updatedP.wanted = (updatedP.wanted || 0) + 1;
      }

      // 맵/주식 업데이트 (성공 시)
      // v6.46 [69차] (S06): 청산자 귀속용 행동 직전 주가 스냅샷 (타 시나리오는 s06NoteLiquidation 항등).
      const _s06PreStocks = s.stocks;
      let newMap = s.map;
      let newStocks = s.stocks;
      let destroyedBuilding = null;
      if (outcome === 'success') {
        if (cell.building) destroyedBuilding = cell.building;  // v0.6.3e: 건물 파괴 기록
        newMap = { ...s.map, [pr.coord]: { ...cell, owner: null, fortified: 0, building: null } };
        newStocks = { ...s.stocks, [bloc]: Math.max(1, s.stocks[bloc] - (rewards.stockHit || 0)) };
        // v0.6.3e: 건물 파괴 보너스 — Ghost는 추가 ★+2, ₵+3
        if (destroyedBuilding) {
          updatedP.resources.rep = (updatedP.resources.rep || 0) + 2;
          updatedP.resources.credit = (updatedP.resources.credit || 0) + 3;
        }
      }

      ps[0] = updatedP;
      // v6.23 (S04): 레이드 성공 시 공권력 +raidHeatBonus 가산 (docs/14 §S04 = 총 +2). 실패는 rewards.heat 만.
      const heatDelta = (rewards.heat || 0) + (outcome === 'success' ? scenarioRule(s, 'raidHeatBonus', 0) : 0);
      const newHeat = Math.min(10, Math.max(0, s.heat + heatDelta));
      s = { ...s, players: ps, map: newMap, stocks: newStocks, heat: newHeat };
      // v6.46 [69차] (S06): 인간 Ghost 레이드가 블록을 붕괴 바닥으로 밀어넣었으면 청산자 누적 (P0 좌석).
      s = s06NoteLiquidation(s, 0, _s06PreStocks);
      // v6.11.4 (P0-4): 레이드 실패 HP 피해를 통합 헬퍼로 — HP0 시 STEP F (Bloc 방어자가 약탈물 수령)
      if (outcome === 'failure') s = applyDamage(s, 0, rewards.hp || 0, { attacker: pr.blocIdx, label: '레이드 실패' });

      // 레이드 카운트 증가 (성공만)
      if (outcome === 'success') {
        // v6.51 (E4/E7): 레이드 성공 공통 부작용 — 카운터·스캔들 오염·truce 위반 판정·첫 레이드
        //   하이라이트를 rules_raidSuccessFx 단일 지점으로 (인간·봇 이동·카드효과 3경로 동일).
        if (typeof rules_raidSuccessFx === 'function') {
          s = rules_raidSuccessFx(s, 0, cell.owner, bloc);
        } else {
          // 폴백 (모듈 미로드 — E13 배너 고지): 승리 판정에 필수인 카운터만 유지
          s.meta = { ...s.meta, raidsThisGame: { ...s.meta.raidsThisGame, 0: (s.meta.raidsThisGame[0] || 0) + 1 } };
        }
        // v0.6.3b: 레이드 성공 시 사용한 스탯에 따라 트랙 +1
        const raidTrackMap = { atk: 'combat', spd: 'transport', hack: 'mfg' };
        const tk = raidTrackMap[rtype.useStat] || 'combat';
        s = raiseTrack(s, 0, tk, 1, '레이드 성공');
        // 잠입형/협상형 보너스: security/party
        // v6.11.3 (P0-2): rtype.id 미정의 버그 → pr.selectedType(RAID_TYPES 키) 비교로 교체
        if (pr.selectedType === 'infiltrate') s = raiseTrack(s, 0, 'security', 1, '잠입');
        if (pr.selectedType === 'negotiate') s = raiseTrack(s, 0, 'party', 1, '협상');
        // v0.9.1: 하이라이트 — 첫 raid 성공은 rules_raidSuccessFx 공통 지점에서 기록 (E7)
        if (pr.selectedType === 'infiltrate') s = recordHighlight(s, 'first_infiltrate', 0);
        if (destroyedBuilding) s = recordHighlight(s, 'first_building_kill', 0);
        if (s.map[pr.coord]?.zone === 'nex') s = recordHighlight(s, 'first_nexus_claim', 0);
        // v0.6.3d: NPC 블록 레이드 시 시그널 +1 (잠입형은 +2)
        const blocOwner = state.players.findIndex(pp => pp.specific === bloc && pp.role === 'bloc');
        const ownerP = state.players[blocOwner];
        if (ownerP?.isNpc) {
          const sigGain = (pr.selectedType === 'infiltrate' || rtype.bypass_defense) ? 2 : 1;  // v6.11.3 (P0-2)
          s = revealSignal(s, blocOwner, 0, sigGain);
          // 시그널 LV3 보너스 약탈
          if (s.players[blocOwner].signal?.revealed >= 3) {
            const ps = [...s.players];
            ps[0] = { ...ps[0], resources: { ...ps[0].resources, credit: (ps[0].resources.credit || 0) + 5, data: (ps[0].resources.data || 0) + 2 } };
            s = { ...s, players: ps };
            s = logEntry(s, `🎁 시그널 LV3 보너스 약탈 — ₵+5 📡+2`);
          }
        }
      } else {
        // 실패 시 경호 트랙 +1 (방어 학습)
        s = raiseTrack(s, 0, 'security', 1, '레이드 실패');
        // v6.16 (P1-2): MOLE 위장 상태로 위장 대상 구역 레이드 실패 시 발각 (해제 + 수배+1)
        s = moleRaidReveal(s, 0, bloc);
      }

      // 결과 상세 로그
      const cbStr = counterBonus > 0 ? ` +상성${counterBonus}` : '';
      const invStr = [
        inv.weapons ? `🔩×${inv.weapons}` : null,
        inv.data ? `📡×${inv.data}` : null,
        inv.poolAttr ? `◈${inv.poolAttr}${poolBonus>1?'(매치+2)':'+1'}` : null,
      ].filter(Boolean).join(' ');
      const defStr = defenseLogs.length > 0 ? ` | 🛡 ${defenseLogs.join(', ')}` : '';
      const rtn = rtype.name;
      s = logEntry(s, `⭐ 당신 ${rtype.icon} ${rtn} 레이드 [${pr.coord} ${pr.zoneNm}] — ${pr.bloc}${defStr}`);
      if (invStr) s = logEntry(s, `  투자: ${invStr}`);
      s = logEntry(s, `  🎲 접근 ${approachRoll}+${approachBonus}=${approachTotal} ${approachOK ? '✓' : '✗(실행-2)'} · 실행 ${execRoll}+${statVal}${cbStr}+${execBonus+poolBonus}=${execTotal} vs ${finalThreshold} ${execOK ? '✓' : '✗'} · 도주 ${escapeRoll}+${me.stats.spd}=${escapeTotal} ${escapeOK ? '✓' : '✗(수배+1)'}`);
      if (outcome === 'success') {
        const lootStr = Object.values(zoneLoot).length > 0 ? ` + ${zoneLoot.label}` : '';
        const buildStr = destroyedBuilding ? ` · 🏚 ${BUILDINGS[destroyedBuilding].name} 파괴 (★+2 ₵+3)` : '';
        s = logEntry(s, `  ✅ 성공 · 보상 선택 대기(★+${rewards.rep} 또는 약탈) · ${bloc} 주가-${rewards.stockHit} · 중립화${lootStr}${buildStr}`);
        // 서사 표면화: 레이드 성공 시 실행 고스트(P0) 명대사 1회 첨가 (게임당 인물별 캡)
        s = loreFlavorOnce(s, me.specific);
      } else {
        s = logEntry(s, `  ❌ 실패 · HP-${rewards.hp || 0} · 수배+${rewards.wanted || 0}`);
      }

      s.meta = { ...s.meta, pendingRaid: null };

      // v6.5: 레이드 성공 기본 평판 보상을 선택 결정으로 큐잉 (밸런스 중립: ★+rep vs 등가 약탈)
      if (outcome === 'success' && (rewards.rep || 0) > 0) {
        if (typeof euro_addPendingDecision === 'function' && typeof euro_raidLootBundle === 'function') {
          const _lb = euro_raidLootBundle(rewards.rep);
          // v6.51 (E10): id 에 시퀀스 부가 — 같은 R·같은 좌표 2번째 보상이 중복 id 로 증발하는 문제 봉합
          const _dseq = (s.meta.decisionSeq || 0) + 1;
          s = { ...s, meta: { ...s.meta, decisionSeq: _dseq } };
          s = euro_addPendingDecision(s, {
            id: `raid_reward_r${s.meta.round}_${pr.coord}_${_dseq}`,
            type: 'raid_reward',
            playerIdx: 0,
            prompt: '레이드 성공 — 보상 선택',
            options: [
              { id: 'rep',  label: `★ 평판 +${rewards.rep} (평판 루트)` },
              { id: 'loot', label: `₵+${_lb.credit}, ⚙+${_lb.parts} (약탈 루트)` },
            ],
            context: { round: s.meta.round, rep: rewards.rep, coord: pr.coord },
          });
        } else {
          // 폴백: euro_module 미로드 시 기존 동작 유지 (평판 즉시 지급)
          const ps2 = [...s.players];
          ps2[0] = { ...ps2[0], resources: { ...ps2[0].resources, rep: (ps2[0].resources.rep || 0) + rewards.rep } };
          s = { ...s, players: ps2 };
        }
      }
      return s;
    }

    case 'RESOLVE_RAID_NO': {
      const pr = state.meta.pendingRaid;
      if (!pr) return state;
      let s = { ...state, meta: { ...state.meta, pendingRaid: null } };
      s = logEntry(s, `⭐ 당신 🕶 레이드 포기 [${pr.coord} ${pr.zoneNm}] — 정찰만 하고 물러남`);
      return s;
    }

    case 'RESOLVE_DUEL_YES': {
      const d = state.meta.pendingGhostDuel;
      if (!d) return state;
      let s = { ...state };
      const atkRoll = d6();
      const defRoll = d6();
      const ps = [...s.players];
      const atkP = ps[d.atkGhostIdx];
      const defP = ps[d.defGhostIdx];
      // 상성 보너스: 공격자 → 방어자 카운터 관계면 atk +2
      const counterBonus = countersGhost(atkP.specific, defP.specific) ? 2 : 0;
      const atkTotal = d.atkStat + atkRoll + counterBonus;
      const defTotal = d.defStat + defRoll;
      if (atkTotal >= defTotal + 2) {
        const loot = Math.min(3, defP.resources.credit || 0);
        ps[d.atkGhostIdx] = { ...atkP, resources: { ...atkP.resources, rep: (atkP.resources.rep || 0) + 2, credit: (atkP.resources.credit || 0) + loot } };
        ps[d.defGhostIdx] = { ...defP, resources: { ...defP.resources, credit: Math.max(0, (defP.resources.credit || 0) - loot) } };
        s = { ...s, players: ps, meta: { ...s.meta, pendingGhostDuel: null } };
        const cbStr = counterBonus > 0 ? ` +상성${counterBonus}` : '';
        s = logEntry(s, `⭐ 당신 ⚔️ Ghost 결투 승리! → P${d.defGhostIdx} ${defP.specific} | 🎲${atkRoll}+${d.atkStat}${cbStr}=${atkTotal} vs ${defTotal} | 렙+2, ₵+${loot} 탈취`);
        s = applyDamage(s, d.defGhostIdx, 2, { attacker: d.atkGhostIdx, label: 'Ghost 결투' });  // v6.11.4 (P0-4)
      } else if (defTotal >= atkTotal + 2) {
        s = { ...s, players: ps, meta: { ...s.meta, pendingGhostDuel: null } };
        s = logEntry(s, `⭐ 당신 ⚔️ Ghost 결투 반격당함! P${d.defGhostIdx} ${defP.specific} | 🎲${atkTotal} vs ${defTotal} | HP-2`);
        s = applyDamage(s, d.atkGhostIdx, 2, { attacker: d.defGhostIdx, label: 'Ghost 결투 반격' });  // v6.11.4 (P0-4)
      } else {
        s = { ...s, meta: { ...s.meta, pendingGhostDuel: null } };
        s = logEntry(s, `⭐ 당신 ⚔️ Ghost 결투 무승부 P${d.defGhostIdx} | 🎲${atkTotal} vs ${defTotal}`);
      }
      return s;
    }

    case 'RESOLVE_DUEL_NO': {
      const d = state.meta.pendingGhostDuel;
      if (!d) return state;
      let s = { ...state, meta: { ...state.meta, pendingGhostDuel: null } };
      const defP = s.players[d.defGhostIdx];
      s = logEntry(s, `⭐ 당신 🕶 결투 회피 — P${d.defGhostIdx} ${defP.specific}와 잠시 공존`);
      return s;
    }

    case 'DISMISS_TARGETED':
      return { ...state, meta: { ...state.meta, lastTargetedBy: null } };

    case 'BUY_STOCK': {
      // action.playerIdx, action.bloc, action.qty
      // v6.22 (S06): 첫 N R 거래 동결 — R≤tradeFreezeRounds 매수 금지(원전 시장 동결). 타 시나리오 0 → 무효.
      if (state.meta.round <= scenarioRule(state, 'tradeFreezeRounds', 0)) return state;
      const price = state.stocks[action.bloc];
      if (!price) return state;
      const cost = price * action.qty;
      const ps = [...state.players];
      const p = ps[action.playerIdx];
      if ((p.resources.credit || 0) < cost) return state;
      ps[action.playerIdx] = {
        ...p,
        resources: { ...p.resources, credit: p.resources.credit - cost },
        stocks: { ...p.stocks, [action.bloc]: (p.stocks[action.bloc] || 0) + action.qty },
      };
      // Bloc 본인 매수 유동성 부여: 주가 +1 (매수세)
      const newStocks = { ...state.stocks, [action.bloc]: Math.min(20, price + (action.qty >= 3 ? 1 : 0)) };
      const marker = action.playerIdx === 0 ? '⭐ 당신 ' : '';
      return {
        ...state,
        players: ps,
        stocks: newStocks,
        log: [...state.log, { round: state.meta.round, phase: 1, message: `📈 ${marker}P${action.playerIdx} · ${action.bloc} ${action.qty}주 매수 (₵${cost}) — 주가 ${price}${newStocks[action.bloc] !== price ? `→${newStocks[action.bloc]}` : ''}` }].slice(-150),
      };
    }

    case 'SELL_STOCK': {
      // v6.22 (S06): 첫 N R 거래 동결 — R≤tradeFreezeRounds 매도 금지. 타 시나리오 0 → 무효.
      if (state.meta.round <= scenarioRule(state, 'tradeFreezeRounds', 0)) return state;
      const price = state.stocks[action.bloc];
      if (!price) return state;
      const ps = [...state.players];
      const p = ps[action.playerIdx];
      const have = p.stocks[action.bloc] || 0;
      const qty = Math.min(have, action.qty);
      if (qty === 0) return state;
      const earn = price * qty;
      ps[action.playerIdx] = {
        ...p,
        resources: { ...p.resources, credit: (p.resources.credit || 0) + earn },
        stocks: { ...p.stocks, [action.bloc]: have - qty },
      };
      const newStocks = { ...state.stocks, [action.bloc]: Math.max(1, price - (qty >= 3 ? 1 : 0)) };
      const marker = action.playerIdx === 0 ? '⭐ 당신 ' : '';
      return {
        ...state,
        players: ps,
        stocks: newStocks,
        log: [...state.log, { round: state.meta.round, phase: 1, message: `📉 ${marker}P${action.playerIdx} · ${action.bloc} ${qty}주 매도 (₵+${earn}) — 주가 ${price}${newStocks[action.bloc] !== price ? `→${newStocks[action.bloc]}` : ''}` }].slice(-150),
      };
    }

    case 'BUY_SHORT': {
      // v6.12 P0-4: Ghost 공매도 진입. action.playerIdx, action.bloc, action.qty(기본 1).
      // v6.22 (S06): 첫 N R 거래 동결 — 숏 진입도 시장 동결 대상. 타 시나리오 0 → 무효.
      if (state.meta.round <= scenarioRule(state, 'tradeFreezeRounds', 0)) return state;
      const p0 = state.players[action.playerIdx];
      if (!p0 || p0.role !== 'ghost' || p0.defeated) return state;
      if (!state.stocks[action.bloc]) return state;
      const sp = { ...(p0.shortPositions || {}) };
      const curBloc = sp[action.bloc] || 0;
      const curTotal = shortTotal(p0);
      // 상한: 블록당 capPerBloc, 총 capTotal
      const addable = Math.min(action.qty || 1, SHORT_CONFIG.capPerBloc - curBloc, SHORT_CONFIG.capTotal - curTotal);
      if (addable <= 0) return state;
      const cost = SHORT_CONFIG.cost * addable;
      if ((p0.resources.credit || 0) < cost) return state;
      const ps = [...state.players];
      sp[action.bloc] = curBloc + addable;
      ps[action.playerIdx] = { ...p0, resources: { ...p0.resources, credit: p0.resources.credit - cost }, shortPositions: sp };
      const marker = action.playerIdx === 0 ? '⭐ 당신 ' : '';
      return {
        ...state,
        players: ps,
        log: [...state.log, { round: state.meta.round, phase: 1, message: `🔻 ${marker}P${action.playerIdx} · ${action.bloc} 숏 ${addable}건 진입 (₵-${cost}) — 총 ${curTotal + addable}/${SHORT_CONFIG.capTotal}` }].slice(-150),
      };
    }

    case 'DECLARE_MNA': {
      // v6.10: M&A Stage 2 — 인간(P0) 적대적 인수 선언. 게이트·상태전이는 euro_module에.
      if (typeof euro_declareMna !== 'function') return state;
      let mnaState = euro_declareMna(state, action.playerIdx, action.bloc);
      // 서사 표면화: 인수 선언이 성립(pendingMna 생성)하면 선언 블록 수장 명대사 1회 첨가.
      if (mnaState !== state && mnaState.meta && mnaState.meta.pendingMna) {
        const decl = state.players[action.playerIdx];
        if (decl) mnaState = loreFlavorOnce(mnaState, decl.specific);
      }
      return mnaState;
    }

    case 'HUMAN_SUPPRESS': {
      // v6.4: 인간 플레이어 능동 견제 — payload: { playerIdx(부여자), targetIdx, tokenType }
      // 봇 부여(euro_grantSuppression)의 인간 방향 대칭. 토큰 소비는 다음 NEXT_ROUND의
      // euro_applySuppression이 자동 처리 (여기선 부여만).
      const SPEC = (typeof window !== 'undefined' && window.SUPPRESSION_SPEC) || (typeof SUPPRESSION_SPEC !== 'undefined' ? SUPPRESSION_SPEC : null);
      const spec = SPEC && SPEC[action.tokenType];
      if (!spec) return state;
      const attacker = state.players[action.playerIdx];
      const target = state.players[action.targetIdx];
      if (!attacker || !target) return state;
      // 가드: 부여자 human · 미탈락, 타겟 미탈락 · 자기 아님, ₵≥5, 라운드당 1회
      if (attacker.kind !== 'human' || attacker.defeated) return state;
      if (target.defeated || action.targetIdx === action.playerIdx) return state;
      if ((attacker.resources.credit || 0) < 5) return state;
      const suppressed = state.meta.humanSuppressedThisRound || {};
      if (suppressed[action.playerIdx]) return state;
      const ps = [...state.players];
      ps[action.playerIdx] = { ...attacker, resources: { ...attacker.resources, credit: (attacker.resources.credit || 0) - 5 } };
      const curTok = target.suppressionTokens || { combat: 0, info: 0, diplomacy: 0 };
      // v6.6: 타겟에 보복 메모리 기록 — 봇의 euro_grantSuppression이 다음 R에 이 기억을
      // 읽어 부여자(인간 포함)에게 보복 편향 위협도 +EURO_GRUDGE_BONUS 적용.
      ps[action.targetIdx] = { ...target, suppressionTokens: { ...curTok, [action.tokenType]: (curTok[action.tokenType] || 0) + 1 }, lastSuppressedBy: { by: action.playerIdx, round: state.meta.round } };
      return {
        ...state,
        players: ps,
        meta: { ...state.meta, humanSuppressedThisRound: { ...suppressed, [action.playerIdx]: true } },
        log: [...state.log, { round: state.meta.round, phase: state.meta.phase, message: `${spec.icon} P${action.playerIdx} → P${action.targetIdx} ${target.specific} ${spec.label} 견제 (₵-5)` }].slice(-150),
      };
    }

    case 'SHOP_BUY': {
      // 공용 상점 — 누구나 Phase 1에 구매 가능
      // action.playerIdx, action.item
      const items = {
        medical:   { cost: 5, name: '의료 치료',   apply: p => ({ ...p, hp: p.maxHp }) },
        arms:      { cost: 4, name: '무기상',      apply: p => ({ ...p, resources: { ...p.resources, weapons: (p.resources.weapons||0) + 2 } }) },
        info:      { cost: 3, name: '정보상',      apply: p => ({ ...p, resources: { ...p.resources, data: (p.resources.data||0) + 2, rep: (p.resources.rep||0) + 1 } }) },
        bribe:     { cost: 3, name: '뇌물',        apply: p => ({ ...p, wanted: Math.max(0, (p.wanted||0) - 2) }) },
        bounty:    { cost: 4, name: '현상금 청구', apply: p => ({ ...p, resources: { ...p.resources, rep: (p.resources.rep||0) + 2 } }) },
        recruit:   { cost: 6, name: '용병 영입',   apply: p => ({ ...p, resources: { ...p.resources, weapons: (p.resources.weapons||0) + 3, parts: (p.resources.parts||0) + 1 } }) },
      };
      const it = items[action.item];
      if (!it) return state;
      const p = state.players[action.playerIdx];
      if ((p.resources.credit||0) < it.cost) return state;
      const ps = [...state.players];
      let updated = { ...p, resources: { ...p.resources, credit: p.resources.credit - it.cost } };
      updated = it.apply(updated);
      ps[action.playerIdx] = updated;
      let s = { ...state, players: ps };
      if (action.item === 'bribe') s = { ...s, heat: Math.max(0, s.heat - 1) };
      const marker = action.playerIdx === 0 ? '⭐ 당신 ' : '';
      s = logEntry(s, `🏪 ${marker}P${action.playerIdx} · 상점: ${it.name} (₵-${it.cost})`);
      // v0.6.3b: 상점 구매 → 파티(인맥 거래) 트랙 +1, 무기/용병은 무력으로
      const tk = (action.item === 'arms' || action.item === 'recruit') ? 'combat' : 'party';
      s = raiseTrack(s, action.playerIdx, tk, 1, `상점:${it.name}`);
      return s;
    }

    // v6.44 (A2): NEGOTIATE_PHASE — Phase 1.5 협상 (docs/17 §2 원전 배선).
    //   봇↔봇 자동 경로만 여기서 처리(발생 로그 + cap-immune 계측). 인간(P0)은 UI PROPOSE_NEGOTIATION.
    //   봇↔봇 과밀 방지: 라운드당 봇 제안 상한(NEGO_MAX). 밴드 이탈 시 이 상수 하향이 튜닝 노브.
    //   EV-중립: negoEvalAccept net ≥ 0 만 수락(지배 전략 금지). 원전 3종만 negoBuildCandidates 로 생성.
    case 'NEGOTIATE_PHASE': {
      let s = { ...state };
      const players = s.players, round = s.meta.round;
      // v6.51 (E3): 캡 단일 소스 = rules_module.RULES_NEGO_MAX (인간 PROPOSE_NEGOTIATION 과 동일 값)
      const NEGO_MAX = (typeof RULES_NEGO_MAX === 'number') ? RULES_NEGO_MAX : 2;   // 과밀 방지 · 밴드 튜닝 노브 (라운드당 봇 제안 상한)
      let fired = 0;
      for (let from = 0; from < players.length && fired < NEGO_MAX; from++) {
        const fromP = players[from];
        // 봇 발기자만 (인간 seat 은 UI 경로) · NPC/패배 제외
        if (fromP.defeated || fromP.isNpc || fromP.kind === 'human') continue;
        // 대상: 봇 상대만 (봇↔봇). 인간·NPC·패배 제외 → 인간은 UI 로만 협상 도달
        const others = players.map((pp, i) => ({ pp, i })).filter(({ pp, i }) => i !== from && !pp.defeated && !pp.isNpc && pp.kind !== 'human');
        if (others.length === 0) continue;
        const cands = [];
        for (const { pp: toP, i: to } of others) cands.push(...negoBuildCandidates(fromP, from, toP, to, round));
        if (cands.length === 0) continue;
        cands.sort((a, b) => b.value - a.value);
        s = negoApply(s, cands[0]);   // 발생 로그 + 계측 (수락/거절 모두 기록)
        fired++;
      }
      return s;
    }

    // v6.44 (A2): PROPOSE_NEGOTIATION — 인간(P0) UI 제안 경로. 모달이 완성된 prop 전달, 봇은 EV-중립 판정.
    //   truce 는 meta.promises 에 등록 → 위반 시 레이드 판정(★-2/피해자 ★+2), 만료 시 NEXT_ROUND ★+1.
    case 'PROPOSE_NEGOTIATION': {
      const prop = action.prop;
      if (!prop || prop.from == null || prop.to == null) return state;
      // v6.51 (E3): 인간 제안도 봇과 동일한 라운드당 캡(RULES_NEGO_MAX=2) — BROKER 중개 무상한 반복 봉합.
      //   캡 도달 시 UI 버튼이 disabled+사유 표기, 여기는 이중 안전판(로그로 거부 — 조용한 거부 금지).
      if (typeof rules_negoCapInfo === 'function') {
        const cap = rules_negoCapInfo(state, prop.from);
        if (!cap.ok) return logEntry(state, `🤝 협상 제안 거부: P${prop.from} ${cap.reason}`);
      }
      let s = { ...state };
      if (typeof rules_negoCapNote === 'function') s = rules_negoCapNote(s, prop.from);
      return negoApply(s, prop);
    }

    case 'BOT_MARKET': {
      // 봇들 자동 거래 (간단 AI)
      let s = { ...state };
      const ps = [...state.players];
      // v6.22 (S06): 첫 N R 시장 동결 — 봇 매수/매도/숏/M&A 매집 전부 스킵(원전 시장 동결). 타 시나리오 0 → 무효.
      const marketFrozen = state.meta.round <= scenarioRule(state, 'tradeFreezeRounds', 0);
      state.players.forEach((p, pi) => {
        if (p.kind !== 'bot' || p.defeated) return;
        if (marketFrozen) return;
        const credit = p.resources.credit || 0;
        const blocs = Object.keys(s.stocks);
        // ── v6.12 P0-4: 봇 Ghost 공매도 — 레이드 목표 블록에 1계약 (과용 게이트) ──
        // heuristic: ₵ 여유(botMinCredit) + 확률(botProb) + 총 상한 미만일 때, 자기가
        // 레이드로 노리는 블록(findRaidTargetZone 방향)에 1계약. 목표 미상 시 자산 선두 Bloc.
        if (p.role === 'ghost' && credit >= SHORT_CONFIG.botMinCredit && Math.random() < SHORT_CONFIG.botProb) {
          const sp = ps[pi].shortPositions || {};
          if (shortTotal(ps[pi]) < SHORT_CONFIG.capTotal) {
            let targetBloc = null;
            if (p.position && typeof findRaidTargetZone === 'function') {
              const coord = findRaidTargetZone(s, p.position);
              const cell = coord && s.map[coord];
              const owner = (cell && cell.owner != null) ? s.players[cell.owner] : null;
              if (owner && owner.role === 'bloc') targetBloc = owner.specific;
            }
            if (!targetBloc) {
              let best = -1;
              s.players.forEach(pp => { if (pp.role === 'bloc' && !pp.defeated) { const av = assetValue(pp, s.stocks, s); if (av > best) { best = av; targetBloc = pp.specific; } } });
            }
            if (targetBloc && (sp[targetBloc] || 0) < SHORT_CONFIG.capPerBloc && (ps[pi].resources.credit || 0) >= SHORT_CONFIG.cost) {
              const nsp = { ...sp, [targetBloc]: (sp[targetBloc] || 0) + 1 };
              ps[pi] = { ...ps[pi], resources: { ...ps[pi].resources, credit: ps[pi].resources.credit - SHORT_CONFIG.cost }, shortPositions: nsp };
              s = logEntry(s, `🔻 P${pi} [${p.specific}] · ${targetBloc} 숏 1건 진입 (₵-${SHORT_CONFIG.cost})`);
            }
          }
        }
        // ── v6.12 P0-2: M&A 각성 — 인수 목표 지정 + 목표 지분 매집 ──────────
        // 11×11(M&A 활성) · 봇 Bloc 한정. 게이트(euro_declareMnaBots)는 불변 —
        // 매집이 51% 게이트를 "열리게" 만들 뿐. 목표는 p.mnaTarget에 라운드 지속 저장.
        const mnaOn = (typeof euro_mnaEnabled === 'function') ? euro_mnaEnabled(s) : (s.meta.mapSize === '11x11');
        const curRound = (s.meta && s.meta.round) || 0;
        // 예약된 블록: 이미 어떤 플레이어가 인수 목표로 삼은 블록 (희석 방지 — 지정·일반매수 제외)
        const reserved = () => new Set(ps.map(x => x && x.mnaTarget).filter(Boolean));
        // v6.19 (S02 mnaSerial): 인수 완료된 목표는 해제 → 2차 목표 재지정 허용(2곳 인수 승리 경로 개통).
        //   기존 로직은 mnaTarget 을 인수 후에도 유지 → 봇이 1곳 인수 뒤 정지(2곳 승리 불가).
        //   S02 전용(scenarioRule 게이팅) — S01 등 다른 시나리오는 기존대로 단일 목표 유지(회귀 불변).
        if (scenarioRule(s, 'mnaSerial', false) && ps[pi].mnaTarget
            && (typeof euro_acquisitionsFor === 'function')
            && euro_acquisitionsFor(s, pi).includes(ps[pi].mnaTarget)) {
          ps[pi] = { ...ps[pi], mnaTarget: null };
        }
        // 목표 지정: 게임당 봇별 1회, R1+(가드 완화 근거 상단), ₵ 여유 있을 때만. 예약 안 된 라이벌만 후보.
        if (mnaOn && p.role === 'bloc' && !ps[pi].mnaTarget && curRound >= MNA_MIN_ROUND
            && (ps[pi].resources.credit || 0) >= scenarioRule(s, 'mnaDesignateCredit', MNA_DESIGNATE_CREDIT)) {
          const already = (typeof euro_acquisitionsFor === 'function') ? euro_acquisitionsFor(s, pi) : [];
          const taken = reserved();
          const rivals = blocs.filter(bl => bl !== p.specific && !already.includes(bl));
          // 1순위: 이미 30%+ 보유한 라이벌 블록 (51%까지 완주가 가장 쌈) — 예약 무시(내 것)
          let target = null, bestEq = -1;
          rivals.forEach(bl => {
            const eq = (typeof euro_equityPct === 'function') ? euro_equityPct(s, pi, bl) : 0;
            if (eq >= MNA_TARGET_EXISTING_PCT && eq > bestEq) { bestEq = eq; target = bl; }
          });
          // 2순위: 예약 안 된 가장 싼 라이벌 블록 (매집 비용 최소화 + 단독 집중)
          if (!target) {
            let cheap = null, cheapPrice = Infinity;
            rivals.forEach(bl => { if (taken.has(bl)) return; const pr = s.stocks[bl]; if (pr < cheapPrice) { cheapPrice = pr; cheap = bl; } });
            target = cheap;
          }
          if (target) {
            ps[pi] = { ...ps[pi], mnaTarget: target };
            s = logEntry(s, `🎯 P${pi} [${p.specific}] · ${target} 인수 목표 지정 — 지분 매집 개시`);
          }
        }
        // 목표 매수 모드: 인수 목표가 살아있으면(미인수·지분<중단) 이 봇은 "적대적 인수" 올인 —
        //   (1) 목표·자사 외 보유 주식을 전량 청산해 실탄 확보 (2) ₵ 하한까지 목표 주식 집중 매수
        //   (3) 이번 라운드 일반 매수·매도 스킵. 목표 매집은 주가를 올리지 않는다(미거래 float 흡수
        //   성격 — 주가를 올리면 남은 ₵로 살 주식이 줄고 자산이 부풀어 95 조기승리를 가속, 둘 다 각성 무력화).
        const tgt = ps[pi].mnaTarget;
        let acqMode = false;
        if (mnaOn && tgt && tgt !== p.specific) {
          const acq = (typeof euro_acquisitionsFor === 'function') ? euro_acquisitionsFor(s, pi) : [];
          const eqNow = (typeof euro_equityPct === 'function') ? euro_equityPct(s, pi, tgt) : 0;
          if (!acq.includes(tgt) && eqNow < MNA_EQUITY_STOP) {
            acqMode = true;
            // (1) 인수 자금 마련 — 목표·자사 외 보유 주식 전량 청산
            Object.entries(ps[pi].stocks).forEach(([bl, q]) => {
              if (!q || bl === tgt || (p.role === 'bloc' && bl === p.specific)) return;
              const pr = s.stocks[bl] || 0;
              if (pr <= 0) return;
              ps[pi] = { ...ps[pi], resources: { ...ps[pi].resources, credit: (ps[pi].resources.credit || 0) + pr * q }, stocks: { ...ps[pi].stocks, [bl]: 0 } };
              s = { ...s, stocks: { ...s.stocks, [bl]: Math.max(1, (s.stocks[bl] || 1) - 1) } };
            });
            // (2) 목표 주식 집중 매수 (동일가 배치 = 신용당 주식 최대화)
            const price = s.stocks[tgt];
            let bought = 0;
            if (price <= MNA_BUY_MAXPRICE) {
              while (bought < MNA_BUY_QTY && (ps[pi].resources.credit || 0) - price >= MNA_CREDIT_FLOOR) {
                ps[pi] = {
                  ...ps[pi],
                  resources: { ...ps[pi].resources, credit: ps[pi].resources.credit - price },
                  stocks: { ...ps[pi].stocks, [tgt]: (ps[pi].stocks[tgt] || 0) + 1 },
                };
                bought++;
              }
            }
            if (bought > 0) {
              const eqAfter = (typeof euro_equityPct === 'function') ? euro_equityPct({ ...s, players: ps }, pi, tgt) : 0;
              s = logEntry(s, `📥 P${pi} [${p.specific}] · ${tgt} ${bought}주 매집 (인수 목표 · 지분 ${eqAfter}%)`);
              // 40% 돌파 매집 경보 (docs/22 P0-2) — 게임당 목표별 1회 공개 로그
              const alerted = s.meta.mnaAlert || {};
              if (eqAfter >= 40 && !alerted[`${pi}:${tgt}`]) {
                s = { ...s, meta: { ...s.meta, mnaAlert: { ...alerted, [`${pi}:${tgt}`]: true } } };
                s = logEntry(s, `🚨 매집 경보! P${pi} [${p.specific}]가 ${tgt} 지분 ${eqAfter}% 확보 — 과반 인수 임박`);
              }
            }
          }
        }
        const reservedNow = reserved();  // v6.12: 예약 블록은 일반 매수에서 제외 (집중 보호)
        // 주가 낮고 본인 자산에 들어갈 주식 매수 (Bloc은 자사 제외) — 인수 올인 모드면 스킵
        if (!acqMode) blocs.forEach(bl => {
          if (p.role === 'bloc' && p.specific === bl) return;  // 자사 매수 X
          if (reservedNow.has(bl)) return;                     // v6.12: 인수 목표(예약) 블록 제외
          const price = s.stocks[bl];
          if (price <= 7 && credit >= price * 2 && Math.random() < 0.5) {
            const qty = 2;
            const cost = price * qty;
            ps[pi] = {
              ...ps[pi],
              resources: { ...ps[pi].resources, credit: ps[pi].resources.credit - cost },
              stocks: { ...ps[pi].stocks, [bl]: (ps[pi].stocks[bl] || 0) + qty },
            };
            s = { ...s, stocks: { ...s.stocks, [bl]: Math.min(20, s.stocks[bl] + 1) } };
            s = logEntry(s, `📈 P${pi} [${p.specific}] · ${bl} ${qty}주 매수 (₵${cost}) — 주가 ${price}→${s.stocks[bl]}`);
          }
        });
        // 주가 높은 보유 종목은 매도 — 인수 올인 모드면 스킵(청산은 위에서 전담)
        if (!acqMode) Object.entries(p.stocks).forEach(([bl, qty]) => {
          if (p.role === 'bloc' && p.specific === bl) return;
          if (bl === ps[pi].mnaTarget) return;  // v6.12: 인수 목표 지분은 매도 금지
          const price = s.stocks[bl];
          if (price >= 15 && qty >= 2 && Math.random() < 0.6) {
            const sellQty = Math.min(qty, 2);
            const earn = price * sellQty;
            ps[pi] = {
              ...ps[pi],
              resources: { ...ps[pi].resources, credit: (ps[pi].resources.credit || 0) + earn },
              stocks: { ...ps[pi].stocks, [bl]: qty - sellQty },
            };
            s = { ...s, stocks: { ...s.stocks, [bl]: Math.max(1, s.stocks[bl] - 1) } };
            s = logEntry(s, `📉 P${pi} [${p.specific}] · ${bl} ${sellQty}주 매도 (₵+${earn}) — 주가 ${price}→${s.stocks[bl]}`);
          }
        });
      });
      s = { ...s, players: ps };
      return s;
    }

    case 'SNAPSHOT_TURN': {
      const snap = state.players.map(p => ({
        hp: p.hp,
        rep: p.resources.rep,
        credit: p.resources.credit,
        asset: assetValue(p, state.stocks, state),
        pool: { ...(p.pool || {}) },
        position: p.position,
        zones: Object.values(state.map).filter(c => c.owner === p.id).length,
        wanted: p.wanted || 0,
      }));
      return { ...state, meta: { ...state.meta, turnSnapshot: snap, turnDiff: null } };
    }

    case 'COMPUTE_TURN_DIFF': {
      const prev = state.meta.turnSnapshot;
      if (!prev) return state;
      const diff = state.players.map((p, i) => {
        const o = prev[i] || {};
        return {
          specific: p.specific,
          hp: p.hp - (o.hp ?? p.hp),
          rep: p.resources.rep - (o.rep ?? 0),
          credit: p.resources.credit - (o.credit ?? 0),
          asset: assetValue(p, state.stocks, state) - (o.asset ?? 0),
          zones: Object.values(state.map).filter(c => c.owner === i).length - (o.zones ?? 0),
          wanted: (p.wanted||0) - (o.wanted ?? 0),
          moved: p.position !== o.position ? `${o.position}→${p.position}` : null,
          poolDelta: ['M','I','V','S','B','A','GRID'].map(k => {
            const d = (p.pool?.[k] || 0) - (o.pool?.[k] || 0);
            return d !== 0 ? `${k}${d>0?'+':''}${d}` : null;
          }).filter(Boolean).join(' '),
        };
      });
      return { ...state, meta: { ...state.meta, turnDiff: diff } };
    }

    case 'NEXT_ROUND': {
      // v5.2.1: 유로 메커닉 hook (euro_module.js, 없으면 무시)
      if (typeof euro_applyAll === 'function') state = euro_applyAll(state);
      // v6.10: M&A 2블록 인수 즉시 승리면 라운드 진행 중단 (gameOver 세팅됨)
      if (state.meta.gameOver) return state;
      // v6.12 P0-4: 공매도 정산 — euro_applyAll(시장 시그니처 포함) 후, 전 라운드 종가 대비
      //   하락분을 Ghost 숏 계약에 지급하고 새 스냅샷 저장(단일 지점 = 이중 정산 없음).
      state = settleShortPositions(state);
      // v6.12 P0-1: 종료 선언 갱신 (도달 선언 / 조건 이탈 해제) — 방금 끝난 라운드 기준
      state = applyVictoryDeclaration(state);
      // v6.21: 모바일 NPC 엔진 — heat9 스폰 + 경찰 랜덤 이동 + 이동 후 Ghost 조우 자동전투 (진입점 B).
      state = updatePoliceForRound(state);
      if (state.meta.gameOver) return state;
      const newRound = state.meta.round + 1;
      // v0.8.3: 맵별 maxRounds — 5×5: 8, 11×11: 12
      // v6.20 (S05): 시나리오 roundLimit 오버라이드 (골드러시 8R 단축). 미지정 시 맵 기본값.
      const maxR = scenarioRule(state, 'roundLimit', state.meta.mapSize === '11x11' ? 12 : 8);
      if (newRound > maxR) {
        return checkVictoryByPoints(state);
      }
      // 서사 표면화(선택): 라운드 시작 도시 분위기 1줄 — 공권력(heat) 3단계. 표시 전용.
      {
        const _heat = state.heat || 0;
        const _mood = _heat >= 9
          ? '🌆 애시그리드 R' + newRound + ' — 순찰 드론이 낮게 난다. 거리는 숨을 참는다.'
          : _heat >= 5
            ? '🌆 애시그리드 R' + newRound + ' — 네온이 깜박이고, 베일 너머로 거래가 오간다.'
            : '🌆 애시그리드 R' + newRound + ' — 잿빛 격자망 위로 잠시 정적이 흐른다.';
        state = { ...state, log: [...state.log, { round: newRound, phase: 0, message: _mood }].slice(-150) };
      }
      // v0.9.3: NEXUS 글로벌 룰 적용 (라운드 시작 시)
      const nexRule = getActiveNexusRule(state);
      if (nexRule) {
        const ps0 = [...state.players];
        const ctrlIdx = state.players.indexOf(getNexusController(state));
        if (nexRule.id === 'info_open') {
          // 모든 NPC 시그널 +1
          for (let i = 0; i < ps0.length; i++) {
            if (ps0[i].isNpc && ps0[i].signal && ps0[i].signal.revealed < ps0[i].signal.max) {
              ps0[i] = { ...ps0[i], signal: { ...ps0[i].signal, revealed: ps0[i].signal.revealed + 1 } };
            }
          }
        } else if (nexRule.id === 'martial') {
          // Ghost 전원 수배 +1
          for (let i = 0; i < ps0.length; i++) if (ps0[i].role === 'ghost' && !ps0[i].defeated) ps0[i] = { ...ps0[i], wanted: (ps0[i].wanted || 0) + 1 };
        } else if (nexRule.id === 'biocode') {
          // 모든 플레이어 HP+1
