        <h4 style={{ margin: '4px 0 8px', fontFamily: 'Share Tech Mono, monospace', fontSize: 11, color: 'var(--text-dim)', letterSpacing: 2 }}>PLAYERS</h4>
        {(() => { const vGoals = getVictoryGoals(state); const declIdx = state.meta.victoryDeclaration ? state.meta.victoryDeclaration.idx : -1; return state.players.map((p, i) => {
          // 위협도 계산: 승리 조건 대비 남은 수치 (단일 소스 VICTORY_GOALS 참조)
          let progressPct = 0, needLabel = '', threatLevel = 'safe', threatBadge = null;
          const isWinning = !!evalPlayerVictory(p, i, state, vGoals);
          // v6.27 (B-06): highlightPoints 승리 환산 — 판정과 동일한 asset_eff/rep_eff 로 표시 (정직성).
          const hlBonus = euro_hlVictoryBonus(p);
          if (p.role === 'ghost') {
            const repBase = p.resources.rep || 0;
            const rep = repBase + hlBonus;
            const raids = state.meta.raidsThisGame?.[i] || 0;
            const repGoalV = vGoals.ghostRepBattle;
            const raidDone = raids >= vGoals.ghostRaids;
            progressPct = Math.min(100, Math.round(rep / repGoalV * 100));
            const repLeft = Math.max(0, repGoalV - rep);
            if (isWinning) { threatLevel = 'won'; threatBadge = '🏆'; }
            else if (repLeft <= 3 && raidDone) { threatLevel = 'danger'; threatBadge = '⚠ 한 턴 남음'; }
            else if (repLeft <= 6) { threatLevel = 'warn'; }
            needLabel = `렙 ${repBase}${hlBonus ? `+${hlBonus}✨` : ''}/${repGoalV} · 레이드 ${raids}/${vGoals.ghostRaids}`;
          } else {
            const assetBase = assetValue(p, state.stocks, state);
            const asset = assetBase + hlBonus;
            const assetGoalV = vGoals.blocAsset;
            progressPct = Math.min(100, Math.round(asset / assetGoalV * 100));
            const assetLeft = Math.max(0, assetGoalV - asset);
            if (isWinning) { threatLevel = 'won'; threatBadge = '🏆'; }
            else if (assetLeft <= 5) { threatLevel = 'danger'; threatBadge = '⚠ 한 턴 남음'; }
            else if (assetLeft <= 15) { threatLevel = 'warn'; }
            needLabel = `자산 ${assetBase}${hlBonus ? `+${hlBonus}✨` : ''}/${assetGoalV}`;
          }
          const isDeclared = declIdx === i;
          if (isDeclared) threatBadge = '📢 종료 선언';
          const borderColor = threatLevel === 'danger' ? 'var(--magenta)' : threatLevel === 'won' ? 'var(--green)' : threatLevel === 'warn' ? 'var(--yellow)' : undefined;
          const extraStyle = borderColor ? { borderColor, boxShadow: threatLevel === 'danger' ? '0 0 8px rgba(255,60,140,0.4)' : undefined } : {};
          // "내가 타겟됨" 하이라이트 (P0 아닌데 최근에 나를 공격한 경우)
          const targetedMe = state.meta.lastTargetedBy?.attacker === i;
          return (
            <div key={i} id={`pcard-${i}`} className={`player-card ${i === 0 ? 'me' : ''} ${p.defeated ? '' : ''}`} style={{ ...extraStyle, opacity: p.defeated ? 0.4 : 1 }}>
              {/* v6.50 [75차] ①: 협상 성사/거절 단발 플래시 (오버레이 — 레이아웃 무영향) */}
              {negoFx.marks[i] && <i key={`nego-${negoFx.n}`} className={`pc-nego ${negoFx.marks[i]}`} aria-hidden="true" />}
              <div className="pheader">
                <div className="pname">
                  {p.kind === 'human' ? '👤' : (p.isNpc ? '👁' : '🤖')} P{i} · {p.isNpc && (p.signal?.revealed || 0) === 0 ? '???' : p.specific}
                  {/* 서사 표면화: 클래스명 옆 코드네임(고스트)/수장(블록) 병기 — NPC 미공개 시 생략 */}
                  {!(p.isNpc && (p.signal?.revealed || 0) === 0) && typeof loreTag === 'function' && loreTag(p.specific) && (
                    <span style={{ marginLeft: 5, color: 'var(--text-dim)', fontSize: 9, letterSpacing: 1, fontFamily: 'Share Tech Mono, monospace' }}>“{loreTag(p.specific)}”</span>
                  )}
                  {targetedMe && <span style={{ marginLeft: 4, color: 'var(--magenta)', fontSize: 10 }}>🔴</span>}
                </div>
                <div className="php">HP {p.hp}/{p.maxHp}</div>
              </div>
              {/* 위협 배지 + 진척 바 (종료 선언 배지는 본인 좌석에도 표시) */}
              {(i !== 0 || isDeclared) && threatBadge && (
                <div style={{ fontSize: 10, color: isDeclared ? 'var(--magenta)' : (threatLevel === 'danger' ? 'var(--magenta)' : 'var(--yellow)'), fontWeight: 700, marginTop: 2, letterSpacing: 1 }}>{threatBadge}</div>
              )}
              <div style={{ marginTop: 3, marginBottom: 3 }}>
                <div style={{ fontSize: 9, color: 'var(--text-dim)', fontFamily: 'Share Tech Mono, monospace' }}>{needLabel}</div>
                <div style={{ height: 3, background: 'var(--bg3)', borderRadius: 2, overflow: 'hidden', marginTop: 2 }}>
                  <div style={{ height: '100%', width: `${progressPct}%`, background: threatLevel === 'won' ? 'var(--green)' : threatLevel === 'danger' ? 'var(--magenta)' : (threatLevel === 'warn' ? 'var(--yellow)' : 'var(--cyan)') }}/>
                </div>
              </div>
              <div className="pstats">
                <div>₵ <strong>{p.resources.credit}</strong></div>
                <div>📡 <strong>{p.resources.data}</strong></div>
                <div>🎙 <strong>{p.resources.influence}</strong></div>
                <div>🔩 <strong>{p.resources.weapons}</strong></div>
                <div>⚙️ <strong>{p.resources.parts}</strong></div>
                {p.role === 'ghost'
                  ? <div>★ <strong>{p.resources.rep}</strong></div>
                  : <div>📊 <strong>{assetValue(p, state.stocks, state)}</strong></div>
                }
              </div>
              {p.role === 'ghost' && <div style={{ fontSize: 10, marginTop: 4, color: 'var(--magenta)' }}>⚠ {p.wanted}</div>}
              {/* v6.12 P0-4: 숏 포지션 뱃지 */}
              {p.role === 'ghost' && shortTotal(p) > 0 && (
                <div style={{ fontSize: 9, marginTop: 3, display: 'flex', gap: 4, flexWrap: 'wrap', alignItems: 'center' }}>
                  {Object.entries(p.shortPositions).filter(([, q]) => q > 0).map(([bl, q]) => (
                    <span key={bl} style={{ padding: '0 4px', borderRadius: 2, background: 'rgba(255,45,120,0.15)', color: 'var(--magenta)', border: '1px solid var(--magenta)', fontWeight: 700, fontFamily: 'Share Tech Mono, monospace' }}>🔻{bl}×{q}</span>
                  ))}
                </div>
              )}
              <div style={{ fontSize: 10, marginTop: 4, display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                <span style={{ color: 'var(--green)', fontWeight: 700, letterSpacing: 1 }}>⚡TL {p.tl}</span>
                {/* v6.27 (B-06): highlightPoints 가시화 — 승리 환산 게이지 (판정에 asset_eff/rep_eff 로 편입) */}
                {(p.highlightPoints || 0) > 0 && (
                  <span title={`유로 하이라이트 ${p.highlightPoints}pt → 승리 환산 +${euro_hlVictoryBonus(p)}`} style={{ color: 'var(--yellow)', fontWeight: 700, letterSpacing: 1 }}>✨{p.highlightPoints}pt<span style={{ color: 'var(--text-dim)', fontWeight: 400 }}> (+{euro_hlVictoryBonus(p)})</span></span>
                )}
                {/* 5칸 진척도 게이지 — 현재 레벨 목표 대비 (맵별 TL 상한 반영) */}
                {p.tl < tlCapFor(state.meta.mapSize) && (() => {
                  const cost = tlCostFor(p.tl);
                  const prog = p.tlProgress || 0;
                  const filled = Math.min(5, Math.floor((prog / cost) * 5));
                  return (
                    <span style={{ display: 'inline-flex', gap: 1 }}>
                      {[0,1,2,3,4].map(k => (
                        <span key={k} style={{
                          display: 'inline-block',
                          width: 8, height: 10,
                          background: k < filled ? 'var(--green)' : 'var(--bg3)',
                          border: '1px solid var(--border)',
                          boxShadow: k < filled ? '0 0 3px var(--green)' : 'none',

                      <span style={{ color: 'var(--text-dim)', fontSize: 9, marginLeft: 2 }}>{prog}/{cost}</span>
                    </span>
                  );
                })()}
                {p.tl >= tlCapFor(state.meta.mapSize) && <span style={{ color: 'var(--yellow)', fontSize: 9 }}>MAX</span>}
                <span style={{ color: 'var(--text-dim)', fontSize: 9 }}>@ {p.position || '—'} · 덱 {p.deck.length} · 패 {p.hand.length}</span>
              </div>
              {/* v0.6.3b: 5트랙 + 총악명 + 마일스톤 (악명형 악명식) */}
              {p.tracks && (() => {
                const infamy = getInfamy(p);
                const myMs = (state.meta.milestonesAwarded?.[i]) || [];
                return (
                  <div style={{ marginTop: 4, display: 'flex', flexDirection: 'column', gap: 2, fontSize: 9, fontFamily: 'Share Tech Mono, monospace' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 4, color: 'var(--magenta)', fontWeight: 700, letterSpacing: 1 }}>
                      <span>☠ {STREETCRED_LABEL}</span>
                      <span style={{ color: 'var(--yellow)' }}>{infamy}</span>
                      <span style={{ color: 'var(--text-dim)', fontSize: 8 }}>/{TRACK_MAX * 5}</span>
                      <span style={{ marginLeft: 'auto', display: 'flex', gap: 2 }}>
                        {INFAMY_MILESTONES.map(ms => (
                          <span key={ms} style={{
                            fontSize: 8,
                            padding: '0 3px',
                            borderRadius: 2,
                            background: myMs.includes(ms) ? 'var(--yellow)' : 'transparent',
                            color: myMs.includes(ms) ? 'var(--bg)' : 'var(--text-dim)',
                            border: `1px solid ${myMs.includes(ms) ? 'var(--yellow)' : 'var(--border)'}`,
                            fontWeight: 700,
                          }}>{ms}</span>
                        ))}
                      </span>
                    </div>
                    {TRACK_KEYS.map(k => {
                      const tn = TRACK_NAMES[k];
                      const lv = p.tracks[k] || 0;
                      return (
                        <div key={k} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                          <span style={{ width: 12 }}>{tn.icon}</span>
                          <span style={{ width: 28, color: 'var(--text-dim)' }}>{tn.name}</span>
                          <span style={{ display: 'inline-flex', gap: 1 }}>
                            {[0,1,2,3,4].map(idx => (
                              <span key={idx} style={{
                                display: 'inline-block',
                                width: 8, height: 8,
                                borderRadius: 1,
                                background: idx < lv ? 'var(--cyan)' : 'var(--bg3)',
                                border: '1px solid var(--border)',
                                boxShadow: idx < lv ? '0 0 2px var(--cyan)' : 'none',
                              }}/>
                            ))}
                          </span>
                          <span style={{ color: 'var(--text-dim)', fontSize: 8, marginLeft: 'auto' }}>LV{lv}</span>
                        </div>
                      );
                    })}
                  </div>
                );
              })()}
              {i === 0 && (
                <div style={{ fontSize: 10, marginTop: 6, color: 'var(--yellow)' }}>
                  🎯 {p.objectives.map(o => o.name).join(' · ')}

                <div style={{ marginTop: 4, display: 'flex', flexWrap: 'wrap', gap: 2 }}>
                  {p.cyberware.map((wk, idx) => {
                    const w = CYBERWARE_DEFS[wk];

                      <span key={idx} title={`${w.name} (${w.slot}) — ${w.pro} | ${w.con}`} style={{ fontSize: 10, padding: '0 2px', background: 'rgba(60,200,220,0.15)', border: '1px solid var(--cyan)', borderRadius: 2, cursor: 'help' }}>
                        {w.icon}
                      </span>
                    );
                  })}
                </div>
              )}
              {/* v0.9.1: 하이라이트 모먼트 토큰 */}
              {(() => {
                const myHL = (state.meta.highlights || []).filter(h => h.playerIdx === i);
                if (myHL.length === 0) return null;
                return (
                  <div style={{ marginTop: 4, display: 'flex', flexWrap: 'wrap', gap: 2 }}>
                    {myHL.map((h, idx) => (
                      <span key={idx} title={`${h.label} (R${h.round})`} style={{ fontSize: 10, padding: '0 2px', background: 'rgba(255,235,60,0.15)', border: '1px solid var(--yellow)', borderRadius: 2, cursor: 'help' }}>
                        {h.icon}
                      </span>
                    ))}
                  </div>
                );
              })()}
              {/* v0.6.3e: P0 Bloc 건설 메뉴 (자사 빈 구역이 있을 때) */}
              {i === 0 && p.role === 'bloc' && !p.defeated && (() => {
                const emptyCoords = Object.entries(state.map).filter(([c, cell]) => cell.owner === 0 && !cell.building);
                if (emptyCoords.length === 0) return null;
                return (
                  <div style={{ marginTop: 6, padding: '4px 6px', background: 'rgba(255,235,60,0.06)', border: '1px dashed var(--yellow)', borderRadius: 3, fontSize: 9, color: 'var(--yellow)' }}>
                    🏗 건설 가능 (빈 자사 {emptyCoords.length}구역):
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 3, marginTop: 3 }}>

                        const check = canBuildBuilding(state, 0, k, emptyCoords[0][0]);
                        return (
                          <button key={k}
                            disabled={!check.ok}
                            title={`${b.desc} | ${Object.entries(b.cost).map(([r,a]) => r+a).join(' ')} | TL${b.tl}+`}
                            className="pa-btn"
                            style={{ fontSize: 8, padding: '1px 4px', borderColor: check.ok ? 'var(--yellow)' : 'var(--bg3)', color: check.ok ? 'var(--yellow)' : 'var(--text-dim)', opacity: check.ok ? 1 : 0.5 }}
                            onClick={() => dispatch({ type: 'BUILD_BUILDING', playerIdx: 0, key: k, coord: emptyCoords[0][0] })}>
                            {b.icon}{b.name}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}
              {/* v0.6.3d: NPC 시그널 표시 */}
              {p.isNpc && p.signal && (
                <div style={{ marginTop: 6, padding: '4px 6px', background: 'rgba(60,200,220,0.07)', border: '1px dashed var(--cyan)', borderRadius: 3, fontSize: 9, color: 'var(--cyan)' }}>
                  📡 시그널 {p.signal.revealed}/{p.signal.max}: {SIGNAL_LEVEL_DESC[p.signal.revealed]}
                  {p.signal.revealed >= 1 && ` [${p.specific}]`}
                  {state.players[0] && !state.players[0].defeated && p.signal.revealed < p.signal.max && (
                    <button className="pa-btn" style={{ marginLeft: 6, fontSize: 8, padding: '1px 4px', borderColor: 'var(--cyan)', color: 'var(--cyan)' }}
                      disabled={(state.players[0].resources.data || 0) < SIGNAL_REVEAL_COST.data}
                      onClick={() => dispatch({ type: 'SIGNAL_INVEST', playerIdx: 0, npcIdx: i })}>
                      📡-{SIGNAL_REVEAL_COST.data}
                    </button>
                  )}
                </div>
              )}
            </div>
          );
        }); })()}
      </div>

      {/* CENTER — Map + Hand */}
      <div className="center-panel">
        {/* ═══ v6.26 레이스 HUD — ①트랙 ②마켓 틱커 ③위협 스트립 ④라운드 브리핑 (docs/22 §계기판) ═══ */}
        {(() => {
          const vG = getVictoryGoals(state);
          const declIdx = state.meta.victoryDeclaration ? state.meta.victoryDeclaration.idx : -1;

            const hit = briefPats.find(bp => bp.re.test(msg));

                  const canAfford = (me.resources.credit || 0) >= 5;

                  const valid = suppressTarget != null && targets.some(t => t.i === suppressTarget);
                  const disabled = already || !canAfford || !valid;
                  const reason = already ? '이번 라운드 이미 견제함' : (!canAfford ? '₵ 부족 (5 필요)' : (!valid ? '대상을 선택하세요' : null));

                          <button key={i} onClick={() => setSuppressTarget(i)}

                            {p.kind === 'human' ? '👤' : (p.isNpc ? '👁' : '🤖')} P{i} {p.isNpc && (p.signal?.revealed || 0) === 0 ? '???' : p.specific}
                          </button>

                      <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap', alignItems: 'center' }}>

                        {Object.entries(SUP).map(([key, s]) => (
                          <button key={key} onClick={() => setSuppressType(key)}
                            style={{ fontSize: 9, padding: '3px 6px', background: suppressType === key ? 'var(--cyan)' : 'var(--bg3)', color: suppressType === key ? 'var(--bg1)' : 'var(--text)', border: `1px solid ${suppressType === key ? 'var(--cyan)' : 'var(--border)'}`, borderRadius: 2, cursor: 'pointer' }}>
                            {s.icon} {s.label} ({s.resIcon}-1)
                          </button>

                      </div>
                      <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                        <button disabled={disabled}
                          onClick={() => { dispatch({ type: 'HUMAN_SUPPRESS', playerIdx: meIdx, targetIdx: suppressTarget, tokenType: suppressType }); setSuppressTarget(null); }}
                          style={{ fontSize: 10, padding: '5px 12px', background: disabled ? 'var(--bg1)' : 'var(--magenta)', color: disabled ? 'var(--text-dim)' : 'var(--bg1)', border: `1px solid ${disabled ? 'var(--border)' : 'var(--magenta)'}`, borderRadius: 2, fontWeight: 700, cursor: disabled ? 'not-allowed' : 'pointer', whiteSpace: 'nowrap' }}>
                          🚧 견제 (₵5)
                        </button>
                        <span style={{ fontSize: 9, color: 'var(--text-dim)' }}>
                          {reason || `다음 라운드 시작 시 대상 ${SUP[suppressType] ? SUP[suppressType].resIcon : ''} 자원 -1`}
                        </span>
                      </div>
                    </div>
                  );
                })()}
              </div>
            </div>
          )}
          {state.meta.phase === 2 && !canPlan && !state.meta.awaitingMoveTarget && (
            <button className="pa-btn" disabled>봇 계획 중...</button>
          )}
          {state.meta.awaitingMoveTarget && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
              <div style={{ color: 'var(--yellow)', fontWeight: 700, fontSize: 13 }}>
                🎯 이동 목표 선택 — 노란 ◎ 칸 클릭 (최대 {state.meta.moveBudget}칸)
              </div>
              <button className="pa-btn" onClick={skipMovePick}>AI에게 맡기기</button>
            </div>
          )}
        </div>
      </div>

      {/* RIGHT — Pool, News, Log */}
      <div className="right-panel">
        {/* === 승리 진척 (상시 표시) === */}
        {(() => {
          const vGoals = getVictoryGoals(state);
          if (me.role === 'ghost') {
            const repGoal = vGoals.ghostRepBattle;
            const raidGoal = vGoals.ghostRaids;
            const rep = me.resources.rep || 0;
            const raids = state.meta.raidsThisGame?.[0] || 0;
            const repPct = Math.min(100, Math.round(rep / repGoal * 100));
            const raidDone = raids >= raidGoal;
            const repDone = rep >= repGoal;
            // 가장 가까운 Bloc 구역 + 레이드 성공률 계산
            const nearest = me.position ? findNearestBlocZone(state, me.position) : null;
            const nearestDist = nearest ? (nearest === me.position ? 0 : bfsDistance(state, me.position, nearest)) : null;
            // v6.28: 맵 프리뷰(L8000)와 동일 식 — raidThreshold(cell) 기반·크리티컬 실패 반영 상한 5/6 (정직성 통일)
            const nearestCell = nearest ? state.map[nearest] : null;
            const succRolls = nearestCell ? Math.max(0, Math.min(5, 7 - raidThreshold(nearestCell) + me.stats.atk)) : 0;
            const raidPct = Math.round(succRolls / 6 * 100);
            // 승리 예측: 현재 렙 + 성공 시 +3, 레이드 목표도 충족?
            const repNeeded = Math.max(0, repGoal - rep);
            const raidsNeeded = Math.max(0, raidGoal - raids);
            const oneRaidWins = !repDone && repNeeded <= 3 && raidsNeeded <= 1;
            const nextTip = repDone && raidDone
              ? '✅ 승리 조건 충족 — 종료 선언! 다음 라운드 종료까지 유지하면 승리'
              : oneRaidWins && nearest
                ? `🎯 ${nearest} 레이드 성공 시 종료 선언 (다음 R 유지 시 승리 · 성공률 ${raidPct}%, 거리 ${nearestDist}칸)`
                : !nearest
                  ? 'Bloc 구역이 맵에 없음 — 다음 Bloc 확장 기다리기'
                  : `${nearest} 레이드 시 렙+3 → ${rep + 3}/${repGoal} (성공률 ${raidPct}%, 거리 ${nearestDist}칸)`;
            return (
              <div className="pool-box" style={{ borderColor: repDone && raidDone ? 'var(--green)' : (oneRaidWins ? 'var(--magenta)' : 'var(--yellow)'), boxShadow: oneRaidWins ? '0 0 12px rgba(255,60,140,0.3)' : undefined }}>
                <h4 style={{ color: repDone && raidDone ? 'var(--green)' : (oneRaidWins ? 'var(--magenta)' : 'var(--yellow)') }}>

                <div style={{ fontSize: 11, fontFamily: 'Share Tech Mono, monospace', marginTop: 4 }}>
                  <div style={{ marginBottom: 4 }}>
                    <span style={{ color: repDone ? 'var(--green)' : 'var(--text)' }}>{repDone ? '✓' : '•'} 렙 </span>
                    <strong style={{ color: repDone ? 'var(--green)' : 'var(--yellow)' }}>{rep}/{repGoal}</strong>
                    <div style={{ height: 4, background: 'var(--bg3)', borderRadius: 2, overflow: 'hidden', marginTop: 2 }}>
                      <div style={{ height: '100%', width: `${repPct}%`, background: repDone ? 'var(--green)' : 'var(--yellow)', transition: 'width 0.3s' }}/>
                    </div>
                  </div>
                  <div style={{ marginBottom: 4 }}>
                    <span style={{ color: raidDone ? 'var(--green)' : 'var(--text)' }}>{raidDone ? '✓' : '•'} 누적 레이드 </span>
                    <strong style={{ color: raidDone ? 'var(--green)' : 'var(--magenta)' }}>{raids}/{raidGoal}</strong>
                  </div>
                  <div style={{ fontSize: 10, color: oneRaidWins ? 'var(--magenta)' : 'var(--text-dim)', marginTop: 6, lineHeight: 1.4, fontWeight: oneRaidWins ? 700 : 400 }}>💡 {nextTip}</div>
                </div>
              </div>

            const asset = assetValue(me, state.stocks, state);
            const assetPct = Math.min(100, Math.round(asset / assetGoal * 100));
            const assetDone = asset >= assetGoal;
            // 남은 간격 계산
            const gap = Math.max(0, assetGoal - asset);
            const myZones = Object.values(state.map).filter(c => c.owner === 0).length;
            const tip = assetDone
              ? '✅ 승리 조건 충족 — 종료 선언! 다음 라운드 종료까지 유지하면 승리'
              : gap <= 10
                ? `자산 ${gap} 남음 — 구역 확장 2곳 또는 타 블록 주식 매수로 마무리 가능`
                : `구역 ${Math.ceil(gap / 5)}곳 확장 or 타 블록 주식 모으기 (현재 ${myZones}구역)`;
            return (
              <div className="pool-box" style={{ borderColor: assetDone ? 'var(--green)' : 'var(--yellow)' }}>
                <h4 style={{ color: assetDone ? 'var(--green)' : 'var(--yellow)' }}>🎯 내 승리 조건 (Bloc 튜토리얼)</h4>
                <div style={{ fontSize: 11, fontFamily: 'Share Tech Mono, monospace', marginTop: 4 }}>
                  <div style={{ marginBottom: 4 }}>
                    <span style={{ color: assetDone ? 'var(--green)' : 'var(--text)' }}>{assetDone ? '✓' : '•'} 자산 </span>
                    <strong style={{ color: assetDone ? 'var(--green)' : 'var(--yellow)' }}>{asset}/{assetGoal}</strong>
                    <div style={{ height: 4, background: 'var(--bg3)', borderRadius: 2, overflow: 'hidden', marginTop: 2 }}>
                      <div style={{ height: '100%', width: `${assetPct}%`, background: assetDone ? 'var(--green)' : 'var(--yellow)', transition: 'width 0.3s' }}/>
                    </div>
                  </div>
                  <div style={{ fontSize: 10, color: 'var(--text-dim)', marginTop: 6, lineHeight: 1.4 }}>💡 {tip}</div>
                </div>
              </div>
            );
          }
        })()}

        <div className="pool-box">
          <h4>🎨 내 속성 풀 (개인)</h4>
          <div className="attr-row">
            {Object.entries(me.pool || {}).map(([k, v]) => (
              <span key={k} className={`attr-tag a-${k}`} style={{ opacity: v > 0 ? 1 : 0.3 }}>◈{k}<span style={{ marginLeft: 2 }}>{v}</span></span>
            ))}
          </div>
          <div style={{ fontSize: 9, color: 'var(--text-dim)', marginTop: 4 }}>
            ※ 개인 풀 — 매 라운드 ½ 감쇠 (올림)
          </div>

        {state.meta.turnDiff && (
          <div className="pool-box" style={{ borderColor: 'var(--yellow)' }}>
            <h4 style={{ color: 'var(--yellow)' }}>⚡ 이번 턴 변화</h4>

              const p = state.players[i];
              if (!p || p.defeated) return null;
              const marker = i === 0 ? '⭐ ' : '   ';
              const parts = [];
              if (d.hp !== 0) parts.push(<span key="hp" style={{ color: d.hp > 0 ? 'var(--green)' : 'var(--magenta)' }}>HP{d.hp>0?'+':''}{d.hp}</span>);
              if (d.rep !== 0) parts.push(<span key="rep" style={{ color: d.rep > 0 ? 'var(--green)' : 'var(--magenta)' }}>렙{d.rep>0?'+':''}{d.rep}</span>);
              if (d.credit !== 0) parts.push(<span key="cr" style={{ color: d.credit > 0 ? 'var(--green)' : 'var(--magenta)' }}>₵{d.credit>0?'+':''}{d.credit}</span>);
              if (d.asset !== 0) parts.push(<span key="as" style={{ color: d.asset > 0 ? 'var(--green)' : 'var(--magenta)' }}>자산{d.asset>0?'+':''}{d.asset}</span>);
              if (d.zones !== 0) parts.push(<span key="zo" style={{ color: d.zones > 0 ? 'var(--green)' : 'var(--magenta)' }}>구역{d.zones>0?'+':''}{d.zones}</span>);
              if (d.wanted !== 0) parts.push(<span key="wt" style={{ color: 'var(--magenta)' }}>수배{d.wanted>0?'+':''}{d.wanted}</span>);
              if (d.moved) parts.push(<span key="mv" style={{ color: 'var(--cyan)' }}>🚶{d.moved}</span>);
              if (d.poolDelta) parts.push(<span key="pl" style={{ color: 'var(--text-dim)' }}>[{d.poolDelta}]</span>);
              return (
                <div key={i} style={{ fontSize: 10, fontFamily: 'Share Tech Mono, monospace', marginBottom: 2, lineHeight: 1.4 }}>
                  {marker}P{i} {p.specific.slice(0,4)} · {parts.length > 0 ? parts.reduce((acc, el, j) => j === 0 ? [el] : [...acc, ' · ', el], []) : <span style={{ color: 'var(--text-dim)' }}>변화 없음</span>}
                </div>
              );
            })}
          </div>
        )}

        <div className={`pool-box signal-box sig-${state.signalDie}`}>
          📡 {state.signalDie}
        </div>

        <div className="pool-box">
          <h4>📊 주가 · 보유 · 거래</h4>
          {state.meta.pendingMna && (
            <div style={{ background: 'rgba(255,45,120,0.12)', border: '1px solid var(--magenta)', borderRadius: 3, padding: 5, marginBottom: 5, fontFamily: 'Share Tech Mono, monospace', fontSize: 10, color: 'var(--magenta)', fontWeight: 700 }}>
              🏴 {state.meta.pendingMna.target} 인수 진행 — 방어 라운드
            </div>
          )}
          <div style={{ fontFamily: 'Share Tech Mono, monospace', fontSize: 10 }}>
            {Object.entries(state.stocks).map(([bl, v]) => {
              const myQty = me.stocks[bl] || 0;
              const isOwnBloc = me.role === 'bloc' && me.specific === bl;
              const canTrade = state.meta.phase === 1;
              const canBuy = canTrade && !isOwnBloc && (me.resources.credit || 0) >= v;
              const canSell = canTrade && !isOwnBloc && myQty > 0;
              return (
                <div key={bl} style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '2px 0', borderBottom: '1px solid var(--bg3)' }}>
                  <span style={{ color: 'var(--text-dim)', width: 60 }}>{bl}{isOwnBloc ? '★' : ''}:</span>
                  <span style={{ color: v > 10 ? 'var(--green)' : (v < 10 ? 'var(--magenta)' : 'var(--text)'), width: 24, textAlign: 'right' }}>{v}</span>
                  <span style={{ color: 'var(--text-dim)', width: 36 }}>보유 {myQty}</span>
                  {typeof euro_equityPct === 'function' && (() => {
                    const eq = euro_equityPct(state, meIdx, bl);
                    const mnaOn = typeof euro_mnaEnabled === 'function' && euro_mnaEnabled(state);
                    const canMna = eq >= 51 && mnaOn;
                    const chk = (canTrade && canMna && typeof euro_declareMnaCheck === 'function') ? euro_declareMnaCheck(state, meIdx, bl) : null;
                    return (
                      <>
                        <span style={{ color: eq >= 51 ? 'var(--magenta)' : 'var(--text-dim)' }}>
                          지분 {eq}%{canMna && ' 🎯'}

                          <button
                            disabled={!chk.ok}
                            title={chk.ok ? `${bl} 적대적 인수 선언` : chk.reason}
                            onClick={() => dispatch({ type: 'DECLARE_MNA', playerIdx: meIdx, bloc: bl })}
                            style={{ fontSize: 9, padding: '1px 5px', background: chk.ok ? 'var(--magenta)' : 'var(--bg1)', color: chk.ok ? 'var(--bg1)' : 'var(--text-dim)', border: `1px solid ${chk.ok ? 'var(--magenta)' : 'var(--border)'}`, borderRadius: 2, cursor: chk.ok ? 'pointer' : 'not-allowed' }}>
                            {chk.ok ? '🎯 인수 선언' : '🎯 불가'}
                          </button>
                        )}
                      </>
                    );
                  })()}
                  {canBuy && <button style={{ fontSize: 9, padding: '1px 5px', background: 'var(--bg3)', color: 'var(--green)', border: '1px solid var(--green)', borderRadius: 2, cursor: 'pointer' }} onClick={() => dispatch({ type: 'BUY_STOCK', playerIdx: 0, bloc: bl, qty: 1 })}>매수 ₵{v}</button>}
                  {canSell && <button style={{ fontSize: 9, padding: '1px 5px', background: 'var(--bg3)', color: 'var(--magenta)', border: '1px solid var(--magenta)', borderRadius: 2, cursor: 'pointer' }} onClick={() => dispatch({ type: 'SELL_STOCK', playerIdx: 0, bloc: bl, qty: 1 })}>매도 ₵{v}</button>}
                </div>
              );
            })}
          </div>
          {state.meta.phase === 1 && (
            <div style={{ fontSize: 9, color: 'var(--cyan)', marginTop: 4 }}>
              💡 시장 개장 중 — 매수(녹)/매도(자주) 클릭. ₵보유 {me.resources.credit || 0}
            </div>
          )}
        </div>

        {state.currentNews && (
          <div className="news-box">
            <div className="nh">📰 뉴스 {state.currentNews.id}</div>
            <div style={{ fontWeight: 700 }}>{state.currentNews.title}</div>
            <div style={{ fontSize: 10, color: 'var(--text-dim)', fontStyle: 'italic', marginTop: 3 }}>{state.currentNews.flavor}</div>
            {/* v6.46 (S05): 매 라운드 2장 드로우 시나리오 — 함께 뽑힌 앞장(들)도 표시 (정직성: 효과는 이미 적용됨) */}
            {(state.meta.newsDrawn || []).length > 1 && (
              <div style={{ fontSize: 10, color: 'var(--text-dim)', marginTop: 5, borderTop: '1px solid var(--border)', paddingTop: 4 }}>
                이번 라운드 {state.meta.newsDrawn.length}장 공개 ·{' '}
                {state.meta.newsDrawn.slice(0, -1).map(n => `${n.id} ${n.title}`).join(' / ')}
              </div>
            )}
          </div>
        )}

        <div className="pool-box">
          <h4>🏆 업적 (선언)</h4>
          <div style={{ display: 'grid', gap: 3, fontSize: 10 }}>
            {ACHIEVEMENTS_IN.map(a => {
              const claimed = state.meta.claimedAchievements[a.id] !== undefined;
              const mine = state.meta.claimedAchievements[a.id] === 0;
              return (
                <button
                  key={a.id}
                  className="pa-btn"
                  style={{ fontSize: 10, padding: '4px 6px', opacity: claimed ? 0.4 : 1, background: mine ? 'var(--green)' : 'var(--bg3)', color: mine ? '#000' : 'var(--text)' }}
                  disabled={claimed}
                  onClick={() => dispatch({ type: 'CLAIM_ACHIEVEMENT', playerIdx: 0, achievementId: a.id })}
                >
                  {a.tier === 'gold' ? '🥇' : a.tier === 'silver' ? '🥈' : '🥉'} {a.name}
                </button>
              );
            })}
          </div>
        </div>

        <div className="log-box">
          <div className="log-head">
            <h4>📜 플레이 로그</h4>
            <button className="copy-btn" onClick={() => copyLogToClipboard(state.log)}>📋 복사</button>
          </div>
          <div className="log-scroll">
            {state.log.slice().reverse().map((l, i) => {
              const cls = classifyLog(l.message);
              return (
                <div key={i} className={`log-entry ${cls}`}>
                  <span className="tag">R{l.round}·P{l.phase + 1}</span>
                  {l.message}
                </div>
              );
            })}
          </div>
        </div>
      </div>
      {/* ===== v6.28: NEXUS BAR — 하단 고정 "내 상태 바" (좌: 정체성+HP / 중: 절대값 리본 / 우: 행동+NEXT) =====
          정직성: 핵심지표는 절대 현재값만 — getVictoryGoals/hudRaceProgress 미호출(진척은 상단 Race HUD 독점).
          표시 소스 = 판정 소스(assetValue·me.resources.rep). meIdx 기준(players[0] 하드코딩 없음, 핫시트 호환). */}
      {(() => {
        const roleGlyph = me.role === 'ghost' ? '👻' : '🏢';
        const codename = (typeof loreTag === 'function' && loreTag(me.specific)) ? loreTag(me.specific) : me.specific;
        const hpPct = me.maxHp ? Math.round(me.hp / me.maxHp * 100) : 0;
        const hpLow = me.maxHp ? (me.hp / me.maxHp <= 0.3) : false;
        const wanted = me.wanted || 0;
        const pendingN = (state.meta.pendingDecisions && state.meta.pendingDecisions.length) || 0;
        // 시그니처 게이지(기함) — 클래스 스위치. G[me.specific] 없는 클래스는 슬롯 생략(undefined 참조·크래시 0).
        const SIG = {
          RIGGER: { key: 'rigTraps',    icon: '🪤', label: '함정',   hint: (v) => `함정 발동 ★+2까지 ${3 - (v % 3)}`, charged: (v) => v % 3 === 2 },
          CIPHER: { key: 'hackNodes',   icon: '💾', label: '해킹',   hint: (v) => v >= 3 ? '해킹 신 달성' : `해킹 신까지 ${3 - v}`, charged: (v) => v === 2 },
          BROKER: { key: 'tradeMemo',   icon: '🤝', label: '거래',   hint: (v) => v >= 5 ? '외교 능숙 달성' : `₵+5 ★+3까지 ${5 - v}`, charged: (v) => v === 4 },
          HELIX:  { key: 'helixClones', icon: '🧬', label: '클론',   hint: (v) => `주식 매집까지 ${3 - (v % 3)}`, charged: (v) => v % 3 === 2 },
        };
        const sig = SIG[me.specific];
        const sigV = sig ? (me[sig.key] || 0) : null;
        const sigCharged = sig ? sig.charged(sigV) : false;
        const next = nextAction(state, { canPlan, needCards, selectedCards, confirmPlan, dispatch, meIdx });
        const scrollToMe = () => { const el = document.getElementById(`pcard-${meIdx}`); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
        return (

function classifyLog(msg) {
  if (!msg) return '';
  const classes = [];
  if (msg.includes('⭐ 당신')) classes.push('me');
  if (msg.includes('🔄 R') || msg.includes('R시작') || msg.includes('시작 ·')) classes.push('round');
  if (msg.includes('📊') || msg.includes('요약')) classes.push('summary');
  if (msg.includes('🗡️') || msg.includes('레이드')) classes.push('raid');
  else if (msg.includes('💥')) classes.push('combat');
  if (msg.includes('💰') || msg.includes('📈') || msg.includes('수입')) classes.push('income');
  if (msg.includes('📰')) classes.push('news');
  if (msg.includes('🚶')) classes.push('move');
  return classes.join(' ');
}

function copyLogToClipboard(log) {
  const text = log.map(l => `[R${l.round}·P${l.phase + 1}] ${l.message}`).join('\n');
  navigator.clipboard.writeText(text).then(
    () => alert('✅ 로그 복사 완료 · ' + log.length + '개 엔트리'),
    () => {
      // Fallback for file:// or clipboard blocked
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); alert('✅ 로그 복사 완료 (fallback)'); }
      catch (e) { alert('❌ 복사 실패. 로그창 스크롤해서 수동 선택·Ctrl+C'); }
      document.body.removeChild(ta);
    }
  );
}

function buildInitial(opts) {
  // v1.0: opts = { mode, mapSize, difficulty, role, specific, humans }
  const { mode = 'solo', mapSize = '11x11', difficulty = 'normal', role = 'ghost', specific = 'CIPHER', humans = null, scenario = 'S01' } = opts || {};
  const playerCount = mode === 'multi' && humans ? Math.max(2, humans.length) : 4;
  const initial = initGame(role, specific, playerCount, mapSize, { mode, difficulty, humans, scenario });
  initial.players = initial.players.map(p => {
    const handSize = 6;
    return { ...p, hand: p.deck.slice(0, handSize), deck: p.deck.slice(handSize) };
  });
  return initial;
}

// 🎓 BGA 스타일 코치마크 오버레이 — tutorial_module.js 의 데이터를 "렌더만" 한다.
//   모듈 미로드 시 typeof 가드로 아무것도 렌더하지 않음(완전 무해).
//   backdrop 은 pointer-events:none 이라 게임 조작을 막지 않고, 말풍선만 클릭 수용.
function TutorialOverlay({ state, enabled }) {
  const seenRef = useRef(null);
  if (seenRef.current === null) seenRef.current = new Set();
  const doneRef = useRef(false);
  // active: 현재 표시 중인 스텝을 "래치". 한 번 뜨면 유저가 [다음]/[건너뛰기]로
  //   닫을 때까지 유지 — 수익처럼 자동 진행되는 페이즈에서도 말풍선이 사라지지 않음.
  const [active, setActive] = useState(null);
  const modOk = typeof tutorial_pickStep === 'function';

  useEffect(() => {
    if (!modOk || !enabled || doneRef.current || active) return;
    const next = tutorial_pickStep(state, seenRef.current);
    if (next) setActive(next);
  }, [state, enabled, active, modOk]);

  if (!modOk || !enabled || doneRef.current || !active) return null;  // 모듈 미로드 → 무해

  const step = active;
  const text = (typeof tutorial_resolveText === 'function') ? tutorial_resolveText(step, state) : (step.body || '');
  const dismiss = (finalize) => {
    seenRef.current.add(step.id);
    if (finalize || step.final) {
      doneRef.current = true;
      if (typeof tutorial_markDone === 'function') tutorial_markDone();
    }
    setActive(null);  // 닫으면 useEffect 가 다음 스텝을 다시 픽
  };

  return (
    <>
      <div className="tut-backdrop" />
      <div className={`tut-bubble a-${step.anchor || 'center'}`}>
        <div className="tut-title">{step.title}</div>
        <div className="tut-body">{text}</div>
        <div className="tut-actions">
          <button className="tut-skip" onClick={() => dismiss(true)}>튜토리얼 건너뛰기</button>
          <button className="tut-next" onClick={() => dismiss(false)}>{step.final ? '완료 ✓' : '다음 ▶'}</button>
        </div>
      </div>
    </>
  );
}

function App() {
  const [state, setState] = useState(null);
  const savedRef = useRef(false);
  // v6.24 (레거시 Stage 1): 게임 종료 시 계산한 챕터 해금 배너 { chapter1Newly, unlocked }
  const [legacyBanner, setLegacyBanner] = useState(null);
  // 🎓 튜토리얼: 이번 게임에서 가이드가 켜졌는지 (5×5 솔로 + 토글 ON + 미완료)
  const tutEnabledRef = useRef(false);
  const evalTut = (opts) => {
    tutEnabledRef.current = (typeof tutorial_shouldAutoStart === 'function') ? tutorial_shouldAutoStart(opts) : false;
  };

  const startGame = useCallback((opts) => {
    console.log('[SIM] Start game:', opts);
    savedRef.current = false;
    setLegacyBanner(null);
    evalTut(opts);
    setState(buildInitial(opts));
  }, []);

  // v6.26: E2E/스크린샷 전용 상태 주입 훅 (표시 전용 — 게임 규칙 무영향). 프로덕션 무해(호출자 없음).
  useEffect(() => { window.__dnInject = (s) => setState(s); return () => { try { delete window.__dnInject; } catch (e) {} }; }, []);

  const dispatch = useCallback((action) => {
    if (action.type === 'RESET') {
      savedRef.current = false;
      setLegacyBanner(null);
      evalTut(action.opts);
      setState(buildInitial(action.opts));
      return;
    }
    if (action.type === 'BACK_TO_MENU') {
      savedRef.current = false;
      setLegacyBanner(null);
      setState(null);
      return;
    }
    setState(prev => {
      if (!prev) return prev;
      try {
        return reducer(prev, action);
      } catch (e) {
        console.error('[SIM] Reducer error:', e, 'Action:', action);
        return prev;
      }
    });
  }, []);

  // 게임 종료 시 히스토리 저장 (한 번만)
  useEffect(() => {
    if (state?.meta?.gameOver && !savedRef.current) {
      savedRef.current = true;
      saveGameRecord(buildGameRecord(state));
      // v6.24 (레거시 Stage 1): 최초 레이드 발생 → 챕터 1 해금 + 최다 피해 블록 → 도시 흉터.
      // v6.31 (레거시 Stage 2): 최초 M&A 선언(Bloc→타 Bloc) → 챕터 2 해금 + M&A 표적(PREY) → 흉터.
      // v6.33 (레거시 Stage 3): 계엄 발생(공권력 최고조/경찰 전개/S04) → 챕터 3 해금 + 'martial' 흉터.
      // v6.34 (레거시 Stage 4): 임의 Bloc TL 4 달성 → 챕터 4 해금 + 그 과잉 개조 블록 → 'splice' 흉터.
      // v6.35 (레거시 Stage 5): CIPHER TL5 또는 해킹 노드 ≥3 → 챕터 5 해금 + 종가 최저 블록 → 'mesh' 흉터.
      // v6.36 (레거시 Stage 6): M&A 인수 완결(meta.acquisitions) → 챕터 6 해금 + 흡수된 블록 → 'acquired' 흉터.
      // v6.39 (레거시 Stage 7·8): NEXUS 종료 장악(getNexusController) → 챕터 7 해금 + 장악 블록 → 'nexus' 흉터.
      //   챕터 8(Zero Day, 완결)은 gameResult 파생 아님 — 챕터 1~7 전부 해금 시 자동 해금(캠페인 완주) + 'zeroday' 도시 전역 흉터(완결 판 1회성).
      //   legacy_module 미로드 시 무해(typeof 가드). localStorage 실패는 모듈 내부 try/catch.
      //   모든 신호는 현행 meta·players 집계에서 파생 — 새 카운터 신설 없음(하위 호환·헤드리스 안전).
      if (typeof legacyRecordGame === 'function') {
        try {
          const raids = state.meta.raidsThisGame || {};
          const anyRaid = Object.values(raids).some(n => (n || 0) > 0);
          const dmg = state.meta.raidDmgByBloc || {};
          let topRaidBloc = null, topN = 0;
          for (const b in dmg) { if (dmg[b] > topN) { topN = dmg[b]; topRaidBloc = b; } }
          // 챕터 2 해금: Bloc 공격자가 M&A 선언(meta.mnaCount) 1회 이상 → anyMna (원전 "Bloc가 타 Bloc").
          const mnaCnt = state.meta.mnaCount || {};
          let anyMna = false;
          for (const k in mnaCnt) {
            const pl = state.players[Number(k)];
            if ((mnaCnt[k] || 0) > 0 && pl && pl.role === 'bloc') anyMna = true;
          }
          // M&A 표적(PREY·방어자): 완료 인수(acquisitions) 우선, 없으면 진행 중(pendingMna) 표적.
          let mnaPreyBloc = null;
          const acq = state.meta.acquisitions || {};
          for (const k in acq) { const list = acq[k] || []; if (list.length) mnaPreyBloc = list[list.length - 1]; }
          if (!mnaPreyBloc && state.meta.pendingMna && state.meta.pendingMna.target) mnaPreyBloc = state.meta.pendingMna.target;
          // 챕터 6 해금(블록 인수): 원전 "Bloc 1곳 완전 흡수 (지분 51%+ 이사회 3R 장악)".
          //   현행 실존 신호 = M&A 인수 완결 = meta.acquisitions 에 완료 기록 1건 이상
          //   (euro_completeMnaAcquisition 이 방어 실패 후 push + 피인수 p.acquiredBy 마커). 단순 M&A
          //   선언(ch2 anyMna=mnaCount)과 구분 — 여기선 pendingMna(진행 중)는 제외, 완결만 트리거.
          //   흉터 대상(absorbedBloc) = 마지막으로 완전 흡수돼 NPC 전환된 피인수 블록 → 그 블록 시작 주가 -1.
          //   상시 카운터 신설 없이 기존 meta.acquisitions 집계에서 파생 (하위 호환·헤드리스 안전).
          let blocAbsorbed = false, absorbedBloc = null;
          for (const k in acq) { const list = acq[k] || []; if (list.length) { blocAbsorbed = true; absorbedBloc = list[list.length - 1]; } }
          // 챕터 3 해금(계엄): 원전 "공권력 트랙 10 도달(계엄선포)" → 현행 신호 파생.
          //   policeSpawned(공권력 9 도달 시 경찰 전개·하락해도 유지, S04 는 시작부터 true) ||
          //   heat==10(엔진 상한 도달 = 트랙 최고조) || 시나리오 martialLaw(S04 계엄 게이트).
          const martialLaw = !!state.meta.policeSpawned
            || (state.heat || 0) >= 10
            || scenarioRule(state, 'martialLaw', false) === true;
          // 챕터 4 해금(스플라이스): 원전 "임의 Bloc TL 4 달성 OR Ghost 스플라이스 3개".
          //   현행 실존 신호 = 어떤 role==='bloc' 플레이어의 p.tl(엔진 TL 시스템, R&D 파생) ≥ 4.
          //   TL 최고(≥4) 블록을 흉터 대상(spliceBloc)으로 파생 — raid/prey 와 동일한 블록-주가 흉터.
          //   Ghost 스플라이스 장착 집계는 엔진 부재 → 미파생(No-op 정직). 상시 카운터 신설 없음.
          let spliceTech = false, spliceBloc = null, topTl = 0;
          for (const p of state.players) {
            if (p && p.role === 'bloc' && (p.tl || 1) >= 4 && (p.tl || 1) > topTl) {
              topTl = p.tl || 1; spliceTech = true; spliceBloc = p.specific;
            }
          }
          // 챕터 5 해금(메시 고스트): 원전 "CIPHER 테크 레벨 5 달성 OR 메시 노드 3개 이상 침입".
          //   두 분기 모두 현행 실존 신호 — CIPHER 클래스 플레이어(p.specific==='CIPHER')의
          //   p.tl(엔진 TL 시스템, 11×11 캡=5) ≥ 5  OR  p.hackNodes(CIPHER 시그니처 "해킹 노드"
          //   게이지, ≥3=해킹 신) ≥ 3. 상시 카운터 신설 없이 기존 필드에서 파생.
          //   흉터 대상(meshBloc) = 종가(state.stocks) 최저 블록 — SIGNAL/메시 고스트가 가장 취약한
          //   노드에 강림(원전 "메시 침입") → 그 블록 시작 주가 -1. raid/prey/splice 와 동일 -1 채널.
          let meshTech = false;
          for (const p of state.players) {
            if (p && p.specific === 'CIPHER' && ((p.tl || 1) >= 5 || (p.hackNodes || 0) >= 3)) { meshTech = true; break; }
          }
          let meshBloc = null;
          if (meshTech) {
            let lowSp = Infinity;
            for (const b of ['VANTA', 'IRONWALL', 'HELIX', 'AXIOM', 'CARBON']) {
              const sp = (state.stocks && state.stocks[b] != null) ? state.stocks[b] : null;
              if (sp != null && sp < lowSp) { lowSp = sp; meshBloc = b; }
            }
          }
          // v6.39 (레거시 Stage 7): 챕터 7 해금(도시의 심장) — 원전 "어느 세력이든 NEXUS(F6) 3라운드 연속 장악".
          //   현행 실존 신호 = 게임 종료 시점 NEXUS 셀 소유자(getNexusController) 존재 = 어느 세력이든 심장을 끝까지 장악.
          //   원전 "3R 연속"의 정밀 연속 카운터는 엔진 meta.nexusStreak/nexusHolder 가 死필드(갱신 안 됨)라 미배선(No-op 정직) —
          //   "종료 시점 장악 유지"로 근사(끝까지 쥐고 있음 ≈ 지속 장악). 상시 카운터 신설 없이 기존 셀 소유에서 파생.
          //   흉터 대상(nexusBloc) = 장악자가 Bloc 이면 그 블록(왕관이 있는 자리가 무겁다 → 시작 주가 -1); Ghost 장악 시 NEXUS 중립 → null.
          let nexusHeld = false, nexusBloc = null;
          if (typeof getNexusController === 'function') {
            const nc = getNexusController(state);
            if (nc) { nexusHeld = true; if (nc.role === 'bloc' && nc.specific) nexusBloc = nc.specific; }
          }
          const res = legacyRecordGame({ anyRaid, topRaidBloc, anyMna, mnaPreyBloc, martialLaw, spliceTech, spliceBloc, meshTech, meshBloc, blocAbsorbed, absorbedBloc, nexusHeld, nexusBloc });
          setLegacyBanner({ chapter1Newly: !!res.chapter1Newly, chapter2Newly: !!res.chapter2Newly, chapter3Newly: !!res.chapter3Newly, chapter4Newly: !!res.chapter4Newly, chapter5Newly: !!res.chapter5Newly, chapter6Newly: !!res.chapter6Newly, chapter7Newly: !!res.chapter7Newly, chapter8Newly: !!res.chapter8Newly, campaignComplete: !!res.campaignComplete, unlocked: res.state.chaptersUnlocked });
        } catch (e) { console.warn('[SIM] legacy record failed', e); }
      }
    }
  }, [state?.meta?.gameOver]);

  if (!state) {
    return <SetupScreen onStart={startGame} />;
  }

  return <GameScreen state={state} dispatch={dispatch} tutorialEnabled={tutEnabledRef.current} legacyBanner={legacyBanner} />;
}

// Mount — 마운트 성공 시 부트 스플래시 제거 + 워치독 해제. 실패 시 실패 UI 노출.
try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
  if (window.__bootWatch) { clearTimeout(window.__bootWatch); window.__bootWatch = null; }
  const __boot = document.getElementById('boot'); if (__boot) __boot.remove();
} catch (e) {
  if (window.__bootFail) window.__bootFail('앱 초기화 오류: ' + ((e && e.message) || e));
}

</script>
