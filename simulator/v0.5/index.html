        s = logEntry(s, `⚔️ P${playerIdx} · 암살 mini-raid → ${blocCoord} ★+2`);
      }
    }
  }
  if (effect.protect_ally || effect.absorb || effect.def_infinite_to_1) {
    // 호위/방어 → HP+3 + ★+3 + security 트랙
    const cur = s.players[playerIdx];
    const ps = [...s.players];
    ps[playerIdx] = { ...cur, hp: Math.min(cur.maxHp, cur.hp + 3), resources: { ...cur.resources, rep: (cur.resources.rep || 0) + 3 } };
    s = { ...s, players: ps };
    s = logEntry(s, `🛡 P${playerIdx} · 호위·방어 HP+3 ★+3`);
    s = raiseTrack(s, playerIdx, 'security', 1, '호위');
  }
  if (effect.block_adj || effect.enemy_spd || effect.def_penalty || effect.def_zero) {
    // 적 봉쇄/속도 둔화 → ★+3 + ₵+3 + combat 트랙
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, rep: (ps[playerIdx].resources.rep || 0) + 3, credit: (ps[playerIdx].resources.credit || 0) + 3 } };
    s = { ...s, players: ps };
    s = logEntry(s, `🚧 P${playerIdx} · 적 봉쇄 ★+3 ₵+3`);
    s = raiseTrack(s, playerIdx, 'combat', 1, '봉쇄');
  }
  // MOLE — 내부 침투 계열 (v0.7.1: 모든 internal 효과에 mini-raid 추가 — Bloc 정보 누출 = 영향력 약화)
  if (effect.peek_bloc || effect.steal_card) {
    // 블록 내부 엿보기 → ★+5 ₵+4 + party 트랙 + MOLE mini-raid
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, rep: (ps[playerIdx].resources.rep || 0) + 5, credit: (ps[playerIdx].resources.credit || 0) + 4 } };

    if (s.players[playerIdx]?.specific === 'MOLE') s = tryMoleMiniRaid(s, playerIdx, '엿보기');

  if (effect.bloc_resource || effect.vote_flip) {
    // Bloc 자원 탈취·투표 조작 → ★+5 ₵+5 (mini-raid 제거 — 너무 잦음)
    const ps = [...s.players];

    s = logEntry(s, `🗳 P${playerIdx} · Bloc 자원/투표 조작 · ★+5, ₵+5`);
  }
  if (effect.frame || effect.swap_blame) {
    // 누명 씌우기 → 수배-2 + ★+4 + party 트랙 (mini-raid 제거)
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], wanted: Math.max(0, (ps[playerIdx].wanted || 0) - 2), resources: { ...ps[playerIdx].resources, rep: (ps[playerIdx].resources.rep || 0) + 4 } };
    s = { ...s, players: ps };
    s = logEntry(s, `👺 P${playerIdx} · 누명 · 수배-2, ★+4`);
    s = raiseTrack(s, playerIdx, 'party', 1, '누명');
  }
  if (effect.infiltrate || effect.disguise || effect.bypass_veil) {
    // v0.6.5d: 침투 강화 — 렙+3, 데이터+2, 경호 트랙 +1, NPC 시그널 +1
    s = { ...s, meta: { ...s.meta, mapReveal: (s.meta.mapReveal || 0) + 3 } };
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, rep: (ps[playerIdx].resources.rep || 0) + 3, data: (ps[playerIdx].resources.data || 0) + 2 } };
    s = { ...s, players: ps };
    s = logEntry(s, `🎭 P${playerIdx} · 위장 침투 강화 · 지도 3R 노출, ★+3, 📡+2`);
    s = raiseTrack(s, playerIdx, 'security', 1, '침투');
    const npcIdx = s.players.findIndex(pp => pp.isNpc && pp.signal && pp.signal.revealed < pp.signal.max);
    if (npcIdx >= 0) s = revealSignal(s, npcIdx, playerIdx, 1);
    // v0.6.5d: MOLE 침투 mini-raid — 가장 가까운 Bloc 구역 자동 잠입 (방어 우회)
    const meP = s.players[playerIdx];
    if (meP.role === 'ghost' && meP.position) {
      const adj = coordsAdj(meP.position).concat([meP.position]);
      const blocCoord = adj.find(c => s.map[c]?.owner != null && s.players[s.map[c].owner]?.role === 'bloc' && !s.players[s.map[c].owner]?.defeated);
      if (blocCoord) {
        const bcell = s.map[blocCoord];
        const bowner = s.players[bcell.owner];
        const newStocks = { ...s.stocks, [bowner.specific]: Math.max(1, s.stocks[bowner.specific] - 2) };
        const ps2 = [...s.players];
        ps2[playerIdx] = { ...ps2[playerIdx], resources: { ...ps2[playerIdx].resources, rep: (ps2[playerIdx].resources.rep || 0) + 2 } };
        const newMap = { ...s.map, [blocCoord]: { ...bcell, owner: null, fortified: 0, building: null } };
        s = { ...s, players: ps2, stocks: newStocks, map: newMap };
        s.meta = { ...s.meta, raidsThisGame: { ...s.meta.raidsThisGame, [playerIdx]: (s.meta.raidsThisGame[playerIdx] || 0) + 1 } };
        s = logEntry(s, `🕷 P${playerIdx} · 침투 mini-raid → ${blocCoord} ${bowner.specific} 중립화 (★+2 주가-2)`);
      }
    }
  }
  if (effect.scandal || effect.stock_dmg) {
    // v0.7.1: 스캔들 강화 → 주가-3, ★+4 + MOLE mini-raid
    const blocs = Object.keys(s.stocks);
    const pick = rand(blocs);
    const newStocks = { ...s.stocks, [pick]: Math.max(1, s.stocks[pick] - 3) };
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, rep: (ps[playerIdx].resources.rep || 0) + 4 } };
    s = { ...s, stocks: newStocks, players: ps };
    s = logEntry(s, `💣 P${playerIdx} · ${pick} 스캔들 · 주가-3, ★+4`);
    s = raiseTrack(s, playerIdx, 'party', 1, '스캔들');
    if (s.players[playerIdx]?.specific === 'MOLE') s = tryMoleMiniRaid(s, playerIdx, '스캔들');
  }
  if (effect.permanent_clear) {
    // 영구 흔적 삭제: 수배 완전 초기화 + 렙+2
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], wanted: 0, resources: { ...ps[playerIdx].resources, rep: (ps[playerIdx].resources.rep || 0) + 2 } };
    s = { ...s, players: ps };
    s = logEntry(s, `🧹 P${playerIdx} · 영구 삭제 · 수배→0, ★+2`);
  }
  // RIGGER — 기술·제작 계열
  if (effect.emp_pulse || effect.tech_breach) {
    // EMP/해킹: 타겟 주가-3 + 데이터+2 + 렙+2 (v0.5.14)
    const blocs = Object.keys(s.stocks);
    const pick = rand(blocs);
    const newStocks = { ...s.stocks, [pick]: Math.max(1, s.stocks[pick] - 3) };
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, data: (ps[playerIdx].resources.data || 0) + 2, rep: (ps[playerIdx].resources.rep || 0) + 2 } };
    s = { ...s, stocks: newStocks, players: ps };
    s = logEntry(s, `⚡ P${playerIdx} · EMP/브리치 · ${pick} 주가-3, 📡+2, ★+2`);
  }
  if (effect.field_craft || effect.jury_rig) {
    // v0.6.6: 현장 제작 강화 — ⚙+5 🔩+3 ★+4 + mfg 트랙 +1
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, parts: (ps[playerIdx].resources.parts || 0) + 5, weapons: (ps[playerIdx].resources.weapons || 0) + 3, rep: (ps[playerIdx].resources.rep || 0) + 4 } };
    s = { ...s, players: ps };
    s = logEntry(s, `🔧 P${playerIdx} · 현장 제작 · ⚙+5, 🔩+3, ★+4`);
    s = raiseTrack(s, playerIdx, 'mfg', 1, '현장 제작');
  }
  // v0.6.6: 신규 RIGGER 효과 키 폴백 — repair / salvage / craft_item / zone_shield / zone_disable / atk_range / multi_target / disable_elec
  if (effect.repair || effect.salvage) {
    // 수리/자원 회수 → HP+3 + ⚙+3 + ★+3 + mfg 트랙
    const ps = [...s.players];
    const cur = ps[playerIdx];
    ps[playerIdx] = { ...cur, hp: Math.min(cur.maxHp, cur.hp + 3), resources: { ...cur.resources, parts: (cur.resources.parts || 0) + 3, rep: (cur.resources.rep || 0) + 3 } };
    s = { ...s, players: ps };
    s = logEntry(s, `🔩 P${playerIdx} · 수리/자원 회수 · HP+3 ⚙+3 ★+3`);
    s = raiseTrack(s, playerIdx, 'mfg', 1, '수리');
  }
  if (effect.craft_item || effect.zone_shield) {
    // 아이템 제작/구역 차폐 → 무기+2 + 부품+2 + 요새화+1 + 렙+3
    const cur = s.players[playerIdx];
    const ps = [...s.players];
    ps[playerIdx] = { ...cur, resources: { ...cur.resources, weapons: (cur.resources.weapons || 0) + 2, parts: (cur.resources.parts || 0) + 2, rep: (cur.resources.rep || 0) + 3 } };
    s = { ...s, players: ps };
    if (cur.position && s.map[cur.position]) {
      s = { ...s, map: { ...s.map, [cur.position]: { ...s.map[cur.position], fortified: (s.map[cur.position].fortified || 0) + 1 } } };
    }
    s = logEntry(s, `🛡 P${playerIdx} · 차폐/제작 · 🔩+2 ⚙+2 요새+1 ★+3`);
    s = raiseTrack(s, playerIdx, 'mfg', 1, '차폐');
  }
  if (effect.atk_range || effect.multi_target || effect.disable_elec || effect.zone_disable) {
    // 드론 광역 공격/EMP → 인접 Bloc 자동 mini-raid + 렙+3 + 주가-2
    const cur = s.players[playerIdx];
    const ps = [...s.players];
    ps[playerIdx] = { ...cur, resources: { ...cur.resources, rep: (cur.resources.rep || 0) + 3, data: (cur.resources.data || 0) + 2 } };
    s = { ...s, players: ps };
    s = logEntry(s, `🛰 P${playerIdx} · 드론 광역 ★+3 📡+2`);
    s = raiseTrack(s, playerIdx, 'mfg', 1, '드론 광역');
    // v1.1.1: RIGGER mini-raid 5×5 50% / 11×11 100%
    const rigRate = s.meta.mapSize === '11x11' ? 1.0 : 0.5;
    if (cur.role === 'ghost' && cur.position && Math.random() < rigRate) {
      const adj = coordsAdj(cur.position).concat([cur.position]);
      const blocCoord = adj.find(c => s.map[c]?.owner != null && s.players[s.map[c].owner]?.role === 'bloc' && !s.players[s.map[c].owner]?.defeated);
      if (blocCoord) {
        const bcell = s.map[blocCoord];
        const bowner = s.players[bcell.owner];
        const newStocks = { ...s.stocks, [bowner.specific]: Math.max(1, s.stocks[bowner.specific] - 2) };
        const ps2 = [...s.players];
        ps2[playerIdx] = { ...ps2[playerIdx], resources: { ...ps2[playerIdx].resources, rep: (ps2[playerIdx].resources.rep || 0) + 2 } };
        const newMap = { ...s.map, [blocCoord]: { ...bcell, owner: null, fortified: 0, building: null } };
        s = { ...s, players: ps2, stocks: newStocks, map: newMap };
        s.meta = { ...s.meta, raidsThisGame: { ...s.meta.raidsThisGame, [playerIdx]: (s.meta.raidsThisGame[playerIdx] || 0) + 1 } };
        s = logEntry(s, `🛰 P${playerIdx} · 드론 mini-raid → ${blocCoord} ${bowner.specific} 중립화 ★+2 주가-2`);
      }
    }
  }
  if (effect.shield_gen || effect.drone_swarm || effect.overclock) {
    // 드론·차폐: 다음 판정 +2 + 렙+3 (v0.5.14 강화)
    s = { ...s, meta: { ...s.meta, attackBonusOnce: (s.meta.attackBonusOnce || 0) + 2 } };
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, rep: (ps[playerIdx].resources.rep || 0) + 3 } };
    s = { ...s, players: ps };
    s = logEntry(s, `🛰 P${playerIdx} · 드론/차폐 · 다음 판정+2, ★+3`);
  }
  if (effect.disable_tl || effect.force_tl_down) {
    // TL 방해 → 랜덤 Bloc TL 1 하락 + 렙+3
    const rivalBlocs = s.players.filter((pp, i) => i !== playerIdx && !pp.defeated && pp.role === 'bloc' && pp.tl > 1);
    if (rivalBlocs.length > 0) {
      const target = rand(rivalBlocs);
      const tIdx = s.players.indexOf(target);
      const ps = [...s.players];
      ps[tIdx] = { ...ps[tIdx], tl: Math.max(1, (ps[tIdx].tl || 1) - 1) };
      ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, rep: (ps[playerIdx].resources.rep || 0) + 3 } };
      s = { ...s, players: ps };
      s = logEntry(s, `📉 P${playerIdx} · P${tIdx} TL 방해 (→${ps[tIdx].tl}), ★+3`);
    }
  }
  if (effect.temp_tl) {
    // v0.8.5: OVERCLOCK (RIGGER) — 한 라운드 TL+1 → 다음 R 카드+1, 부품+2, 렙+2
    s = { ...s, meta: { ...s.meta, extraDrawNext: (s.meta.extraDrawNext || 0) + 1 } };
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, rep: (ps[playerIdx].resources.rep || 0) + 2, parts: (ps[playerIdx].resources.parts || 0) + 2 } };
    s = { ...s, players: ps };
    s = logEntry(s, `⚡ P${playerIdx} · 오버클록 · 다음 R 카드+1, ⚙+2, ★+2`);
    s = raiseTrack(s, playerIdx, 'mfg', 1, '오버클록');
  }
  if (effect.transfer_ally || effect.fuel) {
    // v0.6.6c: 보급 강화 → ₵+4 ⚙+2 + transport 트랙
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, credit: (ps[playerIdx].resources.credit || 0) + 4, parts: (ps[playerIdx].resources.parts || 0) + 2 } };
    s = { ...s, players: ps };
    s = logEntry(s, `⛽ P${playerIdx} · 보급 · ₵+4, ⚙+2`);
    s = raiseTrack(s, playerIdx, 'transport', 1, '보급');
  }
  if (effect.untrack || effect.shortcut || effect.ignore_obstacles || effect.ignore_all || effect.move_3_nowalls || effect.move_any || effect.teleport) {
    // v0.6.6c: 경로 우회 → 수배-1 ★+2 + transport 트랙 (★+3→2 너프)
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], wanted: Math.max(0, (ps[playerIdx].wanted || 0) - 1), resources: { ...ps[playerIdx].resources, rep: (ps[playerIdx].resources.rep || 0) + 2 } };
    s = { ...s, players: ps };
    s = logEntry(s, `🚶 P${playerIdx} · 경로 우회 · 수배-1, ★+2`);
    s = raiseTrack(s, playerIdx, 'transport', 1, '경로 우회');
  }
  if (effect.leave_fire || effect.burn_behind || effect.smuggle) {
    // v0.6.6c: 밀수/방화 → ₵+4 ★+2 + transport 트랙 (★+3→2)
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, credit: (ps[playerIdx].resources.credit || 0) + 4, rep: (ps[playerIdx].resources.rep || 0) + 2 } };
    s = { ...s, players: ps };
    s = logEntry(s, `🔥 P${playerIdx} · 밀수/방화 · ₵+4, ★+2`);
    s = raiseTrack(s, playerIdx, 'transport', 1, '밀수');
  }
  // v0.6.6c: DRIFTER 신규 — ram_atk
  if (effect.ram_atk) {
    // 충각: 같은 구역 적 HP-(ram_atk) + ★+3 + combat 트랙
    const cur = s.players[playerIdx];
    const enemies = s.players.filter((pp, i) => i !== playerIdx && !pp.defeated && pp.position === cur.position);
    const ps = [...s.players];
    let ramTargetIdx = -1;
    if (enemies.length > 0) {
      const target = enemies[0];
      ramTargetIdx = s.players.indexOf(target);
      s = logEntry(s, `🚛 P${playerIdx} · 충각 → P${ramTargetIdx} HP-${effect.ram_atk}`);
    }
    ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, rep: (ps[playerIdx].resources.rep || 0) + 3 } };
    s = { ...s, players: ps };
    if (ramTargetIdx >= 0) s = applyDamage(s, ramTargetIdx, effect.ram_atk, { attacker: playerIdx, label: '충각' });  // v6.11.4 (P0-4)
    s = raiseTrack(s, playerIdx, 'combat', 1, '충각');
  }
  if (effect.break_veil) {
    // 베일 해제 → 데이터+1 + 렙+1
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, data: (ps[playerIdx].resources.data || 0) + 1, rep: (ps[playerIdx].resources.rep || 0) + 1 } };
    s = { ...s, players: ps };
    s = logEntry(s, `🔓 P${playerIdx} · 베일 해제 · 📡+1, ★+1`);
  }
  // v6.51 (E2): force_enter 중복 분기 제거 — BLADE 폴백 번들(assassin|…|force_enter, v0.6.6c 정본)로 통합

  // === Bloc 신규 효과들 ===
  // 임의 블록 N주 자동 매수 (저가 순)
  if (effect.stock_buy_any) {
    const pNow = s.players[playerIdx];
    const blocs = Object.entries(s.stocks).filter(([bl]) => !(pNow.role === 'bloc' && pNow.specific === bl));
    blocs.sort((a, b) => a[1] - b[1]);
    let bought = 0;
    let newPlayerStocks = { ...pNow.stocks };
    let remainingCredit = pNow.resources.credit || 0;
    for (const [bl, price] of blocs) {
      while (bought < effect.stock_buy_any && remainingCredit >= price) {
        newPlayerStocks[bl] = (newPlayerStocks[bl] || 0) + 1;
        remainingCredit -= price;
        bought++;
      }
      if (bought >= effect.stock_buy_any) break;
    }
    if (bought > 0) {
      const ps = [...s.players];
      ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, credit: remainingCredit }, stocks: newPlayerStocks };
      s = { ...s, players: ps };
      s = logEntry(s, `📈 P${playerIdx} [${p.specific}] · ${bought}주 자동 매수 (잔액 ₵${remainingCredit})`);
    } else {
      s = logEntry(s, `📈 P${playerIdx} · 매수 실패 (₵ 부족)`);
    }
  }

  // 현위치 요새화 — 방어력 +1 플래그 (단순화: 다음 레이드 threshold +1)
  if (effect.fortify_here) {
    const pNow = s.players[playerIdx];
    const cellHere = s.map[pNow.position];
    if (cellHere && cellHere.owner === playerIdx) {
      const newMap = { ...s.map, [pNow.position]: { ...cellHere, fortified: (cellHere.fortified || 0) + 1 } };
      s = { ...s, map: newMap };
      s = logEntry(s, `🛡 P${playerIdx} [${p.specific}] · ${pNow.position} 요새화 (방어 +1)`);
    } else {
      s = logEntry(s, `🛡 P${playerIdx} · 요새화 실패 (자사 구역 아님)`);
    }
  }

  // 용병 고용 — 랜덤 Bloc 구역(자사 제외) 주가 -3
  if (effect.hire_raid) {
    const targets = Object.entries(s.map).filter(([c, cell]) => cell.owner !== null && cell.owner !== undefined && cell.owner !== playerIdx && s.players[cell.owner]?.role === 'bloc');
    if (targets.length > 0) {
      const [coord, cell] = rand(targets);
      const targetBloc = s.players[cell.owner].specific;
      const targetIdx = cell.owner;
      const newStocks = { ...s.stocks, [targetBloc]: Math.max(1, s.stocks[targetBloc] - 3) };
      const newMap = { ...s.map, [coord]: { ...cell, owner: null } };
      s = { ...s, stocks: newStocks, map: newMap };
      s = logEntry(s, `🗡 P${playerIdx} [${p.specific}] · 용병 고용 → ${coord} ${targetBloc} 타격 (주가-3, 중립화)`);
      if (targetIdx === 0 && playerIdx !== 0) {
        s.meta = { ...s.meta, lastTargetedBy: { attacker: playerIdx, effectKey: 'hire_raid', detail: `${coord} 잃음, 주가-3` } };
      }
    } else {
      s = logEntry(s, `🗡 P${playerIdx} · 용병 고용 실패 (타 Bloc 구역 없음)`);
    }
  }

  // Ghost 전원 수배 +N
  if (effect.ghost_wanted_all) {
    const ps = s.players.map(pp => pp.role === 'ghost' && !pp.defeated ? { ...pp, wanted: (pp.wanted || 0) + effect.ghost_wanted_all } : pp);
    s = { ...s, players: ps };
    s = logEntry(s, `🚨 P${playerIdx} [${p.specific}] · Ghost 전원 수배 +${effect.ghost_wanted_all}`);
    if (s.players[0].role === 'ghost' && playerIdx !== 0) {
      s.meta = { ...s.meta, lastTargetedBy: { attacker: playerIdx, effectKey: 'ghost_wanted_all', detail: `수배 +${effect.ghost_wanted_all}` } };
    }
  }

  return s;
}

function cardDisplayName(card) {
  if (!card) return '?';
  return CARD_NAMES_KR[card.id] || card.name || '?';
}

function logEntry(s, msg) {
  return { ...s, log: [...s.log, { round: s.meta.round, phase: s.meta.phase, message: msg }].slice(-150) };
}

// 서사 표면화 — 명대사 1줄 첨가. 게임당 인물(specific)별 1회 캡(meta.loreQuoted)으로 스팸 방지.
// 표시 전용: lore_module 미로드 시 무해(no-op). 게임 로직·자원 무변경.
function loreFlavorOnce(s, specific) {
  if (!s || !specific || typeof loreQuote !== 'function') return s;
  const quoted = (s.meta && s.meta.loreQuoted) || {};
  if (quoted[specific]) return s;
  const q = loreQuote(specific);
  if (!q) return s;
  s = { ...s, meta: { ...s.meta, loreQuoted: { ...quoted, [specific]: true } } };
  return logEntry(s, q.line);
}

// v6.51 (E1): 타임아웃 승자 = 진영별 목표 대비 정규화 진척 1위 (rules_module 단일 소스).
//   defeated/isNpc 필터·hlBonus 가산·동률=무승부 규칙 포함 — evalPlayerVictory/hudRaceProgress 와 동일 수학.
function checkVictoryByPoints(state) {
  if (typeof rules_victoryByPoints === 'function') return rules_victoryByPoints(state);
  // 폴백 (rules_module 미로드 — E13 배너가 별도 고지): 판정 불능 = 무승부
  return { ...state, meta: { ...state.meta, gameOver: true, winner: null, winReason: '무승부 (판정 모듈 미로드)' } };
}

function checkInstantVictory(state) {
  // v6.10: M&A 2블록 인수 승리는 5R 가드 이전에 체크 (인수 루프 특성상 조기 성립 가능).
  //  M&A(2블록)·NEXUS 연속 점유 같은 "이벤트형 즉시 승리"는 서사적 정당성이 있어
  //  종료 선언 유예를 우회하고 즉시 확정한다 (v6.12 P0-1 설계 판단).
  if (typeof euro_checkMnaVictory === 'function') {
    const mv = euro_checkMnaVictory(state);
    if (mv.meta.gameOver) return mv;
  }
  // v0.7.5: 최소 5R 가드 — 5R 종료 전엔 승리 판정 X (조기 승리 방지)
  if (state.meta.round < 5) return state;
  const goals = getVictoryGoals(state);
  // v6.12 P0-1: 종료 선언 확정 —
  //   자산·평판 경로는 "즉시 승리"가 아니라 "선언(NEXT_ROUND) → 유예 1R → 확정".
  //   선언 라운드(decl.round)보다 뒤 라운드에서 여전히 조건을 유지하면 여기서 확정한다.
  //   신규 도달(첫 임계 돌파)은 즉시 승리하지 않고 NEXT_ROUND의 applyVictoryDeclaration이
  //   공개 선언만 남긴다 — 그 사이 다른 플레이어가 견제·레이드·M&A로 끌어내릴 기회를 갖는다.
  const decl = state.meta.victoryDeclaration;
  if (decl && decl.round < state.meta.round) {
    const dp = state.players[decl.idx];
    const still = evalPlayerVictory(dp, decl.idx, state, goals);
    if (still) {
      return { ...state, meta: { ...state.meta, gameOver: true, winner: decl.idx,
        winReason: `${still.reason} — 종료 선언 확정 (R${decl.round} 선언 → R${state.meta.round} 유지)` } };
    }
    // 유지 실패 시 여기선 확정하지 않는다 — NEXT_ROUND applyVictoryDeclaration이 선언 해제 처리.
  }
  return state;
}

// v6.12 P0-1: 종료 선언 라운드 — 임계 도달 시 즉시 승리 대신 전원에게 공개 선언 후 유예 1R.
//   NEXT_ROUND(euro_applyAll·M&A 체크 직후)에서 호출 → state.meta.round 는 방금 끝난 라운드 R.
//   ① 현 선언자가 조건을 이탈했으면 선언 해제(재도달 시 재선언 가능)
//   ② 활성 선언이 없고 신규 도달자가 있으면 선언 (같은 플레이어 게임당 2회 캡 — 무한 반복 방지)
//   확정은 다음 라운드 phase6 checkInstantVictory 가 담당.
function applyVictoryDeclaration(state) {
  if (state.meta.gameOver) return state;
  if (state.meta.round < 5) return state;  // 5R 가드 이전엔 선언 없음
  const goals = getVictoryGoals(state);
  let decl = state.meta.victoryDeclaration || null;
  const counts = { ...(state.meta.declarationCounts || {}) };
  const logMsgs = [];
  const loreQuoted = { ...(state.meta.loreQuoted || {}) };  // 서사 표면화: 게임당 인물별 명대사 1회 캡
  // ① 현 선언자 조건 이탈 → 선언 해제
  if (decl) {
    const dp = state.players[decl.idx];
    if (!evalPlayerVictory(dp, decl.idx, state, goals)) {
      logMsgs.push(`⚖ P${decl.idx} [${dp ? dp.specific : '?'}] 승리 조건 이탈 — 종료 선언 해제 (견제 성공)`);
      decl = null;
    }
  }
  // ② 활성 선언 없음 & 신규 도달자 → 선언 (2회 캡)
  if (!decl) {
    for (let i = 0; i < state.players.length; i++) {
      const p = state.players[i];
      if (!p || p.defeated || p.isNpc) continue;
      const v = evalPlayerVictory(p, i, state, goals);
      if (!v) continue;
      if ((counts[i] || 0) >= 2) continue;  // 무한 반복 방지 캡
      counts[i] = (counts[i] || 0) + 1;
      decl = { idx: i, route: v.route, reason: v.reason, round: state.meta.round };
      logMsgs.push(`📢 P${i} [${p.specific}] 승리 조건 도달 (${v.reason}) — 이번 라운드가 마지막 기회. 다음 라운드 종료까지 유지하면 승리!`);
      // 서사 표면화: 종료 선언 시 선언자 명대사 1회 첨가 (게임당 인물별 캡)
      if (typeof loreQuote === 'function' && !loreQuoted[p.specific]) {
        const lq = loreQuote(p.specific);
        if (lq) { logMsgs.push(lq.line); loreQuoted[p.specific] = true; }
      }
      break;
    }
  }
  if (logMsgs.length === 0 && (state.meta.victoryDeclaration || null) === decl) return state;
  return {
    ...state,
    meta: { ...state.meta, victoryDeclaration: decl, declarationCounts: counts, loreQuoted },
    log: [...state.log, ...logMsgs.map(m => ({ round: state.meta.round, phase: 6, message: m }))].slice(-150),
  };
}

// AI (Score-based greedy)
// ============================================================================

function botPickCards(state, playerIdx) {
  const p = state.players[playerIdx];
  if (p.hand.length === 0) return [];

  if (p.role === 'ghost') {
    // Pick 2 cards if possible
    const scored = p.hand.map(cid => ({ cid, score: scoreGhostCard(state, playerIdx, cid) }));
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, Math.min(2, p.hand.length)).map(x => x.cid);
  } else {
    // Bloc: 2장 선택 (상위 2장)
    const scored = p.hand.map(cid => ({ cid, score: scoreBlocCard(state, playerIdx, cid) }));
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, Math.min(2, p.hand.length)).map(x => x.cid);
  }
}

function scoreGhostCard(state, pIdx, cid) {
  const c = getCard(cid);
  const p = state.players[pIdx];
  if (!c) return 0;
  if (c.wound) return -1000 + Math.random();  // v6.13.1 (P1-1): 상처 = 최하 점수 → 봇 자연 회피
  let score = 10;

  // TL3~5 해금: 클래스 상위 카드는 TL 도달 전 봇이 회피 (docs/09 §4 고스트 스킬 트리).
  //   블록보다 완화(-16/+8): 고스트 파워 보존. tl 미지정 카드는 상시 사용 가능.
  if (c.tl) { if (c.tl <= (p.tl || 1)) score += 8; else score -= 16; }

  const rep = p.resources.rep || 0;
  const raids = state.meta.raidsThisGame?.[pIdx] || 0;
  const repNeeded = Math.max(0, 16 - rep);
  const raidNeeded = Math.max(0, 2 - raids);
  const closeToWin = repNeeded <= 3 && raidNeeded <= 1;

  // 두 반쪽을 합쳐 카드 가치 평가 (하나만 쓰겠지만 잠재 기여도 둘 다 합산 X, 최대값)
  const halves = [c.top, c.bot].filter(Boolean);
  for (const h of halves) {
    // 공격·이동: 기존 점수
    if (h.atk || h.atk_x2 || h.atk_x3_retort) score += (p.hp > p.maxHp * 0.5 ? 12 : -5);
    if (h.move) score += p.role === 'ghost' ? (raidNeeded > 0 ? 8 : 3) : 8;
    // 속성 생성
    if (h.gen) score += 4;
    // === 신규: 폴백 보상 효과들 점수화 (BROKER/CIPHER/MOLE 살리기) ===
    if (h.extort) score += h.extort * 5;       // rep + credit
    if (h.contact) score += h.contact * 3;
    if (h.blackmarket) score += h.blackmarket * 4;
    if (h.peek_objective || h.sell_info) score += 6;  // rep + data
    if (h.peek_hand || h.peek_full || h.peek_news) score += 3;
    if (h.scout || h.scout_all || h.drone_scan) score += 2;
    if (h.broker_fee) score += h.broker_fee;  // 중개 수수료는 credit + rep
    if (h.stop_combat || h.cancel_card || h.cancel_action) score += 7;  // 개입 → rep +2
    if (h.invisible || h.invisible_2r || h.stealth || h.hide_actions || h.hide_actions_1r) score += (p.wanted > 2 ? 8 : 3);
    if (h.clear_wanted || h.burn_identity) score += (p.wanted > 3 ? 10 : 1);
    if (h.heal) score += (p.hp < p.maxHp * 0.5 ? 10 : 2);
    if (h.stat_boost) score += h.stat_boost * 2;
    if (h.ambush) score += 6;
    if (h.copy_bloc_card) score += 8;
    if (h.reward) score += h.reward;
    if (h.draw_quest || h.quest_two) score += 5;
    if (h.cargo_haul || h.supply_drop || h.haul) score += 4;
    if (h.deploy_trap || h.trap) score += 3;
    if (h.swap || h.swap_ratio) score += 2;
    // === v0.5.13: BLADE/MOLE/RIGGER 효과 점수 ===
    if (h.execute) score += 12;            // 즉시 렙+4
    if (h.frenzy || h.atk_per_hp) score += (p.hp > p.maxHp * 0.6 ? 10 : 3);
    if (h.hp_to_1 || h.last_stand) score += (p.hp > p.maxHp * 0.7 ? 8 : -5);
    if (h.negate || h.shield || h.human_shield) score += (p.hp < p.maxHp * 0.5 ? 8 : 2);
    if (h.point_blank || h.surprise) score += 6;
    if (h.peek_bloc || h.steal_card) score += 7;
    if (h.bloc_resource || h.vote_flip) score += 10;
    if (h.frame || h.swap_blame) score += (p.wanted > 2 ? 8 : 4);
    // v0.6.6e: mini-raid 트리거 점수 (적정 — 너무 높으면 Ghost 폭주)
    if (h.infiltrate || h.disguise || h.bypass_veil) score += 12;  // MOLE
    if (h.def_ignore || h.steal) score += 8;                        // CIPHER
    if (h.atk_range || h.multi_target || h.disable_elec || h.zone_disable) score += 8;  // RIGGER
    if (h.execute) score += 8;                                      // BLADE
    if (h.assassin || h.atk_twice || h.atk_x3_retort || h.atk_reroll || h.force_enter) score += 10;
    if (h.scandal || h.stock_dmg) score += 7;
    if (h.permanent_clear) score += (p.wanted > 3 ? 12 : 2);
    if (h.emp_pulse || h.tech_breach) score += 8;
    if (h.field_craft || h.jury_rig) score += 12;     // v0.6.6: 강화 효과 반영
    if (h.repair || h.salvage) score += 8;            // v0.6.6 신규
    if (h.craft_item || h.zone_shield) score += 8;    // v0.6.6 신규
    if (h.shield_gen || h.drone_swarm || h.overclock) score += 5;
    if (h.disable_tl || h.force_tl_down) score += 9;
    if (h.temp_tl) score += 5;
    if (h.transfer_ally || h.fuel) score += 6;        // v0.6.6c 강화
    if (h.leave_fire || h.burn_behind || h.smuggle) score += 6;  // v0.6.6c 강화
    if (h.untrack || h.shortcut || h.ignore_obstacles || h.move_3_nowalls || h.move_any || h.teleport) score += 5;
    if (h.ram_atk) score += 7;                        // v0.6.6c 신규
    if (h.break_veil) score += 3;
    if (h.mimic || h.transfer_attack || h.redirect) score += 8;  // v0.6.6c 신규
    if (h.wipe_log || h.slow_target) score += (p.wanted > 2 ? 10 : 4);
    if (h.protect_ally || h.absorb || h.def_infinite_to_1) score += (p.hp < p.maxHp * 0.6 ? 8 : 4);
    if (h.block_adj || h.enemy_spd || h.def_penalty || h.def_zero) score += 6;
  }

  // LOSS 회피
  if (c.loss) {
    if (p.hp < p.maxHp * 0.3) score -= 15;
    else score += (c.bot?.atk || 0);
  }

  // 승리 근접 시 공격·이동 선호
  if (closeToWin) {
    if (halves.some(h => h.atk || h.move || h.extort)) score += 10;
  }

  return score + Math.random() * 3;
}

function scoreBlocCard(state, pIdx, cid) {
  const c = getCard(cid);
  const p = state.players[pIdx];
  if (!c) return 0;
  if (c.scandalCard) return -1000 + Math.random();  // v6.13.1 (P1-1): 스캔들 = 최하 점수 → 봇 자연 회피
  let score = 10;

  // Prefer own TL or lower
  if (c.tl <= p.tl) score += 15;
  if (c.tl > p.tl) score -= 20;

  // === v0.6.6: Bloc 점수 (보수적 조정 — Bloc 카드 너무 자주 쓰면 Ghost 약화)
  const m = c.main || {};
  if (m.move) score += 8;
  if (m.deploy_op) score += 14;
  if (m.hire_raid) score += 10;
  if (m.stock_buy_any) score += m.stock_buy_any * 3;
  if (m.crash_target || m.destroy_zone) score += 10;
  if (m.zone_income_2x || m.div_2x) score += 12;     // CARBON 핵심
  if (m.zero_income || m.block_resource) score += 7;
  if (m.fortify || m.veil_up || m.fortify_here) score += 6;
  if (m.heal_all) score += 9;                        // HELIX 핵심
  if (m.ghost_extra_card || m.contracts_boost) score += 8;
  if (m.same_round_trade || m.flash_trade) score += 6;
  if (m.algorithm || m.long_contract) score += 12;
  if (m.bond) score += m.bond;
  // v0.8.6: Bloc 능동 액션
  if (m.bounty_post) score += 12;          // 가장 강한 Ghost 견제
  if (m.assassin_contract) score += 14;    // HP 큰 타격 + 평판 가산
  if (m.ghost_track) score += 10;          // 정보 + 수배 + 영향력
  if (m.lock_zone || m.quarantine) score += 7;
  if (m.steal_op) score += 10;
  if (m.revive) score += 5;
  if (m.ghost_move) score += 6;
  if (m.ghost_wanted_all) score += 5;
  if (m.heat && m.heat < 0) score += 5;
  if (m.peek_news || m.scout_all) score += 4;
  if (m.credit) score += m.credit;

  // Resource efficiency
  const costLen = c.main?.cost?.length || 0;
  if (costLen > 0) {
    let payable = true;
    const poolCopy = { ...(p.pool || {}) };
    for (const a of c.main.cost) {
      if (poolCopy[a] > 0) poolCopy[a]--;
      else if (poolCopy.GRID > 0) poolCopy.GRID--;
      else { payable = false; break; }
    }
    if (!payable) score -= 30;
  }

  // Reward aggressive cards for attackers
  if (c.main?.deploy_op || c.main?.heat) score += 10;

  return score + Math.random() * 2;
}

            {history.map((h, i) => (

// v6.28: NEXUS BAR 및 phase-actions primary 진행 로직의 단일 소스.
//   페이즈 3~6은 useEffect 에서 setTimeout 자동 진행이므로 수동 매핑은 0/1/2 만.
//   신규 게임 로직 없음 — 기존 dispatch(SET_PHASE)/confirmPlan 을 그대로 미러링.
function nextAction(state, ctx) {
  const pending = (state.meta.pendingDecisions && state.meta.pendingDecisions.length) || 0;
  if (pending > 0)   // Civ 결정-게이트: 미해소 결정 있으면 진행 차단
    return { label: `결정 필요 ${pending}`, disabled: true, tone: 'block', onClick: null, title: '미해소 결정을 먼저 처리하세요' };
  const ph = state.meta.phase;
  const decl = state.meta.victoryDeclaration;
  const declTone = (decl && decl.idx === ctx.meIdx) ? 'won' : null;   // 종료 선언 유지 = 승리 톤
  if (ph === 0) return { label: '▶ 뉴스로', disabled: false, tone: declTone || 'cyan',
                         onClick: () => ctx.dispatch({ type: 'SET_PHASE', phase: 1 }), title: '시장 → 뉴스' };
  if (ph === 1) return { label: '▶ 거래 끝', disabled: false, tone: declTone || 'cyan',
                         onClick: () => ctx.dispatch({ type: 'SET_PHASE', phase: 2 }), title: '거래 종료 → 계획 단계' };
  if (ph === 2) {
    if (state.meta.awaitingMoveTarget)   // 계획 확정 후 이동 목표 대기 — 지도 클릭 유도
      return { label: '🎯 이동 목표', disabled: true, tone: 'dim', onClick: null, title: '지도에서 이동 목표 칸을 클릭하세요' };
    const ready = ctx.canPlan && ctx.selectedCards.length === ctx.needCards;
    return { label: ready ? '✓ 확정' : `카드 ${ctx.selectedCards.length}/${ctx.needCards}`,
             disabled: !ready, tone: ready ? (declTone || 'yellow') : 'dim',
             onClick: ready ? ctx.confirmPlan : null,
             title: ready ? '계획 확정' : `카드 ${ctx.needCards}장을 선택하세요` };
  }
  return { label: '⏳ 처리 중', disabled: true, tone: 'dim', onClick: null, title: '자동 진행 중' };
}

function GameScreen({ state, dispatch, tutorialEnabled, legacyBanner }) {
  // v1.0.2: 핫시트 모드면 activePlayer 인간 기준으로 'me' 결정
  const isMulti = state.meta.mode === 'multi';
  const meIdx = isMulti ? (state.meta.activePlayer ?? 0) : 0;
  const me = state.players[meIdx];
  const isMyTurn = state.meta.phase === 2;  // Plan phase
  const [passDeviceShown, setPassDeviceShown] = useState(false);  // v1.0.2: pass-device 가림막
  const [selectedCards, setSelectedCards] = useState([]);
  const [selectedHalves, setSelectedHalves] = useState([]);  // 각 선택 카드의 'top'|'bot' (Ghost) / 'main'|'side' (Bloc)
  const [suppressTarget, setSuppressTarget] = useState(null);  // v6.4: 능동 견제 대상 인덱스
  const [suppressType, setSuppressType] = useState('combat');  // v6.4: 견제 토큰 종류
  const [negoModal, setNegoModal] = useState(null);  // v6.44 (A2): 협상 모달 { to } — 인간 제안 대상
  const [soundOn, setSoundOn] = useState(() => (typeof DNSound !== 'undefined' ? DNSound.isOn() : true));  // v6.44 (B2): 사운드 토글 표시 상태

  // v6.44 (B2): 사운드 표시층 훅 — 상태 전이 관찰만(게임 로직 무변경). DNSound 미로드/미언락 시 전부 무해.
  const _sndLogRef = useRef(state.log && state.log.length ? state.log[state.log.length - 1] : null);
  useEffect(() => {
    if (typeof DNSound === 'undefined') return;
    const log = state.log || [];
    if (!log.length) return;
    const top = log[log.length - 1];
    if (top === _sndLogRef.current) return;
    const at = log.indexOf(_sndLogRef.current);
    const fresh = at >= 0 ? log.slice(at + 1) : log.slice(-6);
    _sndLogRef.current = top;
    if (!fresh.length) return;
    const has = (re) => fresh.some(e => e && e.message && re.test(e.message));
    let pick = null;
    if (has(/레이드/) && has(/✅ 성공|성공 ·|명중|타격/)) pick = 'raid_impact';
    else if (has(/ 레이드 \[/)) pick = 'raid_impact';
    else if (has(/거래 성사/)) pick = 'deal';
    else if (has(/비공격 약속/)) pick = 'truce';
    else if (has(/BROKER 중개/)) pick = 'broker';
    else if (has(/주 매수|주 매도|숏 .*진입/)) pick = 'trade_tick';
    if (pick) DNSound.play(pick);
  }, [state.log]);

  const _sndPhaseRef = useRef(state.meta.phase);
  useEffect(() => {
    if (typeof DNSound === 'undefined') return;
    if (state.meta.phase !== _sndPhaseRef.current) {
      _sndPhaseRef.current = state.meta.phase;
      if (!state.meta.gameOver) DNSound.play('phase_shift');
    }
  }, [state.meta.phase]);

  const _sndDeclRef = useRef(!!state.meta.victoryDeclaration);
  useEffect(() => {
    if (typeof DNSound === 'undefined') return;
    const now = !!state.meta.victoryDeclaration;
    if (now && !_sndDeclRef.current) DNSound.play('end_sting');
    _sndDeclRef.current = now;
  }, [state.meta.victoryDeclaration]);

  const _sndOverRef = useRef(state.meta.gameOver);
  useEffect(() => {
    if (typeof DNSound === 'undefined') return;
    if (state.meta.gameOver && !_sndOverRef.current) {
      DNSound.play(state.meta.winner === meIdx ? 'victory' : 'defeat');
    }
    _sndOverRef.current = state.meta.gameOver;
  }, [state.meta.gameOver]);

  // ===== v6.50 [75차]: 이벤트 연출 훅 — 표시층 전용 (v6.44 B2 사운드 훅과 동일 규율) =====
  // 판별 로직 본문은 fx_module.js (dnfx_*). 훅 호출 자체는 여기 고정 배치 → 모듈 미로드 시에도
  // 훅 개수·순서 불변(연출만 빠지고 게임은 정상). dispatch 0 · 리듀서/판정 미호출.
  // 연속 발동 시 애니 재생은 nonce(n)을 React key 로 실어 강제한다.
  const _fxT = useRef([]);
  const fxLater = (fn, ms) => { _fxT.current.push(setTimeout(fn, ms)); };
  useEffect(() => () => { _fxT.current.forEach(clearTimeout); _fxT.current = []; }, []);

  // ① 협상 성사(시안)/거절(마젠타) — 참여 좌석 카드 단발 플래시
  const [negoFx, setNegoFx] = useState({ n: 0, marks: {} });
  const _negoLogRef = useRef(state.log && state.log.length ? state.log[state.log.length - 1] : null);
  useEffect(() => { if (typeof dnfx_nego === 'function') dnfx_nego(state, _negoLogRef, setNegoFx, fxLater);
    // eslint-disable-next-line
  }, [state.log]);

  // ② S06 타이틀(재건왕/청산자) 스팅 — 3초 자동 소멸 풀와이드 배너
  const [titleSting, setTitleSting] = useState(null);
  const _hlLenRef = useRef((state.meta.highlights || []).length);
  const showSting = (key, playerIdx) => {
    if (typeof dnfx_stingPayload !== 'function') return;
    setTitleSting(dnfx_stingPayload(key, playerIdx));
    fxLater(() => setTitleSting(null), 3000);
  };
  useEffect(() => { if (typeof dnfx_sting === 'function') dnfx_sting(state, _hlLenRef, showSting);
    // eslint-disable-next-line
  }, [state.meta.highlights]);
  // 발동률 1%대 희소 이벤트라 렌더 확인 경로가 필요 — 검증용 강제 발동 훅 (표시층만, 상태 무변경)
  useEffect(() => {
    window.__dnFxTitleSting = (k) => { const key = (typeof dnfx_isStingKey === 'function' && dnfx_isStingKey(k)) ? k : 'reconstructor'; showSting(key, 0); return key; };
    return () => { window.__dnFxTitleSting = undefined; };
    // eslint-disable-next-line
  }, []);

  // ③ 레이스 HUD — 추월(순위 상승) 바운스 · 90%+ 위험 존 진입 순간 1회 펄스
  const [raceFx, setRaceFx] = useState({ n: 0, bump: {}, hot: {} });
  const _racePctRef = useRef(null);
  useEffect(() => { if (typeof dnfx_race === 'function') dnfx_race(state, _racePctRef, setRaceFx, fxLater);
    // eslint-disable-next-line
  }, [state.players, state.stocks, state.meta.round]);

  // ④ NEXUS BAR — 크레딧/핵심지표(렙·자산) 변동 시 숫자 틱 컬러 플래시 (+녹/−적)
  const [barFx, setBarFx] = useState({ n: 0, cr: null, key: null });
  const _barPrevRef = useRef(null);
  useEffect(() => { if (typeof dnfx_bar === 'function') dnfx_bar(state, me, meIdx, _barPrevRef, setBarFx, fxLater);
    // eslint-disable-next-line
  }, [me, state.stocks, meIdx]);

  // v1.0.2: 핫시트 — activePlayer 변경되면 카드 선택 리셋 + pass-device 모달 자동 표시
  useEffect(() => {
    if (isMulti) {
      setSelectedCards([]);
      setSelectedHalves([]);
      setPassDeviceShown(true);
    }
    // eslint-disable-next-line
  }, [meIdx, isMulti]);

  // Auto-advance phases
  useEffect(() => {
    if (state.meta.gameOver) return;
    const ph = state.meta.phase;

    // Instantaneous phase handling
    // Phase 1 (시장) — 뉴스 1장 공개 + 봇 거래. 사용자 거래는 "거래 끝" 버튼으로 진행.
    if (ph === 1 && !state.currentNews) {
      setTimeout(() => dispatch({ type: 'DRAW_NEWS' }), 400);
      setTimeout(() => dispatch({ type: 'BOT_MARKET' }), 1200);
      // v6.44 (A2): Phase 1.5 — 봇↔봇 협상 자동 발동(발생 로그만, 과밀 방지). 인간 협상은 시장 패널 버튼.
      setTimeout(() => dispatch({ type: 'NEGOTIATE_PHASE' }), 1600);
      // phase 2로의 자동 이동은 사용자가 시장 패널의 "거래 끝" 버튼을 눌러야 함
    }

    if (ph === 2) {
      // Bots auto-pick
      state.players.forEach((p, i) => {
        if (p.kind === 'bot' && !p.defeated && p.plannedCards.length === 0) {
          const cards = botPickCards(state, i);
          setTimeout(() => dispatch({ type: 'PLAN_CARDS', playerIdx: i, cards }), 300 + i * 200);
        }
      });
    }

    if (ph === 3) {
      setTimeout(() => {
        dispatch({ type: 'SNAPSHOT_TURN' });
        setTimeout(() => dispatch({ type: 'EXECUTE_TURN' }), 150);
        setTimeout(() => dispatch({ type: 'COMPUTE_TURN_DIFF' }), 900);
        setTimeout(() => dispatch({ type: 'SET_PHASE', phase: 4 }), 1400);
      }, 500);
    }

    if (ph === 4) {
      setTimeout(() => {
        dispatch({ type: 'COLLECT_INCOME' });
        setTimeout(() => dispatch({ type: 'SET_PHASE', phase: 5 }), 800);
      }, 400);
    }

    if (ph === 5) {
      setTimeout(() => dispatch({ type: 'RESEARCH_PHASE' }), 300);
      setTimeout(() => dispatch({ type: 'SET_PHASE', phase: 6 }), 900);
    }

    if (ph === 6) {
      setTimeout(() => {
        // Check victory
        const after = checkInstantVictory(state);
        if (after.meta.gameOver) {
          dispatch({ type: 'VICTORY', winner: after.meta.winner, reason: after.meta.winReason });
        } else {
          dispatch({ type: 'NEXT_ROUND' });
        }
      }, 500);
    }
  }, [state.meta.phase, state.meta.round]);

  const canPlan = me.kind === 'human' && state.meta.phase === 2;
  const needCards = 2; // Ghost·Bloc 모두 2장 플레이 (main/side 조합)

  // 선택한 카드+반쪽의 총 이동 스텝 합계
  const computeMoveBudget = (cards, halves) => {
    let total = 0;
    cards.forEach((cid, idx) => {
      const c = getCard(cid);
      if (!c) return;
      const defaultHalf = me.role === 'ghost'
        ? (idx === 0 ? 'top' : 'bot')
        : (idx === 0 ? 'main' : 'side');
      const half = halves[idx] || defaultHalf;
      if (c[half]?.move) total += c[half].move;
    });
    return total;
  };

  const confirmPlan = () => {
    // v6.44 (B2): 카드 플레이 SFX — 인간 계획 확정(표시층 핸들러). 미로드/미언락 무해.
    if (typeof DNSound !== 'undefined') DNSound.play('card_play');
    // v1.0.2: 핫시트 모드면 활성 인간 인덱스로
    dispatch({ type: 'PLAN_CARDS', playerIdx: meIdx, cards: selectedCards, halves: selectedHalves });
    const budget = computeMoveBudget(selectedCards, selectedHalves);
    // v1.0.2: 멀티 모드면 다음 인간 차례로 (모든 인간 plan 끝나면 phase 3)
    if (isMulti) {
      const humansIdx = state.players.map((p, i) => p.kind === 'human' && !p.defeated ? i : -1).filter(x => x >= 0);
      const curPos = humansIdx.indexOf(meIdx);
      if (curPos < humansIdx.length - 1) {
        // 아직 plan 안 한 인간 남음 → NEXT_HUMAN
        setTimeout(() => dispatch({ type: 'NEXT_HUMAN' }), 400);
        return;
      }
      // 마지막 인간 → phase 3
      setTimeout(() => dispatch({ type: 'SET_PHASE', phase: 3 }), 600);
      return;
    }
    // 이동 스텝이 있으면 사용자에게 목표 클릭 요청
    if (budget > 0) {
      dispatch({ type: 'REQUEST_MOVE_TARGET', budget });
    } else {
      setTimeout(() => dispatch({ type: 'SET_PHASE', phase: 3 }), 600);
    }
    setSelectedCards([]);
    setSelectedHalves([]);
  };

  const skipMovePick = () => {
    // 목표 찍지 않고 AI 라우팅에 위임
    dispatch({ type: 'CLEAR_MOVE_TARGET' });
    setTimeout(() => dispatch({ type: 'SET_PHASE', phase: 3 }), 300);
  };

  const pickMoveTarget = (coord) => {
    if (!state.meta.awaitingMoveTarget) return;
    dispatch({ type: 'SET_MOVE_TARGET', coord });
    setTimeout(() => dispatch({ type: 'SET_PHASE', phase: 3 }), 300);
  };

  // 내 현재 위치에서 moveBudget 만큼 BFS로 도달 가능한 셀 집합
  const reachableCells = useMemo(() => {
    if (!state.meta.awaitingMoveTarget) return new Set();
    const from = me.position;
    if (!from) return new Set();
    const budget = state.meta.moveBudget || 0;
    const visited = new Map();
    visited.set(from, 0);
    let frontier = [from];
    for (let step = 0; step < budget; step++) {
      const next = [];
      frontier.forEach(c => {
        coordsAdj(c).forEach(a => {
          if (!visited.has(a) && state.map[a]) {
            visited.set(a, step + 1);
            next.push(a);
          }
        });
      });
      frontier = next;
    }
    visited.delete(from);  // 제자리는 선택 불가
    return new Set(visited.keys());
  }, [state.meta.awaitingMoveTarget, state.meta.moveBudget, me.position]);

  const toggleCard = (cid) => {
    if (!canPlan) return;
    if (selectedCards.includes(cid)) {
      const idx = selectedCards.indexOf(cid);
      setSelectedCards(selectedCards.filter(c => c !== cid));
      setSelectedHalves(selectedHalves.filter((_, i) => i !== idx));
    } else if (selectedCards.length < needCards) {
      const newSel = [...selectedCards, cid];
      // 기본: 첫 카드=top/main, 두 번째 카드=bot/side
      let defaultHalf;
      if (me.role === 'ghost') {
        defaultHalf = selectedCards.length === 0 ? 'top' : 'bot';
      } else {
        defaultHalf = selectedCards.length === 0 ? 'main' : 'side';
      }
      setSelectedCards(newSel);
      setSelectedHalves([...selectedHalves, defaultHalf]);
    }
  };

  // 특정 선택 카드의 반쪽 토글
  const cycleHalf = (idx) => {
    if (!canPlan) return;
    const next = [...selectedHalves];
    if (me.role === 'ghost') {
      next[idx] = next[idx] === 'top' ? 'bot' : 'top';
    } else {
      next[idx] = next[idx] === 'main' ? 'side' : 'main';
    }
    setSelectedHalves(next);
  };

  if (state.meta.gameOver) {
    const iWon = state.meta.winner === 0;
    // 서사 표면화: 승자 role×specific×승리경로(winReason 파싱)로 에필로그 재구성 (표시 전용)
    const winnerP = state.meta.winner != null ? state.players[state.meta.winner] : null;
    const epi = (winnerP && typeof loreEpilogue === 'function' && typeof loreRouteFromReason === 'function')
      ? loreEpilogue(winnerP.role, winnerP.specific, loreRouteFromReason(state.meta.winReason, winnerP.role))
      : null;
    return (
      <div className={`gameover ${iWon ? 'win' : 'lose'}`} style={{ overflow: 'auto', height: '100vh', padding: 24 }}>
        <h1>{iWon ? 'VICTORY' : 'DEFEAT'}</h1>
        <div style={{ color: 'var(--text-dim)', fontSize: 14, letterSpacing: 2, marginBottom: 20, textAlign: 'center' }}>
          {state.meta.winReason || '게임 종료'}
        </div>
        {/* v6.24/6.31/6.33/6.34/6.35/6.36/6.39 (레거시 Stage 1~8): 이번 판에 신규 해금된 챕터(1 레이드·2 M&A·3 계엄·4 스플라이스·5 메시·6 인수·7 넥서스·8 완결)마다 봉투 개봉 배너 */}
        {legacyBanner && (legacyBanner.chapter1Newly || legacyBanner.chapter2Newly || legacyBanner.chapter3Newly || legacyBanner.chapter4Newly || legacyBanner.chapter5Newly || legacyBanner.chapter6Newly || legacyBanner.chapter7Newly || legacyBanner.chapter8Newly) && (() => {
          const total = (typeof legacyTotalChapters === 'function') ? legacyTotalChapters() : 8;
          const newlyNums = [];
          if (legacyBanner.chapter1Newly) newlyNums.push(1);
          if (legacyBanner.chapter2Newly) newlyNums.push(2);
          if (legacyBanner.chapter3Newly) newlyNums.push(3);
          if (legacyBanner.chapter4Newly) newlyNums.push(4);
          if (legacyBanner.chapter5Newly) newlyNums.push(5);
          if (legacyBanner.chapter6Newly) newlyNums.push(6);
          if (legacyBanner.chapter7Newly) newlyNums.push(7);
          if (legacyBanner.chapter8Newly) newlyNums.push(8);
          return newlyNums.map(num => {
            const ch = (typeof legacyChapterMeta === 'function') ? legacyChapterMeta(num) : null;
            if (!ch) return null;
            const isFinale = num === 8;
            return (
              <div key={num} style={{ maxWidth: 640, margin: '0 auto 22px', padding: '18px 22px', background: isFinale ? 'rgba(255, 80, 200, 0.07)' : 'rgba(255, 200, 0, 0.06)', border: `1px solid ${isFinale ? 'var(--magenta)' : 'var(--yellow)'}`, borderLeft: `3px solid ${isFinale ? 'var(--magenta)' : 'var(--yellow)'}`, borderRadius: 4, textAlign: 'left' }}>
                <div style={{ fontFamily: 'Share Tech Mono, monospace', fontSize: 13, letterSpacing: 1, color: isFinale ? 'var(--magenta)' : 'var(--yellow)', fontWeight: 700, marginBottom: 6 }}>
                  {isFinale ? '🏁 캠페인 완주: ' : '📜 레거시 해금: '}Chapter {ch.id} — {ch.title}
                </div>
                <div style={{ fontFamily: 'Share Tech Mono, monospace', fontSize: 10, letterSpacing: 2, color: 'var(--text-dim)', marginBottom: 10 }}>
                  ASH &amp; SIGNAL · 봉투 {ch.envelope} · 해금 {legacyBanner.unlocked.length}/{total}{isFinale ? ' · CAMPAIGN COMPLETE' : ''}
                </div>
                {ch.story.map((ln, li) => (
                  <p key={li} style={{ fontSize: 13, lineHeight: 1.7, color: 'var(--text)', margin: '0 0 6px' }}>{ln}</p>
                ))}
                {isFinale && ch.epilogue && (
                  <p style={{ fontSize: 13, fontStyle: 'italic', color: 'var(--magenta)', margin: '12px 0 2px', lineHeight: 1.7 }}>“{ch.epilogue}”</p>
                )}
              </div>
            );
          });
        })()}
        {epi && (
          <div style={{ maxWidth: 640, margin: '0 auto 22px', padding: '18px 22px', background: 'var(--bg2)', border: '1px solid var(--border)', borderLeft: '3px solid var(--cyan)', borderRadius: 4, textAlign: 'left' }}>
            <div style={{ fontFamily: 'Share Tech Mono, monospace', fontSize: 10, letterSpacing: 3, color: 'var(--cyan)', marginBottom: 10 }}>EPILOGUE — ASHGRID</div>
            {epi.lines.filter(Boolean).map((ln, li) => (
              <p key={li} style={{ fontSize: 14, lineHeight: 1.7, color: 'var(--text)', margin: '0 0 6px' }}>{ln}</p>
            ))}
            <p style={{ fontSize: 14, fontStyle: 'italic', color: 'var(--yellow)', margin: '12px 0 2px', lineHeight: 1.6 }}>“{epi.quote}”</p>
            <p style={{ fontFamily: 'Share Tech Mono, monospace', fontSize: 11, color: 'var(--text-dim)', letterSpacing: 1, margin: 0, textAlign: 'right' }}>— {epi.quoteBy}</p>
          </div>
        )}
        <div className="stats-grid">
          <div className="stat-box">
            <div className="lbl">ROUND</div>
            <div className="val">{state.meta.round}</div>
          </div>
          <div className="stat-box">
            <div className="lbl">{me.role === 'bloc' ? 'ASSET' : 'REP'}</div>
            <div className="val">{me.role === 'bloc' ? assetValue(me, state.stocks, state) : me.resources.rep}</div>
          </div>
          <div className="stat-box">
            <div className="lbl">ACHIEVEMENTS</div>
            <div className="val">{me.achievements.length}</div>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 12, justifyContent: 'center', marginTop: 12, marginBottom: 20, flexWrap: 'wrap' }}>
          <button className="start-btn" style={{ maxWidth: 180 }} onClick={() => dispatch({ type: 'RESET', humanRole: me.role, humanSpecific: me.specific })}>
            🔄 다시
          </button>
          <button className="start-btn" style={{ maxWidth: 180, background: 'var(--bg3)', color: 'var(--yellow)', border: '1px solid var(--yellow)' }} onClick={() => dispatch({ type: 'BACK_TO_MENU' })}>
            📊 메뉴 & 히스토리
          </button>
          <button className="start-btn" style={{ maxWidth: 180, background: 'var(--bg3)', color: 'var(--cyan)', border: '1px solid var(--cyan)' }} onClick={() => copyLogToClipboard(state.log)}>
            📋 로그 복사
          </button>
        </div>

        {/* 게임 끝나도 로그 표시 */}
        <div style={{ maxWidth: 900, margin: '20px auto', background: 'var(--bg2)', border: '1px solid var(--border)', borderRadius: 4, padding: 16, textAlign: 'left' }}>
          <h3 style={{ margin: 0, fontFamily: 'Share Tech Mono, monospace', color: 'var(--cyan)', letterSpacing: 2, fontSize: 14, marginBottom: 12 }}>📜 전체 플레이 로그 ({state.log.length}개 엔트리)</h3>
          <div style={{ maxHeight: '50vh', overflowY: 'auto', fontFamily: 'Share Tech Mono, monospace', fontSize: 11 }}>
            {state.log.map((l, i) => {
              const cls = classifyLog(l.message);
              return (
                <div key={i} className={`log-entry ${cls}`} style={{ padding: '3px 6px', marginBottom: 2, lineHeight: 1.4 }}>
                  <span className="tag" style={{ fontSize: 9, color: 'var(--text-dim)', marginRight: 6 }}>R{l.round}·P{l.phase + 1}</span>
                  {l.message}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="game">
      {/* 🎓 BGA 스타일 가이드 튜토리얼 오버레이 (tutorial_module.js 미로드 시 무해) */}
      <TutorialOverlay state={state} enabled={tutorialEnabled} />
      {/* === v0.5.22: 레이드 풀세트 모달 (타입 선택 → 자원 투자 → 실행) === */}
      {state.meta.pendingRaid && (() => {
        const pr = state.meta.pendingRaid;
        const counterActive = countersBloc(me.specific, pr.bloc);
        const counterBonus = counterActive ? 1 : 0;
        const zoneType = pr.zoneType;
        const zoneAttr = ZONE_TYPES[zoneType]?.attr;
        const zoneLoot = ZONE_LOOT[zoneType] || {};
        const rt = pr.selectedType ? RAID_TYPES[pr.selectedType] : null;
        // v6.11.3 (P0-3): 잠입형(bypass_defense)은 방어 무시 — 표시를 실판정과 일치시킴
        const defense = rt?.bypass_defense ? {} : (BLOC_DEFENSE[pr.bloc] || {});

        // 방어 효과 요약
        let thresholdMod = 0;
        const defenseDesc = [];
        if (defense.threshold_plus) { thresholdMod += defense.threshold_plus; defenseDesc.push(`${pr.bloc} 방어 +${defense.threshold_plus}`); }
        if (defense.detect) defenseDesc.push(`${pr.bloc} 센서 감지 (접근 -2)`);
        if (defense.all_plus) defenseDesc.push(`${pr.bloc} AI 보조 (전 판정 -${defense.all_plus})`);
        // v6.11.3 (P0-1/P0-3): 요새 + 주둔 + 베일 토큰을 threshold에 가산 (실판정과 동일 소스)
        if (!rt?.bypass_defense) {
          const tokBonus = (pr.fortified || 0) + (pr.garrison || 0) + (pr.veil || 0);
          if (tokBonus > 0) { thresholdMod += tokBonus; defenseDesc.push(`방어 토큰 +${tokBonus} (요새${pr.fortified||0}/주둔${pr.garrison||0}/베일${pr.veil||0})`); }
        }

        // 현재 예상 성공률 (크리티컬 실패 5/6만 반영)
        let estPct = 50;
        if (rt) {
          const stat = me.stats[rt.useStat] || 0;
          const poolBonus = pr.invested.poolAttr === zoneAttr ? 2 : (pr.invested.poolAttr ? 1 : 0);
          const execBonus = pr.invested.weapons + counterBonus - (defense.all_plus || 0);
          const effThreshold = rt.threshold + thresholdMod;
          const effStat = stat + execBonus + poolBonus;
          const needed = effThreshold - effStat;
          // d6=1은 자동 실패. 2~6 중 (6-needed+1) 성공. 단 max 5/6
          const baseSucc = Math.max(0, Math.min(6, 7 - needed));
          const rawSucc = Math.min(5, baseSucc);  // 1은 crit fail
          estPct = Math.round(rawSucc / 6 * 100);
        }

        return (
          <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.88)', zIndex: 200, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'auto', padding: 16 }}>
            <div style={{ background: 'var(--bg2)', border: '2px solid var(--magenta)', borderRadius: 6, padding: 20, maxWidth: 720, width: '95%', boxShadow: '0 0 30px rgba(255, 60, 140, 0.3)' }}>
              <div style={{ color: 'var(--magenta)', fontFamily: 'Share Tech Mono, monospace', fontSize: 11, letterSpacing: 2, marginBottom: 4 }}>🗡️ RAID · 3-PHASE</div>
              <h2 style={{ margin: 0, color: 'var(--text)', letterSpacing: 1 }}>
                {pr.coord} · {pr.zoneNm} · <span style={{ color: 'var(--magenta)' }}>{pr.bloc}</span> 거점
              </h2>
              {/* 방어 정보 */}
              {defenseDesc.length > 0 && (
                <div style={{ marginTop: 6, padding: '6px 8px', background: 'rgba(255, 60, 140, 0.08)', border: '1px dashed var(--magenta)', borderRadius: 3, fontSize: 10, color: 'var(--magenta)' }}>
                  🛡 자동 방어: {defenseDesc.join(' · ')}
                </div>
              )}

              {/* Step 1: 타입 선택 */}
              <div style={{ marginTop: 12 }}>
                <div style={{ color: 'var(--cyan)', fontSize: 11, letterSpacing: 2, marginBottom: 6 }}>1️⃣ 레이드 타입 선택</div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8 }}>
                  {Object.entries(RAID_TYPES).map(([key, cfg]) => {
                    const selected = pr.selectedType === key;
                    const stat = me.stats[cfg.useStat];
                    // v0.6.3c: 트랙 LV 잠금 체크
                    const reqT = cfg.requiresTrack;
                    const myLv = reqT ? (me.tracks?.[reqT.key] || 0) : 0;
                    const locked = !!reqT && myLv < reqT.lv;
                    const lockLabel = reqT ? `${TRACK_NAMES[reqT.key].name} LV${reqT.lv}` : null;
                    return (
                      <button key={key}
                        onClick={() => !locked && dispatch({ type: 'RAID_SELECT_TYPE', raidType: key })}
                        disabled={locked}
                        style={{
                          padding: 10,
                          background: locked ? 'rgba(60,60,80,0.4)' : (selected ? 'rgba(60,200,220,0.2)' : 'var(--bg3)'),
                          border: `2px solid ${locked ? 'var(--bg3)' : (selected ? 'var(--cyan)' : 'var(--border)')}`,
                          borderRadius: 4,
                          cursor: locked ? 'not-allowed' : 'pointer',
                          textAlign: 'left',
                          color: locked ? 'var(--text-dim)' : 'var(--text)',
                          fontSize: 11, lineHeight: 1.4,
                          opacity: locked ? 0.55 : 1,
                        }}>
                        <div style={{ fontSize: 16 }}>{locked ? '🔒 ' : ''}{cfg.icon} <strong>{cfg.name}</strong></div>
                        <div style={{ color: 'var(--text-dim)', fontSize: 10, marginTop: 2 }}>{cfg.desc}</div>
                        {reqT && (
                          <div style={{ marginTop: 2, fontSize: 9, color: locked ? 'var(--magenta)' : 'var(--green)' }}>
                            {locked ? `🔒 ${lockLabel} 필요 (LV${myLv}/${reqT.lv})` : `✓ ${lockLabel} 충족`}
                            {cfg.classAffinity && me.specific === cfg.classAffinity && ' · 클래스 특화'}
                          </div>
                        )}
                        <div style={{ marginTop: 4, fontFamily: 'Share Tech Mono, monospace', fontSize: 10 }}>
                          {cfg.useStat.toUpperCase()} {stat} · 목표 {cfg.threshold}
                        </div>
                        <div style={{ marginTop: 3, color: 'var(--green)', fontSize: 10 }}>
                          ✓ 렙+{cfg.success.rep}{cfg.success.data ? ` 📡+${cfg.success.data}` : ''} · 주가-{cfg.success.stockHit}
                        </div>
                        <div style={{ color: 'var(--magenta)', fontSize: 10 }}>
                          ✗ {cfg.failure.hp ? `HP-${cfg.failure.hp} ` : ''}수배+{cfg.failure.wanted}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Step 2: 자원 투자 (타입 선택 후 활성) */}
              {pr.selectedType && (
                <div style={{ marginTop: 14 }}>
                  <div style={{ color: 'var(--yellow)', fontSize: 11, letterSpacing: 2, marginBottom: 6 }}>2️⃣ 자원 투자 (선택)</div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
                    <div style={{ background: 'var(--bg1)', border: '1px solid var(--border)', borderRadius: 3, padding: 8, fontSize: 11 }}>
                      <div style={{ color: 'var(--text-dim)', fontSize: 9 }}>🔩 무기 ({pr.invested.weapons}) · 실행+1/개</div>
                      <div style={{ display: 'flex', gap: 4, marginTop: 4 }}>
                        <button className="pa-btn" style={{ flex: 1, fontSize: 10 }} disabled={(me.resources.weapons||0) <= pr.invested.weapons} onClick={() => dispatch({ type: 'RAID_INVEST', item: 'weapons' })}>+1</button>
                      </div>
                    </div>
                    <div style={{ background: 'var(--bg1)', border: '1px solid var(--border)', borderRadius: 3, padding: 8, fontSize: 11 }}>
                      <div style={{ color: 'var(--text-dim)', fontSize: 9 }}>📡 데이터 ({pr.invested.data}) · 접근+1/개</div>
                      <div style={{ display: 'flex', gap: 4, marginTop: 4 }}>
                        <button className="pa-btn" style={{ flex: 1, fontSize: 10 }} disabled={(me.resources.data||0) <= pr.invested.data} onClick={() => dispatch({ type: 'RAID_INVEST', item: 'data' })}>+1</button>
                      </div>
                    </div>
                    <div style={{ background: 'var(--bg1)', border: '1px solid var(--border)', borderRadius: 3, padding: 8, fontSize: 11 }}>
                      <div style={{ color: 'var(--text-dim)', fontSize: 9 }}>◈ 속성 {pr.invested.poolAttr ? `(${pr.invested.poolAttr})` : ''} · 실행+1{zoneAttr ? ` · ${zoneAttr}매치+2` : ''}</div>
                      <div style={{ display: 'flex', gap: 2, marginTop: 4, flexWrap: 'wrap' }}>
                        {['M','I','V','S','B','A'].map(a => (me.pool?.[a] || 0) > 0 && (
                          <button key={a} className={`attr-tag a-${a}`} style={{ fontSize: 9, padding: '2px 4px', cursor: 'pointer', border: pr.invested.poolAttr === a ? '2px solid var(--cyan)' : '1px solid transparent', opacity: (!pr.invested.poolAttr || pr.invested.poolAttr === a) ? 1 : 0.4 }} onClick={() => dispatch({ type: 'RAID_INVEST', item: pr.invested.poolAttr === a ? 'unset_pool' : 'poolAttr', attr: a })}>{a}</button>
                        ))}
                      </div>
                    </div>
                  </div>
                  <div style={{ fontSize: 10, color: 'var(--text-dim)', marginTop: 4 }}>
                    💡 상대 Bloc의 구역 속성과 매치되면 +2 (일반 +1). 투자는 실행 시 영구 소모.
                  </div>
                </div>
              )}

              {/* Step 3: 예상 결과 + 실행 */}
              {pr.selectedType && rt && (
                <div style={{ marginTop: 14, background: 'var(--bg1)', borderRadius: 4, padding: 10, fontFamily: 'Share Tech Mono, monospace' }}>
                  <div style={{ color: 'var(--cyan)', fontSize: 11, letterSpacing: 2, marginBottom: 6 }}>3️⃣ 예상 판정 (3단계)</div>
                  <div style={{ fontSize: 11, lineHeight: 1.7 }}>
                    <div>🚶 <strong>접근</strong> d6 + 📡{pr.invested.data}{defense.detect ? ' -2 감지' : ''} vs 4</div>
                    <div>⚔️ <strong>실행</strong> d6 + {rt.useStat.toUpperCase()} {me.stats[rt.useStat]}{counterActive ? ' +1상성' : ''} + 🔩{pr.invested.weapons}{pr.invested.poolAttr ? ` +${pr.invested.poolAttr === zoneAttr ? 2 : 1}속성` : ''}{defense.all_plus ? ` -${defense.all_plus} AI` : ''} vs <strong style={{ color: 'var(--magenta)' }}>{rt.threshold + thresholdMod}</strong></div>
                    <div>🏃 <strong>도주</strong> d6 + SPD {me.stats.spd} vs 3</div>
                  </div>
                  <div style={{ marginTop: 8, display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderTop: '1px solid var(--border)', paddingTop: 8 }}>
                    <span style={{ color: 'var(--text-dim)', fontSize: 11 }}>실행 성공률</span>
                    <strong style={{ color: estPct >= 66 ? 'var(--green)' : (estPct >= 33 ? 'var(--yellow)' : 'var(--magenta)'), fontSize: 22 }}>~{estPct}%</strong>
                  </div>
                  {Object.keys(zoneLoot).length > 0 && (
                    <div style={{ marginTop: 6, padding: 6, background: 'rgba(60,220,100,0.08)', borderRadius: 3, fontSize: 10, color: 'var(--green)' }}>
                      🎁 구역 추가 전리품: {zoneLoot.label}
                    </div>
                  )}
                </div>
              )}

              {/* 버튼 */}
              <div style={{ display: 'flex', gap: 10, marginTop: 14 }}>
                <button className="pa-btn primary" disabled={!pr.selectedType} style={{ flex: 2, padding: '14px', fontSize: 13, background: pr.selectedType ? 'var(--magenta)' : 'var(--bg3)', color: pr.selectedType ? 'var(--bg1)' : 'var(--text-dim)', border: `1px solid ${pr.selectedType ? 'var(--magenta)' : 'var(--border)'}` }} onClick={() => dispatch({ type: 'RAID_EXECUTE' })}>
                  {pr.selectedType ? `${RAID_TYPES[pr.selectedType].icon} 레이드 실행 (~${estPct}%)` : '타입을 먼저 선택'}
                </button>
                <button className="pa-btn" style={{ flex: 1, padding: '14px', fontSize: 13 }} onClick={() => dispatch({ type: 'RESOLVE_RAID_NO' })}>
                  🕶 물러나기
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* === Ghost 결투 결정 모달 === */}
      {state.meta.pendingGhostDuel && (() => {
        const d = state.meta.pendingGhostDuel;
        const rival = state.players[d.defGhostIdx];
        const myClass = me.specific;
        const counterActive = countersGhost(myClass, rival.specific);
        const counterBonus = counterActive ? 2 : 0;
        // 승리 확률: (atk+counter) vs def
        const diff = d.atkStat + counterBonus - d.defStat;
        const winPct = Math.max(15, Math.min(85, 50 + diff * 10));
        return (
          <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.85)', zIndex: 200, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{ background: 'var(--bg2)', border: '2px solid var(--cyan)', borderRadius: 6, padding: 24, maxWidth: 560, width: '90%', boxShadow: '0 0 30px rgba(60,200,220,0.3)' }}>
              <div style={{ color: 'var(--cyan)', fontFamily: 'Share Tech Mono, monospace', fontSize: 11, letterSpacing: 2, marginBottom: 6 }}>⚔️ GHOST DUEL</div>
              <h2 style={{ margin: 0, color: 'var(--text)' }}>
                {d.coord} · {d.zoneNm} · <span style={{ color: 'var(--cyan)' }}>P{d.defGhostIdx} {rival.specific}</span>와 조우
              </h2>
              <div style={{ fontSize: 13, color: 'var(--text-dim)', marginTop: 6, marginBottom: 16 }}>
                같은 구역에 라이벌 Ghost가 있다. 선제 타격할 것인가?
              </div>
              <div style={{ background: 'var(--bg1)', borderRadius: 4, padding: 12, marginBottom: 16, fontFamily: 'Share Tech Mono, monospace', fontSize: 12 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                  <span style={{ color: 'var(--text-dim)' }}>내 ATK {d.atkStat}{counterActive ? <span style={{color:'var(--green)'}}> +2 상성</span> : ''} vs 상대 DEF {d.defStat}</span>
                </div>
                {counterActive && <div style={{ color: 'var(--green)', fontSize: 10, marginBottom: 6 }}>🎯 {myClass} → {rival.specific} 상성 유리</div>}
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                  <span style={{ color: 'var(--text-dim)' }}>개략 승률</span>
                  <strong style={{ color: winPct >= 60 ? 'var(--green)' : (winPct >= 40 ? 'var(--yellow)' : 'var(--magenta)'), fontSize: 18 }}>~{winPct}%</strong>
                </div>
                <div style={{ fontSize: 10, color: 'var(--text-dim)' }}>양측 d6 굴림. 2점 이상 차이로 승리·패배, 그 외 무승부</div>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 16 }}>
                <div style={{ background: 'rgba(60,220,100,0.1)', border: '1px solid var(--green)', borderRadius: 4, padding: 10 }}>
                  <div style={{ color: 'var(--green)', fontSize: 11, fontWeight: 700, marginBottom: 6 }}>✓ 승리 시</div>
                  <div style={{ fontSize: 11, lineHeight: 1.6 }}>★ 렙 +2<br/>₵ +최대 3 (상대 자산 탈취)<br/>🗡 상대 HP -2</div>
                </div>
                <div style={{ background: 'rgba(255,60,140,0.1)', border: '1px solid var(--magenta)', borderRadius: 4, padding: 10 }}>
                  <div style={{ color: 'var(--magenta)', fontSize: 11, fontWeight: 700, marginBottom: 6 }}>✗ 반격당함</div>
                  <div style={{ fontSize: 11, lineHeight: 1.6 }}>❤️ HP -2 ({me.hp} → {me.hp - 2})<br/>무승부 시: 피해 없음</div>
                </div>
              </div>
              <div style={{ display: 'flex', gap: 10 }}>
                <button className="pa-btn primary" style={{ flex: 1, padding: '14px', fontSize: 13, background: 'var(--cyan)', color: 'var(--bg1)', border: '1px solid var(--cyan)' }} onClick={() => dispatch({ type: 'RESOLVE_DUEL_YES' })}>
                  ⚔️ 선제 공격 (~{winPct}%)
                </button>
                <button className="pa-btn" style={{ flex: 1, padding: '14px', fontSize: 13 }} onClick={() => dispatch({ type: 'RESOLVE_DUEL_NO' })}>
                  🕶 회피 (공존)
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* === 타겟 당함 알림 === */}
      {state.meta.lastTargetedBy && (() => {
        const t = state.meta.lastTargetedBy;
        const atk = state.players[t.attacker];
        return (
          <div style={{ position: 'fixed', top: 70, right: 16, zIndex: 150, background: 'var(--bg2)', border: '2px solid var(--magenta)', borderRadius: 6, padding: 12, maxWidth: 280, boxShadow: '0 0 20px rgba(255,60,140,0.4)', animation: 'pulse 1.5s infinite' }}>
            <div style={{ color: 'var(--magenta)', fontSize: 10, letterSpacing: 2, fontWeight: 700 }}>🔴 INCOMING</div>
            <div style={{ fontSize: 12, marginTop: 3, fontWeight: 700 }}>
              P{t.attacker} {atk?.specific}가 당신을 공격
            </div>
            <div style={{ fontSize: 10, color: 'var(--text-dim)', marginTop: 2 }}>{t.detail}</div>
            <button style={{ marginTop: 6, fontSize: 10, padding: '3px 8px', background: 'transparent', color: 'var(--text-dim)', border: '1px solid var(--border)', borderRadius: 2, cursor: 'pointer' }} onClick={() => dispatch({ type: 'DISMISS_TARGETED' })}>확인</button>
          </div>
        );
      })()}

      {/* === 구역 첫 방문 보너스 모달 === */}
      {/* v6.0: 결정 모달 골격 — pendingDecisions 큐 표시 (마일스톤/어워드/결정) */}
      {state.meta.pendingDecisions && state.meta.pendingDecisions.length > 0 && (() => {
        const dec = state.meta.pendingDecisions[0];
        const kindLabel = dec.type === 'milestone' ? '마일스톤' : dec.type === 'award' ? '어워드' : dec.type === 'raid_reward' ? '레이드 보상' : dec.type === 'bloc_invest' ? 'Bloc 투자' : dec.type === 'mna_defense' ? '🏴 M&A 방어' : '결정';
        return (
          <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.82)', zIndex: 210, display: 'flex', alignItems: 'center', justifyContent: 'center' }} onClick={(e) => e.stopPropagation()}>
            <div style={{ background: 'var(--bg2)', border: '2px solid var(--cyan)', borderRadius: 6, padding: 24, maxWidth: 600, width: '90%', boxShadow: '0 0 30px rgba(60,235,255,0.3)' }}>
              <div style={{ color: 'var(--cyan)', fontFamily: 'Share Tech Mono, monospace', fontSize: 11, letterSpacing: 2, marginBottom: 6 }}>🧭 DECISION · {kindLabel}</div>
              <h2 style={{ margin: 0, color: 'var(--text)', fontFamily: 'Rajdhani, sans-serif', letterSpacing: 1, fontSize: 18 }}>{dec.prompt}</h2>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 16 }}>
                {dec.options.filter(o => o.enabled !== false || o.keepDisabled).map((opt, i) => {
                  const isDisabled = opt.enabled === false; // keepDisabled 옵션은 표시하되 비활성
                  return (
                  <button key={opt.id || i}
                    className="pa-btn"
                    disabled={isDisabled}
                    style={{ padding: '14px 12px', fontSize: 13, textAlign: 'left', borderColor: isDisabled ? 'var(--border)' : 'var(--cyan)', color: isDisabled ? 'var(--text-dim)' : 'var(--text)', lineHeight: 1.4, whiteSpace: 'normal', opacity: isDisabled ? 0.45 : 1, cursor: isDisabled ? 'not-allowed' : 'pointer' }}
                    onClick={isDisabled ? undefined : () => dispatch({ type: 'RESOLVE_DECISION', decisionId: dec.id, choice: opt.id })}>
                    {opt.label}{isDisabled ? ' (자원 부족)' : ''}
                  </button>
                  );
                })}
              </div>
              {dec.context && dec.context.otherClaimers && dec.context.otherClaimers.length > 0 && (
                <div style={{ fontSize: 11, color: 'var(--yellow)', marginTop: 12 }}>⚠ 경쟁자도 조건 달성: {dec.context.otherClaimers.join(', ')}</div>
              )}
            </div>
          </div>
        );
      })()}

      {state.meta.zoneBonusPending && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.82)', zIndex: 200, display: 'flex', alignItems: 'center', justifyContent: 'center' }} onClick={(e) => e.stopPropagation()}>
          <div style={{ background: 'var(--bg2)', border: '2px solid var(--yellow)', borderRadius: 6, padding: 24, maxWidth: 600, width: '90%', boxShadow: '0 0 30px rgba(255, 235, 60, 0.3)' }}>
            <div style={{ color: 'var(--yellow)', fontFamily: 'Share Tech Mono, monospace', fontSize: 11, letterSpacing: 2, marginBottom: 6 }}>🌟 FIRST VISIT DRAFT</div>
            <h2 style={{ margin: 0, color: 'var(--text)', fontFamily: 'Rajdhani, sans-serif', letterSpacing: 1 }}>
              {state.meta.zoneBonusPending.coord} · {ZONE_TYPES[state.meta.zoneBonusPending.zone]?.name}
            </h2>
            <div style={{ fontSize: 12, color: 'var(--text-dim)', marginTop: 4, marginBottom: 16 }}>
              이 구역을 처음 밟았다 — 세 가지 기회 중 하나를 선택하라
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: `repeat(${state.meta.zoneBonusPending.options.length}, 1fr)`, gap: 10 }}>
              {state.meta.zoneBonusPending.options.map((opt, i) => (
                <button key={i}
                  className="pa-btn"
                  style={{ padding: '18px 12px', fontSize: 13, textAlign: 'center', borderColor: 'var(--yellow)', color: 'var(--text)', lineHeight: 1.4, whiteSpace: 'normal', minHeight: 80 }}
                  onClick={() => dispatch({ type: 'APPLY_ZONE_BONUS', opt })}>
                  {opt.label}
                </button>
              ))}
            </div>
            <div style={{ textAlign: 'center', marginTop: 12 }}>
              <button className="pa-btn" style={{ fontSize: 10, color: 'var(--text-dim)' }} onClick={() => dispatch({ type: 'SKIP_ZONE_BONUS' })}>건너뛰기</button>
            </div>
          </div>
        </div>
      )}

      {/* v0.6.3b: 트랙 투자 모달 (R&D 페이즈 자유 레벨업) */}
      {state.meta.pendingTrackInvest && state.players[0] && !state.players[0].defeated && (() => {
        const p0 = state.players[0];
        const infamy = getInfamy(p0);
        return (
          <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.82)', zIndex: 200, display: 'flex', alignItems: 'center', justifyContent: 'center' }} onClick={(e) => e.stopPropagation()}>
            <div style={{ background: 'var(--bg2)', border: '2px solid var(--magenta)', borderRadius: 6, padding: 24, maxWidth: 640, width: '90%', boxShadow: '0 0 30px rgba(255,60,140,0.3)' }}>
              <div style={{ color: 'var(--magenta)', fontFamily: 'Share Tech Mono, monospace', fontSize: 11, letterSpacing: 2, marginBottom: 6 }}>☠ STREET CRED · 트랙 1개 무료 레벨업</div>
              <h2 style={{ margin: 0, color: 'var(--text)', fontFamily: 'Rajdhani, sans-serif', letterSpacing: 1 }}>
                {STREETCRED_LABEL} {infamy} · {p0.specific}
              </h2>
              <div style={{ fontSize: 12, color: 'var(--text-dim)', marginTop: 4, marginBottom: 14 }}>
                R&D 페이즈 종료 — 트랙 하나를 골라 레벨을 올려라. 거리명성이 높을수록 Ashgrid의 더 많은 행동이 해금된다.
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 8 }}>
                {TRACK_KEYS.map(k => {
                  const tn = TRACK_NAMES[k];
                  const lv = p0.tracks?.[k] || 0;
                  const maxed = lv >= TRACK_MAX;
                  return (
                    <button key={k}
                      className="pa-btn"
                      disabled={maxed}
                      style={{ padding: '14px 8px', fontSize: 11, textAlign: 'center', borderColor: maxed ? 'var(--bg3)' : 'var(--magenta)', color: maxed ? 'var(--text-dim)' : 'var(--text)', lineHeight: 1.4, whiteSpace: 'normal', minHeight: 92, opacity: maxed ? 0.4 : 1 }}
                      onClick={() => dispatch({ type: 'TRACK_INVEST', playerIdx: 0, key: k, free: true })}>
                      <div style={{ fontSize: 18 }}>{tn.icon}</div>
                      <div style={{ fontWeight: 700, marginTop: 2 }}>{tn.name}</div>
                      <div style={{ fontSize: 9, color: 'var(--text-dim)', marginTop: 2 }}>{tn.desc}</div>
                      <div style={{ marginTop: 4, fontSize: 10, color: maxed ? 'var(--yellow)' : 'var(--cyan)' }}>{maxed ? 'MAX' : `LV ${lv} → ${lv + 1}`}</div>
                    </button>
                  );
                })}
              </div>
              <div style={{ textAlign: 'center', marginTop: 12 }}>

        {(() => {
          const total = CAPTIVE_COUNT;
          const hasCaptiveGame = scenarioRule(state, 'captiveStart', 0) > 0;

              style={{ background: 'var(--yellow)', color: 'var(--bg)', padding: '0 8px', fontFamily: 'Share Tech Mono, monospace', fontSize: 10, fontWeight: 700, borderRadius: 3 }}>

        {/* v0.9.3: NEXUS 룰 표시 */}

        {/* v6.44 (B2): 사운드 마스터 토글 (🔊/🔇 · localStorage dn_sim_sound) */}

        >

        </button>
      </div>

      {/* v6.12 P0-1: 종료 선언 배너 (전 좌석 공개) */}
      {state.meta.victoryDeclaration && (() => {
        const d = state.meta.victoryDeclaration;
        const dp = state.players[d.idx];
        const isMe = d.idx === meIdx;
        return (
          <div className={`decl-banner ${isMe ? 'me' : 'enemy'}`} style={{ position: 'fixed', top: 50, left: 0, right: 0, zIndex: 400, padding: '6px 14px', background: isMe ? 'linear-gradient(90deg, rgba(20,40,28,0.97), rgba(20,40,28,0.92))' : 'linear-gradient(90deg, rgba(45,15,30,0.97), rgba(45,15,30,0.92))', borderBottom: `2px solid ${isMe ? 'var(--green)' : 'var(--magenta)'}`, fontFamily: 'Share Tech Mono, monospace', fontSize: 12, fontWeight: 700, letterSpacing: 1, color: isMe ? 'var(--green)' : 'var(--magenta)', display: 'flex', alignItems: 'center', gap: 10 }}>

      {/* v6.50 [75차] ②: S06 타이틀 스팅 — 종료 선언 배너 패턴 재사용, 3초 자동 소멸 (fx_module.js 참조) */}
      {titleSting && (
