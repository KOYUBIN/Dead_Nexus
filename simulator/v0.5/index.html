<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06060e">
<meta name="description" content="DEAD NEXUS 시뮬레이터 — 애시그리드 2091, Bloc과 Ghost의 인수·억압·레이드 전략 웹 시뮬레이터 (봇 밸런스/솔로 플레이).">
<title>DEAD NEXUS · Simulator v0.5</title>
<!-- 외부 폰트 의존 제거 (CDN 0 · file:// 호환) — 로컬 Share Tech Mono/Rajdhani가 있으면 쓰고, 없으면 시스템 폰트로 폴백. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2032%2032'%3E%3Crect%20width%3D'32'%20height%3D'32'%20fill%3D'%2306060e'%2F%3E%3Ccircle%20cx%3D'16'%20cy%3D'16'%20r%3D'9'%20fill%3D'none'%20stroke%3D'%2300e5ff'%20stroke-width%3D'1.5'%2F%3E%3Ccircle%20cx%3D'16'%20cy%3D'16'%20r%3D'3'%20fill%3D'%2300e5ff'%2F%3E%3C%2Fsvg%3E">
<style>
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; background: #06060e; color: #e0e0e0; }
  body { font-family: 'Rajdhani', system-ui, sans-serif; overflow-x: hidden; }
  .mono { font-family: 'Share Tech Mono', monospace; }
  button { font-family: inherit; cursor: pointer; }

  /* ---- Color palette ---- */
  :root {
    --bg: #06060e;
    --bg2: #0f0f1a;
    --bg3: #1a1a2e;
    --border: #2d2d4f;
    --cyan: #00e5ff;
    --magenta: #ff003c;
    --yellow: #ffd700;
    --green: #b4ff39;
    --orange: #ff9100;
    --purple: #a855f7;
    --text-dim: #9090a8;
    --text: #e0e0e0;
    --botbar-h: 46px;   /* v6.28: 하단 NEXUS BAR 높이 (모바일 56px 오버라이드) */
  }

  /* ---- Boot screen (v6.37: 부트 스플래시 + 자산 로드 실패 처리) ---- */
  #boot {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #06060e; color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 4px; font-size: 14px;
    text-align: center;
  }
  #boot .boot-title { font-size: 22px; letter-spacing: 8px; color: var(--cyan);
    animation: bootPulse 1.15s ease-in-out infinite; }
  #boot .boot-dots { display: inline-block; width: 1.4em; text-align: left;
    animation: bootDots 1.2s steps(4, end) infinite; overflow: hidden; vertical-align: bottom; }
  #boot .boot-sub { margin-top: 12px; font-size: 11px; letter-spacing: 3px; color: var(--text-dim); }
  #boot .boot-bar { margin: 20px auto 0; width: 200px; height: 2px; background: var(--border);
    overflow: hidden; position: relative; }
  #boot .boot-bar > span { position: absolute; top: 0; height: 100%; width: 40%;
    background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: bootScan 1.1s ease-in-out infinite; }
  @keyframes bootPulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes bootScan  { 0% { left: -40%; } 100% { left: 100%; } }
  @keyframes bootDots  { 0% { width: 0; } 100% { width: 1.4em; } }
  /* 자산 로드 실패 상태 (조용한 실패 금지 — v6.11 교훈) */
  #boot.boot-error { color: var(--magenta); }
  #boot .boot-fail-title { font-size: 17px; letter-spacing: 3px; color: var(--magenta); }
  #boot .boot-asset { margin-top: 12px; font-size: 12px; letter-spacing: 1px; color: var(--yellow); word-break: break-all; }
  #boot .boot-hint { margin-top: 6px; font-size: 10px; letter-spacing: 1px; color: var(--text-dim); }
  #boot .boot-retry { margin-top: 18px; background: transparent; border: 1px solid var(--cyan);
    color: var(--cyan); padding: 9px 24px; font-family: 'Share Tech Mono', monospace;
    letter-spacing: 3px; font-size: 13px; border-radius: 3px; transition: background .15s, color .15s; }
  #boot .boot-retry:hover { background: var(--cyan); color: #06060e; }
  @media (prefers-reduced-motion: reduce) {
    #boot .boot-title, #boot .boot-bar > span, #boot .boot-dots { animation: none; }
    #boot .boot-dots { width: 1.4em; }
  }

  /* ---- Setup screen ---- */
  .setup {
    max-width: 900px; margin: 0 auto; padding: 40px 24px;
  }
  .setup h1 {
    font-family: 'Share Tech Mono', monospace;
    font-size: 42px; letter-spacing: 4px; margin: 0;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .setup .tagline {
    color: var(--text-dim); letter-spacing: 3px; font-size: 11px;
    margin-top: 4px; font-family: 'Share Tech Mono', monospace;
  }
  .setup h2 {
    font-family: 'Share Tech Mono', monospace;
    color: var(--cyan); letter-spacing: 2px;
    font-size: 16px; margin: 32px 0 12px;
    border-bottom: 1px solid var(--border); padding-bottom: 6px;
  }
  .role-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .role-card {
    border: 2px solid var(--border); background: var(--bg2);
    padding: 16px; border-radius: 4px; cursor: pointer;
    transition: all 0.2s;
  }
  .role-card.selected { border-color: var(--cyan); background: var(--bg3); box-shadow: 0 0 20px rgba(0,229,255,0.2); }
  .role-card h3 { margin: 0 0 6px; font-family: 'Share Tech Mono', monospace; color: var(--cyan); }
  .role-card p { margin: 0; color: var(--text-dim); font-size: 13px; }

  .class-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .class-card {
    border: 1.5px solid var(--border); background: var(--bg2);
    padding: 12px; border-radius: 3px; cursor: pointer; transition: all 0.15s;
  }
  .class-card.selected { border-color: var(--cyan); background: rgba(0,229,255,0.1); }
  .class-card .cname { font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: 700; color: var(--cyan); letter-spacing: 1px; }
  .class-card .cstats { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 6px; }

  .start-btn {
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    border: none; color: #000; font-weight: 700;
    font-family: 'Share Tech Mono', monospace; letter-spacing: 3px;
    padding: 14px 36px; font-size: 16px; border-radius: 3px;
    margin-top: 32px; width: 100%;
  }
  .start-btn:hover { filter: brightness(1.15); box-shadow: 0 0 30px rgba(0,229,255,0.4); }

  /* ---- Game layout ---- */
  .game {
    display: grid;
    grid-template-columns: 300px 1fr 280px;
    grid-template-rows: 50px 1fr;
    /* v6.28: 하단 고정 NEXUS BAR(46px) 만큼 그리드 높이 축소 → 콘텐츠 가림 0 (z-index 트릭 불필요) */
    height: calc(100vh - var(--botbar-h)); max-height: calc(100vh - var(--botbar-h));
    grid-template-areas:
      "top top top"
      "left center right";
  }
  .top-bar {
    grid-area: top;
    background: var(--bg2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 24px;
    font-family: 'Share Tech Mono', monospace; font-size: 12px;
  }
  .top-bar .home-link {
    color: var(--text-dim); text-decoration: none; font-size: 15px; line-height: 1;
    padding: 1px 6px; border: 1px solid var(--border); border-radius: 3px;
  }
  .top-bar .home-link:hover { color: var(--cyan); border-color: var(--cyan); }
  .top-bar .title {
    font-weight: 700; letter-spacing: 3px; color: var(--cyan);
  }
  .top-bar .phases {
    display: flex; gap: 4px; flex: 1; justify-content: center;
  }
  .phase-chip {
    padding: 2px 10px; border: 1px solid var(--border); border-radius: 2px;
    font-size: 10px; letter-spacing: 1px; color: var(--text-dim);
  }
  .phase-chip.active { background: var(--cyan); color: #000; border-color: var(--cyan); font-weight: 700; }
  .phase-chip.done { color: #555; border-color: #333; }
  .top-bar .round { color: var(--yellow); }
  .top-bar .heat { color: var(--magenta); }

  /* Left panel — player state */
  .left-panel {
    grid-area: left; background: var(--bg2); border-right: 1px solid var(--border);
    padding: 12px; overflow-y: auto;
  }
  .player-card {
    border: 1.5px solid var(--border); background: var(--bg3);
    padding: 10px; border-radius: 3px; margin-bottom: 10px;
  }
  .player-card.me { border-color: var(--cyan); }
  .player-card.turn { box-shadow: 0 0 15px rgba(0,229,255,0.3); }
  .player-card .pheader {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    margin-bottom: 6px;
  }
  .player-card .pname { color: var(--cyan); letter-spacing: 1px; }
  .player-card .php {
    color: var(--magenta); font-weight: 700;
  }
  .player-card .pstats {
    font-family: 'Share Tech Mono', monospace; font-size: 10px;
    color: var(--text-dim); display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px;
  }
  .player-card .pstats strong { color: var(--text); }

  /* v6.26 Race HUD / Market ticker / Threat strip (docs/22 §계기판) */
  .hud-wrap.decl { margin-top: 34px; }   /* 종료 선언 배너(fixed, top:50) 겹침 회피 */
  .race-hud {
    flex: 0 0 auto; margin-bottom: 10px;
    background: linear-gradient(180deg, rgba(10,10,22,0.96), rgba(15,15,26,0.92));
    border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px 12px;
  }
  .race-hud .rh-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 2px;
    color: var(--text-dim); margin-bottom: 14px; flex-wrap: wrap;
  }
  .race-hud .rh-head .rh-lead { color: var(--yellow); letter-spacing: 1px; }
  .race-track {
    position: relative; height: 34px; border-radius: 3px;
    border: 1px solid var(--border);
    background: linear-gradient(90deg, rgba(0,229,255,0.05), rgba(255,215,0,0.04) 60%, rgba(255,0,60,0.06));
  }
  .race-track .rt-danger {
    position: absolute; top: 0; bottom: 0; pointer-events: none; border-left: 1px dashed var(--magenta);
    background: repeating-linear-gradient(45deg, rgba(255,0,60,0.14) 0 6px, rgba(255,0,60,0.03) 6px 12px);
  }
  .race-track .rt-finish { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--green); box-shadow: 0 0 6px var(--green); }
  .race-marker {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; cursor: pointer;
    transition: left 0.45s ease; z-index: 2;
  }
  .race-marker .rm-dot {
    width: 19px; height: 19px; border-radius: 50%; border: 2px solid;
    display: flex; align-items: center; justify-content: center; font-size: 10px; background: var(--bg1);
  }
  .race-marker.me { z-index: 6; }
  .race-marker.me .rm-dot { width: 24px; height: 24px; font-size: 13px; box-shadow: 0 0 10px currentColor; }
  .race-marker .rm-cap {
    font-family: 'Share Tech Mono', monospace; font-size: 8px; margin-top: 1px;
    white-space: nowrap; color: var(--text-dim); line-height: 1.1; text-align: center;
  }
  .race-marker .rm-cap .rm-pct { color: var(--text); font-weight: 700; }
  .race-marker .rm-up { color: var(--green); } .race-marker .rm-dn { color: var(--magenta); }
  @keyframes rhBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
  .race-marker .rm-decl { animation: rhBlink 0.9s infinite; font-size: 12px; margin-bottom: 1px; }
  .mkt-ticker, .threat-strip, .round-brief {
    flex: 0 0 auto; font-family: 'Share Tech Mono', monospace; font-size: 11px;
    border-radius: 3px; padding: 5px 10px; margin-bottom: 8px;
  }
  .mkt-ticker { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: #000; border: 1px solid var(--border); }
  .mkt-ticker .mt-label { color: var(--text-dim); font-size: 9px; letter-spacing: 1px; }
  .mkt-ticker .mt-item { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; }
  .mkt-ticker .mt-item b { color: var(--text); }
  .mkt-ticker .mt-up { color: var(--green); animation: tickUp .7s ease-out; } .mkt-ticker .mt-down { color: var(--magenta); animation: tickDown .7s ease-out; } .mkt-ticker .mt-flat { color: var(--text-dim); }
  /* v6.38 B2: 주가 변동 틱커 상승/하락 컬러 플래시 (배경/텍스트섀도 페이드 — 변동 라운드에 1회) */
  @keyframes tickUp   { 0% { background: rgba(180,255,57,.32); text-shadow: 0 0 8px var(--green); } 100% { background: transparent; text-shadow: none; } }
  @keyframes tickDown { 0% { background: rgba(255,0,60,.32); text-shadow: 0 0 8px var(--magenta); } 100% { background: transparent; text-shadow: none; } }
  .mkt-ticker .mt-short { margin-left: auto; color: var(--yellow); font-weight: 700; }
  .threat-strip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: rgba(45,15,30,0.55); border: 1px solid var(--magenta); color: var(--magenta); }
  .threat-strip .ts-lbl { font-size: 9px; letter-spacing: 1px; color: var(--magenta); opacity: 0.8; }
  .threat-strip .ts-chip { padding: 1px 7px; border: 1px solid var(--magenta); border-radius: 2px; color: var(--text); }
  .threat-strip .ts-hint { color: var(--yellow); border-color: var(--yellow); font-weight: 700; }
  .round-brief { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--bg2); border: 1px solid var(--border); color: var(--text-dim); font-size: 10px; }
  .round-brief .rb-lbl { color: var(--cyan); font-size: 9px; letter-spacing: 1px; }
  .round-brief .rb-item b { color: var(--text); }

  /* Center - map */
  .center-panel {
    grid-area: center; display: flex; flex-direction: column; padding: 12px;
    overflow: auto;
  }
  .map-wrap { display: flex; gap: 16px; }
  .map-board {
    display: grid;
    grid-template-columns: 28px repeat(5, 1fr);
    grid-template-rows: 28px repeat(5, 1fr);
    gap: 2px;
    background: #000;
    padding: 2px;
    border: 2px solid var(--border);
    max-width: 520px;
    aspect-ratio: 5.5/5.5;
  }
  /* v0.8.2 / v1.0.5-fix: 11×11 정식 — 손패가 가려지지 않도록 max 480px로 축소 */
  .map-board.size-11 {
    grid-template-columns: 18px repeat(11, 1fr);
    grid-template-rows: 18px repeat(11, 1fr);
    max-width: 480px;
    max-height: 480px;
    aspect-ratio: 1/1;
    margin: 0 auto;
  }
  .map-board.size-11 .map-cell { font-size: 7px; padding: 1px; }
  .map-board.size-11 .map-cell .coord { font-size: 6px; }
  .map-board.size-11 .map-cell .ztype { font-size: 6px; }
  .map-board.size-11 .map-cell .owner { font-size: 6px; padding: 0 1px; }
  .map-board.size-11 .map-cell .pm { font-size: 6px; }
  .map-cell {
    background: var(--bg3); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    font-size: 10px; padding: 4px;
    position: relative; cursor: pointer;
    /* v6.38 B2: transform/opacity/box-shadow만 트랜지션 (layout thrash 회피, was: all) */
    transition: filter .12s ease, box-shadow .16s ease, transform .12s ease;
    font-family: 'Share Tech Mono', monospace;
  }
  .map-cell:hover { filter: brightness(1.28) saturate(1.12); outline: 1px solid var(--cyan); z-index: 3; }
  /* v6.45 a11y: 키보드 포커스 가시화 (WCAG 2.4.7) — 상호작용 셀만 role=button */
  .map-cell[role="button"]:focus-visible { outline: 3px solid var(--cyan); outline-offset: -2px; z-index: 4; }
  /* 라벨/코너(빈 셀) 제외 — 실제 구역만 네온 글로우 */
  .map-cell:not(.label):not(.corner):hover { box-shadow: inset 0 0 10px rgba(0,229,255,.22), 0 0 9px rgba(0,229,255,.28); }
  /* v6.38 B2: 소유 블록 색 링 (--own 은 셀 인라인 스타일에서 주입) */
  .map-cell.owned::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: 2px; z-index: 3;
    border: 2px solid var(--own, var(--cyan));
    box-shadow: inset 0 0 7px -1px var(--own, var(--cyan));
  }
  /* v6.38 B2: 레이드 가능 셀 펄스 (opacity만 — 저비용) */
  .map-cell.raidable::after {
    content: ''; position: absolute; inset: -1px; pointer-events: none; border-radius: 3px; z-index: 3;
    border: 1.5px solid var(--magenta);
    animation: raidPulse 1s ease-in-out infinite;
  }
  @keyframes raidPulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  /* v6.38 B2: 레이드 피격 셀 플래시 (내 구역 상실 시) */
  .map-cell .cell-flash {
    position: absolute; inset: 0; pointer-events: none; border-radius: 2px; z-index: 4;
    background: rgba(255,0,60,.55); animation: raidFlash 1.15s ease-out forwards;
  }
  @keyframes raidFlash { 0% { opacity: 1; } 65% { opacity: .5; } 100% { opacity: 0; } }
  .map-cell.label { background: transparent; cursor: default; color: var(--text-dim); }
  .map-cell.corner { background: transparent; cursor: default; }
  .map-cell .coord {
    position: absolute; top: 2px; left: 3px; font-size: 8px; opacity: 0.5;
  }
  .map-cell .ztype { font-size: 9px; color: #000; font-weight: 700; }
  .map-cell .owner {
    position: absolute; bottom: 2px; right: 3px;
    font-size: 7px; padding: 0 3px;
    background: rgba(0,0,0,0.5); color: white; font-weight: 700;
  }
  .map-cell .pm {
    position: absolute; top: 14px; right: 3px; font-size: 9px;
    background: var(--cyan); color: #000; padding: 1px 3px; font-weight: 700;
  }
  /* Zone colors — v6.38 B2: 공통 명암 오버레이(입체감) + 구역별 상단 네온 액센트 스트립 */
  .z-ruin { background: linear-gradient(155deg, rgba(255,255,255,.06), rgba(0,0,0,.22)), #3a3a2a; color: #b0b0a0; border-top: 2px solid #6a6a4a; }
  .z-home { background: linear-gradient(155deg, rgba(255,255,255,.10), rgba(0,0,0,.22)), #4a3a5a; color: #fff; border-top: 2px solid #a06ac0; }
  .z-bank { background: linear-gradient(155deg, rgba(255,255,255,.12), rgba(0,0,0,.24)), #8a6a10; color: #fff; border-top: 2px solid #ffd24a; }
  .z-data { background: linear-gradient(155deg, rgba(255,255,255,.10), rgba(0,0,0,.24)), #1a4a7a; color: #fff; border-top: 2px solid #3aa0ff; }
  .z-heal { background: linear-gradient(155deg, rgba(255,255,255,.10), rgba(0,0,0,.22)), #2a7a5a; color: #fff; border-top: 2px solid #3ad99a; }
  .z-work { background: linear-gradient(155deg, rgba(255,255,255,.10), rgba(0,0,0,.24)), #7a5a2a; color: #fff; border-top: 2px solid #e0954a; }
  .z-arms { background: linear-gradient(155deg, rgba(255,255,255,.10), rgba(0,0,0,.24)), #5a5a5a; color: #fff; border-top: 2px solid #b7b7b7; }
  .z-club { background: linear-gradient(155deg, rgba(255,255,255,.10), rgba(0,0,0,.24)), #7a2a5a; color: #fff; border-top: 2px solid #ff4a9e; }
  .z-port { background: linear-gradient(155deg, rgba(255,255,255,.10), rgba(0,0,0,.24)), #3a4a7a; color: #fff; border-top: 2px solid #5a7aff; }
  .z-cop  { background: linear-gradient(155deg, rgba(255,255,255,.06), rgba(0,0,0,.30)), #222; color: #fff; border-top: 2px solid #ff3c3c; }
  .z-nex  { background: linear-gradient(155deg, rgba(255,255,255,.22), rgba(0,0,0,.10)), #ffd700; color: #000; font-weight: 900; border-top: 2px solid #fff3a0; }
  .z-aux  { background: linear-gradient(155deg, rgba(255,255,255,.08), rgba(0,0,0,.24)), #5a3a3a; color: #fff; border-top: 2px solid #c07a7a; }
  /* NEXUS 셀 — 승리 구역: 은은한 골드 글로우 펄스 (opacity만 애니 → 저비용, 맵당 1셀) */
  .z-nex::after {
    content: ''; position: absolute; inset: -1px; pointer-events: none; border-radius: 2px; z-index: 2;
    box-shadow: 0 0 11px 1px rgba(255,215,0,.6); animation: nexPulse 2.4s ease-in-out infinite;
  }
  @keyframes nexPulse { 0%, 100% { opacity: .3; } 50% { opacity: .9; } }

  /* Right panel */
  .right-panel {
    grid-area: right; background: var(--bg2); border-left: 1px solid var(--border);
    padding: 12px; overflow-y: auto; display: flex; flex-direction: column;
  }
  .pool-box {
    background: var(--bg3); border: 1px solid var(--border);
    padding: 8px; border-radius: 3px; margin-bottom: 10px;
  }
  .pool-box h4 {
    margin: 0 0 6px; font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px; color: var(--text-dim);
  }
  .attr-row { display: flex; gap: 4px; flex-wrap: wrap; font-family: 'Share Tech Mono', monospace; font-size: 11px; }
  .attr-tag {
    padding: 2px 6px; border-radius: 2px; color: white; font-weight: 700;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .a-M { background: #185FA5; }
  .a-I { background: #888780; }
  .a-V { background: #854F0B; }
  .a-S { background: #534AB7; }
  .a-B { background: #1D9E75; }
  .a-A { background: #C04828; }
  .a-GRID { background: #666; }

  .signal-box { text-align: center; font-family: 'Share Tech Mono', monospace; letter-spacing: 2px; padding: 6px; }
  .sig-MESH_UP { background: rgba(24,95,165,0.3); color: var(--cyan); }
  .sig-MESH_DOWN { background: rgba(192,72,40,0.3); color: var(--magenta); }
  .sig-SURGE { background: rgba(255,215,0,0.3); color: var(--yellow); }
  .sig-BLACKOUT { background: #000; color: #555; border: 1px solid #333; }

  .news-box {
    background: var(--bg3); border: 1px solid var(--border);
    padding: 10px; border-radius: 3px; margin-bottom: 10px;
    font-size: 12px;
  }
  .news-box .nh { color: var(--yellow); font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 2px; margin-bottom: 4px; }

  .log-box {
    background: var(--bg3); border: 1px solid var(--border);
    padding: 10px; border-radius: 3px; font-size: 12px; flex: 1 1 auto;
    overflow-y: auto; min-height: 200px;
    font-family: 'Share Tech Mono', monospace;
    display: flex; flex-direction: column;
  }
  .log-box .log-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .log-box .log-head h4 {
    margin: 0; font-size: 11px; letter-spacing: 3px; color: var(--cyan);
  }
  .log-box .copy-btn {
    background: var(--bg2); border: 1px solid var(--cyan); color: var(--cyan);
    font-family: 'Share Tech Mono', monospace; font-size: 9px;
    padding: 3px 8px; letter-spacing: 1px; cursor: pointer;
  }
  .log-box .copy-btn:hover { background: var(--cyan); color: #000; }
  .log-box .log-scroll {
    flex: 1; overflow-y: auto; padding-right: 4px;
    display: flex; flex-direction: column-reverse;
  }
  .log-entry {
    padding: 3px 6px; margin-bottom: 2px;
    line-height: 1.4; font-size: 11px;
    color: var(--text-dim);
    border-left: 2px solid transparent;
    word-break: break-word;
  }
  .log-entry.me { border-left-color: var(--cyan); background: rgba(0,229,255,0.06); color: var(--text); }
  .log-entry.combat { color: var(--magenta); }
  .log-entry.income { color: var(--green); }
  .log-entry.news { color: var(--yellow); }
  .log-entry.move { color: #9fdcff; }
  .log-entry.raid { color: #ff6b9e; font-weight: 700; }
  .log-entry.round { color: var(--cyan); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 4px 6px; background: rgba(0,229,255,0.08); }
  .log-entry.summary { color: var(--yellow); background: rgba(255,215,0,0.08); padding: 4px 6px; font-weight: 700; }
  .log-entry .tag { font-size: 9px; color: var(--text-dim); margin-right: 6px; font-weight: 400; }

  /* Hand */
  /* v1.0.5-fix: hand가 항상 최소 280px 보장 (11×11 맵에 가려지지 않도록) */
  .hand-wrap {
    background: var(--bg2); border-top: 1px solid var(--border);
    padding: 10px; flex: 1 1 280px;
    display: flex; flex-direction: column;
    min-height: 240px; max-height: 320px;   /* v6.28: NEXUS BAR 축소분 흡수 (was 280) */
  }
  .hand-wrap h4 { margin: 0 0 6px; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--cyan); letter-spacing: 2px; }
  .hand { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; flex: 1; align-items: flex-start; }
  .card {
    width: 150px; height: 240px;
    background: linear-gradient(180deg, #10101f 0%, #0a0a16 100%);
    border: 1.5px solid var(--border);
    border-radius: 4px; padding: 6px;
    flex-shrink: 0;
    font-size: 10px; display: flex; flex-direction: column;
    /* v6.38 B2: 리프트/글로우/락페이드 트랜지션 (transform·opacity·box-shadow — layout thrash 회피) */
    cursor: pointer;
    transition: transform .16s ease, border-color .12s ease, box-shadow .16s ease, opacity .35s ease, filter .35s ease;
    overflow: hidden;
    animation: cardDeal .3s ease;   /* 손패 등장 시 딜링 연출 (마운트 1회) */
  }
  @keyframes cardDeal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .card:hover { transform: translateY(-6px); border-color: var(--cyan); box-shadow: 0 6px 18px rgba(0,0,0,.5), 0 0 14px rgba(0,229,255,.34); }
  .card.selected { border-color: var(--yellow); transform: translateY(-6px);
    box-shadow: 0 0 0 1px var(--yellow), 0 0 16px rgba(255,215,0,.5), 0 6px 18px rgba(0,0,0,.5); }
  .card.selected:hover { transform: translateY(-8px); }
  /* 계획 확정/비계획 페이즈 → 손패 잠금: 페이드+탈채도 (플레이 커밋 연출) */
  .card.disabled { opacity: 0.4; filter: grayscale(.5); cursor: not-allowed; }
  .card .ch {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Share Tech Mono', monospace; font-size: 9px;
    border-bottom: 1px solid var(--border); padding-bottom: 3px; margin-bottom: 3px;
  }
  .card .ci { background: var(--cyan); color: #000; padding: 1px 5px; font-weight: 700; }
  .card .ct {
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    color: var(--yellow); letter-spacing: 0.5px; text-align: center; margin: 4px 0;
  }
  .card .ceff {
    font-size: 9.5px; line-height: 1.35; flex: 1;
    overflow-y: auto; max-height: 90px;
  }
  .card .ceff strong { display: block; margin-bottom: 2px; font-size: 9px; }
  .card .cbot {
    border-top: 1px dashed #444; padding-top: 4px; margin-top: 3px;
    font-size: 9.5px; line-height: 1.35;
    max-height: 90px; overflow-y: auto;
  }
  .card .cbot strong { display: block; margin-bottom: 2px; font-size: 9px; }
  .card .cost {
    font-family: 'Share Tech Mono', monospace; font-size: 9px; color: var(--text-dim);
  }
  .loss-tag { color: var(--magenta); font-weight: 700; font-size: 8px; padding: 1px 3px; background: rgba(255,0,60,0.2); }

  /* Action buttons */
  .phase-actions {
    display: flex; gap: 8px; padding: 10px; background: var(--bg2);
    border-top: 2px solid var(--cyan);
    flex: 0 0 auto;
    min-height: 54px;
  }
  /* v1.0.5-fix: 맵이 너무 크면 스크롤되도록, hand는 항상 보이게 */
  .center-panel { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .map-wrap { flex: 0 1 auto; overflow: auto; min-height: 0; }
  .pa-btn {
    flex: 1; padding: 10px; background: var(--bg3);
    border: 1.5px solid var(--border); color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 1px; border-radius: 2px; font-size: 12px;
  }
  .pa-btn:hover:not(:disabled) { background: var(--cyan); color: #000; border-color: var(--cyan); }
  .pa-btn.primary { background: var(--cyan); color: #000; border-color: var(--cyan); font-weight: 700; }
  .pa-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: var(--bg2); border: 2px solid var(--cyan);
    padding: 24px; border-radius: 4px; max-width: 560px; width: 90%;
  }
  .modal h2 {
    font-family: 'Share Tech Mono', monospace;
    color: var(--cyan); letter-spacing: 3px; margin: 0 0 12px;
  }
  .modal p { color: var(--text-dim); line-height: 1.5; }
  .modal .obj-list { margin: 16px 0; }
  .modal .obj-item {
    background: var(--bg3); border-left: 3px solid var(--yellow);
    padding: 8px 12px; margin: 6px 0; font-size: 12px;
  }

  /* ---- BGA 스타일 튜토리얼 코치마크 (tutorial_module.js) ---- */
  .tut-backdrop {
    position: fixed; inset: 0; z-index: 300;   /* 게임 모달(≤210)보다 위 */
    background: rgba(0,0,0,0.35);
    pointer-events: none;            /* 게임 조작을 막지 않음 — 클릭 통과 */
  }
  .tut-bubble {
    position: fixed; z-index: 301;
    pointer-events: auto;            /* 말풍선만 클릭 수용 */
    width: min(360px, 90vw);
    background: var(--bg2);
    border: 2px solid var(--magenta);
    border-radius: 6px;
    padding: 16px 18px;
    box-shadow: 0 0 24px rgba(255,0,60,0.35);
    font-size: 13px; color: var(--text); line-height: 1.55;
  }
  .tut-bubble.a-center { left: 50%; top: 50%; transform: translate(-50%, -50%); border-color: var(--cyan); box-shadow: 0 0 24px rgba(0,229,255,0.35); }
  .tut-bubble.a-bottom { left: 50%; bottom: calc(var(--botbar-h) + 12px); transform: translateX(-50%); }   /* v6.28: NEXUS BAR 위로 상향 */
  .tut-bubble.a-map    { left: 50%; top: 120px; transform: translateX(-50%); }
  .tut-bubble.a-left   { left: 16px; top: 70px; }
  .tut-bubble.a-right  { right: 16px; top: 70px; }
  @media (max-width: 720px) {
    .tut-bubble.a-left, .tut-bubble.a-right { left: 50%; right: auto; top: auto; bottom: calc(var(--botbar-h) + 12px); transform: translateX(-50%); }   /* v6.28: NEXUS BAR 위로 상향 */
    .tut-bubble.a-map { top: 80px; }

    /* v6.25-fix: 모바일 세로 스택 — 고정 3컬럼(300+280=580px)이 폰 세로(~390px)에서
       중앙 게임 UI를 음수 폭으로 소멸시키던 크리티컬 버그 수정.
       스택 순서: 페이즈 바(고정) → 중앙 게임(지도+손패+행동/거래) → 좌 플레이어 → 우 정보. */
    html, body, #root { height: auto; min-height: 100%; }
    .game {
      grid-template-columns: minmax(0, 1fr);   /* min 0 → 단일 컬럼이 min-content로 폭 터지는 것 방지 */
      grid-template-rows: 50px auto auto auto;
      height: auto; max-height: none; min-height: 100vh;
      grid-template-areas:
        "top"
        "center"
        "left"
        "right";
    }
    .top-bar, .left-panel, .center-panel, .right-panel { min-width: 0; }
    .left-panel, .right-panel { overflow-x: hidden; }
    .top-bar {
      position: sticky; top: 0; z-index: 50;
      flex-wrap: wrap; gap: 6px 12px; padding: 6px 10px; min-height: 50px;
    }
    .top-bar .phases { order: 3; flex: 1 1 100%; justify-content: flex-start; flex-wrap: wrap; }
    .center-panel { overflow: visible; padding: 10px; }
    /* v6.26: 모바일 — HUD/틱커/위협 스트립은 center 최상단(=top 바 아래·지도 위) 자동 배치 */
    .hud-wrap.decl { margin-top: 100px; }   /* 모바일 배너는 3줄 랩 → 더 큰 오프셋 */
    .mkt-ticker { flex-wrap: nowrap; overflow-x: auto; }
    .race-track { height: 30px; }
    .race-marker .rm-dot { width: 17px; height: 17px; }
    .race-marker.me .rm-dot { width: 21px; height: 21px; }
    .map-wrap { overflow-x: auto; overflow-y: visible; }
    .map-board, .map-board.size-11 { margin: 0 auto; }
    .map-board.size-11 { min-width: 460px; }   /* 11×11 셀 탭 타깃 확보 → 가로 스크롤 */
    .hand-wrap { max-height: none; min-height: 0; flex: 0 0 auto; }
    .card { width: 132px; height: 212px; }
    .left-panel, .right-panel {
      overflow-y: visible;
      border-left: none; border-right: none; border-top: 1px solid var(--border);
    }
    .phase-actions { flex-wrap: wrap; }
    .pa-btn { flex: 1 1 auto; min-height: 40px; }
    .modal { max-height: 88vh; overflow-y: auto; }
    /* v6.44 (B-04): 모바일 매수/매도 세로 스택 — 5블록 병렬(≈23px 폭)에서 좌우 병렬 버튼이 라벨 잘림 → 세로 배치로 탭 타깃 확보 */
    .mkt-bs { flex-direction: column; gap: 4px; }
    .mkt-bs-btn { min-height: 30px; font-size: 10px !important; }
  }
  .tut-bubble .tut-title {
    font-family: 'Share Tech Mono', monospace;
    color: var(--magenta); letter-spacing: 1px; font-weight: 700;
    font-size: 13px; margin-bottom: 8px;
  }
  .tut-bubble.a-center .tut-title { color: var(--cyan); }
  .tut-bubble .tut-body { color: var(--text-dim); white-space: pre-line; margin-bottom: 14px; }
  .tut-bubble .tut-actions { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  .tut-bubble .tut-next {
    background: var(--cyan); color: #000; border: none; border-radius: 3px;
    padding: 6px 16px; font-weight: 700; font-size: 12px; cursor: pointer;
    font-family: 'Share Tech Mono', monospace; letter-spacing: 1px;
  }
  .tut-bubble .tut-next:hover { filter: brightness(1.15); }
  .tut-bubble .tut-skip {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 3px; padding: 6px 10px; font-size: 11px; cursor: pointer;
  }
  .tut-bubble .tut-skip:hover { color: var(--magenta); border-color: var(--magenta); }

  /* Game over */
  .gameover {
    text-align: center; padding: 60px 24px;
  }
  .gameover h1 {
    font-family: 'Share Tech Mono', monospace; font-size: 56px;
    letter-spacing: 6px; margin: 0 0 20px;
  }
  .gameover.win h1 { color: var(--green); text-shadow: 0 0 30px var(--green); }
  .gameover.lose h1 { color: var(--magenta); text-shadow: 0 0 30px var(--magenta); }
  .gameover .stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    max-width: 600px; margin: 24px auto;
  }
  .gameover .stat-box {
    background: var(--bg2); border: 1px solid var(--border);
    padding: 16px; border-radius: 3px;
  }
  .gameover .stat-box .lbl { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 2px; }
  .gameover .stat-box .val { font-family: 'Share Tech Mono', monospace; font-size: 28px; color: var(--cyan); margin-top: 4px; }

  /* ===== v6.28: NEXUS BAR — 하단 고정 "내 상태 바" =====
     상단 Race HUD = 세계/상대(진척·시장·위협), 하단 = 나 자신의 절대값 + 내 행동.
     진척 트랙/게이지/임계선은 하단에 절대 그리지 않음(계기판 정직화: 표시값=판정값). */
  .dn-botbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--botbar-h); z-index: 90;
    background: var(--bg2); border-top: 2px solid var(--cyan);
    box-shadow: 0 -4px 12px rgba(0,0,0,.45);
    display: grid; grid-template-columns: 300px 1fr 280px; align-items: center;
    font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--text);
  }
  .bb-id { display: flex; align-items: center; gap: 8px; padding: 0 12px; min-width: 0; }
  .bb-core { display: flex; align-items: center; gap: 12px; padding: 0 12px; min-width: 0;
    overflow-x: auto; white-space: nowrap; flex-wrap: nowrap;   /* 세로 wrap 금지(높이 폭발 방지) */
    border-left: 1px solid var(--border); }
  .bb-core::-webkit-scrollbar { height: 4px; }
  .bb-core > span { flex: 0 0 auto; }
  .bb-act { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 12px;
    border-left: 1px solid var(--border); }
  .bb-face { font-size: 18px; flex: 0 0 auto; cursor: pointer; }
  .bb-name { color: var(--cyan); letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
  .bb-hp { display: inline-flex; align-items: center; white-space: nowrap; flex: 0 0 auto; }
  .bb-hp b { color: var(--magenta); font-weight: 700; }
  .bb-hpbar { display: inline-block; width: 44px; height: 4px; background: var(--bg3); border-radius: 2px; vertical-align: middle; margin-left: 4px; overflow: hidden; }
  .bb-hpbar i { display: block; height: 100%; background: var(--magenta); }
  .bb-cr { color: var(--text); }
  .bb-key { color: var(--yellow); font-size: 14px; font-weight: 700; }
  .bb-pool { display: inline-flex; gap: 3px; align-items: center; }
  .bb-eco { color: var(--text-dim); }
  .bb-hand { color: var(--text-dim); flex: 0 0 auto; }
  .bb-decq { min-width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 9px;
    background: var(--magenta); color: #fff; font-size: 11px; font-weight: 700; padding: 0 5px;
    animation: dnBotPulse 1.2s infinite; flex: 0 0 auto; }
  .bb-next { flex: 0 0 auto; min-height: 34px; padding: 4px 14px; white-space: nowrap; }
  @keyframes dnBotPulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  .bb-hp.low b { color: var(--magenta); animation: dnBotPulse 1s infinite; }
  .bb-hpbar.low i { animation: dnBotPulse 1s infinite; }
  .bb-wanted.hot { color: var(--magenta); animation: dnBotPulse 1s infinite; }
  .bb-sig.charged { color: var(--yellow); }
  @media (max-width: 720px) {
    :root { --botbar-h: 56px; }                       /* 터치존 확대 */
    .dn-botbar { display: flex; padding: 0 8px; gap: 8px; }
    .bb-id { flex: 0 0 auto; padding: 0 4px; }         /* 좌 고정 핀: 역할+HP 항상 보임 */
    .bb-core { flex: 1 1 auto; min-width: 0; overflow-x: auto; padding: 0 4px; border-left: none; }
    .bb-act { flex: 0 0 auto; margin-left: auto; padding: 0 4px; border-left: none; }  /* 우 고정 핀 */
    .bb-next { min-height: 44px; min-width: 88px; }    /* 터치 타깃 */
    body { padding-bottom: var(--botbar-h); }          /* 스크롤 레이아웃 하단 가림 방지 */
    .game { min-height: calc(100vh - var(--botbar-h)); }
    .bb-t4 { display: none; }                          /* ≤720: 경제칩 숨김 */
  }
  @media (max-width: 520px) { .bb-t3 { display: none; } }   /* 속성풀·시그니처 숨김 */
  @media (max-width: 400px) {
    .bb-t2 { display: none; }                          /* 손패·수배 숨김 */
    .bb-name { display: none; }                        /* 코드네임 숨김, 초상만 */
  }
  /* Tier1(항상 노출): 초상·HP·₵·핵심지표·결정뱃지·NEXT */

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

  /* ===== v6.38 B2: 그래픽 밀도 — 이벤트 연출 / 패널 질감 (CSS 전용, 표시층) ===== */
  /* INCOMING 배너(피격 알림)용 pulse 키프레임 — 기존 참조(무정의 no-op)였던 것을 정의 */
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 16px rgba(255,60,140,.4); } 50% { box-shadow: 0 0 30px rgba(255,60,140,.75); } }

const MAP_11x11_ZONES = [
  // 코너 (외곽) — ruin / home 위주
  'ruin','home','ruin','aux','data','bank','data','aux','ruin','home','ruin',
  'home','aux','work','arms','data','home','data','arms','work','aux','home',
  'ruin','work','heal','club','aux','heal','aux','club','heal','work','ruin',
  'aux','arms','club','port','work','data','work','port','club','arms','aux',
  'data','data','aux','work','heal','arms','heal','work','aux','data','data',
  'bank','home','heal','data','arms','nex', 'arms','data','heal','home','bank',  // 중앙 F6 = NEXUS
  'data','data','aux','work','heal','arms','heal','work','aux','data','data',
  'aux','arms','club','port','work','data','work','port','club','arms','aux',
  'ruin','work','heal','club','aux','heal','aux','club','heal','work','ruin',
  'home','aux','work','arms','data','home','data','arms','work','aux','home',
  'ruin','home','ruin','aux','data','bank','data','aux','ruin','home','ruin',
];
const MAP_11x11 = (() => {
  const cells = [];
  for (let r = 0; r < 11; r++) {
    for (let c = 0; c < 11; c++) {
      const coord = String.fromCharCode(65 + c) + (r + 1);
      const zone = MAP_11x11_ZONES[r * 11 + c];
      cells.push([coord, zone]);
    }
  }
  return cells;
})();

const d6 = () => Math.floor(Math.random() * 6) + 1;
// v5.2.0: 결정론적 레이드 보너스 (sim-harness/core.js와 동일) — 무기 자원 기반, 운 0%
// v5.2.1: euro_gearBonus 통합 (자원변환 장비가 raid 보너스로 작동)
const raidBonus = (p) => 3 + Math.min(3, Math.floor((p.resources.weapons || 0) / 3)) + (typeof euro_gearBonus === 'function' ? euro_gearBonus(p) : 0);
// v6.11.3 (P0-1): 레이드 방어 토큰 합 — fortified(요새) + garrison(주둔) + veil(베일).
// 봇/카드/인간 모달 레이드 threshold가 이 한 소스를 공유 (sim-harness/core.js:1736 정합).
const raidDefenseBonus = (cell) => (cell?.fortified || 0) + (cell?.garrison || 0) + (cell?.veil || 0);
// 봇/카드 레이드 기본 threshold = 5 + 방어 토큰 (인간 모달은 RAID_TYPES.threshold가 5를 대체하고 방어 토큰을 가산).
const raidThreshold = (cell) => 5 + raidDefenseBonus(cell);
const rand = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (a) => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[r[i], r[j]] = [r[j], r[i]]; } return r; };

const rollSignalDie = () => {
  const r = d6();
  if (r <= 2) return 'MESH_UP';
  if (r <= 4) return 'MESH_DOWN';
  if (r === 5) return 'SURGE';
  return 'BLACKOUT';
};

// ============================================================================
// v6.16 (P1-2 / docs/21 §2 · K5 · X8): 클래스 개성 선택화 루프
//   "내 카드 선택이 내 필살기를 당긴다" — 특정 클래스 카드를 플레이하면 해당
//   시그니처 게이지가 +1 오르고, 시그니처 마일스톤이 그만큼 빨리 발동한다.
//   실존 GHOST_CARDS만 훅함 (없는 카드 창작 금지). 게이지 필드(rigTraps/
//   hackNodes/tradeMemo)는 euro_module.js 시그니처와 공유 상태다.
// ============================================================================
const GAUGE_HOOKS = {
  TRAP_WIRE: { cls: 'RIGGER', gauge: 'rigTraps',  icon: '🪤', label: '함정망' },      // 함정 3개마다 ★+2
  ICE_BREAK: { cls: 'CIPHER', gauge: 'hackNodes', icon: '💾', label: '해킹 노드' },   // ≥3 → 해킹 신 하이라이트
  PORT_SCAN: { cls: 'CIPHER', gauge: 'hackNodes', icon: '💾', label: '해킹 노드' },
  NETWORK:   { cls: 'BROKER', gauge: 'tradeMemo', icon: '🤝', label: '거래 메모' },   // 5 도달 → ₵+5 ★+3
  BACK_DEAL: { cls: 'BROKER', gauge: 'tradeMemo', icon: '🤝', label: '거래 메모' },
};
// 밸런스 가드(docs/21 §2·4): 훅당 +1이 과하면 이 게이트를 1 미만으로 낮춰 확률 감쇠.
const GAUGE_HOOK_CHANCE = 1.0;
// 카드 플레이 시 게이지 훅 적용. 반쪽(top/bot) 무관 — 그 클래스 카드를 낸 사실이 트리거.
// euro_module 시그니처 함수와 동일 공식으로 마일스톤을 인라인 정산해, 게이지가 카드로
// 오를 때 라운드 시그니처 틱이 마일스톤 값을 건너뛰지 않도록 한다.
function applyGaugeHook(state, playerIdx, cardId) {
  const hook = GAUGE_HOOKS[cardId];
  if (!hook) return state;
  const p = state.players[playerIdx];
  if (!p || p.defeated || p.specific !== hook.cls) return state;
  if (GAUGE_HOOK_CHANCE < 1 && Math.random() >= GAUGE_HOOK_CHANCE) return state;
  let s = state;
  const cur = (p[hook.gauge] || 0) + 1;
  const ps = [...s.players];
  ps[playerIdx] = { ...ps[playerIdx], [hook.gauge]: cur };
  s = { ...s, players: ps };
  s.meta = { ...s.meta, gaugeHooks: (s.meta.gaugeHooks || 0) + 1 };  // 측정용
  const meTag = playerIdx === 0 ? '⭐ 당신 ' : '';
  const nm = CARD_NAMES_KR[cardId] || cardId;
  if (hook.gauge === 'rigTraps' && cur % 3 === 0) {
    const ps2 = [...s.players];
    ps2[playerIdx] = { ...ps2[playerIdx], resources: { ...ps2[playerIdx].resources, rep: (ps2[playerIdx].resources.rep || 0) + 2 } };
    s = { ...s, players: ps2 };
    s = logEntry(s, `${meTag}${hook.icon} P${playerIdx} RIGGER · ${nm} → ${hook.label} 게이지 ${cur} · 함정 발동 ★+2`);
  } else if (hook.gauge === 'tradeMemo' && cur === 5) {
    const ps2 = [...s.players];
    ps2[playerIdx] = { ...ps2[playerIdx], resources: { ...ps2[playerIdx].resources, credit: (ps2[playerIdx].resources.credit || 0) + 5, rep: (ps2[playerIdx].resources.rep || 0) + 3 } };
    s = { ...s, players: ps2 };
    s = logEntry(s, `${meTag}${hook.icon} P${playerIdx} BROKER · ${nm} → 거래 메모 5 도달 · ₵+5 ★+3 (외교 능숙)`);
  } else {
    s = logEntry(s, `${meTag}${hook.icon} P${playerIdx} ${hook.cls} · ${nm} → ${hook.label} 게이지 +1 (누적 ${cur})`);
  }
  return s;
}

// v6.16 (P1-2 / docs/21 §2 · P1): MOLE 위장(disguiseBloc) 소비처.
//   euro_moleSignature가 R2에 설정하는 disguiseBloc이 실효화되는 유일 경로.
//   위장 대상 Bloc의 구역을 레이드하면 threshold -2 (내부자 이점).
//   실패 시 위장 발각 — disguiseBloc 해제 + 수배 +1 (기본 실패 페널티에 가산).
const moleDisguiseMatch = (attacker, blocName) =>
  !!(attacker && attacker.specific === 'MOLE' && attacker.disguiseBloc && attacker.disguiseBloc === blocName);
const moleDisguiseMod = (attacker, blocName) => (moleDisguiseMatch(attacker, blocName) ? -2 : 0);
// 레이드 실패 시 위장 발각 처리.
function moleRaidReveal(state, playerIdx, blocName) {
  const p = state.players[playerIdx];
  if (!moleDisguiseMatch(p, blocName)) return state;
  const ps = [...state.players];
  ps[playerIdx] = { ...ps[playerIdx], disguiseBloc: null, wanted: (ps[playerIdx].wanted || 0) + 1 };
  let s = { ...state, players: ps };
  s.meta = { ...s.meta, moleReveals: (s.meta.moleReveals || 0) + 1 };  // 측정용
  const meTag = playerIdx === 0 ? '⭐ 당신 ' : '';
  s = logEntry(s, `${meTag}🕷 P${playerIdx} MOLE · 위장 발각! ${blocName} 잠입 실패 — 위장 해제, 수배+1`);
  return s;
}

// 거리명성(Street Cred) = 5트랙 합. LV 임계 효과 (LV2 패시브 / LV4 강화 / LV5 once-ability).
// 내부 키는 호환성 유지 (combat/transport/mfg/party/security), 표시명만 사이버펑크화
const TRACK_KEYS = ['combat', 'transport', 'mfg', 'party', 'security'];
const TRACK_NAMES = {
  combat:    { name: '화력',     icon: '💥', desc: 'ATK·레이드 파워 — 솔로/킬러 라이프패스' },
  transport: { name: '그리드런', icon: '🌃', desc: '이동·도주 — 노매드 라이프패스' },
  mfg:       { name: '코드',     icon: '💾', desc: '부품·무기·해킹 — 넷러너/리거 라이프패스' },
  party:     { name: '인맥',     icon: '🤝', desc: '크레딧·영향력·접선 — 픽서 라이프패스' },
  security:  { name: '그림자',   icon: '🎭', desc: 'DEF·위장·은폐 — 첩보 라이프패스' },
};
// v1.0: 총합 지표명 (악명 → 거리명성 / Street Cred — Cyberpunk RPG 핵심 용어)
const STREETCRED_LABEL = '거리명성';
const TRACK_MAX = 5;

// 트랙별 투자 비용 (R&D 페이즈 직접 레벨업) — 트랙 성격에 맞는 자원
const TRACK_COST = {
  combat:    { weapons: 2 },  // 무력: 무기 2
  transport: { credit: 3 },   // 수송: ₵3
  mfg:       { parts: 2 },    // 제조: 부품 2
  party:     { credit: 3 },   // 파티: ₵3 (인맥 작업)
  security:  { data: 2 },     // 경호: 정보 2
};

// 클래스별 시작 트랙 (사이버펑크 라이프패스 풍)
const CLASS_STARTING_TRACKS = {
  // Ghost
  CIPHER:   { security: 1, mfg: 1, transport: 1 },     // v0.6.5a: transport 1 추가
  BLADE:    { combat: 2, security: 1, transport: 1 },  // v0.6.5a: transport 1 추가
  RIGGER:   { mfg: 2, transport: 1, combat: 1 },       // v0.6.5a: security→transport (드론 클래스라 이동도 필요)
  BROKER:   { party: 2, transport: 2, security: 1 },   // v0.6.5a: transport 강조 (협상가는 발이 빠름)
  DRIFTER:  { transport: 2, combat: 1, mfg: 1 },       // 균형 (변경 없음)

  HELIX:    { mfg: 1, party: 1, security: 1 },
  AXIOM:    { mfg: 2, security: 1 },
  CARBON:   { mfg: 1, transport: 1, party: 1 },
};

const initTracks = (specific) => {
  const start = CLASS_STARTING_TRACKS[specific] || {};
  const tracks = {};
  TRACK_KEYS.forEach(k => { tracks[k] = start[k] || 0; });
  return { tracks };
};

// 거리명성(Street Cred) = 5트랙 합 — DEAD NEXUS Ashgrid 2091 핵심 지표
function getInfamy(player) {
  if (!player.tracks) return 0;
  return TRACK_KEYS.reduce((sum, k) => sum + (player.tracks[k] || 0), 0);
}

// 트랙 직접 레벨업 (자원 차감 + 레벨 +1) — 보통 R&D 페이즈에서 호출
// 반환: { ok: bool, state: newState, reason: string }
function levelUpTrack(state, playerIdx, key, opts = {}) {
  if (!TRACK_KEYS.includes(key)) return { ok: false, state, reason: '잘못된 트랙' };
  const p = state.players[playerIdx];
  const tracks = { ...(p.tracks || {}) };
  const curLv = tracks[key] || 0;
  if (curLv >= TRACK_MAX) return { ok: false, state, reason: 'LV5 도달' };
  // 비용 검증 (free 옵션이면 스킵)
  const cost = opts.free ? {} : (TRACK_COST[key] || {});
  for (const [resKey, amt] of Object.entries(cost)) {
    if ((p.resources[resKey] || 0) < amt) return { ok: false, state, reason: `${resKey} ${amt} 필요` };
  }
  // 자원 차감
  const ps = [...state.players];
  const newP = { ...p };
  newP.resources = { ...p.resources };
  for (const [resKey, amt] of Object.entries(cost)) {
    newP.resources[resKey] = (newP.resources[resKey] || 0) - amt;
  }
  tracks[key] = curLv + 1;
  newP.tracks = tracks;
  ps[playerIdx] = newP;
  let s = { ...state, players: ps };
  const tn = TRACK_NAMES[key];
  const marker = playerIdx === 0 ? '⭐ 당신 ' : '';
  const costStr = Object.entries(cost).map(([k, v]) => `-${v}${k.charAt(0).toUpperCase()}`).join(' ');
  s = logEntry(s, `${marker}${tn.icon} P${playerIdx} [${newP.specific}] · ${tn.name} 트랙 LV${curLv + 1} 투자 ${costStr ? `(${costStr})` : '(무료)'} · ${STREETCRED_LABEL} ${getInfamy(newP)}`);
  s = checkInfamyMilestones(s, playerIdx);
  return { ok: true, state: s, reason: '' };
}

// 트랙 자동 상승 — 카드 효과·액션 결과로 무료 +1 (보통 1칸)
// levelUpTrack과 달리 자원 비용 없음, 게임 중 누적 가능
function raiseTrack(state, playerIdx, key, n = 1, reason = '') {
  if (!TRACK_KEYS.includes(key)) return state;
  const p = state.players[playerIdx];
  if (!p || p.defeated) return state;
  const tracks = { ...(p.tracks || {}) };
  const curLv = tracks[key] || 0;
  if (curLv >= TRACK_MAX) return state;
  const newLv = Math.min(TRACK_MAX, curLv + n);
  if (newLv === curLv) return state;
  tracks[key] = newLv;
  const ps = [...state.players];
  ps[playerIdx] = { ...p, tracks };
  let s = { ...state, players: ps };
  const tn = TRACK_NAMES[key];
  const marker = playerIdx === 0 ? '⭐ 당신 ' : '';
  s = logEntry(s, `${marker}${tn.icon} P${playerIdx} [${p.specific}] · ${tn.name} LV${curLv}→${newLv} (${reason || '액션'}) · ${STREETCRED_LABEL} ${getInfamy(ps[playerIdx])}`);
  // v0.6.4: LV5 도달 시 once-ability 해금
  if (newLv === 5 && curLv < 5) {
    const onceMap = {
      combat: 'critFailImmunity',     // 무력 LV5: 크리티컬 실패 영구 면역
      transport: 'teleport',           // 수송 LV5: 1회 텔레포트
      mfg: 'droneFree',                // 제조 LV5: 1회 무료 드론
      party: 'reroll',                 // 파티 LV5: 1회 주사위 리롤
      security: 'deathSave',           // 경호 LV5: 1회 HP 0→1 부활
    };
    const ability = onceMap[key];
    if (ability) {
      const abilities = { ...(ps[playerIdx].onceAbilities || {}), [ability]: true };
      ps[playerIdx] = { ...ps[playerIdx], onceAbilities: abilities };
      s = { ...s, players: ps };
      s = logEntry(s, `🌟 P${playerIdx} [${p.specific}] · ${tn.name} LV5 궁극 해금 — ${ability}`);
    }
  }
  s = checkInfamyMilestones(s, playerIdx);
  return s;
}

// v0.6.3c: 트랙 LV별 패시브 보너스 (사이버펑크 라이프패스식)
// LV2: 기본 +1 / LV4: 추가 +2 (총 +3) / LV5: 추가 +1 (총 +4)
function trackBonus(p, kind) {
  if (!p?.tracks) return 0;
  const t = p.tracks;
  let b = 0;
  const map = { atk: 'combat', spd: 'transport', def: 'security', hack: 'mfg' };
  const trackKey = map[kind];
  if (!trackKey) return 0;
  const lv = t[trackKey] || 0;
  if (lv >= 2) b += 1;
  if (lv >= 4) b += 2;
  if (lv >= 5) b += 1;
  return b;
}

// v0.6.3e: Bloc 건물 건설 시스템 (산업 트랙형 + Gallerist 영감)
// 자사 구역에 건물 1개 건설 → 영구 패시브. Ghost 레이드로 파괴 가능
const BUILDINGS = {
  // v6.46 [71차 L4]: desc 에 자산 기여를 전부 명시 — assetValue() 의 buildingValue 는 5종 전부에
  //   가산하는데 desc 는 hq/media 만 '자산 +N' 을 적어, 공장·보안센터·거래소의 자산 기여가 UI 에서
  //   보이지 않았다(구매 판단이 실제 효과와 어긋남). 수치는 assetValue 의 맵과 동일 출처.
  factory:   { name: '공장',     icon: '🏭', tl: 1, cost: { credit: 4, parts: 2 }, desc: '매 라운드 부품 +2 · 자산 +2' },
  hq:        { name: '사옥',     icon: '🏢', tl: 2, cost: { credit: 6 },           desc: '자산 +5 영구, 매 라운드 인플루언스 +1' },
  security:  { name: '보안센터', icon: '🛡', tl: 1, cost: { credit: 3, parts: 1 }, desc: '구역 요새화 +2 영구 (레이드 방어) · 자산 +2' },
  trading:   { name: '거래소',   icon: '📈', tl: 2, cost: { credit: 5 },           desc: '매 라운드 크레딧 +2 · 자산 +3' },
  media:     { name: '미디어허브', icon: '📡', tl: 3, cost: { credit: 5, parts: 2 }, desc: '자산 +4 (건설 보너스)' },
};
function canBuildBuilding(state, playerIdx, key, coord) {
  const p = state.players[playerIdx];
  if (!p || p.role !== 'bloc' || p.defeated) return { ok: false, reason: 'Bloc 전용' };
  const cell = state.map[coord];
  if (!cell || cell.owner !== playerIdx) return { ok: false, reason: '자사 구역만' };
  if (cell.building) return { ok: false, reason: '이미 건물 존재' };
  const cfg = BUILDINGS[key];
  if (!cfg) return { ok: false, reason: '잘못된 건물' };
  if ((p.tl || 1) < cfg.tl) return { ok: false, reason: `TL${cfg.tl} 필요` };
  for (const [r, amt] of Object.entries(cfg.cost)) {
    if ((p.resources[r] || 0) < amt) return { ok: false, reason: `${r} ${amt} 필요` };
  }
  return { ok: true };
}

// v0.6.3d: 시그널 점진 공개 — NPC 블록 정보 점진 공개
const SIGNAL_REVEAL_COST = { data: 3 };  // data 3 → +1 시그널
const SIGNAL_LEVEL_DESC = {
  0: '정체 미상 (???)',
  1: '정체 확인',
  2: '방어 특성 노출',
  3: '완전 노출 (레이드 시 보너스 약탈)',
};
function revealSignal(state, npcIdx, by = 0, n = 1) {
  const npc = state.players[npcIdx];
  if (!npc?.isNpc || !npc.signal) return state;
  const cur = npc.signal.revealed || 0;
  if (cur >= npc.signal.max) return state;
  const next = Math.min(npc.signal.max, cur + n);
  if (next === cur) return state;
  const ps = [...state.players];
  ps[npcIdx] = { ...npc, signal: { ...npc.signal, revealed: next } };
  let s = { ...state, players: ps };
  const marker = by === 0 ? '⭐ 당신 ' : '';
  s = logEntry(s, `${marker}📡 NPC P${npcIdx} 시그널 ${cur}→${next}: ${SIGNAL_LEVEL_DESC[next]}${next === 3 ? ' [' + npc.specific + ']' : ''}`);
  return s;
}

// 트랙 패시브 자원 보너스 (수익 페이즈에서 호출)
function trackIncomeBonus(p) {
  if (!p?.tracks) return { credit: 0, parts: 0 };
  const t = p.tracks;
  let credit = 0, parts = 0;
  const partyLv = t.party || 0;
  if (partyLv >= 2) credit += 1;
  if (partyLv >= 4) credit += 2;
  if (partyLv >= 5) credit += 1;
  const mfgLv = t.mfg || 0;
  if (mfgLv >= 2) parts += 1;
  if (mfgLv >= 4) parts += 2;
  if (mfgLv >= 5) parts += 1;
  return { credit, parts };
}

};
const CYBERWARE_KEYS = Object.keys(CYBERWARE_DEFS);
const MAX_CYBERWARE_SLOTS = 3;

// 장착 시 영구 보너스 적용 — buildPlayer에서 stats/resources 직접 변경
function applyCyberware(state, playerIdx, wareKey) {
  const ware = CYBERWARE_DEFS[wareKey];
  const p = state.players[playerIdx];
  if (!p || !ware) return state;
  const installed = p.cyberware || [];
  if (installed.length >= MAX_CYBERWARE_SLOTS) {
    return logEntry(state, `❌ P${playerIdx} 슬롯 가득참 (${MAX_CYBERWARE_SLOTS}개 한도)`);
  }
  if (installed.includes(wareKey)) {
    return logEntry(state, `❌ P${playerIdx} 이미 장착됨 (${ware.name})`);
  }
  // 비용 검증
  for (const [r, amt] of Object.entries(ware.cost)) {
    if ((p.resources[r] || 0) < amt) {
      return logEntry(state, `❌ P${playerIdx} ${ware.name} 비용 부족 (${r} ${amt})`);
    }
  }
  // 비용 차감 + 장착
  const ps = [...state.players];
  const newRes = { ...p.resources };
  for (const [r, amt] of Object.entries(ware.cost)) newRes[r] = (newRes[r] || 0) - amt;
  const newStats = { ...p.stats };
  // 즉시 stats 변경
  if (wareKey === 'reflex_booster') { newStats.atk = (newStats.atk || 0) + 1; }
  if (wareKey === 'iron_skin')      { newStats.def = (newStats.def || 0) + 2; newStats.spd = Math.max(0, (newStats.spd || 0) - 1); }
  if (wareKey === 'neural_jack')    { newStats.hack = (newStats.hack || 0) + 2; }
  if (wareKey === 'myomer_legs')    { newStats.spd = (newStats.spd || 0) + 2; }
  let newHp = p.hp, newMaxHp = p.maxHp;
  if (wareKey === 'reflex_booster') { newMaxHp = Math.max(1, newMaxHp - 1); newHp = Math.min(newHp, newMaxHp); }
  ps[playerIdx] = { ...p, resources: newRes, stats: newStats, hp: newHp, maxHp: newMaxHp, cyberware: [...installed, wareKey] };
  let s = { ...state, players: ps };
  const marker = playerIdx === 0 ? '⭐ 당신 ' : '';
  s = logEntry(s, `${marker}${ware.icon} P${playerIdx} [${p.specific}] · ${ware.name} 장착! (${ware.pro}) — 단점: ${ware.con}`);
  // 인맥 트랙 보너스 (mood_chip)
  if (wareKey === 'mood_chip') s = raiseTrack(s, playerIdx, 'party', 1, '무드 칩');
  return s;
}

// 하이라이트 기록 — 1회성 (이미 받았으면 재발동 X)
function recordHighlight(state, key, playerIdx) {
  const def = HIGHLIGHT_DEFS[key];
  if (!def) return state;
  const list = state.meta.highlights || [];
  const dupe = list.find(h => h.key === key && h.playerIdx === playerIdx);
  if (dupe) return state;  // 1회성
  const entry = { key, playerIdx, round: state.meta.round, label: def.label, icon: def.icon, rep: def.rep };
  let s = { ...state, meta: { ...state.meta, highlights: [...list, entry] } };
  // 평판 보상
  if (def.rep > 0) {
    const ps = [...s.players];
    ps[playerIdx] = { ...ps[playerIdx], resources: { ...ps[playerIdx].resources, rep: (ps[playerIdx].resources.rep || 0) + def.rep } };
    s = { ...s, players: ps };
  }
  const marker = playerIdx === 0 ? '⭐ 당신 ' : '';
  s = logEntry(s, `${marker}${def.icon} P${playerIdx} · 하이라이트 [${def.label}] · ${def.desc} · ★+${def.rep}`);
  return s;
}
function checkInfamyMilestones(state, playerIdx) {
  if (!MILESTONES_ENABLED) return state;

  if (!p) return state;
  const infamy = getInfamy(p);
  const awarded = (state.meta.milestonesAwarded && state.meta.milestonesAwarded[playerIdx]) || [];
  let s = state;
  for (const ms of INFAMY_MILESTONES) {
    if (infamy >= ms && !awarded.includes(ms)) {
      s = applyInfamyMilestone(s, playerIdx, ms);
      const newAwarded = [...awarded, ms];
      const allAwarded = { ...(s.meta.milestonesAwarded || {}), [playerIdx]: newAwarded };
      s = { ...s, meta: { ...s.meta, milestonesAwarded: allAwarded } };
    }
  }
  return s;
}

function applyInfamyMilestone(state, playerIdx, ms) {
  const p = state.players[playerIdx];
  const ps = [...state.players];
  let s = state;
  const marker = playerIdx === 0 ? '⭐ 당신 ' : '';
  // v0.6.3b: 마일스톤은 "도장" 같은 작은 보너스로. 게임 종결을 직접 만들지 않음.
  if (ms === 6) {
    // 6: 자원 한 묶음 — Ghost ★+1 ₵+2, Bloc ₵+3 ⚙+1
    const gain = p.role === 'ghost' ? { rep: 1, credit: 2 } : { credit: 3, parts: 1 };
    ps[playerIdx] = { ...p, resources: { ...p.resources, rep: (p.resources.rep || 0) + (gain.rep || 0), credit: (p.resources.credit || 0) + (gain.credit || 0), parts: (p.resources.parts || 0) + (gain.parts || 0) } };
    s = { ...s, players: ps };
    s = logEntry(s, `${marker}☠ P${playerIdx} [${p.specific}] · ${STREETCRED_LABEL} 6 마일스톤 — ${p.role === 'ghost' ? '★+1 ₵+2' : '₵+3 ⚙+1'}`);
  } else if (ms === 12) {
    // 12: TL Progress +3 (자동 승급 X) + 자원 약간
    const newProg = (p.tlProgress || 0) + 3;
    ps[playerIdx] = { ...p, tlProgress: newProg, resources: { ...p.resources, rep: (p.resources.rep || 0) + 1, credit: (p.resources.credit || 0) + 3 } };
    s = { ...s, players: ps };
    s = logEntry(s, `${marker}☠ P${playerIdx} [${p.specific}] · ${STREETCRED_LABEL} 12 마일스톤 — TL진척+3 ★+1 ₵+3`);
  } else if (ms === 18) {
    // 18: 전설 — Ghost는 ★+3, Bloc은 ₵+5 + 영구 영향력+1
    if (p.role === 'ghost') {
      ps[playerIdx] = { ...p, resources: { ...p.resources, rep: (p.resources.rep || 0) + 3 } };
    } else {
      ps[playerIdx] = { ...p, resources: { ...p.resources, credit: (p.resources.credit || 0) + 5, influence: (p.resources.influence || 0) + 1 } };
    }
    s = { ...s, players: ps };
    s = logEntry(s, `${marker}🏆 P${playerIdx} [${p.specific}] · ${STREETCRED_LABEL} 18 전설 마일스톤 — ${p.role === 'ghost' ? '★+3' : '₵+5 영향력+1'}`);
    s = recordHighlight(s, 'milestone_18', playerIdx);  // v0.9.1
  }
  return s;
}

  if (!state || !state.players) return identity;
  // 의도적 편향 시나리오(S02 all-bloc · S03 ghostRising)는 원전 구성 유지 → 항등 폴백.
  if (typeof scenarioRule === 'function' && scenarioRule(state, 'underdogRelief', true) === false) return identity;
  let gc = 0, bc = 0;

  //   게임을 8~11R로 늘려 51% 매집·연속 M&A 창을 확보한다. S01 등 미지정 시나리오는 0(무변화).
  const scAssetBonus = scenarioRule(state, 'blocAssetBonus', 0);

  const scGhostRep   = scenarioRule(state, 'ghostRepBattleOverride', null);

//     Ghost=rep)에 hp×SCALE 를 가산한다. 두 변형 중 '달성값 가산'을 선택한 근거:
//     ① 임계(getVictoryGoals)를 건드리지 않아 언더독 스케일과 부등식 반대편에서 독립 합성
//        (적용 순서 무관) ② HUD·판정이 동일 asset_eff/rep_eff 를 읽어 정직성 계약 유지.
//   [역할 대칭 — 원전 근거] P1-6 "유로 층 전체가 승리 문법에 편입". EURO_HIGHLIGHTS 8종은
//     Ghost 트리거(hp_one_raid·triple_raid·zero_wanted·rep_legend)와 Bloc 트리거(imperium·
//     stock_legend)를 모두 포함하고 마일스톤은 양 역할 공통 → 두 역할 모두 환산해야 "전체"
//     편입이 성립. 따라서 Bloc=asset_eff, Ghost=rep_eff 대칭 적용. 단 레이드 게이트는
//     원전이 asset/rep 값만 언급하므로 불변(별도 축).
// [측정 튜닝] SCALE 이터레이션 (S01 11×11 n=300 ghost% / 1g3b n=100 minority ghost%):
//   0.0(baseline) 56.7% / 33% · 0.3 → 59.0% / 46% · 0.5 → 58.7% / 52%.
//   S01 밴드는 전 구간 노이즈 내 불변(40~60 유지). 1g3b 언더독은 hp 환산이 소수 Ghost 를
//   double-dip(임계 완화 + 렙 환산)시켜 상향 — 0.5 는 52%(v6.25 목표 25~45 초과), 0.3 은 46%
//   (목표 상단, n=100 노이즈 내). 동일 밴드에서 언더독 초과가 최소인 0.3 채택 (반환 표 참조).
const EURO_HL_VICTORY_SCALE = 0.3;  // highlightPoint 당 달성값 가산치 (측정 튜닝값)
function euro_hlVictoryBonus(p) {
  if (!p) return 0;
  return Math.round((p.highlightPoints || 0) * EURO_HL_VICTORY_SCALE);
}
// 플레이어가 현재 승리 조건을 충족하면 { route, reason } 반환, 아니면 null (단일 판정 소스).
function evalPlayerVictory(p, idx, state, goals) {
  if (!p || p.defeated || p.isNpc) return null;
  goals = goals || getVictoryGoals(state);
  const hlBonus = euro_hlVictoryBonus(p);  // v6.27 (B-06): 달성값 가산 (역할 대칭)
  if (p.role === 'bloc') {
    const avBase = assetValue(p, state.stocks, state);
    const av = avBase + hlBonus;
    if (av >= goals.blocAsset) return { route: 'asset', reason: `Bloc 승리: 자산 ${avBase}${hlBonus ? `+${hlBonus}✨` : ''} (≥${goals.blocAsset}, ${goals.nonNpcCount}인)` };
  } else {
    const repBase = p.resources.rep || 0;
    const rep = repBase + hlBonus;
    const raids = (state.meta.raidsThisGame || {})[idx] || 0;
    if (rep >= goals.ghostRepBattle && raids >= goals.ghostRaids) return { route: 'repBattle', reason: `Ghost 승리 (전투): 렙 ${repBase}${hlBonus ? `+${hlBonus}✨` : ''} /${goals.ghostRepBattle} + 레이드 ${raids}` };
    if (rep >= goals.ghostRepOnly) return { route: 'repOnly', reason: `Ghost 승리 (평판): 렙 ${repBase}${hlBonus ? `+${hlBonus}✨` : ''} (≥${goals.ghostRepOnly})` };
  }
  return null;
}

// ============================================================================
// v6.26 (docs/22 §계기판·docs/23): 레이스 HUD 정직성 진척 함수 — 단일 소스 계기판
//   원칙: "HUD 숫자 = 판정 숫자". 진척률은 evalPlayerVictory(=checkInstantVictory)와
//   동일 소스만 사용한다: getVictoryGoals(언더독 스케일 반영) + assetValue/rep/raidsThisGame.
//   새 임계 수학을 도입하지 않는다 — 오직 이미 판정에 쓰는 값을 0~100 으로 정규화할 뿐.
//   [정직성 계약] evalPlayerVictory 가 승리(non-null)를 반환하는 상태에서는 반드시 100 을
//   반환한다(각 경로의 게이트가 곧 100% 지점). Ghost 는 두 승리 경로(렙배틀·렙온리)의
//   max 진척(레이스에서 실제로 더 가까운 경로). 렙배틀은 렙·레이드 동시 게이트 → min 성분.
function hudRaceProgress(p, idx, state, goals) {
  if (!p || p.isNpc || p.defeated) return 0;
  goals = goals || getVictoryGoals(state);
  const hlBonus = euro_hlVictoryBonus(p);  // v6.27 (B-06): 판정과 동일 asset_eff/rep_eff (정직성 계약)
  if (p.role === 'bloc') {
    const av = assetValue(p, state.stocks, state) + hlBonus;
    if (!goals.blocAsset) return 0;
    return Math.max(0, Math.min(100, Math.round(av / goals.blocAsset * 100)));
  }
  const rep = (p.resources.rep || 0) + hlBonus;
  const raids = (state.meta.raidsThisGame || {})[idx] || 0;
  // 렙배틀 경로: 렙≥ghostRepBattle && 레이드≥ghostRaids — 뒤처진 성분이 레이스를 게이트 → min.
  const battleRep  = goals.ghostRepBattle > 0 ? rep / goals.ghostRepBattle : 1;
  const battleRaid = goals.ghostRaids     > 0 ? raids / goals.ghostRaids   : 1;
  const battlePct  = Math.min(battleRep, battleRaid) * 100;
  // 렙온리 경로: 렙≥ghostRepOnly.
  const onlyPct = goals.ghostRepOnly > 0 ? rep / goals.ghostRepOnly * 100 : 0;
  return Math.max(0, Math.min(100, Math.round(Math.max(battlePct, onlyPct))));
}

const getScenario = (id) => SCENARIOS[id] || SCENARIOS.S01;

function scenarioRule(state, key, fallback) {

  return (sc && sc[key] != null) ? sc[key] : fallback;
}
// v6.19 (S03) — Ghost 레이드 특수 룰 헬퍼 (scenarioRule 게이팅; 미지정 시 항등 → 타 시나리오 불변).
//   원전(docs/14 S03): 레이드 보상 +50% · 현상수배 상승 −1 · NPC Bloc 방어력 −1.
//   기존 레이드 핸들러(봇/인간 공용)에서 보상·수배·방어 임계에 얇게 곱/가산한다.
// v6.22 (S06): 뉴스 주가 효과 방향 배율 — 상승 델타·하락 델타에 시나리오 배수(원전 상승−50%/하락+50%).
//   자원/구조 효과(시그널·존 플립·스캔들·인수 동결 등)는 배제, 주가 델타류만. 미지정 시나리오는 배수 1(항등 폴백).
//   function 선언 = 전역(window) 노출 → 유닛 테스트 직접 검증 가능.
function scenNewsStockDelta(state, delta) {
  if (delta > 0) return Math.round(delta * scenarioRule(state, 'newsStockUpMult', 1));
  if (delta < 0) return Math.round(delta * scenarioRule(state, 'newsStockDownMult', 1));

}
const scenRaidRep    = (state, rep) => Math.round((rep || 0) * scenarioRule(state, 'raidRewardMult', 1));
const scenRaidWanted = (state, w)   => Math.max(0, (w || 0) + scenarioRule(state, 'raidWantedDelta', 0));
// v6.23 (S04): 레이드 성공 시 공권력 델타 — 기본 +1, S04 는 raidHeatBonus(+1) 가산 → +2 (docs/14 §S04).
//   function 선언 = window 노출(유닛 검증). 미지정 시나리오는 bonus 0 → 항등(+base). 성공 사이트에만 적용.

//   방어 임계 보정: 대상 구역 소유자가 NPC Bloc 이면 npcDefenseMod 가산(음수 = 방어 약화).
const scenNpcDefMod  = (state, ownerIdx) => {

// ============================================================================
// v6.46 [69차] (S06): 원전 특수 승리 루트 — 재건왕/청산자 하이라이트 배선 (docs/14 §S06 원안)
//   원전 인용: "재건왕(RECONSTRUCTOR): 파산(주가 0) 블록을 주가 10↑로 복구한 플레이어 ★ 타이틀 + 렙/자산 +5."
//              "청산자: 2개 이상 블록 파산 유도 Ghost 렙 +10."
//   전용 점수·타이틀 추적 엔티티 신설 대신 기존 하이라이트(recordHighlight) 재사용 = 경량 배선.
//   전부 scenarioRule 게이트(crashBottomThresh / reconstructThresh / liquidatorBlocs). 타 시나리오는
//   키 미지정 → 0 폴백 → 첫 줄에서 인자 state 를 그대로 반환(참조 동일 = byte 불변 항등).
//   function 선언 = 전역(window) 노출 → 유닛 테스트 직접 검증 가능.
// ----------------------------------------------------------------------------
// 붕괴 바닥(=파산) 도달 이력 기록. 주가는 전역 Math.max(1, …) 하한이라 원전 "주가 0"은 도달 불가 →
//   crashBottomThresh(S06=1) 이하를 "파산"으로 매핑. 원인 무관(뉴스·레이드·매도) — 복구 판정의 전제.
function s06MarkCrashBottom(state) {
  const bottom = scenarioRule(state, 'crashBottomThresh', 0);
  if (!bottom) return state;
  const cur = state.meta.s06CrashedBlocs || {};
  let next = null;
  for (const bl of Object.keys(state.stocks || {})) {
    if ((state.stocks[bl] ?? 99) <= bottom && !cur[bl]) { next = next || { ...cur }; next[bl] = true; }
  }
  return next ? { ...state, meta: { ...state.meta, s06CrashedBlocs: next } } : state;
}
// 재건왕 — 파산 이력이 있는 블록의 주가가 reconstructThresh(원전 10) 이상으로 회복되면 해당 블록의
//   Bloc 플레이어에게 하이라이트. 귀속 근거: 엔진에 "누가 주가를 올렸는가" 신호가 없고(뉴스·배당·다중 매수),
//   플레이어에 결정적으로 귀속되는 주가 상승 신호는 자사 매수(BUY_STOCK/봇 매집 = 주가 +1)뿐이므로
//   원전의 "복구한 플레이어"를 자사 블록 소유 Bloc 좌석으로 매핑한다. NPC Bloc·탈락 좌석 제외.
function s06CheckReconstructor(state) {
  const thresh = scenarioRule(state, 'reconstructThresh', 0);
  if (!thresh) return state;
  let s = s06MarkCrashBottom(state);
  const crashed = s.meta.s06CrashedBlocs || {};
  for (let i = 0; i < s.players.length; i++) {
    const p = s.players[i];
    if (!p || p.role !== 'bloc' || p.defeated || p.isNpc) continue;
    if (crashed[p.specific] && (s.stocks[p.specific] || 0) >= thresh) s = recordHighlight(s, 'reconstructor', i);
  }
  return s;
}
// 청산자 — 한 Ghost 의 행동 창(카드 해결 1회분 / 레이드 1회) 안에서 바닥 위 → 바닥 이하로 밀려난 블록만
//   그 Ghost 의 "파산 유도"로 귀속·누적. 누적 블록 수가 liquidatorBlocs(원전 2) 이상이면 하이라이트.
//   preStocks = 행동 직전 state.stocks 스냅샷. Bloc·NPC 는 role 게이트로 제외.
function s06NoteLiquidation(state, playerIdx, preStocks) {
  const need = scenarioRule(state, 'liquidatorBlocs', 0);
  if (!need || !preStocks) return state;
  const p = state.players[playerIdx];
  if (!p || p.role !== 'ghost') return state;
  const bottom = scenarioRule(state, 'crashBottomThresh', 1);
  const byP = state.meta.s06LiquidatedBy || {};
  const mine = byP[playerIdx] || [];
  let add = null;
  for (const bl of Object.keys(state.stocks || {})) {
    const before = preStocks[bl], after = state.stocks[bl];
    if (before != null && before > bottom && after <= bottom && mine.indexOf(bl) === -1 && !(add && add.indexOf(bl) !== -1)) {
      add = add || []; add.push(bl);
    }
  }
  if (!add) return state;
  const nextMine = [...mine, ...add];
  let s = { ...state, meta: { ...state.meta, s06LiquidatedBy: { ...byP, [playerIdx]: nextMine } } };
  s = s06MarkCrashBottom(s);
  if (nextMine.length >= need) s = recordHighlight(s, 'liquidator', playerIdx);

}
// 시작 구역 확장용: origin 좌표에서 가장 가까운 미소유 일반(비-NEXUS) 구역 1칸을 찾는다.
//   좌표 = 열문자(A..)+행숫자(1..). 맵에 존재·owner null·zone!=='nex' 조건.
function nearestUnownedZone(map, origin) {
  const parse = (c) => ({ col: c.charCodeAt(0) - 65, row: parseInt(c.slice(1), 10) });
  const o = parse(origin);
  let best = null, bestD = Infinity;
  for (const c of Object.keys(map)) {
    const cell = map[c];
    if (!cell || cell.owner != null || cell.zone === 'nex') continue;
    const p = parse(c);
    const d = Math.abs(p.col - o.col) + Math.abs(p.row - o.row);
    if (d > 0 && d < bestD) { bestD = d; best = c; }
  }
  return best;
}
// initGame 훅 — 시작 players/map 변형 (전원 Bloc 이미 배치·구역 소유 확정 후 호출).
//   startCredit(전원 Bloc 크레딧 보강) · extraSupport(HQ 인근 미소유 구역 추가 소유).
function applyScenarioInit(scen, players, map) {
  if (!scen) return;
  if (scen.startCredit) {
    players.forEach(p => {
      if (p.role === 'bloc') p.resources = { ...p.resources, credit: (p.resources.credit || 0) + scen.startCredit };
    });
  }
  // v6.19 (S03): Ghost 시작 렙/크레딧 보강 + (실참) Bloc 인플루언스 보강 (docs/14 S03).
  if (scen.ghostRepBonus || scen.ghostCreditBonus) {
    players.forEach(p => {
      if (p.role !== 'ghost') return;
      p.resources = { ...p.resources,
        rep:    (p.resources.rep || 0)    + (scen.ghostRepBonus || 0),
        credit: (p.resources.credit || 0) + (scen.ghostCreditBonus || 0) };
    });
  }
  if (scen.blocInfluenceBonus) {
    players.forEach(p => {
      if (p.role === 'bloc' && !p.isNpc) p.resources = { ...p.resources, influence: (p.resources.influence || 0) + scen.blocInfluenceBonus };
    });
  }
  // v6.20 (S05/S06): 전원 대상 시작 자원 델타 (docs/14 S05 크레딧 +5 · S06 크레딧 −3·인플루언스 −1).
  //   role 무관 전 좌석에 적용. 음수는 0 하한으로 클램프(자원 음수 방지).
  if (scen.startCreditAll) {
    players.forEach(p => { p.resources = { ...p.resources, credit: Math.max(0, (p.resources.credit || 0) + scen.startCreditAll) }; });
  }
  if (scen.startInfluenceAll) {
    players.forEach(p => { p.resources = { ...p.resources, influence: Math.max(0, (p.resources.influence || 0) + scen.startInfluenceAll) }; });
  }
  // v6.20 (S06): 모든 블록 스캔들 카드 1장씩 덱 오염 상태로 시작 (docs/14 S06).
  //   insertScandal 코어와 동일하게 'SCANDAL' 카드를 discard 에 선삽입 (런타임 오염 카드).
  if (scen.startScandalEach) {
    players.forEach(p => { if (p.role === 'bloc') p.discard = [...(p.discard || []), 'SCANDAL']; });
  }
  if (scen.extraSupport) {
    players.forEach(p => {
      if (p.role !== 'bloc' || p.position == null) return;
      for (let n = 0; n < scen.extraSupport; n++) {
        const coord = nearestUnownedZone(map, p.position);
        if (coord) map[coord] = { ...map[coord], owner: p.id };
      }
    });
  }
  // v6.21 (S04): 전원 무기 델타 (docs/14 S04 무기 −2 압수). 0 하한 클램프.
  if (scen.startWeaponsAll) {
    players.forEach(p => { p.resources = { ...p.resources, weapons: Math.max(0, (p.resources.weapons || 0) + scen.startWeaponsAll) }; });
  }
}

// v6.21 — 모바일 NPC 엔티티 엔진 (docs/02 §6.3 공권력 9 · docs/14 S04 계엄의 밤).
//   meta.npcs = [{ id, type:'police', position, hp, atk, maxHp }] — 이동·전투 하는 경찰 NPC.
//   설계 원칙(스코프 통제): NPC 는 (1) 맵 표시, (2) Ghost 자동전투 외 경제 효과 없음.
//   전투는 기존 applyDamage(STEP F)·d6 판정을 재사용 — 신규 전투 시스템 없음.

const POLICE_ATK = 4;         // docs/14 S04: NPC ATK 4
const POLICE_KILL_REP = 2;    // NPC 격파 보상 렙 (기존 Ghost 결투 승리 렙+2 선례; docs 무명시→소액 정합)
const POLICE_COUNT = 3;       // docs/02 §6.3 · docs/14 S04: 3체
const mapMaxIdx = (state) => (state.meta && state.meta.mapSize === '11x11') ? 10 : 4;

// v6.23 — 구금 NPC(captive) 상수 (docs/14 §S04 구출 퀘스트). police 엔진 재사용: 신규 엔티티 시스템 없이
//   같은 meta.npcs 배열에 type:'captive' 로 공존(이동·전투 없음). id 는 100+ 로 police(0..2) 와 격리.
const CAPTIVE_COUNT = 5;            // docs/14 §S04: 구금 NPC 5체
const CAPTIVE_ID_BASE = 100;       // captive id 오프셋 (police id 와 충돌 방지)
const CAPTIVE_RESCUE_REP = 1;      // 개별 구출 보상 ★+1 (docs 개별 보상 무명시 → 소액 판단; 전원 보너스는 별도)
const CAPTIVE_ALL_BONUS_REP = 10;  // docs/14 §S04: 5명 전원 구출 시 Ghost 렙 +10 (개별 보상과 별개 가산)

// 좌표 맨해튼 거리 (열문자+행숫자). 순찰 수호·구출 목표 근접 판정용.
const coordDist = (a, b) => Math.abs(a.charCodeAt(0) - b.charCodeAt(0)) + Math.abs(parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10));

// 맵 상의 유효 좌표에서 count 곳을 무작위로 뽑아 police NPC 엔티티 배열 생성.
function spawnPoliceEntities(map, candidates, count) {
  const valid = (candidates && candidates.length ? candidates : Object.keys(map)).filter(c => map[c] && map[c].zone !== 'nex');
  const chosen = shuffle(valid).slice(0, count != null ? count : POLICE_COUNT);
  return chosen.map((pos, i) => ({ id: i, type: 'police', position: pos, hp: POLICE_HP, maxHp: POLICE_HP, atk: POLICE_ATK }));
}

// v6.23 — 구금 NPC(captive) 엔티티 생성. 넥서스·exclude(경찰/플레이어 시작칸) 제외한 무작위 구역 count 곳.
//   captive 는 hp/atk 없음(비전투)·이동 없음. 맵에 ⛓ 표시, Ghost 도착 시 자동 구출(resolveCaptiveRescue).

  const ex = new Set(exclude || []);
  const valid = Object.keys(map).filter(c => map[c] && map[c].zone !== 'nex' && !ex.has(c));
  const chosen = shuffle(valid).slice(0, count != null ? count : CAPTIVE_COUNT);
  return chosen.map((pos, i) => ({ id: CAPTIVE_ID_BASE + i, type: 'captive', position: pos }));
}

// v6.23 — Ghost 가 구금 NPC 위치 도착 시 자동 구출. 같은 칸에 경찰이 있으면 구출 불가(경찰이 지킨다 →
//   자동전투 먼저; 호출부에서 police 조우 선처리). 디스폰 + ★+1, 전원(5) 구출 시 ★+10 보너스 1회.

  // 경찰이 같은 칸을 지키면 구출 보류 (호출부가 자동전투를 먼저 해소해야 함)
  if ((s.meta.npcs || []).some(n => n.type === 'police' && n.position === ghost.position)) return s;
  const rby = { ...(s.meta.rescuesByPlayer || {}) };
  rby[ghostIdx] = (rby[ghostIdx] || 0) + 1;
  const ps = [...s.players];
  ps[ghostIdx] = { ...ghost, resources: { ...ghost.resources, rep: (ghost.resources.rep || 0) + CAPTIVE_RESCUE_REP } };
  s = { ...s, players: ps, meta: { ...s.meta,
    npcs: (s.meta.npcs || []).filter(n => n.id !== cap.id),
    rescues: (s.meta.rescues || 0) + 1,
    rescuesByPlayer: rby,
  } };
  const meTag = ghostIdx === 0 ? '⭐ 당신 ' : '';
  const zNm = ZONE_TYPES[s.map[cap.position]?.zone]?.name || cap.position;
  s = logEntry(s, `${meTag}⛓ 구금 NPC 구출 (${zNm}) — P${ghostIdx} [${ghost.specific}] 렙+${CAPTIVE_RESCUE_REP} · 진행 ${rby[ghostIdx]}/${CAPTIVE_COUNT}`);
  // 전원 구출 보너스 (플레이어별 1회)
  const awarded = { ...(s.meta.captiveBonusAwarded || {}) };
  if (rby[ghostIdx] >= CAPTIVE_COUNT && !awarded[ghostIdx]) {
    awarded[ghostIdx] = true;
    const g2 = s.players[ghostIdx];
    const ps2 = [...s.players];
    ps2[ghostIdx] = { ...g2, resources: { ...g2.resources, rep: (g2.resources.rep || 0) + CAPTIVE_ALL_BONUS_REP } };
    s = { ...s, players: ps2, meta: { ...s.meta, captiveBonusAwarded: awarded } };
    s = logEntry(s, `${meTag}⛓ 전원 구출 달성! P${ghostIdx} [${g2.specific}] 렙+${CAPTIVE_ALL_BONUS_REP} 보너스 (docs/14 §S04)`);
  }
  return s;
}

// Ghost ↔ 경찰 NPC 자동전투. 단일 조우를 결론까지 해소 (docs/14 "자동 전투").
//   판정: 매 교환 양측 d6. Ghost atk(+트랙 보너스)+d6 vs POLICE_ATK+d6.
//   Ghost 우세 → NPC HP −Ghost atk. NPC 우세 → Ghost 피해 누적(POLICE_ATK).
//   NPC HP0 → 격파(렙+2·디스폰). Ghost 피해는 마지막에 applyDamage 1회 위임(HP0 시 STEP F 자동).
function resolvePoliceCombat(state, ghostIdx, npcId, trigger) {
  let s = state;
  const npcs = s.meta.npcs || [];
  const npc = npcs.find(n => n.id === npcId);
  const ghost = s.players[ghostIdx];
  if (!npc || !ghost || ghost.defeated || ghost.role !== 'ghost') return s;
  let npcHp = npc.hp;
  let ghostHpSim = ghost.hp;
  let ghostDmg = 0;
  const gAtkBase = (ghost.stats.atk || 0) + trackBonus(ghost, 'atk');
  let ghostWon = false, guard = 0;
  while (guard++ < 30) {
    const gTotal = gAtkBase + d6();
    const nTotal = POLICE_ATK + d6();
    if (gTotal >= nTotal) npcHp -= Math.max(1, ghost.stats.atk || 1);   // Ghost 가격
    else { ghostHpSim -= POLICE_ATK; ghostDmg += POLICE_ATK; }          // 경찰 반격 (누적)
    if (npcHp <= 0) { ghostWon = true; break; }
    if (ghostHpSim <= 0) { ghostWon = false; break; }
  }
  const meTag = ghostIdx === 0 ? '⭐ 당신 ' : '';
  const zNm = ZONE_TYPES[s.map[npc.position]?.zone]?.name || npc.position;
  if (ghostWon) {
    if (ghostDmg > 0) s = applyDamage(s, ghostIdx, ghostDmg, { label: '경찰 전투' });  // STEP F 위임 (가해자 없음=환경)
    const gNow = s.players[ghostIdx];
    if (gNow && !gNow.defeated) {
      const ps = [...s.players];
      ps[ghostIdx] = { ...gNow, resources: { ...gNow.resources, rep: (gNow.resources.rep || 0) + POLICE_KILL_REP } };
      s = { ...s, players: ps };
    }
    s = { ...s, meta: { ...s.meta, npcs: (s.meta.npcs || []).filter(n => n.id !== npcId), policeKills: (s.meta.policeKills || 0) + 1 } };
    s = logEntry(s, `${meTag}🚔 경찰 NPC 격파 (${zNm}) — P${ghostIdx} [${ghost.specific}] 렙+${POLICE_KILL_REP}`);
  } else {
    const npcs2 = (s.meta.npcs || []).map(n => n.id === npcId ? { ...n, hp: Math.max(0, npcHp) } : n);
    s = { ...s, meta: { ...s.meta, npcs: npcs2, policeFights: (s.meta.policeFights || 0) + 1 } };
    s = logEntry(s, `${meTag}🚔 경찰 자동전투 (${zNm}) — P${ghostIdx} [${ghost.specific}] 피해 −${ghostDmg} · 경찰 HP ${Math.max(0, npcHp)}/${POLICE_HP}`);
    if (ghostDmg > 0) s = applyDamage(s, ghostIdx, ghostDmg, { label: '경찰 전투' });  // STEP F 위임
  }
  return s;
}

// 매 라운드(NEXT_ROUND) NPC 갱신: (1) heat≥9 최초 스폰 (docs/02 §6.3, 게임당 1회, 하락해도 유지),
//   (2) 각 NPC 무작위 인접 1칸 이동, (3) Ghost 와 같은 칸이면 자동전투(진입점 B).
function updatePoliceForRound(state) {
  let s = state;
  // (1) 공권력 9 도달 시 경찰 3체 스폰 (S01 포함 전 게임 공통 코어 규칙). policeSpawned 로 1회 게이트.
  if (!s.meta.policeSpawned && (s.heat || 0) >= 9) {
    const npcs = spawnPoliceEntities(s.map, null, POLICE_COUNT);
    s = { ...s, meta: { ...s.meta, npcs, policeSpawned: true } };
    s = logEntry(s, `🚔 공권력 ${s.heat} 도달 — 공권력 NPC ${npcs.length}체 출현 (무작위 구역)`);
  }
  const cur = s.meta.npcs || [];
  if (!cur.length) return s;
  // (2) 이동: police 만 이동(captive 는 고정). S04(patrolGuard) 는 가장 가까운 구금 NPC 로 수호 순찰,
  //     그 외 시나리오/heat9 스폰은 기존 무작위 인접 1칸(docs/02 §6.3 · docs/14 "랜덤 이동").
  const maxIdx = mapMaxIdx(s);
  const capPos = cur.filter(n => n.type === 'captive').map(n => n.position);
  const guard = scenarioRule(s, 'patrolGuard', false) && capPos.length > 0;
  const moved = cur.map(n => {
    if (n.type !== 'police') return { ...n };            // captive 고정
    const adj = coordsAdj(n.position, maxIdx).filter(c => s.map[c]);
    if (!adj.length) return { ...n };
    if (guard) {
      // 수호: 가장 가까운 구금 NPC 를 향해 1칸(거리 최소화). 이미 수호칸(거리0)이면 정지.
      let nearest = capPos[0], nd = coordDist(n.position, capPos[0]);
      for (const cp of capPos) { const d = coordDist(n.position, cp); if (d < nd) { nd = d; nearest = cp; } }
      if (n.position === nearest) return { ...n };        // 구금 NPC 칸에 착석 = 수호
      let best = adj[0], bd = coordDist(adj[0], nearest);
      for (const c of adj) { const d = coordDist(c, nearest); if (d < bd) { bd = d; best = c; } }
      return { ...n, position: best };
    }
    return { ...n, position: rand(adj) };
  });
  s = { ...s, meta: { ...s.meta, npcs: moved } };
  // (3) 이동 후 Ghost 와 겹친 NPC → police=자동전투(진입점 B), captive=자동 구출(경찰 부재 시).
  //     id 스냅샷 순회 (디스폰 안전). captive 는 police 처리 후 검사 → 경찰이 지키면 구출 보류.
  for (const npc of [...s.meta.npcs]) {
    if (npc.type !== 'police') continue;
    const ghost = s.players.find(p => !p.defeated && p.role === 'ghost' && p.position === npc.position);
    if (ghost) s = resolvePoliceCombat(s, ghost.id, npc.id, 'police-entry');
  }
  for (const npc of [...s.meta.npcs]) {
    if (npc.type !== 'captive') continue;
    const ghost = s.players.find(p => !p.defeated && p.role === 'ghost' && p.position === npc.position);
    if (ghost) s = resolveCaptiveRescue(s, ghost.id);
  }
  return s;
}

// 봇 Ghost 이동 heuristic — NPC 회피/격파 판단 (간단). 각 이동 스텝의 nextStep 보정.
//   HP 여유(≥60%) → 인접 경찰 있으면 격파 보상 추구(경찰칸으로 진입). 여유 없으면 회피(경찰칸 배제).
function policeAwareStep(s, playerIdx, current, nextStep) {
  const npcs = s.meta.npcs || [];
  if (!npcs.length) return nextStep;
  const g = s.players[playerIdx];
  const engage = g.maxHp ? (g.hp / g.maxHp) >= 0.6 : true;
  const policeAt = (c) => npcs.some(n => n.type === 'police' && n.position === c);  // v6.23: captive 는 위협 아님
  const adj = coordsAdj(current, mapMaxIdx(s)).filter(c => s.map[c]);
  if (engage) {
    const adjPolice = adj.filter(policeAt);
    if (adjPolice.length) return adjPolice[0];   // 격파 추구: 인접 경찰로 진입
  } else if (nextStep && policeAt(nextStep)) {
    const safe = adj.filter(c => !policeAt(c));   // 회피: 경찰 없는 인접칸
    return safe.length ? rand(safe) : current;
  }
  return nextStep;
}

// TL 승급 비용: TL3~5 해금 — docs/09 §1 "TL이 오를수록 비쌈" 곡선.
//   e2e 축적 분포(중앙 47pt·p75 61·p90 80/게임, 평균 8R)에 맞춰 누적 임계 5/25/55/90 캘리브레이션:
//   TL2 거의 전원 · TL3 중반 다수(~87% 시트) · TL4 후반 강자(~34%) · TL5 희소 정점(~5%, 게임당 0~1명).
const tlCostFor = (curTl) => {
  switch (curTl) {
    case 1: return 5;    // →TL2 (누적 5)
    case 2: return 20;   // →TL3 (누적 25)
    case 3: return 30;   // →TL4 (누적 55)
    case 4: return 35;   // →TL5 (누적 90)
    default: return 99999; // TL5 상한
  }
};
// 맵별 TL 상한 — docs/10 §15.7: 5×5 튜토리얼은 TL2까지, 11×11 정규는 TL5.
const tlCapFor = (mapSize) => (mapSize === '11x11' ? 5 : 2);

// ============================================================================
// 게임 히스토리 (LocalStorage) — 브라우저 로컬에만 저장, 서버 전송 없음
// ============================================================================
const HISTORY_KEY = 'dn_sim_history_v053';
const loadHistory = () => {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
};
const saveGameRecord = (rec) => {
  try {
    const h = loadHistory();
    h.unshift(rec);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, 50)));  // 최근 50판만
  } catch (e) { console.warn('history save failed', e); }
};
const clearHistory = () => {
  try { localStorage.removeItem(HISTORY_KEY); } catch {}
};
const buildGameRecord = (state) => {
  const me = state.players[0];
  const iWon = state.meta.winner === 0;
  return {
    ts: Date.now(),
    round: state.meta.round,
    role: me.role,
    specific: me.specific,
    won: iWon,
    winner: state.meta.winner,
    winnerSpecific: state.meta.winner != null ? state.players[state.meta.winner]?.specific : null,
    reason: state.meta.winReason,
    hp: me.hp,
    rep: me.resources.rep,
    asset: assetValue(me, state.stocks, state),
    raids: state.meta.raidsThisGame?.[0] || 0,
    tl: me.tl,
    achievements: me.achievements.length,
    zones: Object.values(state.map).filter(c => c.owner === 0).length,
  };
};
const formatHistoryTime = (ts) => {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};

const coord = (col, row) => String.fromCharCode(65 + col) + (row + 1);
// v0.7.3: 두 번째 인자 maxIdx (0-based 최대 인덱스). 5×5는 4, 11×11은 10. 미지정 시 10 (큰 보드).
const coordsAdj = (c, maxIdx = 10) => {
  const col = c.charCodeAt(0) - 65;
  const row = parseInt(c.slice(1)) - 1;
  return [
    col > 0      ? coord(col - 1, row) : null,
    col < maxIdx ? coord(col + 1, row) : null,
    row > 0      ? coord(col, row - 1) : null,
