<!-- ── 부트 실패 핸들러 + 워치독 (vendor 로드 전에 정의) [54차] — 조용한 실패 금지 ── -->
<script>
(function () {
  window.__bootFail = function (asset) {
    if (window.__bootFailed) return;
    window.__bootFailed = true;
    if (window.__bootWatch) { clearTimeout(window.__bootWatch); window.__bootWatch = null; }
    var b = document.getElementById('boot');
    if (!b) return;
    b.className = 'boot-error';
    b.innerHTML =
      '<div class="boot-box">' +
        '<div class="boot-fail-title">SYSTEM BOOT FAILED</div>' +
        '<div class="boot-asset">자산 로드 실패: ' + String(asset).replace(/[<>&]/g, '') + '</div>' +
        '<div class="boot-hint">네트워크를 확인한 뒤 재시도하세요</div>' +
        '<button class="boot-retry" onclick="location.reload()">재시도</button>' +
      '</div>';
  };
  window.__bootWatch = setTimeout(function () {
    if (!document.getElementById('boot')) return;
    var miss = [];
    if (typeof React === 'undefined') miss.push('react');
    if (typeof ReactDOM === 'undefined') miss.push('react-dom');
    if (typeof Babel === 'undefined') miss.push('babel');
    if (miss.length) window.__bootFail(miss.join(', '));
  }, 20000);
})();
</script>

<!-- ── UI (JSX 트랜스파일 표면은 이 text/babel 블록으로 한정 [G4]) ── -->
<script type="text/babel" data-presets="react">
'use strict';
const { useReducer, useState, useEffect, useRef, useMemo } = React;
const STORE = window.RPG_STORE, CH = window.RPG_CHARACTER, AB = window.RPG_ABILITIES,
      GRID = window.RPG_GRID, PROJ = window.RPG_PROJECTION, LORE = window.RPG_LORE,
      SAVE = window.RPG_SAVE, ATTRS = window.RPG_ATTRS, CAMP = window.RPG_CAMPAIGN;
// 활성 미션 = 진행 중 대화/전투의 missionId 를 레지스트리로 해석 (ch01 폴백).
function missionOf(state) {
  const id = (state.dialogue && state.dialogue.missionId) || (state.combat && state.combat.missionId);
  return (id && CAMP.missionData(id)) || (window.RPG_MISSION_CH01 && window.RPG_MISSION_CH01.MISSION);
}
function chLabel(entry) { return entry && entry.chapter ? ('CH' + (entry.chapter < 10 ? '0' + entry.chapter : entry.chapter)) : ''; }
// [48차] 클래스 정체성 한줄 태그라인 + 킷 라벨 (4클래스 UI 표기 · 하드코딩 분기 제거).
const CLASS_TAGLINE = { CIPHER: '정보전의 유령', BLADE: '거리의 집행관', RIGGER: '설치/제어의 정비공', MOLE: '위장/침투의 첩자' };
const CLASS_KITLABEL = { CIPHER: '해킹 킷', BLADE: '근접 킷', RIGGER: '설치·제어 킷', MOLE: '위장·침투 킷' };
function classTagline(k) { return CLASS_TAGLINE[k] || '운영자'; }
function classKitLabel(k) { return CLASS_KITLABEL[k] || '히어로 킷'; }
const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── 타자기 텍스트 (탭하면 즉시 완성, reduced-motion 존중) ──
function Typewriter({ text, speed = 16 }) {
  const [n, setN] = useState(reducedMotion ? text.length : 0);
  useEffect(() => {
    if (reducedMotion) { setN(text.length); return; }
    setN(0);
    let i = 0; const id = setInterval(() => { i += 2; setN(i); if (i >= text.length) clearInterval(id); }, speed);
    return () => clearInterval(id);
  }, [text]);
  return <div className="tw" onClick={() => setN(text.length)}>{text.slice(0, n)}{n < text.length ? <span className="caret">▊</span> : null}</div>;
}

// ── 초상 (팔레트 CSS 글리치 카드, 아트 0) ──
function Portrait({ kind }) {
  return <div className={'portrait ' + (kind === 'bloc' ? 'bloc' : '')}>{kind === 'bloc' ? '🎙' : '🎭'}</div>;
}

function TopBar({ save, onSave, view, onToggleView }) {
  const ch = save.character;
  const iso = view === 'iso';
  return (
    <div className="topbar">
      <a className="home-link" href="../index.html" title="홈으로">⌂</a>
      <span className="brand">GHOSTGRID</span>
      <span className="stat">{ch.icon || '👤'} {ch.classKey} <b>{ch.codename || ''}</b></span>
      <span className="spacer" />
      <button className={'chip viewtoggle' + (iso ? ' iso' : '')} onClick={onToggleView}
        title={'전투 뷰: ' + (iso ? '아이소 (탭 시 탑다운)' : '탑다운 (탭 시 아이소)')} style={{cursor:'pointer'}}>
        {iso ? '◈ ISO' : '▦ TOP'}
      </button>
      <span className="chip rep">★{ch.rep}</span>
      <span className="chip karma">karma {ch.karma}</span>
      <span className="chip">₵{ch.nuyen}</span>
      <button className="chip" onClick={onSave} style={{cursor:'pointer'}}>💾 세이브</button>
    </div>
  );
}

function Banner({ banner, dispatch }) {
  if (!banner) return null;
  return (
    <div className={'banner ' + banner.kind} onClick={() => dispatch({ type: 'CLEAR_BANNER' })}>
      {banner.text ? <div>{banner.text}</div> : null}
      {banner.lines ? <ul>{banner.lines.map((l, i) => <li key={i}>{l}</li>)}</ul> : null}
    </div>
  );
}

// ── 지난 작전 결과 패널 (대화 분기 영속을 허브에 반영) ──
function LastOpPanel({ flags }) {
  if (!flags || !flags.firstBlood) return null;
  const style = flags.extractionStyle;
  const hero = flags.heroChoice;
  const chips = [];
  if (style === 'quiet') chips.push({ t: '🕊 무흔적 추출', c: 'cyan' });
  else if (style === 'loud') chips.push({ t: '🔊 소란한 강습', c: 'magenta' });
  if (hero === 'hero') chips.push({ t: '★ 영웅 — 정체 공개 (모든 블록 적대)', c: 'magenta' });
  else if (hero === 'ghost') chips.push({ t: '👻 유령 — 은폐 (레이드 +50%)', c: 'cyan' });
  if (flags.plantedBackdoor) chips.push({ t: '🚪 백도어 잠복', c: 'green' });
  return (
    <div className="lastop">
      <div className="lab">지난 작전 · First Blood — 다음 미션에 영속 반영</div>
      <div className="lastop-chips">{chips.map((k, i) => <span key={i} className={'opchip ' + k.c}>{k.t}</span>)}</div>
    </div>
  );
}

// ── 로스터 (플레이어블 클래스 선택 → 다른 빌드로 같은 미션 재완주) ──
function Roster({ state, dispatch }) {
  const cur = state.save.character.classKey;
  const playable = (window.RPG_CLASSES.PLAYABLE || ['CIPHER', 'BLADE']);
  return (
    <div className="sheet">
      <button className="btn ghost" onClick={() => dispatch({ type: 'HUB_NAV', node: 'root' })}>← 허브</button>
      <h1 style={{ color: 'var(--cyan)', fontFamily: 'monospace', margin: '4px 0' }}>크루 / 로스터</h1>
      <p className="sub" style={{ color: 'var(--text-dim)' }}>운영자를 편성한다. 같은 미션을 다른 빌드로 완주 — CIPHER 해킹 · BLADE 근접 · RIGGER 설치/제어 · MOLE 위장/침투.</p>
      {playable.map(key => {
        const cl = window.RPG_CLASSES.CLASSES[key];
        const active = cur === key;
        const q = LORE.quote(key);
        return (
          <div key={key} className={'rosterCard' + (active ? ' active' : '')}>
            <div className="rc-head">
              <span className="rc-ic">{cl.icon}</span>
              <span className="rc-nm">{cl.key} · {cl.codename}</span>
              {active ? <span className="rc-badge">편성됨</span> : null}
            </div>
            <div className="rc-stats">❤{cl.hp*2} ⚔{cl.atk} 🛡{cl.def} ⚡{cl.spd} 💻{cl.hack} · {ATTRS.ATTRS[cl.primary].sym}/{ATTRS.ATTRS[cl.secondary].sym}</div>
            <div className="rc-note">{cl.note}{cl.passive ? ' · ' + cl.passive : ''}</div>
            {q ? <div className="rc-quote">{q.line}</div> : null}
            <button className="btn" disabled={active} onClick={() => dispatch({ type: 'SELECT_CLASS', classKey: key })}>
              {active ? '현재 편성' : (cl.key + ' 편성')}
            </button>
          </div>
        );
      })}
      <p className="hint" style={{ color: 'var(--text-dim)' }}>편성 전환 시 해당 빌드로 새 운영자를 배치합니다(성장 초기화). 캠페인 진행은 유지됩니다.</p>
    </div>
  );
}

// ── 미션 카드 (메인 체인 / 사이드 보드 공용) ──
//  row = { id, kind, chapter, unlocked, cleared, hint }  (CAMP.boardState 산출)
function MissionCard({ row, current, dispatch }) {
  const entry = CAMP.missionById(row.id);
  const isCurrent = row.id === current;
  // 미해금: 메인은 챕터 번호 + 힌트, 사이드는 ??? + 힌트 (미리보기 은폐).
  if (!row.unlocked) {
    return (
      <div className={'mcard locked ' + row.kind}>
        <span className="mc-ttl">🔒 {row.kind === 'side' ? '??? — 미해금 계약' : chLabel(entry)}</span>
        <span className="mc-hint">{row.hint}</span>
      </div>
    );
  }
  const m = CAMP.missionData(row.id);
  const title = (m && m.title) || row.id;
  const subtitle = (m && m.subtitle) || '';
  let tag;
  if (row.cleared) tag = '✅ 클리어 · 재입장(축소 보상)';
  else if (isCurrent) tag = '▶ 현재 작전 · 전액 보상';
  else tag = '신규 · 최초 클리어 전액 보상';
  return (
    <button className={'mcard' + (isCurrent ? ' current' : '') + (row.cleared ? ' cleared' : '')}
      onClick={() => dispatch({ type: 'START_MISSION', missionId: row.id })}>
      <span className="mc-ttl">{row.cleared ? '✅ ' : (isCurrent ? '▶ ' : '')}{title}</span>
      <span className="mc-sub">{subtitle}</span>
      <span className="mc-tag">{tag}</span>
    </button>
  );
}

// ── 미션 보드 (메인 체인 1→8 순차 해금 · 사이드 계약 보드) ──
function MissionBoard({ state, dispatch }) {
  const board = CAMP.boardState(state.save);
  const sideVisible = board.sides.filter(s => s.unlocked).length;
  return (
    <div className="sheet mboard">
      <button className="btn ghost" onClick={() => dispatch({ type: 'HUB_NAV', node: 'root' })}>← 허브</button>
      <h1 style={{ color: 'var(--cyan)', fontFamily: 'monospace', margin: '4px 0' }}>미션 보드</h1>
      <p className="sub" style={{ color: 'var(--text-dim)' }}>
        메인 캠페인은 챕터 1→8 순차 해금. 사이드 계약은 조건 충족 시 개방. 최초 클리어만 전액·챕터 효과·해금.
      </p>
      <div className="board-sec">MAIN — 캠페인 체인 ({board.mains.filter(m => m.cleared).length}/{board.mains.length} 클리어)</div>
      <div className="mission-list">
        {board.mains.map(row => <MissionCard key={row.id} row={row} current={board.current} dispatch={dispatch} />)}
      </div>
      <div className="board-sec">SIDE — 계약 보드 ({sideVisible}/{board.sides.length} 개방)</div>
      <div className="mission-list">
        {board.sides.map(row => <MissionCard key={row.id} row={row} current={board.current} dispatch={dispatch} />)}
      </div>
    </div>
  );
}

// ── 허브 ──
function Hub({ state, dispatch, openSave }) {
  const node = state.hub.node;
  const save = state.save;
  const ch = save.character;
  const threat = CAMP.threatGauge((save.missionsDone || []).length * 3, 0, 10);
  if (node === 'sheet') return <CharacterSheet state={state} dispatch={dispatch} />;
  if (node === 'roster') return <Roster state={state} dispatch={dispatch} />;
  if (node === 'save') return <SaveMenu state={state} dispatch={dispatch} back={() => dispatch({ type: 'HUB_NAV', node: 'root' })} />;
  if (node === 'missions') return <MissionBoard state={state} dispatch={dispatch} />;
  const board = CAMP.boardState(save);
  const clearedCount = board.mains.filter(m => m.cleared).length + board.sides.filter(s => s.cleared).length;
  const curEntry = board.current ? CAMP.missionById(board.current) : null;
  const missionNote = board.current
    ? ('▶ ' + chLabel(curEntry) + ' 진행 중 · 클리어 ' + clearedCount + '/' + board.mains.length + '+side')
    : ('전 챕터 클리어 · 클리어 ' + clearedCount);
  return (
    <div className="hub">
      <h1>안전가옥 — ASHGRID</h1>
      <p className="sub">{ch.icon} {ch.classKey} / {ch.codename} · {classTagline(ch.classKey)}</p>
      <LastOpPanel flags={save.flags} />
      <div className="hub-grid">
        <button className="hub-node" onClick={() => dispatch({ type: 'HUB_NAV', node: 'missions' })}>
          <span className="ic">🎯</span><span className="lb">미션 보드</span>
          <span className="nt">{missionNote}</span>
        </button>
        <button className="hub-node" onClick={() => dispatch({ type: 'HUB_NAV', node: 'sheet' })}>
          <span className="ic">📋</span><span className="lb">캐릭터 시트</span>
          <span className="nt">karma {ch.karma} 지출 가능</span>
        </button>
        <button className="hub-node" onClick={() => dispatch({ type: 'HUB_NAV', node: 'roster' })}>
          <span className="ic">👥</span><span className="lb">크루 / 로스터</span>
          <span className="nt">4클래스 빌드 전환 (해킹·근접·설치·위장)</span>
        </button>
        <button className="hub-node stub" onClick={() => dispatch({ type: 'HUB_NAV', node: 'root' })}>
          <span className="ic">🛒</span><span className="lb">상점 / 의료</span><span className="nt">HELIX 회복 (Stage 3)</span>
        </button>
      </div>
      <div className="threat">
        <div className="lab">SIGNAL 추적 / 캠페인 위협 {threat.value}/{threat.cap} · 전투 노출은 미션 내 게이지로 실동</div>
        <div className="bar"><i style={{ width: Math.min(100, threat.value / threat.cap * 100) + '%' }} /></div>
      </div>
      <button className="btn ghost" onClick={openSave}>💾 세이브 / 문자열 export·import</button>
    </div>
  );
}

// ── 캐릭터 시트 (karma 지출 → 유효 스탯 반영) ──
function CharacterSheet({ state, dispatch }) {
  const ch = state.save.character;
  const eff = CH.effectiveStats(ch);
  const rows = [
    { k: 'hp',  nm: '❤ HP (유효)', vl: eff.maxHp, grow: 'hp' },
    { k: 'atk', nm: '⚔ ATK',       vl: eff.atk,   grow: 'atk' },
    { k: 'def', nm: '🛡 DEF',       vl: eff.def,   grow: 'def' },
    { k: 'spd', nm: '⚡ SPD (MOV ' + eff.mov + ')', vl: eff.spd, grow: 'spd' },
    { k: 'hack','nm': '💻 HACK',    vl: eff.hack,  grow: 'hack' },
  ];
  const cl = window.RPG_CLASSES.CLASSES[ch.classKey];
  return (
    <div className="sheet">
      <button className="btn ghost" onClick={() => dispatch({ type: 'HUB_NAV', node: 'root' })}>← 허브</button>
      <h1 style={{ color: 'var(--cyan)', fontFamily: 'monospace', margin: '4px 0' }}>{ch.icon} {ch.classKey} · {ch.codename}</h1>
      <p className="sub" style={{ color: 'var(--text-dim)' }}>
        주{ATTRS.ATTRS[ch.primary].sym} 부{ATTRS.ATTRS[ch.secondary].sym} · 시그널 정렬 {ch.signalFavor === 'iron' ? '🔴DOWN' : '🔵UP'}
        {ch.passive ? <span> · {ch.passive}</span> : null}
      </p>
      <p className="sub" style={{ color: 'var(--text-dim)' }}>karma를 스탯에 직접 지출 (레벨 없음). karma 잔여 <b style={{color:'var(--orange)'}}>{ch.karma}</b></p>
      {rows.map(r => (
        <div className="statline" key={r.k}>
          <span className="nm">{r.nm}</span>
          <span className="vl">{r.vl}{ch.growth[r.grow] ? <small style={{color:'var(--green)'}}> +{ch.growth[r.grow]}</small> : null}</span>
          <button disabled={ch.karma < 1} onClick={() => dispatch({ type: 'SPEND_KARMA', stat: r.grow })}>+1</button>
        </div>
      ))}
      <div style={{ marginTop: 8 }}>
        <div className="sub" style={{ color: 'var(--text-dim)', marginBottom: 6 }}>{classKitLabel(ch.classKey)}</div>
        <div className="kit">{ch.kit.map(k => <span className="ab" key={k}>{AB.ABILITIES[k].icon} {AB.ABILITIES[k].name}</span>)}</div>
      </div>
      <AffinityMatrix />
    </div>
  );
}

// ── 상성 매트릭스 6종 전체 (docs/06 §6 계승) — 표시 체감 확대 ──
function AffinityMatrix({ compact }) {
  const [open, setOpen] = useState(false);
  const mtx = ATTRS.matrix();
  return (
    <div className="matrix">
      <button className="matrix-toggle" onClick={() => setOpen(!open)}>⚔ 속성 상성표 {open ? '▲' : '▼'}</button>
      {open ? (
        <div className="matrix-grid">
          {mtx.map((m, i) => (
            <span key={i} className="mrow">
              <b style={{ color: m.atkColor }}>{m.atkSym}</b>
              <span className="arr">▶</span>
              <b style={{ color: m.defColor }}>{m.defSym}</b>
              <small>+1</small>
            </span>
          ))}
        </div>
      ) : null}
    </div>
  );
}

// ── 세이브 메뉴 (localStorage + 문자열 export/import) ──
function SaveMenu({ state, dispatch, back }) {
  const [txt, setTxt] = useState('');
  const [msg, setMsg] = useState('');
  return (
    <div className="savemenu">
      <button className="btn ghost" onClick={back}>← 뒤로</button>
      <p className="hint">파일:// 오리진에서 localStorage가 비워질 수 있어 문자열 export/import가 안전판입니다 (G11).</p>
      <div className="btn-row">
        <button className="btn" onClick={() => { const ok = SAVE.saveLocal(state.save); setMsg(ok ? 'localStorage 저장됨' : 'localStorage 불가 — 문자열 사용'); }}>localStorage 저장</button>
        <button className="btn ghost" onClick={() => { const s = SAVE.loadLocal(); if (s) { dispatch({ type: 'LOAD_SAVE', save: s }); setMsg('불러옴'); } else setMsg('저장본 없음'); }}>불러오기</button>
      </div>
      <button className="btn" onClick={() => { setTxt(SAVE.exportString(state.save)); setMsg('export 문자열 생성 — 복사하세요'); }}>세이브 문자열 export ⬇</button>
      <textarea value={txt} onChange={e => setTxt(e.target.value)} placeholder="세이브 문자열을 붙여넣고 import" spellCheck="false" />
      <button className="btn" onClick={() => { const r = SAVE.importString(txt); if (r.ok) { dispatch({ type: 'LOAD_SAVE', save: r.save }); setMsg('import 성공 — 복원됨'); } else setMsg('import 실패: ' + r.error); }}>세이브 문자열 import ⬆</button>
      {msg ? <p className="hint" style={{ color: 'var(--green)' }}>{msg}</p> : null}
    </div>
  );
}

// ── 대화 오버레이 (활성 클래스에 따라 고스트 발화자 전환) ──
function DialogueOverlay({ state, dispatch }) {
  const mission = missionOf(state);
  const node = mission.dialogue.nodes[state.dialogue.nodeId];
  const ctx = STORE.dialogueCtx(state);
  const ch = state.save.character;
  const isBloc = node.portrait === 'bloc';
  const person = LORE.person(ch.classKey);
  const ghostName = (person && person.data.codename) || ch.codename || ch.classKey;
  const ghostReal = (person && person.data.realName) || '';
  // 고스트 인용은 활성 클래스 명대사(원문 고정), 블록 인용은 노드 지정 발화자.
  const q = node.quote ? (isBloc ? LORE.quote(node.quote) : LORE.quote(ch.classKey)) : null;
  // 블록 발화자명은 노드 speaker (미션별: VANTA/AXIOM/IRONWALL…) — 하드코딩 제거.
  const blocName = node.speaker || 'BLOC';
  // 오프닝 전문은 미션당 최초 1회만. 재방문(openingSeen) 시 요약 1줄 + 스킵 안내.
  const isStart = state.dialogue.nodeId === mission.dialogue.start;
  const collapsedOpening = isStart && state.dialogue.openingSeen;
  const bodyText = collapsedOpening
    ? ((mission.refrain || mission.subtitle || node.text.split('\n')[0]))
    : node.text;
  return (
    <div className="dialogue">
      <div className="portrait-row">
        <Portrait kind={node.portrait} />
        <div>
          <div className={'speaker ' + (isBloc ? 'bloc' : '')}>
            {isBloc ? blocName : ghostName}
            <small>{isBloc ? (mission.title || 'BLOC DIRECTIVE') : (ghostReal ? ghostName + ' · ' + ghostReal : ghostName)}</small>
          </div>
        </div>
      </div>
      <div className="textbox">
        {collapsedOpening ? <div className="opening-skip">↺ 오프닝 열람 완료 — 요약만 표시</div> : null}
        <Typewriter text={bodyText} />
        {q ? <div className={'quote-bubble ' + (isBloc ? 'bloc' : '')}>{q.line}</div> : null}
      </div>
      <div className="choices">
        {node.choices.map((c, i) => {
          const st = window.RPG_DIALOGUE.choiceState(c, ctx);
          if (st === 'hidden') return null;
          const gated = !!c.gate;
          return (
            <button key={i} className={'choice ' + (gated ? 'gate ' : '') + (st === 'gray' ? 'gray' : '')}
              onClick={() => dispatch({ type: 'DIALOGUE_CHOOSE', index: i })}>
              {c.label}
              {c.desc ? <span className="desc">{c.desc}</span> : null}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── 전투 ──
function Combat({ state, dispatch, view }) {
  const c = state.combat;
  const p = STORE.player(c);
  const sel = AB.ABILITIES[c.selectedAbility];
  const TILE = 56; // projection.left/top 계산용 논리 픽셀 (CSS var 로 실제 스케일)
  const mode = view === 'square' ? 'square' : 'iso'; // 기본 아이소, 폴백 탑다운
  const dim = { cols: c.field.cols, rows: c.field.rows };
  // 이동 범위
  const blocked = GRID.buildBlocked(c.field, c.units, 'cipher');
  const reach = GRID.bfsRange({ x: p.x, y: p.y }, p.mov, blocked, c.field.cols, c.field.rows);
  // 텔레그래프 셀
  const threatTiles = {}; const threatMoveTiles = {};
  c.telegraphs.forEach(t => { if (t.attackTile) threatTiles[t.attackTile.x + ',' + t.attackTile.y] = true;
    if (t.moveTile) threatMoveTiles[t.moveTile.x + ',' + t.moveTile.y] = true; });
  // 조준 가능 적
  function canTarget(u) {
    if (u.side !== 'enemy' || u.hp <= 0) return false;
    if (sel.kind === 'ULTIMATE' || sel.kind === 'PASSIVE') return false;
    if (u.physImmune && !sel.useHack) return false;
    if (p.ap < sel.ap || (p.cooldowns[c.selectedAbility] || 0) > 0) return false;
    return GRID.chebyshev(p, u) <= sel.range && GRID.lineOfSight(p, u, c.field);
  }
  const adjObj = GRID.chebyshev(p, c.objective) <= 1 && !c.objective.done;
  const objByForce = p.hack < p.atk; // BLADE 등 물리 축 → 강습
  const sig = c.signal || { key: 'UP', sym: '🔵', label: 'MESH UP', desc: '' };
  const th = c.threat || { value: 0, cap: 8, alarm: false };
  // 피격 플래시: dmg/miss 부유 텍스트가 있는 타일의 유닛을 flash [G7 juice]
  const hitTiles = {}; (c.floaters || []).forEach(f => { if (f.kind === 'dmg' || f.kind === 'miss') hitTiles[f.x + ',' + f.y] = true; });

  function tileClass(x, y) {
    let cls = 'tile' + ((x + y) % 2 ? ' alt' : '');
    const cov = c.field.cover.find(k => k.x === x && k.y === y);
    if (cov) cls += ' cover' + (cov.type === 'full' ? ' full' : '');
    if (c.field.walls.find(w => w.x === x && w.y === y)) cls += ' wall';
    if (c.objective.x === x && c.objective.y === y) cls += ' obj';
    if (reach[x + ',' + y] > 0 && !c.field.cover.find(k=>k.x===x&&k.y===y)) cls += ' move';
    if (threatTiles[x + ',' + y]) cls += ' threat';
    else if (threatMoveTiles[x + ',' + y]) cls += ' threat-move';
    const enemyHere = c.units.find(u => u.x === x && u.y === y && u.side === 'enemy' && u.hp > 0);
    if (enemyHere && canTarget(enemyHere)) cls += ' target';
    return cls;
  }
  function onTile(x, y) {
    if (c.outcome) return;
    const enemyHere = c.units.find(u => u.x === x && u.y === y && u.side === 'enemy' && u.hp > 0);
    if (enemyHere && canTarget(enemyHere)) { dispatch({ type: 'COMBAT_ATTACK', targetId: enemyHere.id, ability: c.selectedAbility }); return; }
    if (reach[x + ',' + y] > 0 && !c.field.cover.find(k=>k.x===x&&k.y===y)) { dispatch({ type: 'COMBAT_MOVE', tile: { x, y } }); return; }
  }

  // 자동 floater 정리
  useEffect(() => {
    if (c.floaters && c.floaters.length) { const id = setTimeout(() => dispatch({ type: 'COMBAT_CLEAR_FLOATERS' }), 1050); return () => clearTimeout(id); }
  }, [c.floaters]);

  // 투영 병진 → CSS calc (tx/ty 는 --tile 배수, iso 는 소수 가능). 룰 무관, 표시층만.
  const posStyle = (px, py, extra) => {
    const pr = PROJ.project(px, py, TILE, dim, mode);
    return Object.assign({ left: 'calc(' + pr.tx + ' * var(--tile))', top: 'calc(' + pr.ty + ' * var(--tile))', zIndex: pr.z }, extra || {});
  };
  const tiles = [];
  for (let y = 0; y < c.field.rows; y++) for (let x = 0; x < c.field.cols; x++) {
    const cov = c.field.cover.find(k => k.x === x && k.y === y);
    const pr = PROJ.project(x, y, TILE, dim, mode);
    tiles.push(<div key={'t' + x + '_' + y} className={tileClass(x, y)} data-tile={x + ',' + y}
      style={{ left: 'calc(' + pr.tx + ' * var(--tile))', top: 'calc(' + pr.ty + ' * var(--tile))' }} onClick={() => onTile(x, y)}>
      {cov ? <span className="cover-ic">{cov.type === 'full' ? '▩' : '▣'}</span> : null}
      {(c.objective.x === x && c.objective.y === y) ? <span className="obj-badge">{c.objective.done ? '✔' : c.objective.threshold}</span> : null}
    </div>);
  }
  const units = c.units.filter(u => u.hp > 0).map(u => {
    const cls = 'unit ' + u.side + (u.ai === 'static' ? ' static' : '') + (u.status && (u.status.stealth || u.status.invuln) ? ' stealth' : '')
      + (hitTiles[u.x + ',' + u.y] ? ' hit' : '');
    return <div key={u.id} className={cls} style={posStyle(u.x, u.y)}>
      <div className="body" title={u.name}>{u.icon}
        <div className="hpbar"><i style={{ width: (u.hp / u.maxHp * 100) + '%' }} /></div>
      </div>
    </div>;
  });
  const floaters = (c.floaters || []).map((f, i) => (
    <div key={'f' + i} className={'floater ' + f.kind + (f.crit ? ' crit' : '')}
      style={posStyle(f.x, f.y, { width: 'var(--tile)', textAlign: 'center', zIndex: 30 })}>{f.text}</div>
  ));

  const bsz = PROJ.boardSize(c.field.cols, c.field.rows, mode);
  const boardW = 'calc(' + bsz.w + ' * var(--tile))';
  const boardH = 'calc(' + bsz.h + ' * var(--tile))';

  return (
    <div className="combat">
      <div className="combat-top">
        <span className="rnd">ROUND {c.round}</span>
        <span className={'sigpill sig-' + sig.key} title={sig.desc}>{sig.sym} {sig.label}</span>
        <span className="obj">🎯 방어도 {c.objective.done ? '돌파✔' : c.objective.threshold}</span>
        <span>❤ {p.hp}/{p.maxHp}</span>
        <span className="spacer" />
        {p.status && p.status.stealth ? <span style={{color:'var(--cyan)'}}>👻 은신</span> : null}
        {p.status && p.status.invuln ? <span style={{color:'var(--yellow)'}}>🛡 무적</span> : null}
      </div>
      <div className={'threat-combat' + (th.alarm ? ' alarm' : '')}>
        <span className="tlab">위협/노출 {th.value}/{th.cap}{th.alarm ? ' · ⚠ 경보 · 증원' : ''}</span>
        <div className="tbar"><i style={{ width: Math.min(100, th.value / th.cap * 100) + '%' }} /></div>
      </div>
      <div className="board-wrap">
        <div className={'board' + (mode === 'iso' ? ' iso' : '')} style={{ width: boardW, height: boardH }}>
          {tiles}{units}{floaters}
        </div>
      </div>

      {c.outcome ? (
        <div className="hud">
          <div className="banner" style={{ borderColor: c.outcome === 'win' ? 'var(--green)' : 'var(--magenta)', color: c.outcome === 'win' ? 'var(--green)' : 'var(--magenta)', margin: 0 }}>
            {c.outcome === 'win' ? ('★ 미션 성공' + (c.objective && c.objective.dataTB ? ' — ' + c.objective.dataTB + 'TB 유출' : ' — 목표 달성')) : '미션 실패 — 다운'}
          </div>
          <button className="btn" onClick={() => dispatch({ type: 'COMBAT_RESOLVE' })}>계속</button>
        </div>
      ) : (
        <div className="hud">
          <div className="ap-row">
            <span>AP</span>
            <span className="ap-pips">{Array.from({ length: Math.max(p.ap, p.maxAp) }).map((_, i) => <i key={i} className={i < p.ap ? 'on' : ''} />)}</span>
            <span className="spacer" style={{flex:1}} />
            {adjObj ? <button className="btn" style={{ width: 'auto', padding: '8px 12px' }} onClick={() => dispatch({ type: 'COMBAT_HACK' })} disabled={p.ap < 1}>{objByForce ? '🗡 서버 랙 강습' : '💻 서버 랙 해킹'}</button> : null}
          </div>
          <div className="abilities">
            {p.kit.filter(k => AB.ABILITIES[k].kind !== 'PASSIVE').map(k => {
              const a = AB.ABILITIES[k];
              const cd = p.cooldowns[k] || 0;
              const dis = p.ap < a.ap || cd > 0 || (a.oncePerMission && p.ultUsed);
              return <button key={k} className={'ability' + (c.selectedAbility === k ? ' sel' : '')} disabled={a.kind === 'ULTIMATE' ? dis : false}
                onClick={() => { if (a.kind === 'ULTIMATE') { if (!dis) dispatch({ type: 'COMBAT_ATTACK', targetId: null, ability: k }); } else dispatch({ type: 'COMBAT_SELECT', ability: k }); }}>
                <span className="an">{a.icon} {a.name}</span>
                <span className="ameta">{a.ap}AP{a.cooldown ? ' · cd' + a.cooldown : ''}{cd > 0 ? ' · 대기' + cd : ''}{a.oncePerMission ? (p.ultUsed ? ' · 소진' : ' · 1회') : ''}</span>
              </button>;
            })}
          </div>
          <div className="hud-actions">
            <button className="btn ghost" onClick={() => dispatch({ type: 'COMBAT_END_TURN' })}>턴 종료 ▶ 적 행동</button>
          </div>
        </div>
      )}
      <div className="log">{c.log.slice().reverse().slice(0, 8).map((l, i) => <div key={i}>{l}</div>)}</div>
      <AffinityMatrix />
    </div>
  );
}

// ── 앱 (씬 라우터) ──
function App() {
  const [state, dispatch] = useReducer(STORE.rpgReducer, undefined, STORE.rpgInitialState);
  const [saveOpen, setSaveOpen] = useState(false);
  // 전투 투영 뷰: 기본 아이소(섀도우런 룩), 탑다운 폴백. localStorage 영속.
  const [view, setView] = useState(() => {
    try { const v = localStorage.getItem('rpg.viewMode'); return (v === 'square' || v === 'iso') ? v : 'iso'; }
    catch (e) { return 'iso'; }
  });
  const toggleView = () => setView(v => {
    const nv = v === 'iso' ? 'square' : 'iso';
    try { localStorage.setItem('rpg.viewMode', nv); } catch (e) {}
    return nv;
  });
  // 자동세이브: 허브 귀환 시 localStorage (안전판은 문자열).
  useEffect(() => { if (state.scene === 'hub') { try { SAVE.saveLocal(state.save); } catch (e) {} } }, [state.scene, state.save]);

  let scene;
  if (saveOpen) scene = <SaveMenu state={state} dispatch={dispatch} back={() => setSaveOpen(false)} />;
  else if (state.scene === 'combat') scene = <Combat state={state} dispatch={dispatch} view={view} />;
  else if (state.scene === 'dialogue') scene = <DialogueOverlay state={state} dispatch={dispatch} />;
  else scene = <Hub state={state} dispatch={dispatch} openSave={() => setSaveOpen(true)} />;

  return (
    <div className="rpg-app">
      <TopBar save={state.save} onSave={() => setSaveOpen(true)} view={view} onToggleView={toggleView} />
      <Banner banner={state.banner} dispatch={dispatch} />
      {scene}
    </div>
  );
}

// 마운트 성공 시 부트 스플래시 제거 + 워치독 해제. 실패 시 실패 UI 노출(조용한 실패 금지).
try {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  if (window.__bootWatch) { clearTimeout(window.__bootWatch); window.__bootWatch = null; }
  const boot = document.getElementById('boot'); if (boot) boot.remove();
} catch (e) {
  if (window.__bootFail) window.__bootFail('앱 초기화 오류: ' + ((e && e.message) || e));
}
