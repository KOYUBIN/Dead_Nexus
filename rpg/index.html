<!-- ── 부트 실패 핸들러 + 워치독 (vendor 로드 전에 정의) [54차] — 조용한 실패 금지 ── -->
<script>
(function () {
  window.__bootFail = function (asset) {
    if (window.__bootFailed) return;
    window.__bootFailed = true;
    if (window.__bootWatch) { clearTimeout(window.__bootWatch); window.__bootWatch = null; }
    var b = document.getElementById('boot');
    if (!b) return;
    b.className = 'boot-error';
    b.innerHTML =
      '<div class="boot-box">' +
        '<div class="boot-fail-title">SYSTEM BOOT FAILED</div>' +
        '<div class="boot-asset">자산 로드 실패: ' + String(asset).replace(/[<>&]/g, '') + '</div>' +
        '<div class="boot-hint">네트워크를 확인한 뒤 재시도하세요</div>' +
        '<button class="boot-retry" onclick="location.reload()">재시도</button>' +
      '</div>';
  };
  window.__bootWatch = setTimeout(function () {
    if (!document.getElementById('boot')) return;
    var miss = [];
    if (typeof React === 'undefined') miss.push('react');
    if (typeof ReactDOM === 'undefined') miss.push('react-dom');
    if (typeof Babel === 'undefined') miss.push('babel');
    if (miss.length) window.__bootFail(miss.join(', '));
  }, 20000);
})();
</script>

<script type="text/babel" data-presets="react">

const CLASS_TAGLINE = { CIPHER: '정보전의 유령', BLADE: '거리의 집행관', RIGGER: '설치/제어의 정비공', MOLE: '위장/침투의 첩자' };
const CLASS_KITLABEL = { CIPHER: '해킹 킷', BLADE: '근접 킷', RIGGER: '설치·제어 킷', MOLE: '위장·침투 킷' };

const CLASS_SPRITE = { CIPHER: 'px-cipher', BLADE: 'px-blade', RIGGER: 'px-rigger', MOLE: 'px-mole' };
const ENEMY_SPRITE = {

  RIVAL_GHOST: 'px-boss', KAI_MORROW: 'px-boss', MARCUS_CRANE: 'px-boss', VERA_ASHTON: 'px-boss', NEXUS_WARDEN: 'px-boss',
  // [61차 Act2] MERIDIAN 외부 세력 + lore 보스 — 기존 17장 재활용(신규 다운로드 0).

  MERIDIAN_WARLORD: 'px-boss', WARD_NODE: 'px-ice', ELIA_VOSS: 'px-boss', HARLAN_VOSS: 'px-boss',
};
function spriteForUnit(u) {
  if (!u) return null;
  if (u.side === 'player') return CLASS_SPRITE[u.classKey] || null;
  return ENEMY_SPRITE[u.key] || null;
}
// 스프라이트 <img> + 이모지 폴백. onError(404·file://·오프라인 안전판) 시 이모지 렌더.
function Glyph({ sprite, emoji, cls }) {
  const [broken, setBroken] = useState(false);
  if (sprite && !broken) {
    return <img className={'uspr' + (cls ? ' ' + cls : '')} src={SPRITE_BASE + sprite + '.png'}

  return <span className={'uemoji' + (cls ? ' ' + cls : '')}>{emoji}</span>;
}

  'side-04-medbay-heist': 'helix',   // HELIX 의료동 — 녹
  'side-05-informant-hit': 'nightlife', // 유흥가 뒷골목 — 네온 핫핑크

  'a2-c2-signal-war': 'nexus',           // 메시 심층 레이어 — 시안

function stageTheme(id) { return (id && STAGE_THEME[id]) || 'vanta'; }

// ── 타자기 텍스트 (탭하면 즉시 완성, reduced-motion 존중) ──
function Typewriter({ text, speed = 16 }) {
  const [n, setN] = useState(reducedMotion ? text.length : 0);
  useEffect(() => {
    if (reducedMotion) { setN(text.length); return; }
    setN(0);
    let i = 0; const id = setInterval(() => { i += 2; setN(i); if (i >= text.length) clearInterval(id); }, speed);
    return () => clearInterval(id);
  }, [text]);
  return <div className="tw" onClick={() => setN(text.length)}>{text.slice(0, n)}{n < text.length ? <span className="caret">▊</span> : null}</div>;
}

// ── 초상 (팔레트 CSS 글리치 카드, 아트 0) ──
function Portrait({ kind }) {

function TopBar({ save, onSave, view, onToggleView }) {

}

function Banner({ banner, dispatch }) {
  if (!banner) return null;

    <div className={'banner ' + banner.kind} onClick={() => dispatch({ type: 'CLEAR_BANNER' })}>

}

// ── 지난 작전 결과 패널 (대화 분기 영속을 허브에 반영) ──
function LastOpPanel({ flags }) {
  if (!flags || !flags.firstBlood) return null;
  const style = flags.extractionStyle;
  const hero = flags.heroChoice;
  const chips = [];
  if (style === 'quiet') chips.push({ t: '🕊 무흔적 추출', c: 'cyan' });
  else if (style === 'loud') chips.push({ t: '🔊 소란한 강습', c: 'magenta' });
  if (hero === 'hero') chips.push({ t: '★ 영웅 — 정체 공개 (모든 블록 적대)', c: 'magenta' });
  else if (hero === 'ghost') chips.push({ t: '👻 유령 — 은폐 (레이드 +50%)', c: 'cyan' });
  if (flags.plantedBackdoor) chips.push({ t: '🚪 백도어 잠복', c: 'green' });
  return (
    <div className="lastop">
      <div className="lab">지난 작전 · First Blood — 다음 미션에 영속 반영</div>
      <div className="lastop-chips">{chips.map((k, i) => <span key={i} className={'opchip ' + k.c}>{k.t}</span>)}</div>
    </div>
  );
}

// ── 로스터 (플레이어블 클래스 선택 → 다른 빌드로 같은 미션 재완주) ──
function Roster({ state, dispatch }) {
  const cur = state.save.character.classKey;
  const playable = (window.RPG_CLASSES.PLAYABLE || ['CIPHER', 'BLADE']);
  return (
    <div className="sheet">
      <button className="btn ghost" onClick={() => dispatch({ type: 'HUB_NAV', node: 'root' })}>← 허브</button>
      <h1 style={{ color: 'var(--cyan)', fontFamily: 'monospace', margin: '4px 0' }}>크루 / 로스터</h1>
      <p className="sub" style={{ color: 'var(--text-dim)' }}>운영자를 편성한다. 같은 미션을 다른 빌드로 완주 — CIPHER 해킹 · BLADE 근접 · RIGGER 설치/제어 · MOLE 위장/침투 · BROKER 중개/정보전 · DRIFTER 기동/충돌.</p>
      {playable.map(key => {
        const cl = window.RPG_CLASSES.CLASSES[key];
        const active = cur === key;
        const q = LORE.quote(key);
        return (
          <div key={key} className={'rosterCard' + (active ? ' active' : '')}>
            <div className="rc-head">
              <span className="rc-ic">{cl.icon}</span>
              <span className="rc-nm">{cl.key} · {cl.codename}</span>
              {active ? <span className="rc-badge">편성됨</span> : null}
            </div>
            <div className="rc-stats">❤{cl.hp*2} ⚔{cl.atk} 🛡{cl.def} ⚡{cl.spd} 💻{cl.hack} · {ATTRS.ATTRS[cl.primary].sym}/{ATTRS.ATTRS[cl.secondary].sym}</div>
            <div className="rc-note">{cl.note}{cl.passive ? ' · ' + cl.passive : ''}</div>
            {q ? <div className="rc-quote">{q.line}</div> : null}
            <button className="btn" disabled={active} onClick={() => dispatch({ type: 'SELECT_CLASS', classKey: key })}>
              {active ? '현재 편성' : (cl.key + ' 편성')}
            </button>
          </div>
        );
      })}
      <p className="hint" style={{ color: 'var(--text-dim)' }}>편성 전환 시 해당 빌드로 새 운영자를 배치합니다(성장 초기화). 캠페인 진행은 유지됩니다.</p>
    </div>
  );
}

// [62차] ACT 2 갈래 그룹 메타 — 엔딩 아이콘 + 잠금 게이트 힌트(보드 4갈래 표시).
//   endingSeen 게이트로 갈래 개방(NG+ 누적) · class 그룹은 classKey 게이트.
const ACT2_BRANCHES = [
  { key: 'framing', icon: '🌆', label: 'PROLOGUE — FRAMING (SILK 의뢰인 허브)', gateHint: 'CH08 완주 필요' },
  { key: 'A', icon: '🏙️', label: 'IRON CROWN (기업 영속)',   gateHint: '🏙️ CORPORATE ETERNAL 엔딩 열람 필요' },
  { key: 'B', icon: '🔥', label: 'ASH REPUBLIC (거리 봉기)',  gateHint: '🔥 STREET RISING 엔딩 열람 필요' },
  { key: 'C', icon: '🕊️', label: 'COUNCIL OF ASH (넥서스 재건)', gateHint: '🕊️ NEXUS REBORN 엔딩 열람 필요' },
  { key: 'D', icon: '💀', label: 'RUIN SURVIVORS (폐허 생존)', gateHint: '💀 DEAD NEXUS 엔딩 열람 필요' },
  { key: 'class', icon: '🧬', label: '클래스 전용 사이드', gateHint: '해당 클래스로 편성 필요' },
  { key: 'capstone', icon: '🌃', label: 'CAPSTONE — MERIDIAN FLAGSHIP (최종 결전)', gateHint: '4갈래 종결전 전부 클리어 필요' },
];

// ── 미션 카드 (메인 체인 / 사이드 보드 공용) ──
//  row = { id, kind, chapter, branch, unlocked, cleared, hint }  (CAMP.boardState 산출)
function MissionCard({ row, current, dispatch }) {
  const entry = CAMP.missionById(row.id);
  const isCurrent = row.id === current;
  // 미해금: 메인은 챕터 번호 + 힌트, 사이드는 ??? + 힌트 (미리보기 은폐).
  if (!row.unlocked) {
    // 미해금 표기: 메인=챕터 번호, 사이드=???, act2=??? (엔딩/클래스 게이트 힌트).
    let lockedTtl;
    if (row.kind === 'side') lockedTtl = '??? — 미해금 계약';
    else if (row.kind === 'act2') lockedTtl = '??? — ACT 2 미개방';
    else lockedTtl = chLabel(entry);
    return (
      <div className={'mcard locked ' + row.kind}>
        <span className="mc-ttl">🔒 {lockedTtl}</span>
        <span className="mc-hint">{row.hint}</span>
      </div>
    );
  }
  const m = CAMP.missionData(row.id);
  const title = (m && m.title) || row.id;
  const subtitle = (m && m.subtitle) || '';
  let tag;
  if (row.cleared) tag = '✅ 클리어 · 재입장(축소 보상)';
  else if (isCurrent) tag = '▶ 현재 작전 · 전액 보상';
  else tag = '신규 · 최초 클리어 전액 보상';
  return (
    <button className={'mcard' + (isCurrent ? ' current' : '') + (row.cleared ? ' cleared' : '')}
      onClick={() => { SFX('mission'); dispatch({ type: 'START_MISSION', missionId: row.id }); }}>
      <span className="mc-ttl">{row.cleared ? '✅ ' : (isCurrent ? '▶ ' : '')}{title}</span>
      <span className="mc-sub">{subtitle}</span>
      <span className="mc-tag">{tag}</span>
    </button>
  );
}

// ── 미션 보드 (메인 체인 1→8 순차 해금 · 사이드 계약 보드) ──
function MissionBoard({ state, dispatch }) {
  const board = CAMP.boardState(state.save);
  const sideVisible = board.sides.filter(s => s.unlocked).length;
  const act2 = board.act2 || [];
  const act2Visible = act2.filter(a => a.unlocked).length;
  return (
    <div className="sheet mboard">
      <button className="btn ghost" onClick={() => dispatch({ type: 'HUB_NAV', node: 'root' })}>← 허브</button>
      <h1 style={{ color: 'var(--cyan)', fontFamily: 'monospace', margin: '4px 0' }}>미션 보드</h1>
      <p className="sub" style={{ color: 'var(--text-dim)' }}>
        메인 캠페인은 챕터 1→8 순차 해금. 사이드 계약은 조건 충족 시 개방. 최초 클리어만 전액·챕터 효과·해금.
      </p>
      <div className="board-sec">MAIN — 캠페인 체인 ({board.mains.filter(m => m.cleared).length}/{board.mains.length} 클리어)</div>
      <div className="mission-list">
        {board.mains.map(row => <MissionCard key={row.id} row={row} current={board.current} dispatch={dispatch} />)}
      </div>
      <div className="board-sec">SIDE — 계약 보드 ({sideVisible}/{board.sides.length} 개방)</div>
      <div className="mission-list">
        {board.sides.map(row => <MissionCard key={row.id} row={row} current={board.current} dispatch={dispatch} />)}
      </div>
      {act2.length ? (
        <React.Fragment>
          <div className="board-sec act2-sec">🌆 ACT 2 — AFTER ZERO DAY ({act2Visible}/{act2.length} 개방){" "}
            <span style={{ color: 'var(--text-dim)', fontWeight: 'normal' }}>· 제로데이 이후 · MERIDIAN 외부 위협 · 엔딩 열람으로 갈래 개방(NG+ 누적)</span>
          </div>
          {ACT2_BRANCHES.map(br => {
            const rows = act2.filter(r => (r.branch || 'framing') === br.key);
            if (!rows.length) return null;
            const grpVisible = rows.filter(r => r.unlocked).length;
            const allLocked = grpVisible === 0;
            return (
              <React.Fragment key={br.key}>
                <div className={'board-sec act2-branch' + (allLocked ? ' locked' : '')}>
                  {br.icon} {br.label}{" "}
                  <span style={{ color: 'var(--text-dim)', fontWeight: 'normal' }}>
                    ({grpVisible}/{rows.length}){allLocked ? ' · 🔒 ' + br.gateHint : ''}
                  </span>
                </div>
                <div className="mission-list">
                  {rows.map(row => <MissionCard key={row.id} row={row} current={board.current} dispatch={dispatch} />)}
                </div>
              </React.Fragment>
            );
          })}
        </React.Fragment>
      ) : null}
    </div>
  );
}

// ── 장비/인텔 허브 요약 헬퍼 ──
function gearEquippedCount(ch) {
  const e = ch.equipment || {};
  return (e.weapon ? 1 : 0) + (e.cyberware ? 1 : 0);
}
function intelCount(save) { return Object.keys(save.intel || {}).length; }
// 장비 mods → 표기 문자열 (+ATK1 · maxHP−2 …). 순서 고정, 0 은 생략.
const MOD_LABEL = { atk: 'ATK', def: 'DEF', spd: 'SPD', hack: 'HACK', mov: 'MOV', maxHp: 'maxHP', cooldown: '쿨다운' };
function modsLabel(mods) {
  return ['atk','def','spd','hack','mov','maxHp','cooldown'].filter(k => mods[k]).map(k => {
    const v = mods[k];
    return MOD_LABEL[k] + (v > 0 ? ' +' + v : ' −' + Math.abs(v));
  }).join(' · ');
}

// ── 장비 상점 (허브) — 무기 개조 1 슬롯 + 사이버웨어 1 슬롯. ₵ 소비처 (경제 루프 실동) ──
function GearShop({ state, dispatch }) {
  const ch = state.save.character;
  const eq = ch.equipment || { weapon: null, cyberware: null };
  const owned = ch.gearOwned || [];
  const SLOT_META = { weapon: { ic: '🔧', lb: '무기 개조' }, cyberware: { ic: '🦿', lb: '사이버웨어' } };
  return (
    <div className="sheet">
      <button className="btn ghost" onClick={() => dispatch({ type: 'HUB_NAV', node: 'root' })}>← 허브</button>
      <h1 style={{ color: 'var(--cyan)', fontFamily: 'monospace', margin: '4px 0' }}>🛒 장비 상점</h1>
      <p className="sub" style={{ color: 'var(--text-dim)' }}>
        미션 ₵로 장비 구매·장착. 슬롯당 1종 — 소유 장비는 무료 교체. 효과는 유효 스탯에 즉시 반영(캐릭터 시트 확인).
        <b style={{ color: 'var(--orange)' }}> 보유 ₵{ch.nuyen}</b>
      </p>
      {GEAR.SLOTS.map(slot => {
        const meta = SLOT_META[slot];
        return (
          <div key={slot} className="gear-slot">
            <div className="board-sec">{meta.ic} {meta.lb} — 슬롯 {eq[slot] ? '장착: ' + GEAR.ITEMS[eq[slot]].name : '비어 있음'}</div>
            {GEAR.BY_SLOT[slot].map(key => {
              const it = GEAR.ITEMS[key];
              const isEquipped = eq[slot] === key;
              const isOwned = owned.indexOf(key) >= 0;
              const allowed = GEAR.canEquip(it, ch);
              const canAfford = ch.nuyen >= it.cost;
              let btnLabel, disabled;
              if (isEquipped) { btnLabel = '장착됨 ✔'; disabled = true; }
              else if (!allowed) { btnLabel = '클래스 제한'; disabled = true; }
              else if (isOwned) { btnLabel = '장착 (무료)'; disabled = false; }
              else { btnLabel = '구매 ₵' + it.cost; disabled = !canAfford; }
              return (
                <div key={key} className={'gearCard' + (isEquipped ? ' equipped' : '') + (!allowed ? ' locked' : '')}>
                  <div className="gc-head"><span className="gc-ic">{it.icon}</span><span className="gc-nm">{it.name}</span>
                    <span className="gc-cost">{isOwned ? '보유' : '₵' + it.cost}</span></div>
                  <div className="gc-mods">{modsLabel(it.mods)}</div>
                  <div className="gc-desc">{it.desc}</div>
                  <div className="gc-lin">{it.lineage}</div>
                  <div className="gc-actions">
                    <button className="btn" disabled={disabled} onClick={() => dispatch({ type: 'BUY_GEAR', slot, key })}>{btnLabel}</button>
                    {isEquipped ? <button className="btn ghost" onClick={() => dispatch({ type: 'UNEQUIP_GEAR', slot })}>해제</button> : null}
                  </div>
                </div>
              );
            })}
          </div>
        );
      })}
      <p className="hint" style={{ color: 'var(--text-dim)' }}>장비는 옵트인 파워입니다 — 미장착 기준 전투 밸런스는 불변(하네스 검증). 클래스 제한은 기본 스탯 기준.</p>
    </div>
  );
}

// ── 정보상 (허브) — ₵로 미션 인텔 구매. 전투 시작 브리핑(적 배치·증원 임계) 공개. 수치 무변경 ──
function IntelBroker({ state, dispatch }) {
  const save = state.save;
  const ch = save.character;
  const price = GEAR.INTEL_PRICE;
  const board = CAMP.boardState(save);
  const rows = board.mains.concat(board.sides).filter(r => r.unlocked);
  return (
    <div className="sheet">
      <button className="btn ghost" onClick={() => dispatch({ type: 'HUB_NAV', node: 'root' })}>← 허브</button>
      <h1 style={{ color: 'var(--cyan)', fontFamily: 'monospace', margin: '4px 0' }}>🛰 정보상</h1>
      <p className="sub" style={{ color: 'var(--text-dim)' }}>
        ₵{price}에 미션 인텔 구매 — 해당 미션 전투 시작 시 <b>적 배치·증원 임계</b>가 브리핑 패널로 공개됩니다.
        전투 수치는 바뀌지 않습니다(정보만). <b style={{ color: 'var(--orange)' }}>보유 ₵{ch.nuyen}</b>
      </p>
      <div className="mission-list">
        {rows.map(row => {
          const m = CAMP.missionData(row.id);
          const has = !!(save.intel && save.intel[row.id]);
          const disabled = has || ch.nuyen < price;
          return (
            <div key={row.id} className={'intelCard' + (has ? ' has' : '')}>
              <div className="ic-info">
                <span className="ic-ttl">{(m && m.title) || row.id}</span>
                <span className="ic-sub">{(m && m.subtitle) || ''} · 적 {m ? m.combat.enemies.length : '?'}기{m && m.combat.reinforcement ? ' + 증원' : ''}</span>
              </div>
              <button className="btn" disabled={disabled} onClick={() => dispatch({ type: 'BUY_INTEL', missionId: row.id })}>
                {has ? '확보됨 ✔' : '인텔 ₵' + price}
              </button>
            </div>
          );
        })}
      </div>
      <p className="hint" style={{ color: 'var(--text-dim)' }}>인텔은 1회 구매로 영구 보관됩니다. 미해금 미션 인텔은 해금 후 구매 가능.</p>
    </div>
  );
}

// ── 허브 ──
function Hub({ state, dispatch, openSave }) {
  const node = state.hub.node;
  const save = state.save;
  const ch = save.character;
  const threat = CAMP.threatGauge((save.missionsDone || []).length * 3, 0, 10);
  if (node === 'sheet') return <CharacterSheet state={state} dispatch={dispatch} />;
  if (node === 'roster') return <Roster state={state} dispatch={dispatch} />;
  if (node === 'save') return <SaveMenu state={state} dispatch={dispatch} back={() => dispatch({ type: 'HUB_NAV', node: 'root' })} />;
  if (node === 'missions') return <MissionBoard state={state} dispatch={dispatch} />;
  if (node === 'shop') return <GearShop state={state} dispatch={dispatch} />;
  if (node === 'intel') return <IntelBroker state={state} dispatch={dispatch} />;
  const board = CAMP.boardState(save);
  const clearedCount = board.mains.filter(m => m.cleared).length + board.sides.filter(s => s.cleared).length;
  const curEntry = board.current ? CAMP.missionById(board.current) : null;
  const missionNote = board.current
    ? ('▶ ' + chLabel(curEntry) + ' 진행 중 · 클리어 ' + clearedCount + '/' + board.mains.length + '+side')

  return (
    <div className="hub">
      <h1>안전가옥 — ASHGRID</h1>
      <p className="sub">{ch.icon} {ch.classKey} / {ch.codename} · {classTagline(ch.classKey)}</p>
      <EndingBadges save={save} />
      <LastOpPanel flags={save.flags} />
      <div className="hub-grid">
        <button className="hub-node" onClick={() => { SFX('ui'); dispatch({ type: 'HUB_NAV', node: 'missions' }); }}>
          <span className="ic">🎯</span><span className="lb">미션 보드</span>
          <span className="nt">{missionNote}</span>
        </button>
        <button className="hub-node" onClick={() => { SFX('ui'); dispatch({ type: 'HUB_NAV', node: 'sheet' }); }}>
          <span className="ic">📋</span><span className="lb">캐릭터 시트</span>
          <span className="nt">karma {ch.karma} 지출 가능</span>
        </button>
        <button className="hub-node" onClick={() => { SFX('ui'); dispatch({ type: 'HUB_NAV', node: 'roster' }); }}>
          <span className="ic">👥</span><span className="lb">크루 / 로스터</span>
          <span className="nt">6클래스 빌드 전환 (해킹·근접·설치·위장·중개·기동)</span>
        </button>
        <button className="hub-node" onClick={() => { SFX('ui'); dispatch({ type: 'HUB_NAV', node: 'shop' }); }}>
          <span className="ic">🛒</span><span className="lb">장비 상점</span>
          <span className="nt">₵{ch.nuyen} · 무기 개조 + 사이버웨어 {gearEquippedCount(ch)}/2 장착</span>
        </button>
        <button className="hub-node" onClick={() => { SFX('ui'); dispatch({ type: 'HUB_NAV', node: 'intel' }); }}>
          <span className="ic">🛰</span><span className="lb">정보상</span>
          <span className="nt">미션 인텔 {intelCount(save)}건 확보 · 전투 브리핑 공개</span>

      </div>
      <div className="threat">

      {(ENDING && ENDING.migrateEndings(save.endings).capstone > 0) ? (

          <span className="ab-best">로컬 최고 웨이브 <b>{(save.abyss && save.abyss.best) || 0}</b> · 탭하여 웨이브 1 개시</span>

    </div>
  );
}

// ── 캐릭터 시트 (karma 지출 → 유효 스탯 반영) ──

      {rows.map(r => (
        <div className="statline" key={r.k}>
          <span className="nm">{r.nm}</span>

      ))}
      <div style={{ marginTop: 8 }}>
        <div className="sub" style={{ color: 'var(--text-dim)', marginBottom: 6 }}>{classKitLabel(ch.classKey)}</div>
        <div className="kit">{ch.kit.map(k => <span className="ab" key={k}>{AB.ABILITIES[k].icon} {AB.ABILITIES[k].name}</span>)}</div>
      </div>
      <GearLoadout ch={ch} dispatch={dispatch} />
      <AffinityMatrix />
    </div>
  );
}

// ── 캐릭터 시트 장비 로드아웃 (장착 장비 + 유효 스탯 반영 표기 · 상점 바로가기) ──
function GearLoadout({ ch, dispatch }) {
  if (!GEAR) return null;
  const eq = ch.equipment || { weapon: null, cyberware: null };
  const rows = [ { slot: 'weapon', ic: '🔧', lb: '무기 개조' }, { slot: 'cyberware', ic: '🦿', lb: '사이버웨어' } ];
  return (
    <div style={{ marginTop: 10 }}>
      <div className="sub" style={{ color: 'var(--text-dim)', marginBottom: 6 }}>장비 로드아웃 (유효 스탯 반영)</div>
      {rows.map(r => {
        const key = eq[r.slot];
        const it = key ? GEAR.ITEMS[key] : null;
        return (
          <div className="loadout-row" key={r.slot}>
            <span className="lo-slot">{r.ic} {r.lb}</span>
            {it ? <span className="lo-item">{it.icon} {it.name} <small style={{ color: 'var(--green)' }}>{modsLabel(it.mods)}</small></span>
                : <span className="lo-empty">— 비어 있음</span>}
          </div>
        );
      })}
      <button className="btn ghost" style={{ marginTop: 6 }} onClick={() => dispatch({ type: 'HUB_NAV', node: 'shop' })}>🛒 장비 상점으로</button>
    </div>
  );
}

// ── 상성 매트릭스 6종 전체 (docs/06 §6 계승) — 표시 체감 확대 ──
function AffinityMatrix({ compact }) {
  const [open, setOpen] = useState(false);
  const mtx = ATTRS.matrix();
  return (
    <div className="matrix">
      <button className="matrix-toggle" onClick={() => setOpen(!open)}>⚔ 속성 상성표 {open ? '▲' : '▼'}</button>
      {open ? (
        <div className="matrix-grid">
          {mtx.map((m, i) => (
            <span key={i} className="mrow">
              <b style={{ color: m.atkColor }}>{m.atkSym}</b>
              <span className="arr">▶</span>
              <b style={{ color: m.defColor }}>{m.defSym}</b>
              <small>+1</small>
            </span>
          ))}
        </div>
      ) : null}
    </div>
  );
}

// ── 세이브 메뉴 (localStorage + 문자열 export/import) ──
function SaveMenu({ state, dispatch, back }) {
  const [txt, setTxt] = useState('');
  const [msg, setMsg] = useState('');
  return (
    <div className="savemenu">
      <button className="btn ghost" onClick={back}>← 뒤로</button>
      <p className="hint">파일:// 오리진에서 localStorage가 비워질 수 있어 문자열 export/import가 안전판입니다 (G11).</p>
      <div className="btn-row">
        <button className="btn" onClick={() => { const ok = SAVE.saveLocal(state.save); setMsg(ok ? 'localStorage 저장됨' : 'localStorage 불가 — 문자열 사용'); }}>localStorage 저장</button>
        <button className="btn ghost" onClick={() => { const s = SAVE.loadLocal(); if (s) { dispatch({ type: 'LOAD_SAVE', save: s }); setMsg('불러옴'); } else setMsg('저장본 없음'); }}>불러오기</button>
      </div>
      <button className="btn" onClick={() => { setTxt(SAVE.exportString(state.save)); setMsg('export 문자열 생성 — 복사하세요'); }}>세이브 문자열 export ⬇</button>
      <textarea value={txt} onChange={e => setTxt(e.target.value)} placeholder="세이브 문자열을 붙여넣고 import" spellCheck="false" />
      <button className="btn" onClick={() => { const r = SAVE.importString(txt); if (r.ok) { dispatch({ type: 'LOAD_SAVE', save: r.save }); setMsg('import 성공 — 복원됨'); } else setMsg('import 실패: ' + r.error); }}>세이브 문자열 import ⬆</button>
      {msg ? <p className="hint" style={{ color: 'var(--green)' }}>{msg}</p> : null}
    </div>
  );
}

// ── 대화 오버레이 (활성 클래스에 따라 고스트 발화자 전환) ──
function DialogueOverlay({ state, dispatch }) {
  const mission = missionOf(state);
  const node = mission.dialogue.nodes[state.dialogue.nodeId];
  const ctx = STORE.dialogueCtx(state);
  const ch = state.save.character;
  const isBloc = node.portrait === 'bloc';
  const person = LORE.person(ch.classKey);
  const ghostName = (person && person.data.codename) || ch.codename || ch.classKey;
  const ghostReal = (person && person.data.realName) || '';
  // 고스트 인용은 활성 클래스 명대사(원문 고정), 블록 인용은 노드 지정 발화자.
  const q = node.quote ? (isBloc ? LORE.quote(node.quote) : LORE.quote(ch.classKey)) : null;
  // 블록 발화자명은 노드 speaker (미션별: VANTA/AXIOM/IRONWALL…) — 하드코딩 제거.
  const blocName = node.speaker || 'BLOC';
  // 오프닝 전문은 미션당 최초 1회만. 재방문(openingSeen) 시 요약 1줄 + 스킵 안내.
  const isStart = state.dialogue.nodeId === mission.dialogue.start;
  const collapsedOpening = isStart && state.dialogue.openingSeen;
  const bodyText = collapsedOpening
    ? ((mission.refrain || mission.subtitle || node.text.split('\n')[0]))
    : node.text;
  const theme = stageTheme(state.dialogue.missionId); // [G①] 무대 팔레트 (표시 전용)
  return (
    <div className={'dialogue stage stage-' + theme}>
      <div className="portrait-row">
        <Portrait kind={node.portrait} />
        <div>
          <div className={'speaker ' + (isBloc ? 'bloc' : '')}>
            {isBloc ? blocName : ghostName}
            <small>{isBloc ? (mission.title || 'BLOC DIRECTIVE') : (ghostReal ? ghostName + ' · ' + ghostReal : ghostName)}</small>
          </div>
        </div>
      </div>
      <div className="textbox">
        {collapsedOpening ? <div className="opening-skip">↺ 오프닝 열람 완료 — 요약만 표시</div> : null}
        <Typewriter text={bodyText} />
        {!reducedMotion && !collapsedOpening ? <div className="tw-skip">▸ 탭하여 즉시 표시</div> : null}
        {q ? <div className={'quote-bubble ' + (isBloc ? 'bloc' : '')}>{q.line}</div> : null}
      </div>
      <div className="choices">
        {node.choices.map((c, i) => {
          const st = window.RPG_DIALOGUE.choiceState(c, ctx);
          if (st === 'hidden') return null;
          const gated = !!c.gate;
          return (
            <button key={i} className={'choice ' + (gated ? 'gate ' : '') + (st === 'gray' ? 'gray' : '')}
              onClick={() => dispatch({ type: 'DIALOGUE_CHOOSE', index: i })}>
              {c.label}
              {c.desc ? <span className="desc">{c.desc}</span> : null}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── 전투 ──
function Combat({ state, dispatch, view }) {
  const c = state.combat;
  const p = STORE.player(c);
  const sel = AB.ABILITIES[c.selectedAbility];
  const TILE = 56; // projection.left/top 계산용 논리 픽셀 (CSS var 로 실제 스케일)
  const mode = view === 'square' ? 'square' : 'iso'; // 기본 아이소, 폴백 탑다운
  const [briefOpen, setBriefOpen] = useState(true); // [B1] 인텔 브리핑 패널 (구매 시 노출)
  const theme = stageTheme(c.missionId);            // [G①] 무대 팔레트 (표시 전용)
  // [G②] 시그니처/궁극 발동 시 풀스크린 플래시 (ultUsed 전이 감지 · 룰 무관 표시).
  const ultRef = useRef(false);
  const [flash, setFlash] = useState(0);
  useEffect(() => {
    if (p.ultUsed && !ultRef.current) setFlash(f => f + 1);
    ultRef.current = !!p.ultUsed;
  }, [p.ultUsed]);
  // [G②] 크리티컬 피격 프레임엔 보드 미진동 (crit floater 존재 → 1회 shake, reduced-motion 무시).
  const critShake = !reducedMotion && (c.floaters || []).some(f => f.crit);
  const dim = { cols: c.field.cols, rows: c.field.rows };
  // 이동 범위
  const blocked = GRID.buildBlocked(c.field, c.units, 'cipher');
  const reach = GRID.bfsRange({ x: p.x, y: p.y }, p.mov, blocked, c.field.cols, c.field.rows);
  // 텔레그래프 셀
  const threatTiles = {}; const threatMoveTiles = {};
  c.telegraphs.forEach(t => { if (t.attackTile) threatTiles[t.attackTile.x + ',' + t.attackTile.y] = true;
    if (t.moveTile) threatMoveTiles[t.moveTile.x + ',' + t.moveTile.y] = true; });
  // 조준 가능 적
  function canTarget(u) {
    if (u.side !== 'enemy' || u.hp <= 0) return false;
    if (sel.kind === 'ULTIMATE' || sel.kind === 'PASSIVE') return false;
    if (u.physImmune && !sel.useHack) return false;
    if (p.ap < sel.ap || (p.cooldowns[c.selectedAbility] || 0) > 0) return false;
    return GRID.chebyshev(p, u) <= sel.range && GRID.lineOfSight(p, u, c.field);
  }
  const adjObj = GRID.chebyshev(p, c.objective) <= 1 && !c.objective.done;
  const objByForce = p.hack < p.atk; // BLADE 등 물리 축 → 강습
  const sig = c.signal || { key: 'UP', sym: '🔵', label: 'MESH UP', desc: '' };
  const th = c.threat || { value: 0, cap: 8, alarm: false };
  // 피격 플래시: dmg/miss 부유 텍스트가 있는 타일의 유닛을 flash [G7 juice]
  const hitTiles = {}; (c.floaters || []).forEach(f => { if (f.kind === 'dmg' || f.kind === 'miss') hitTiles[f.x + ',' + f.y] = true; });

  function tileClass(x, y) {
    let cls = 'tile' + ((x + y) % 2 ? ' alt' : '');
    const cov = c.field.cover.find(k => k.x === x && k.y === y);
    if (cov) cls += ' cover' + (cov.type === 'full' ? ' full' : '');
    if (c.field.walls.find(w => w.x === x && w.y === y)) cls += ' wall';
    if (c.objective.x === x && c.objective.y === y) cls += ' obj';
    if (reach[x + ',' + y] > 0 && !c.field.cover.find(k=>k.x===x&&k.y===y)) cls += ' move';
    if (threatTiles[x + ',' + y]) cls += ' threat';
    else if (threatMoveTiles[x + ',' + y]) cls += ' threat-move';
    const enemyHere = c.units.find(u => u.x === x && u.y === y && u.side === 'enemy' && u.hp > 0);
    if (enemyHere && canTarget(enemyHere)) cls += ' target';
    return cls;
  }
  function onTile(x, y) {
    if (c.outcome) return;
    const enemyHere = c.units.find(u => u.x === x && u.y === y && u.side === 'enemy' && u.hp > 0);
    if (enemyHere && canTarget(enemyHere)) { dispatch({ type: 'COMBAT_ATTACK', targetId: enemyHere.id, ability: c.selectedAbility }); return; }
    if (reach[x + ',' + y] > 0 && !c.field.cover.find(k=>k.x===x&&k.y===y)) { SFX('move'); dispatch({ type: 'COMBAT_MOVE', tile: { x, y } }); return; }
  }

  // 자동 floater 정리 + [v6.44 B1] SFX 훅 (부유 텍스트 종류로 타격/크리/해킹샷 판별 — 표시층 전용)
  useEffect(() => {
    const fs = c.floaters || [];
    if (fs.length) {
      if (fs.some(f => f.kind === 'dmg' && f.crit)) SFX('crit');
      else if (fs.some(f => f.kind === 'dmg')) SFX('hit');
      if (fs.some(f => f.kind === 'hack')) SFX('hack');
      const id = setTimeout(() => dispatch({ type: 'COMBAT_CLEAR_FLOATERS' }), 1050); return () => clearTimeout(id);
    }
  }, [c.floaters]);
  // [v6.44 B1] 처치 SFX — 적 전사 수 증가 감지 (표시층 전용, 유닛 배열 무변경).
  const deadRef = useRef(0);
  useEffect(() => {
    const dead = (c.units || []).filter(u => u.side === 'enemy' && u.hp <= 0).length;
    if (dead > deadRef.current) SFX('kill');
    deadRef.current = dead;
  }, [c.units]);
  // [v6.44 B1] 승리/패배 스팅 — outcome 전이 1회.
  const outRef = useRef(null);
  useEffect(() => {
    if (c.outcome && c.outcome !== outRef.current) SFX(c.outcome === 'win' ? 'victory' : 'defeat');
    outRef.current = c.outcome;
  }, [c.outcome]);

  // 투영 병진 → CSS calc (tx/ty 는 --tile 배수, iso 는 소수 가능). 룰 무관, 표시층만.
  const posStyle = (px, py, extra) => {
    const pr = PROJ.project(px, py, TILE, dim, mode);
    return Object.assign({ left: 'calc(' + pr.tx + ' * var(--tile))', top: 'calc(' + pr.ty + ' * var(--tile))', zIndex: pr.z }, extra || {});
  };
  const tiles = [];
  for (let y = 0; y < c.field.rows; y++) for (let x = 0; x < c.field.cols; x++) {
    const cov = c.field.cover.find(k => k.x === x && k.y === y);
    const pr = PROJ.project(x, y, TILE, dim, mode);
    tiles.push(<div key={'t' + x + '_' + y} className={tileClass(x, y)} data-tile={x + ',' + y}
      style={{ left: 'calc(' + pr.tx + ' * var(--tile))', top: 'calc(' + pr.ty + ' * var(--tile))' }} onClick={() => onTile(x, y)}>
      {cov ? <span className="cover-ic"><Glyph sprite={cov.type === 'full' ? 'px-barrel' : 'px-crate'} emoji={cov.type === 'full' ? '▩' : '▣'} cls="prop-spr" /></span> : null}
      {(c.objective.x === x && c.objective.y === y) ? <span className="obj-ic"><Glyph sprite="px-server" emoji="🖥" cls="prop-spr" /></span> : null}
      {(c.objective.x === x && c.objective.y === y) ? <span className="obj-badge">{c.objective.done ? '✔' : c.objective.threshold}</span> : null}
    </div>);
  }
  const units = c.units.filter(u => u.hp > 0).map(u => {
    const cls = 'unit ' + u.side + (u.ai === 'static' ? ' static' : '') + (u.status && (u.status.stealth || u.status.invuln) ? ' stealth' : '')
      + (hitTiles[u.x + ',' + u.y] ? ' hit' : '');
    return <div key={u.id} className={cls} style={posStyle(u.x, u.y)}>
      <div className="body" title={u.name}>
        <Glyph sprite={spriteForUnit(u)} emoji={u.icon} />
        <div className="hpbar"><i style={{ width: (u.hp / u.maxHp * 100) + '%' }} /></div>
      </div>
    </div>;
  });
  const floaters = (c.floaters || []).map((f, i) => (
    <div key={'f' + i} className={'floater ' + f.kind + (f.crit ? ' crit' : '')}
      style={posStyle(f.x, f.y, { width: 'var(--tile)', textAlign: 'center', zIndex: 30 })}>{f.text}</div>
  ));
  // [G②] 처치 디졸브 — 전사(hp<=0) 유닛 위치에 글리치 페이드 잔상 (표시 전용, 유닛 배열 무변경).
  const dissolving = c.units.filter(u => u.hp <= 0).map(u => (
    <div key={'d' + u.id} className="dissolve" style={posStyle(u.x, u.y)}><Glyph sprite={spriteForUnit(u)} emoji={u.icon} /></div>
  ));

  const bsz = PROJ.boardSize(c.field.cols, c.field.rows, mode);
  const boardW = 'calc(' + bsz.w + ' * var(--tile))';
  const boardH = 'calc(' + bsz.h + ' * var(--tile))';

  return (
    <div className={'combat stage stage-' + theme}>
      {flash ? <div className="ult-flash" key={'uf' + flash} /> : null}
      <div className="combat-top">
        {c.abyss ? <span className="rnd" style={{ color: 'var(--cyan)' }}>🌃 심연 웨이브 {c.abyss.wave}</span> : null}
        <span className="rnd">ROUND {c.round}</span>
        <span className={'sigpill sig-' + sig.key} title={sig.desc}>{sig.sym} {sig.label}</span>
        <span className="obj">🎯 방어도 {c.objective.done ? '돌파✔' : c.objective.threshold}</span>
        <span>❤ {p.hp}/{p.maxHp}</span>
        <span className="spacer" />
        {p.status && p.status.stealth ? <span style={{color:'var(--cyan)'}}>👻 은신</span> : null}
        {p.status && p.status.invuln ? <span style={{color:'var(--yellow)'}}>🛡 무적</span> : null}
      </div>
      <div className={'threat-combat' + (th.alarm ? ' alarm' : '')}>
        <span className="tlab">위협/노출 {th.value}/{th.cap}{th.alarm ? ' · ⚠ 경보 · 증원' : ''}</span>
        <div className="tbar"><i style={{ width: Math.min(100, th.value / th.cap * 100) + '%' }} /></div>
      </div>
      {c.intel && c.briefing ? (
        <div className={'intel-brief' + (briefOpen ? '' : ' collapsed')}>
          <button className="ib-head" onClick={() => setBriefOpen(o => !o)}>
            🛰 정보상 인텔 — 사전 브리핑 {briefOpen ? '▲' : '▼'}
          </button>
          {briefOpen ? (
            <div className="ib-body">
              <div className="ib-sec">적 배치 ({c.briefing.enemies.length}기)</div>
              <div className="ib-list">
                {c.briefing.enemies.map((e, i) => (
                  <span key={i} className="ib-enemy">{e.icon} {e.name} <small>({e.x},{e.y}) HP{e.hp}{e.ai === 'static' ? ' · 정적' : ''}</small></span>
                ))}
              </div>
              {c.briefing.reinforcement ? (
                <div className="ib-reinf">⚠ 증원: {c.briefing.reinforcement.icon} {c.briefing.reinforcement.name} · 위협 {c.briefing.threatCap} 도달 시 ({c.briefing.reinforcement.x},{c.briefing.reinforcement.y}) 투입</div>
              ) : <div className="ib-reinf">증원 없음</div>}
              <div className="ib-note">정보만 공개 — 전투 수치 무변경</div>
            </div>
          ) : null}
        </div>
      ) : null}
      <div className="board-wrap">
        <div className={'board' + (mode === 'iso' ? ' iso' : '') + (critShake ? ' shake' : '')} style={{ width: boardW, height: boardH }}>
          {tiles}{dissolving}{units}{floaters}
        </div>
      </div>

      {c.outcome ? (
        <div className="hud">
          <div className="banner" style={{ borderColor: c.outcome === 'win' ? 'var(--green)' : 'var(--magenta)', color: c.outcome === 'win' ? 'var(--green)' : 'var(--magenta)', margin: 0 }}>
            {c.abyss
              ? (c.outcome === 'win' ? ('★ 웨이브 ' + c.abyss.wave + ' 돌파 — 다음 웨이브로') : ('심연 종료 — 웨이브 ' + c.abyss.wave + ' 다운 (페널티 없음)'))
              : (c.outcome === 'win' ? ('★ 미션 성공' + (c.objective && c.objective.dataTB ? ' — ' + c.objective.dataTB + 'TB 유출' : ' — 목표 달성')) : '미션 실패 — 다운')}
          </div>
          <button className="btn" onClick={() => dispatch({ type: 'COMBAT_RESOLVE' })}>{c.abyss ? (c.outcome === 'win' ? '다음 웨이브' : '허브로') : '계속'}</button>
        </div>
      ) : (
        <div className="hud">
          <div className="ap-row">
            <span>AP</span>
            <span className="ap-pips">{Array.from({ length: Math.max(p.ap, p.maxAp) }).map((_, i) => <i key={i} className={i < p.ap ? 'on' : ''} />)}</span>
            <span className="spacer" style={{flex:1}} />
            {adjObj ? <button className="btn" style={{ width: 'auto', padding: '8px 12px' }} onClick={() => dispatch({ type: 'COMBAT_HACK' })} disabled={p.ap < 1}>{objByForce ? '🗡 서버 랙 강습' : '💻 서버 랙 해킹'}</button> : null}
          </div>
          <div className="abilities">
            {p.kit.filter(k => AB.ABILITIES[k].kind !== 'PASSIVE').map(k => {
              const a = AB.ABILITIES[k];
              const cd = p.cooldowns[k] || 0;
              const dis = p.ap < a.ap || cd > 0 || (a.oncePerMission && p.ultUsed);
              return <button key={k} className={'ability' + (c.selectedAbility === k ? ' sel' : '')} disabled={a.kind === 'ULTIMATE' ? dis : false}
                onClick={() => { if (a.kind === 'ULTIMATE') { if (!dis) dispatch({ type: 'COMBAT_ATTACK', targetId: null, ability: k }); } else { SFX('select'); dispatch({ type: 'COMBAT_SELECT', ability: k }); } }}>
                <span className="an">{a.icon} {a.name}</span>
                <span className="ameta">{a.ap}AP{a.cooldown ? ' · cd' + a.cooldown : ''}{cd > 0 ? ' · 대기' + cd : ''}{a.oncePerMission ? (p.ultUsed ? ' · 소진' : ' · 1회') : ''}</span>
              </button>;
            })}
          </div>
          <div className="hud-actions">
            <button className="btn ghost" onClick={() => dispatch({ type: 'COMBAT_END_TURN' })}>턴 종료 ▶ 적 행동</button>
          </div>
        </div>
      )}
      <div className="log">{c.log.slice().reverse().slice(0, 8).map((l, i) => <div key={i}>{l}</div>)}</div>
      <AffinityMatrix />
    </div>
  );
}

// ── 에필로그 산문 라인 (무대 페이드 — reduced-motion 시 즉시 표시) ──
function EpLine({ text, idx }) {
  const style = reducedMotion ? undefined : { animationDelay: (idx * 0.5 + 0.2) + 's' };
  // [발췌]/[각색] 태그 분리 — 원전 통제 가시화.
  const m = /^\[(발췌|각색)\]\s*(.*)$/.exec(text);
  const tag = m ? m[1] : null;
  const body = m ? m[2] : text;
  return (
    <div className={'ep-line' + (reducedMotion ? ' shown' : '')} style={style}>
      {tag ? <span className={'ep-tag ' + (tag === '발췌' ? 'src' : 'adapt')}>{tag}</span> : null}
      <span className="ep-body">{body}</span>
    </div>
  );
}

// ── 통계 타일 ──
function StatTile({ lb, vl, sub }) {
  return (
    <div className="ep-tile">
      <span className="et-vl">{vl}</span>
      <span className="et-lb">{lb}</span>
      {sub ? <span className="et-sub">{sub}</span> : null}
    </div>
  );
}

// ── 허브 엔딩 뱃지 (본 엔딩 영속 표시 — 회차를 넘어 남는다) ──
function EndingBadges({ save }) {
  if (!ENDING) return null;
  const list = ENDING.endingsSeen(save.endings);
  const anySeen = list.some(e => e.seen);
  if (!anySeen) return null;
  const runs = ENDING.migrateEndings(save.endings).runs;
  return (
    <div className="ending-badges">
      <div className="eb-lab">🏁 본 엔딩 {list.filter(e => e.seen).length}/4 · 완주 {runs}회 (엔딩 기록은 회차를 넘어 영속)</div>
      <div className="eb-row">
        {list.map(e => (
          <span key={e.key} className={'eb-chip' + (e.seen ? ' seen' : '')} title={e.title}>
            {e.icon} {e.seen ? e.title : '???'}{e.count > 1 ? ' ×' + e.count : ''}
          </span>
        ))}
      </div>
    </div>
  );
}

// ── 에필로그 씬 (ch08 완주 피날레 — 엔딩 분기별 상이 에필로그 / v6.44 캡스톤 피날레) ──
function Epilogue({ state, dispatch }) {
  const save = state.save;
  // [v6.44 · 과제 A1] 캡스톤 에필로그 분기 — 4엔딩과 별개 "ASHGRID PREVAILS".
  const isCapstone = !!(state.epilogue && state.epilogue.capstone);
  const key = (state.epilogue && state.epilogue.ending) || ENDING.resolveEnding(save);
  const ep = isCapstone ? ENDING.capstoneEpilogue() : ENDING.epilogueFor(key);
  // 회고 카드: 캡스톤은 4갈래 종결 선택(capstoneRecall), 캠페인은 7챕터 선택(choiceSummary).
  const summary = isCapstone ? ENDING.capstoneRecall(save.flags) : ENDING.choiceSummary(save.flags);
  const stats = ENDING.campaignStats(save);
  const kicker = isCapstone
    ? ('ACT 2 CAPSTONE · MERIDIAN FLAGSHIP 격추 · 캡스톤 ' + stats.capstoneCleared + '회')
    : 'CAMPAIGN COMPLETE · 8/8 · 캠페인 봉인';
  const recallHeader = isCapstone ? '🧭 네 전선의 회고 — 4갈래 종결 선택' : '🧭 당신의 선택들 — 7챕터의 회고';
  return (
    <div className="epilogue stage stage-zeroday">
      <div className="ep-hero">
        <div className="ep-badge">{ep.icon}</div>
        <div className="ep-titles">
          <div className="ep-kicker">{kicker}</div>
          <h1 className="ep-title">{ep.title}</h1>
          <div className="ep-sticker">🏷 "{ep.sticker}" · {ep.cond}</div>
        </div>
      </div>
      <div className="ep-prose">
        {ep.lines.map((l, i) => <EpLine key={i} text={l} idx={i} />)}
      </div>
      <div className="ep-signal">
        <Typewriter text={ENDING.SIGNAL_FINAL.join('\n')} speed={26} />
      </div>
      <div className="ep-card">
        <div className="ep-card-h">{recallHeader}</div>
        <div className="ep-choices">
          {summary.length ? summary.map((c, i) => (
            <div key={i} className="ep-choice">
              <span className="ep-ch">{isCapstone ? ('갈래 ' + c.br) : ('CH' + (c.ch < 10 ? '0' + c.ch : c.ch))}</span>
              <span className="ep-ct">{c.text}</span>
            </div>
          )) : <div className="ep-empty">기록된 분기 선택 없음</div>}
        </div>
      </div>
      {isCapstone ? (
        <div className="ep-card">
          <div className="ep-card-h">🌃 심연 프로토콜 개방 — 무한 상승 계약</div>
          <div className="ep-runs">허브에서 웨이브 결정론 전투 개시 · 현재 최고 웨이브 {(save.abyss && save.abyss.best) || 0} · 패배 페널티 없음</div>
        </div>
      ) : null}
      <div className="ep-card">
        <div className="ep-card-h">📊 캠페인 통계 (세이브 파생)</div>
        <div className="ep-stats">
          <StatTile lb="미션 클리어" vl={stats.missionsCleared} sub={'메인 ' + stats.mainCleared + ' · 사이드 ' + stats.sideCleared} />
          <StatTile lb="karma 총 지출" vl={stats.karmaSpent} sub={'잔여 ' + stats.karmaCurrent} />
          <StatTile lb="장비 보유" vl={stats.gearOwnedCount} sub={'장착 ' + stats.gearEquipped.length + '/2'} />
          <StatTile lb="인텔 · 렙" vl={stats.intelCount + ' · ★' + stats.rep} sub={'₵' + stats.nuyen} />
        </div>
        <div className="ep-classrow">
          <span className="ep-clab">클래스별 캠페인 완주</span>
          {stats.classClears.map(c => (
            <span key={c.classKey} className={'ep-cls' + (c.done ? ' done' : '')}>{c.done ? '✅' : '—'} {c.classKey}</span>
          ))}
        </div>
        <div className="ep-runs">
          총 완주 회차 {stats.runs}회 · {isCapstone ? ('캡스톤 격파 ' + stats.capstoneCleared + '회 · 완주 클래스 ' + (stats.capstoneClasses.join('/') || '—')) : ('이번 엔딩 ' + ep.title)}
        </div>
      </div>
      <div className="ep-actions">
        {isCapstone ? (
          <button className="btn" onClick={() => dispatch({ type: 'EPILOGUE_CONTINUE' })}>허브로 — 심연 프로토콜 개시</button>
        ) : (
          <React.Fragment>
            <button className="btn" onClick={() => dispatch({ type: 'NEW_GAME_PLUS' })}>↻ 새 회차 (진행 리셋 · 엔딩 기록 보존)</button>
            <button className="btn ghost" onClick={() => dispatch({ type: 'EPILOGUE_CONTINUE' })}>허브로 (봉인 유지)</button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// ── 앱 (씬 라우터) ──
function App() {
  const [state, dispatch] = useReducer(STORE.rpgReducer, undefined, STORE.rpgInitialState);
  const [saveOpen, setSaveOpen] = useState(false);
  // 전투 투영 뷰: 기본 아이소(섀도우런 룩), 탑다운 폴백. localStorage 영속.
  const [view, setView] = useState(() => {
    try { const v = localStorage.getItem('rpg.viewMode'); return (v === 'square' || v === 'iso') ? v : 'iso'; }
    catch (e) { return 'iso'; }
  });
  const toggleView = () => setView(v => {
    const nv = v === 'iso' ? 'square' : 'iso';
    try { localStorage.setItem('rpg.viewMode', nv); } catch (e) {}
    return nv;
  });
  // 자동세이브: 허브 귀환 시 localStorage (안전판은 문자열).
  useEffect(() => { if (state.scene === 'hub') { try { SAVE.saveLocal(state.save); } catch (e) {} } }, [state.scene, state.save]);
  // [v6.44 B1] 엔딩 스팅 — 에필로그 씬 진입 1회 (표시층 전용).
  const sceneRef = useRef(null);
  useEffect(() => {
    if (state.scene === 'epilogue' && sceneRef.current !== 'epilogue') SFX('ending');
    sceneRef.current = state.scene;
  }, [state.scene]);

  let scene, sceneKey;
  if (saveOpen) { scene = <SaveMenu state={state} dispatch={dispatch} back={() => setSaveOpen(false)} />; sceneKey = 'save'; }
  else if (state.scene === 'combat') { scene = <Combat state={state} dispatch={dispatch} view={view} />; sceneKey = 'combat'; }
  else if (state.scene === 'dialogue') { scene = <DialogueOverlay state={state} dispatch={dispatch} />; sceneKey = 'dialogue'; }
  else if (state.scene === 'epilogue') { scene = <Epilogue state={state} dispatch={dispatch} />; sceneKey = 'epilogue'; }
  else { scene = <Hub state={state} dispatch={dispatch} openSave={() => setSaveOpen(true)} />; sceneKey = 'hub'; }

  // [G⑤] 씬 전환 — 허브↔대화↔전투 페이드/글리치 와이프 (key 변경 시 재마운트 → CSS 애니, <300ms).
  return (
    <div className="rpg-app">
      <TopBar save={state.save} onSave={() => setSaveOpen(true)} view={view} onToggleView={toggleView} />
      <Banner banner={state.banner} dispatch={dispatch} />
      <div className="scene-anim" key={sceneKey} style={{ display: 'flex', flexDirection: 'column', flex: 1 }}>{scene}</div>
    </div>
  );
}

// 마운트 성공 시 부트 스플래시 제거 + 워치독 해제. 실패 시 실패 UI 노출(조용한 실패 금지).
try {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  if (window.__bootWatch) { clearTimeout(window.__bootWatch); window.__bootWatch = null; }
  const boot = document.getElementById('boot'); if (boot) boot.remove();
} catch (e) {
  if (window.__bootFail) window.__bootFail('앱 초기화 오류: ' + ((e && e.message) || e));
}
